<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking Test – Flyers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7ff; --card:#fff; --ink:#3a3f5c; --muted:#868ba6; --line:#ece4f4;
  --pink:#ff9ebb; --pink-s:#ffe6ee; --blue:#8cc7ff; --blue-s:#e8f3ff; --mint:#7fd3b4; --mint-s:#e6f8f1; --mint-d:#2b8a70;
  --lav:#b9a8f0; --lav-s:#f0eaff; --sun:#ffd86b; --sun-s:#fff6d6; --peach:#ffb38a; --peach-s:#fff0e6;
  --bad:#ff7d97; --bad-s:#ffe9ee; --ok:#4fc79b; --r:20px;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fh:'Baloo 2','Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 0% 0%,#ffe3ee 0,transparent 42%),radial-gradient(circle at 100% 10%,#e0f1ff 0,transparent 40%),radial-gradient(circle at 50% 100%,#e9f9f1 0,transparent 45%);
  background-attachment:fixed;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.15}
.app{max-width:1180px;margin:0 auto;padding:12px 14px 90px}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* ---------- trang chủ ---------- */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.top .logo{flex:1;min-width:0}
.logo h1{font-size:28px;color:#7a5cd6}
.logo small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.ibtn{min-width:48px;height:48px;padding:0 12px;border-radius:15px;background:var(--card);border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;flex:none;box-shadow:0 3px 0 var(--line)}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tico{display:inline-flex;vertical-align:middle;line-height:0}
.ibtn.on{background:var(--mint-s);border-color:var(--mint);color:var(--mint-d)}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#ffd6e5,#e3d9ff 55%,#cfeaff);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:0 5px 0 #d9cdf5}
.hero img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:18px;padding:4px;border:3px solid #fff;flex:none}
.hero .emo{width:84px;height:84px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:44px;flex:none}
.hero b{font-family:var(--fh);font-size:21px;display:block}
.hero span{font-weight:700;font-size:14.5px;opacity:.85}
details.guide{background:var(--card);border:2px solid var(--line);border-radius:var(--r);margin-bottom:12px}
details.guide summary{cursor:pointer;font-weight:800;padding:13px 16px;list-style:none;display:flex;align-items:center;gap:8px;min-height:48px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:'▾';margin-left:auto;color:var(--muted)}
details.guide[open] summary::after{content:'▴'}
details.guide .gb{padding:0 16px 14px;font-size:15px}
details.guide ol,details.guide ul{margin:6px 0 8px;padding-left:20px}
details.guide li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;min-height:42px}
.chip.on{background:var(--mint-s);border-color:var(--mint);color:var(--mint-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tcard{background:var(--card);border:3px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 4px 0 var(--line);transition:transform .12s}
.tcard:active{transform:translateY(2px)}
.tcard .th{height:118px;background:#f3eefb;display:block;width:100%;object-fit:cover}
.tcard .tb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.tcard .tn{font-family:var(--fh);font-weight:800;font-size:21px;color:#6a4fcb;display:flex;align-items:center;gap:8px}
.tcard .ts{font-size:13px;color:var(--muted);font-weight:700;line-height:1.3}
.tcard .tstar{margin-left:auto;font-size:15px;letter-spacing:1px}
.tcard.done{border-color:var(--mint)}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--lav-s);color:#6a4fcb}
.tag.teach{background:var(--sun-s);color:#9a7400}

/* ---------- màn làm bài ---------- */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.bar .ttl{flex:1;min-width:150px}
.bar .ttl b{font-family:var(--fh);font-size:22px;color:#6a4fcb;display:block;line-height:1.1}
.bar .ttl small{color:var(--muted);font-weight:700;font-size:13px}
.timer{font-family:var(--fh);font-weight:800;font-size:20px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;min-width:92px;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px}
.steps{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:104px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center;min-height:62px}
.step b{font-family:var(--fh);font-size:17px;display:block;line-height:1.1}
.step small{font-size:11.5px;color:var(--muted);font-weight:700;display:block;line-height:1.2}
.step.on{border-color:var(--lav);background:linear-gradient(180deg,#fff,var(--lav-s));box-shadow:0 4px 0 #d9cdf5}
.step.on b{color:#6a4fcb}
.step.done{border-color:var(--mint)}
.step.done b::after{content:' ✓';color:var(--mint-d)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.how{background:var(--blue-s);border:2px solid #cfe6fb;border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.how b.en{display:block;font-size:17px;color:#2f6fb0;margin-bottom:2px}
.how .vi{color:#47658a;font-weight:600}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.pics.one{grid-template-columns:1fr}
.pic{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px;position:relative}
.pic.ex{border-color:#ffc7d8}.pic.ca{border-color:#bfdcfa}
.pic .cap{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:800;font-size:14.5px}
.pic.ex .cap{color:#e0527f}.pic.ca .cap{color:#3b86d6}
.pic .cap .zoom{margin-left:auto;font-size:13px;background:var(--lav-s);color:#6a4fcb;border-radius:10px;padding:5px 10px;min-height:34px;font-weight:800}
.pic img{width:100%;height:auto;display:block;border-radius:10px;background:#faf8ff}
.iw{position:relative;line-height:0}
.hintov{display:none;margin-top:8px;background:#fffdf0;border:3px dashed var(--sun);border-radius:12px;padding:8px 10px;line-height:1.4}
.hintov.show{display:block}
.hot{position:absolute;width:var(--hs,9%);min-width:30px;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:0;z-index:2;cursor:pointer}
.showdots .hot::after{content:'';position:absolute;inset:36%;border-radius:50%;background:rgba(255,196,40,.95);box-shadow:0 0 0 3px #fff;animation:pls 1.6s ease-in-out infinite}
@keyframes pls{0%,100%{transform:scale(.85)}50%{transform:scale(1.25)}}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.tip{position:absolute;z-index:4;background:#fff;border:3px solid #ff7a59;border-radius:12px;padding:3px 10px;font-weight:800;font-size:clamp(13px,1.7vw,19px);line-height:1.2;color:#3a3f5c;box-shadow:0 3px 10px rgba(0,0,0,.25);transform:translate(-50%,-50%);white-space:nowrap;cursor:pointer;font-family:var(--font)}
.tip small{display:block;font-size:.72em;color:#b0502e;font-weight:700}
.dring{position:absolute;border:3px dashed #ff5d8f;border-radius:50%;pointer-events:none;z-index:2;background:rgba(255,93,143,.06)}
.dn{position:absolute;transform:translate(-45%,-45%);width:clamp(26px,3.3vw,40px);aspect-ratio:1;border-radius:50%;background:#ff5d8f;color:#fff;font-family:var(--fh);font-weight:800;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:3;font-size:clamp(14px,1.9vw,21px);line-height:1;cursor:pointer;padding:0}
.dsum{background:#fff0f5;border:2px solid #ffc4d6;border-radius:14px;padding:8px 12px;margin-top:10px;font-weight:700;font-size:14.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dsum .dnc{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#ff5d8f;color:#fff;font-family:var(--fh);font-weight:800;font-size:15px}
.dsum .sm{flex-basis:100%;color:#2f6fb0;background:var(--blue-s);border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px}
.col{min-width:0}
.p2help{background:var(--pink-s);border:2px dashed #ffb3c8;border-radius:14px;padding:8px 12px;margin-top:10px;font-size:14px}
.p2help .tt{font-family:var(--fh);font-weight:800;font-size:16px;color:#b0405f;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.p2help table{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:13.5px;background:#fff}
.p2help th,.p2help td{border:1px solid #f3c6d3;padding:4px 7px;text-align:left;vertical-align:top}
.p2help th{background:#ffe0ea}
.qitem{margin:5px 0}
.qbtn{width:100%;text-align:left;background:var(--blue-s);border:2px solid #cfe6fb;border-radius:12px;padding:7px 11px;font-weight:800;color:#2f6fb0;font-size:14px;min-height:40px;display:flex;gap:8px;align-items:center}
.qbtn::after{content:'▾';margin-left:auto;color:#6a8fb5}
.qbtn.open::after{content:'▴'}
.qdet{background:#fff;border:2px solid #cfe6fb;border-top:0;border-radius:0 0 12px 12px;padding:7px 11px;font-size:13.5px;font-weight:600;margin-top:-4px}
.qdet .f{background:var(--sun-s);border-radius:8px;padding:3px 8px;margin:3px 0;font-weight:800;color:#8a6d00}
.p3open{background:linear-gradient(135deg,#fff,#eef7ff);border:3px solid #bfdcfa;border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:15.5px;font-weight:700}
.p3open .who{font-family:var(--fh);font-weight:800;color:#3b86d6;font-size:15px;display:flex;gap:6px;align-items:center;margin-bottom:3px}
.p3open .dn2{color:#a85a24;font-size:12.5px;margin-top:4px}
.storybox{background:var(--pink-s);border:2px dashed #ffb3c8;border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:700}
.storybox .tt{font-family:var(--fh);font-weight:800;font-size:17px;color:#b0405f;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.storybox ol{margin:4px 0;padding-left:22px}.storybox li{margin:3px 0}
.storybox .nt{font-size:12.5px;color:#a85a24;margin-top:4px}
/* ---- chấm điểm ---- */
.score{background:#f4f9ff;border:2px solid #cfe3f7;border-radius:16px;padding:10px 14px;margin-top:12px}
.score>b{font-family:var(--fh);font-size:17px;color:#2f6fb0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.score .sub{font-size:13px;color:var(--muted);font-weight:700;margin:2px 0 6px}
.crow{background:#fff;border:2px solid #e1eefb;border-radius:12px;padding:8px 10px;margin:8px 0}
.crow .ct{font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.crow .ct small{color:var(--muted);font-weight:700;font-size:12px}
.crow .ct .info{margin-left:auto;background:var(--lav-s);color:#6a4fcb;border-radius:9px;padding:3px 9px;font-size:12.5px;font-weight:800;min-height:30px}
.nums{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.nb{min-width:46px;height:46px;border-radius:12px;border:3px solid #cfe3f7;background:#fff;font-family:var(--fh);font-weight:800;font-size:19px;color:#2f6fb0;display:grid;place-items:center}
.nb.on{background:linear-gradient(180deg,#8fe0c3,#5fc9a4);border-color:#3fa882;color:#fff}
.dsc{display:none;font-size:13px;font-weight:600;margin-top:6px;background:#fafcff;border-radius:10px;padding:6px 10px;border:1px solid #e1eefb}
.dsc.show{display:block}
.dsc p{margin:4px 0}.dsc .en{color:#2f6fb0}.dsc .lv{font-weight:800;color:#6a4fcb}
.pavg{font-weight:800;color:var(--mint-d);margin-left:auto}
.shield{display:inline-block;vertical-align:middle;margin:0 1px}
.shields{display:flex;gap:6px;justify-content:center;margin:8px 0}
.sumn{font-size:13px;color:var(--muted);font-weight:700;max-width:560px;margin:8px auto 0}
.hintov .hsec{margin-bottom:8px}
.hintov .hh{font-family:var(--fh);font-weight:800;font-size:14.5px;color:#9a7400;margin-bottom:4px}
.hintov .hchips{display:flex;flex-wrap:wrap;gap:5px}
.hchip{background:var(--sun-s);border:1.5px solid #f1dc8a;border-radius:10px;padding:3px 8px;font-size:13px;line-height:1.25}
.hchip b{font-weight:800;color:#3a3f5c}
.hchip small{display:block;color:#8a6d00;font-weight:700;font-size:11.5px}
.hline{background:var(--blue-s);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:700;color:#2f6fb0;margin:3px 0}
.story .hintov .cols{columns:2 260px;column-gap:14px}
.story .hintov .hsec{break-inside:avoid}
.p2tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.p2tt{font-weight:800;font-size:13px;margin:0 0 3px;color:#3a3f5c}
.p2t{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.p2t td{border:1.5px solid #3a3f5c;padding:3px 6px}
.p2t td:first-child{font-weight:800;width:52%}
.hbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.hbtn{background:var(--sun-s);border:3px solid #f1dc8a;border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;min-height:48px;color:#8a6d00;box-shadow:0 3px 0 #f1dc8a}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #f1dc8a}
.hbar span{font-size:13px;color:var(--muted);font-weight:700}
.p4btns{display:flex;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.p4b{display:flex;flex-direction:column;align-items:center;gap:3px}
.p4b small{font-size:11.5px;color:var(--muted);font-weight:700}
.tbtn{background:var(--pink-s);border-color:#ffc4d4;color:#b0405f;box-shadow:0 3px 0 #ffc4d4;display:inline-flex;align-items:center;gap:6px}
.p4teach{background:var(--pink-s);border:2px dashed #ffb3c8;border-radius:14px;padding:8px 12px;margin-top:10px;text-align:left;font-size:14.5px}
.p4teach .tt{font-family:var(--fh);font-weight:800;font-size:16px;color:#b0405f;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.p4teach .tr{margin:4px 0;font-weight:600}
.p4hint{background:var(--sun-s);border:2px dashed #f1d77a;border-radius:14px;padding:8px 12px;margin-top:10px;text-align:left;font-weight:700;font-size:14.5px;color:#8a6d00}
.p4hint .hchip{display:inline-block;margin:2px 3px 2px 0}
.pic .miss{padding:30px 8px;text-align:center;color:var(--muted);font-weight:700}
@media (max-width:640px) and (orientation:portrait){
  .pics{grid-template-columns:1fr}
  .rotate-hint{display:block!important}
}
.rotate-hint{display:none;background:var(--sun-s);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13.5px;margin-bottom:10px}
.story .pic{padding:10px}
.btn{background:linear-gradient(180deg,#b9a8f0,#9a86e6);color:#fff;font-family:var(--fh);font-weight:800;font-size:18px;border-radius:16px;padding:12px 22px;min-height:52px;box-shadow:0 4px 0 #7f6bd0;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7f6bd0}
.btn.ghost{background:#fff;color:#6a4fcb;border:2px solid #d9cdf5;box-shadow:0 3px 0 #e2d8f6}
.btn.mint{background:linear-gradient(180deg,#8fe0c3,#5fc9a4);box-shadow:0 4px 0 #3fa882}
.btn[disabled]{opacity:.5}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:6px}
.rate{background:var(--sun-s);border-radius:16px;padding:12px 14px;margin-top:12px}
.rate b{font-family:var(--fh);font-size:17px;display:block;margin-bottom:6px}
.rate .rr{display:flex;gap:8px;flex-wrap:wrap}
.rbtn{background:#fff;border:3px solid #f1e3a6;border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;min-height:52px;display:flex;align-items:center;gap:6px}
.rbtn.on{border-color:var(--mint);background:var(--mint-s);color:var(--mint-d)}
.teach{background:var(--sun-s);border:2px dashed #f1d77a;border-radius:16px;padding:10px 14px;margin-top:12px;font-size:14.5px}
.teach summary{cursor:pointer;font-weight:800;min-height:40px;display:flex;align-items:center;gap:6px;list-style:none}
.teach summary::-webkit-details-marker{display:none}
.teach table{width:100%;border-collapse:collapse;margin:6px 0;font-size:14px}
.teach th,.teach td{border:1px solid #efe0a0;padding:5px 8px;text-align:left;vertical-align:top}
.teach th{background:#fff3c4}
.teach .note{font-size:13px;color:#8a6d00;margin:6px 0}
.teach h4{margin:10px 0 4px;font-family:var(--fh);font-size:16px;color:#8a6d00}
.qcard{background:linear-gradient(135deg,#fff,#f6f1ff);border:3px solid var(--lav);border-radius:20px;padding:18px;text-align:center;box-shadow:0 5px 0 #d9cdf5}
.qcard .qn{font-weight:800;color:var(--muted);font-size:13.5px}
.qcard .qt{font-family:var(--fh);font-weight:800;font-size:28px;line-height:1.2;color:#4a3aa7;margin:6px 0 4px}
.qcard .qa{margin-top:10px;background:var(--mint-s);border-radius:14px;padding:10px 14px;font-weight:700;color:var(--mint-d);text-align:left}
.qcard .qb{margin-top:8px;background:var(--peach-s);border-radius:14px;padding:8px 14px;font-weight:700;color:#b25a22;text-align:left;font-size:14.5px}
.draftnote{background:var(--peach-s);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:700;color:#a85a24;margin-bottom:10px}
.dots{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.dots i{width:12px;height:12px;border-radius:50%;background:#e6dff5;display:block}
.dots i.on{background:var(--lav)}.dots i.cur{background:#7a5cd6;transform:scale(1.25)}

/* ---------- tổng kết ---------- */
.sum{text-align:center}
.sum img.ch{width:150px;height:150px;object-fit:contain}
.sum .big{font-family:var(--fh);font-size:34px;color:#6a4fcb}
.sum .rows{max-width:520px;margin:12px auto;text-align:left}
.sum .row{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:800}
.sum .row span:last-child{margin-left:auto;letter-spacing:2px}

/* ---------- phóng to ---------- */
#lb{position:fixed;inset:0;background:rgba(36,26,64,.98);z-index:50;display:flex;flex-direction:column}
#lb .lbt{display:flex;gap:8px;align-items:center;padding:10px 12px;color:#fff;font-weight:800}
#lb .lbt span{flex:1}
#lb .lbt button{background:#fff;color:#6a4fcb;border-radius:12px;min-height:44px;min-width:44px;padding:0 12px;font-weight:800}
#lb .lbc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 8px 16px;touch-action:pan-x pan-y pinch-zoom}

", "Mr Drake"]]}, "candidateAsks": {"title": "Ben's swimming club", "qa": [["What day does Ben go to swimming club?", "Friday"], ["What time does it start?", "5:15 p.m."], ["Where is his swimming club?", "At the sports centre"], ["How long is his swimming club?", "1 hour"], ["What is his teacher called?", "Mrs Crewe"]]}}, "p3": {"title": "The kitten", "intro": "A boy has just opened his front door. There is a kitten sitting outside the front door. The boy looks surprised to see the kitten. He doesn't know where the kitten has come from.", "pics": [{"n": 2, "say": "The boy has taken the kitten inside his house. He is giving the kitten some milk and some food. The kitten looks happy now.", "back": "Where is the kitten now? What is the boy giving the kitten?"}, {"n": 3, "say": "The boy has put a picture of the kitten on a tree. There is a telephone number on the picture.", "back": "What is the boy putting on the tree? What information is on the picture of the kitten?"}, {"n": 4, "say": "An old lady is holding the picture of the kitten. She is phoning the number on the picture. It is her kitten because she has a photo of it on her table.", "back": "What is the old woman holding? What is she doing? What is on her table?"}, {"n": 5, "say": "The boy has given the kitten back to the old woman. The woman and the kitten look very happy. The boy looks surprised and happy because the old woman has given him a present.", "back": "What has the boy done? How does the old woman feel? Why is the boy looking surprised and happy?"}]}}, "p4": {"intro": "Now let's talk about your school.", "qs": [{"q": "What time do your lessons start at school?", "a": "Quarter to nine", "back": "Do your lessons start at nine o'clock?"}, {"q": "How do you travel to school?", "a": "By bus", "back": "Do you travel to school by bus?"}, {"q": "What is your favourite subject at school?", "a": "Maths", "back": "What school subject do you like the best?"}, {"q": "How many children are there in your class?", "a": "30", "back": "Are there 30 children in your class?"}, {"q": "Tell me about what you usually do after school.", "a": "I like to play with my friends. We usually play computer games. I have dinner with my family.", "back": "Do you like to play with your friends after school? What do you like to do with your friends? Do you eat dinner with your family?"}], "draft": false}}, {"id": "ptp-t3", "no": 3, "group": "ptp", "src": "YLE Practice Tests Plus Flyers (2nd ed.)", "t": 3, "hints": {"p1": "cow = con bò; horse = con ngựa; fence = hàng rào; tree = cái cây; bucket = cái xô; duck = con vịt; ducklings = vịt con; frog = con ếch; sheep = con cừu; puppy = chó con; dog bowl = bát của chó; pond = cái ao; stones = hòn đá; basket = cái giỏ; flowers = hoa; teddy bear = gấu bông", "p2q": ["What's the teacher's name?", "What day is the class?", "What time does it start?", "How many children are there?", "What sport do they learn?"], "p2w": "sports class = lớp thể thao; Miss / Mr = cô / thầy; Tuesday / Friday = thứ Ba / thứ Sáu; quarter to two / quarter past two = 1 giờ 45 / 2 giờ 15; twenty-five / twenty-eight children = 25 / 28 em; hockey / volleyball / basketball / tennis = khúc côn cầu / bóng chuyền / bóng rổ / quần vợt", "p3": "calendar = tờ lịch; birthday = sinh nhật; party = bữa tiệc; surprise = bất ngờ; cake = bánh kem; present = quà; balloon = bóng bay; decorate = trang trí; invite = mời; cook = nấu ăn; kitchen = nhà bếp; hide = trốn; welcome = chào đón; guests = khách mời; happy = vui vẻ"}, "teacher": {"p1": {"example": "In my picture there is a tree next to the farmer but in your picture there isn't.", "items": [{"ex": "In my picture, there are two horses.", "cand": "In my picture, there are three horses.", "back": "Are there two horses?"}, {"ex": "In my picture, the boy is holding a toy cat.", "cand": "In my picture, the boy is holding a toy chicken.", "back": "Is the boy holding a toy cat?"}, {"ex": "In my picture, there are five cows.", "cand": "In my picture, there are four cows.", "back": "Are there five cows?"}, {"ex": "In my picture, the puppy is drinking water from a bowl.", "cand": "In my picture, the dog is drinking water from a bowl.", "back": "Is the puppy drinking water from a bowl?"}, {"ex": "In my picture, the frogs are sitting on the bigger rock.", "cand": "In my picture, the frogs are sitting on the smaller rock.", "back": "Are the frogs sitting on the bigger rock?"}, {"ex": "In my picture, the farmer is wearing a black hat.", "cand": "In my picture, the farmer is wearing a brown hat.", "back": "Is the farmer wearing a black hat?"}]}, "p2": {"intro": "George and Katy both have sports lessons at school. I don't know anything about George's sports class but you do. So I'm going to ask you some questions.", "examinerAsks": {"title": "George's sports class", "qa": [["What is George's sports teacher called?", "Mr Butt"], ["What day is George's sports lesson?", "Tuesday"], ["What time does the lesson start?", "2:15"], ["How many children are in George's class?", "25"], ["What sport is George's class learning to play?", "Hockey"]]}, "candidateAsks": {"title": "Katy's sports class", "qa": [["What is Katy's sports teacher called?", "Miss Keen"], ["What day is Katy's sports lesson?", "Friday"], ["What time does the lesson start?", "1:45"], ["How many children are in Katy's class?", "28"], ["What sport is Katy's class learning to play?", "Volleyball"]]}}, "p3": {"title": "The birthday", "intro": "A woman is having breakfast with her family. She looks sad because she thinks her family has forgotten her birthday.", "pics": [{"n": 2, "say": "The man and children are waving goodbye to the woman. The woman is going to work. She still looks unhappy.", "back": "What are the man and the children doing? Where is the woman going?"}, {"n": 3, "say": "The man and the children have made a cake. The man is taking the cake out of the oven.", "back": "What have the man and the children made?"}, {"n": 4, "say": "The man and the children are ith?", "Her grandparents"], ["How long did she go there for?", "Two weeks"], ["What did she do there?", "She went swimming."], ["What did she buy there?", "A T-shirt"]]}, "candidateAsks": {"title": "Tony's holiday", "qa": [["Where did Tony go on holiday?", "To the mountains"], ["Who did he go with?", "His parents"], ["How long did he go there for?", "One week"], ["What did he do there?", "He went skiing."], ["What did he buy there?", "A scarf"]]}}, "p3": {"title": "The hungry birds", "intro": "A family is spending a day on the beach. They are putting their towels and bags on the beach.", "pics": [{"n": 2, "say": "The family are going for a swim in the sea. Everyone is laughing and looks very happy.", "back": "What is the family doing? How do you think the family feels?"}, {"n": 3, "say": "There are three birds on the towels. They are eating the family's sandwiches.", "back": "How many birds are there? What are the birds doing?"}, {"n": 4, "say": "The family have come out of the sea. The birds have flown away. The parents look angry because the birds have eaten the sandwiches.", "back": "Where are the birds? How do the parents feel? Why?"}, {"n": 5, "say": "The family has gone to a beach café to have lunch. They are eating burgers and chips. The children look very happy. I think they are pleased the birds ate their sandwiches.", "back": "Where is the family now? What are they eating? How do the children feel?"}]}}, "p4": {"intro": "Now let's talk about friends.", "qs": [{"q": "How often do you see your friends?", "a": "Every day", "back": "Do you see your friends every day?"}, {"q": "What do you do with your friends after school?", "a": "Play football", "back": "Do you play sport with your friends after school?"}, {"q": "Where do you go with your friends at the weekend?", "a": "To the park", "back": "Do you go to the park with your friends at the weekend?"}, {"q": "What food do you like to eat with your friends?", "a": "Chips", "back": "Do you like to eat chips with I like a book about a girl and her dog. It's funny and has lovely pictures. I read it last month.", "back": "What's the book about? What's it like? When did you read it?"}], "draft": true}}, {"id": "suc-t3", "no": 23, "group": "suc", "src": "Succeed in Cambridge English: Flyers (8 Practice Tests)", "t": 3, "hints": {"p1": "fire engine = xe cứu hỏa; firefighter = lính cứu hỏa; hose = vòi rồng; ladder = thang; helmet = mũ bảo hộ; bench = ghế dài; lead = dây dắt chó; dog = con chó; hat = cái mũ; coat = áo khoác; window = cửa sổ; tree = cái cây; sun = mặt trời; walk = đi bộ; hold = cầm", "p2q": ["What sport do they play at school?", "Where is the school?", "Is it big or small?", "Where do they go for their school holiday?", "What's the school called?"], "p2w": "sport = môn thể thao; tennis / football / basketball = quần vợt / bóng đá / bóng rổ; in East Street / in Boat Street = ở đường East / đường Boat; big / small = lớn / nhỏ; school holiday = kỳ nghỉ của trường; to a castle / to the zoo / to the museum = đến lâu đài / sở thú / bảo tàng", "p3": "rain = mưa; wet = ướt; puddle = vũng nước; cold = lạnh; sneeze = hắt hơi; sick = bị ốm; bed = giường; temperature = nhiệt độ; medicine = thuốc; drink = uống; mum = mẹ; miss school = nghỉ học; feel better = cảm thấy khỏe hơn; play outside = chơi ngoài trời; ball = quả bóng"}, "p4": {"intro": "Now let's talk about a day at school.", "qs": [{"q": "What time do you get to school?", "a": "At a quarter to eight.", "back": "Do you get to school at eight o'clock?"}, {"q": "Who sits next to you in class?", "a": "My friend Nam.", "back": "Does your friend sit next to you?"}, {"q": "What do you eat at break time?", "a": "A sandwich.", "back": "Do you eat a sandwich?"}, {"q": "Which lesson do you like best?", "a": "English.", "back": "Do you like English?"}, {"q": "Tell me about your school.", "a": "My school's big. There's a playground and a library. I like it because my friends are there.", "back": "What's your school like? What is ther r is blowing a whistle.", "cand": "In my picture, the teacher is holding a stopwatch.", "back": "What is the teacher holding?"}, {"ex": "In my picture, the flag is blue.", "cand": "In my picture, the flag is green.", "back": "What colour is the flag?"}]}, "p2": {"intro": "Ella and Ben both go to a summer camp. I don't know anything about Ella's camp but you do. So I'm going to ask you some questions.", "examinerAsks": {"title": "Ella's summer camp", "qa": [["Where is Ella's summer camp?", "by a lake"], ["How long is it?", "two weeks"], ["Who does she go with?", "her cousin"], ["What does she do there?", "sailing"], ["Is it expensive or cheap?", "expensive"]]}, "candidateAsks": {"title": "Ben's summer camp", "qa": [["Where is Ben's summer camp?", "in the mountains"], ["How long is it?", "one week"], ["Who does he go with?", "his friends"], ["What does he do there?", "climbing"], ["Is it expensive or cheap?", "cheap"]]}}, "p3": {"title": "The lost trophy", "intro": "Tom is at school on sports day. He is very happy because he has won a race and he's holding a golden trophy.", "pics": [{"n": 2, "say": "The dog takes the trophy and runs away. Tom is surprised.", "back": "What does the dog do? How does Tom feel?"}, {"n": 3, "say": "Tom runs after the dog. The children are laughing.", "back": "What is Tom doing?"}, {"n": 4, "say": "Tom finds the dog under the tree.", "back": "Where does Tom find the dog?"}, {"n": 5, "say": "Tom is happy. He hugs the dog and gets his trophy back.", "back": "How does Tom feel at the end?"}]}}, "p2tbl": {"topic": "Summer camp", "a": {"name": "Ella", "rows": [["Where", "by a lake"], ["How long", "two weeks"], ["Who / go with", "her cousin"], ["What / do", "sailing"], ["Cost", "expensive"]]}, "b": {"name": "Ben", "rows": [["Where", "in the mountains"], ["How long", "one week"], ["Who / go with", "his friends"], ["What / do", "climbing"], ["Cost", "cheap"]]}}, "hints": {"p1": "sports day = ngày hội thể thao; race = cuộc đua; trophy = chiếc cúp; wearing glasses?"}, {"ex": "In my picture, the cashier is a woman with long hair.", "cand": "In my picture, the cashier is a man with a moustache.", "back": "Who is the cashier?"}, {"ex": "In my picture, the clock says three o'clock.", "cand": "In my picture, the clock says half past four.", "back": "What time does the clock say?"}, {"ex": "In my picture, the man is carrying a red basket.", "cand": "In my picture, the man is carrying a green basket.", "back": "What colour is the basket?"}, {"ex": "In my picture, there is a loaf of bread on the top shelf.", "cand": "In my picture, there is a loaf of bread on the bottom shelf.", "back": "Where is the bread?"}]}, "p2": {"intro": "Anna and Dan each have a favourite shop. I don't know anything about Anna's shop but you do. So I'm going to ask you some questions.", "examinerAsks": {"title": "Anna's favourite shop", "qa": [["What does Anna's shop sell?", "toys"], ["Where is it?", "next to the bank"], ["What time does it open?", "9 a.m."], ["How often does she go there?", "once a month"], ["What did she buy last time?", "a puzzle"]]}, "candidateAsks": {"title": "Dan's favourite shop", "qa": [["What does Dan's shop sell?", "sports clothes"], ["Where is it?", "opposite the cinema"], ["What time does it open?", "10 a.m."], ["How often does he go there?", "every Saturday"], ["What did he buy last time?", "a football"]]}}, "p3": {"title": "The shopping list", "intro": "Mrs Green is at home. She is writing a shopping list and her son Max is going to help her.", "pics": [{"n": 2, "say": "Max and his mum go to the supermarket. Max pushes the trolley.", "back": "Where do they go? What is Max doing?"}, {"n": 3, "say": "The shopping list falls out of Max's pocket. He doesn't see it.", "back": "What falls out of his pocket?"}, {"n": 4, "say": "Mum can't find the list. Max is worried.", "back": "How does Max feel?"}, {"n": 5, "say": "They laugh. They have got all the food in the bags.", "back": "How do they feel at the end?"}]}}, "p2tbl": {"topic": "Favourite shop", "a": {"name": "Anna", "rows": [["What / sell", "toys"], ["Where", "next to the bank"], ["What time / open", "9 a.m."], ["How often / go", "once a month"], ["What / buy", "a puzzle"]]}, "b": {"name": "Dan", "rows": [["What / sell", "sports clothes"], ["Where", "opposite the cinema"], ["What time / open", "10 a.m."], ["How often / go", "every Saturday"], ["What / buy", "a football"]]}}, "hints": {"p1": "supermarket = siêu thị; trolley = xe đẩy; basket = giỏ; shelf = kệ hàng; cashier = thu ngân; till = quầy tính tiền; fridge = tủ lạnh; apples = táo; oranges = cam; bread = bánh mì; milk = sữa; clock = đồng hồ; push = đẩy; carry = xách; choose = chọn", "p2q": ["What does the shop sell?", "Where is it?", "What time does it open?", "How often does he/she go?", "What did he/she buy?"], "p2w": "shop = cửa hàng; toys / sports clothes / books / shoes = đồ chơi / quần áo thể thao / sách / giày; next to / opposite / behind = cạnh / đối diện / sau; open = mở cửa; once a month / every Saturday = mỗi tháng một lần / mỗi thứ Bảy; puzzle / football = trò xếp hình / quả bóng đá", "p3": "shopping list = danh sách mua sắm; trolley = xe đẩy; pocket = túi áo; fall out = rơi ra; supermarket = siêu thị; till = quầy tính tiền; bag = túi; worried = lo lắng; find = tìm thấy; forget = quên; laugh = cười; notice = nhận ra"}, "p4": {"intro": "Now let's talk about food and shopping.", "draft": true, "qs": [{"q": "Do you like going shopping?", "a": "Yes, I do. I like buying sweets.", "back": "What do you like buying?"}, {"q": "What's your favourite food?", "a": "Pizza.", "back": "Do you like pizza or noodles?"}, {"q": "Who cooks dinner in your house?", "a": "My mum.", "back": "Does your mum or your dad cook?"}, {"q": "Where do you buy fruit?", "a": "At the market.", "back": "Do you buy fruit at the market or the supermarket?"}, {"q": "Tell me about your favourite meal.", "a": "My favourite meal is chicken and rice. My grandma makes it on Sundays. It's delicious.", "ba hey are very excited.", "pics": [{"n": 2, "say": "They run onto a train. Leo is laughing.", "back": "What do they do? How does Leo feel?"}, {"n": 3, "say": "Kim looks at her ticket. She is surprised. It's the wrong train.", "back": "What does Kim look at?"}, {"n": 4, "say": "They get off at a small station. Kim is worried.", "back": "How does Kim feel?"}, {"n": 5, "say": "Grandma arrives in her car. The children are happy.", "back": "Who arrives? How do they feel?"}]}}, "p2tbl": {"topic": "A train trip", "a": {"name": "Zoe", "rows": [["Where / go", "to the seaside"], ["What time / leave", "8.30 a.m."], ["How long / take", "two hours"], ["Who / go with", "her aunt"], ["What / take", "a book"]]}, "b": {"name": "Sam", "rows": [["Where / go", "to the capital city"], ["What time / leave", "7.15 a.m."], ["How long / take", "three hours"], ["Who / go with", "his grandparents"], ["What / take", "a camera"]]}}, "hints": {"p1": "railway station = ga tàu; platform = sân ga; train = tàu hỏa; suitcase = va-li; hat = cái mũ; ice cream = kem; bench = ghế dài; comic = truyện tranh; kiosk = quầy bán báo; pushchair = xe đẩy em bé; baby = em bé; pigeon = chim bồ câu; roof = mái nhà; clock = đồng hồ; sign = biển báo", "p2q": ["Where is he/she going?", "What time does the train leave?", "How long does the trip take?", "Who is he/she going with?", "What is he/she taking?"], "p2w": "train trip = chuyến đi tàu; seaside = bờ biển; capital city = thủ đô; leave = rời đi; take (time) = mất (thời gian); two hours / three hours = 2 giờ / 3 giờ; aunt / grandparents = dì (cô) / ông bà; camera / book / sandwiches = máy ảnh / sách / bánh mì", "p3": "platform = sân ga; ticket = vé; wrong train = nhầm tàu; get on = lên (tàu); get off = xuống (tàu); station = nhà ga; map = bản đồ; worried = lo lắng; surprised = ngạc nhiên; grandma = bà; wave = vẫy tay; arrive = đến nơi"}, "p4": {"intro": "Now let's talk about travel.", "draft": true, "qs": [{"q": "How do you go to school?", "a": "I go by bike.", "back": "Do you go by bike or by bus?"}, {"q": "Have you ever been on a train?", "a": "Yes, I have. Last summer.", "back": "Have you been on a train?"}, {"q": "Where do you like going on holiday?", "a": "To the beach.", "back": "Do you like the beach or the mountains?"}, {"q": "Who do you travel with?", "a": "With my family.", "back": "Do you travel with your family?"}, {"q": "Tell me about a trip you remember.", "a": "I went to Da Nang last year. We went by plane. I swam in the sea and ate ice cream.", "back": "Where did you go? How did you go? What did you do?"}]}}, {"id": "ai-t4", "no": 32, "group": "ai", "src": "Bộ soạn thêm – Claude soạn theo cấu trúc Flyers", "t": 4, "hidden": false, "teacher": {"p1": {"example": "In my picture there is a globe on the shelf but in your picture there is a lamp.", "items": [{"ex": "In my picture, the librarian is wearing glasses.", "cand": "In my picture, the librarian is not wearing glasses.", "back": "Is the librarian wearing glasses?"}, {"ex": "In my picture, the girl is holding three books.", "cand": "In my picture, the girl is holding five books.", "back": "How many books is the girl holding?"}, {"ex": "In my picture, the cat is sleeping on the chair.", "cand": "In my picture, the cat is sleeping on the table.", "back": "Where is the cat sleeping?"}, {"ex": "In my picture, the poster is of a rocket.", "cand": "In my picture, the poster is of a dinosaur.", "back": "What's on the poster?"}, {"ex": "In my picture, the plant is next to the window.", "cand": "In my picture, the plant is next to the door.", "back": "Where is the plant?"}]}, "p2": {"intro": "Mia and Leo have both got a new book. I don't know anything about Mia's book but you do. So I'm going to ask you some questions.", "examinerAsks": {"title": "Mia's a new book", "qa": [["What is Mia's book called?", "The Magic Dragon"], ["Who wrote it?", "a famous author"], ["How many pages has it got?", "150"], ["Where did she get it?", "from the library"], ["Is it interesting or boring?", "interesting"]]}, "candidateAsks": {"title": "Leo's a new book", "qa": [["What is Leo's book called?", "Football Stars"], ["Who wrote it?", "a teacher"], ["How many pages has it got?", "90"], ["Where did he get it?", "from his cousin"], ["Is it interesting or boring?", "boring"]]}}, "p3": {"title": "The sleeping librarian", "intro": "It is a quiet afternoon in the library. The librarian is working at her desk and two children are reading.", "pics": [{"n": 2, "say": "The librarian falls asleep. The children smile.", "back": "What happens to the librarian? What do the children do?"}, {"n": 3, "say": "The children put the books back on the shelves.", "back": "What are the children doing?"}, {"n": 4, "say": "The teacher opens the door. She is surprised.", "back": "Who opens the door? How does she feel?"}, {"n": 5, "say": "The librarian wakes up. She is happy and the children give her a book.", "back": "What do the children give her?"}]}}, "p2tbl": {"topic": "A new book", "a": {"name": "Mia", "rows": [["Name / book", "The Magic Dragon"], ["Who / write it", "a famous author"], ["How many pages", "150"], ["Where / get it", "from the library"], ["Interesting / boring", "interesting"]]}, "b": {"name": "Leo", "rows": [["Name / book", "Football Stars"], ["Who / write it", "a teacher"], ["How many pages", "90"], ["Where / get it", "from his cousin"], ["Interesting / boring", "boring"]]}}, "hints": {"p1": "library = thư viện; librarian = thủ thư; shelf = kệ sách; globe = quả địa cầu; lamp = đèn; poster = áp phích; rocket = tên lửa; dinosaur = khủng long; plant = cây cảnh; computer = máy tính; glasses = kính mắt; hold = cầm; read = đọc; share = dùng chung; sleep = ngủ", "p2q": ["What's the book called?", "Who wrote it?", "How many pages has it got?", "Where did he/she get it?", "Is it interesting or boring?"], "p2w": "book = quyển sách; write – wrote = viết – đã viết; author = tác giả; pages = số trang; library = thư viện; cousin = anh chị em họ; interesting / boring = th     R ? h('div.rows', CR.map((c, i) => h('div.row', h('span', c.en), h('span.muted', c.vi), h('span', { style: 'letter-spacing:0' }, R.avg[i].toFixed(1) + ' / 5')))) : null,

    h('div.nav', { style: 'justify-content:center;margin-top:14px' },
      h('button.btn.ghost', { onclick: () => openSet(st.set.id) }, '↺ Làm lại'),
      h('button.btn.ghost', { onclick: goHome }, '☰ Chọn bộ khác'),
      next ? h('button.btn', { onclick: () => openSet(next.id) }, 'Test ' + next.no + ' →') : null)));
  window.scrollTo(0, 0);
}
function goHome() { clearInterval(tick); st.view = 'home'; homeView(); window.scrollTo(0, 0); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('lb').classList.add('hidden'); });
homeView();
</script>
</body>
</html>
