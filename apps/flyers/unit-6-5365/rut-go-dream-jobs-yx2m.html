<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rút Gỗ Dream Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Bố cục: cột câu hỏi + tháp gỗ (ngang), xếp dọc trên điện thoại; giao diện sáng cố định, màu kẹo ngọt */
  color-scheme:light;
  --ink:#2f3f5a; --ink-soft:#5f6f8a;
  --panel:#fffaf0; --panel-line:#f1dfc4;
  --mint:#bdf0d4; --mint-deep:#53c08a;
  --sun:#ffd873; --sun-deep:#f0a63c;
  --coral:#ffb59c; --coral-deep:#e8694a;
  --blue-btn:#8fd0f2; --blue-btn-deep:#5fb3e0;
  --good:#3fae6a; --bad:#e8694a;
  --wood-line:#6a4325;
  --radius-lg:28px; --radius-md:18px; --radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:'Quicksand',system-ui,-apple-system,sans-serif;font-weight:700;color:var(--ink);
  background:linear-gradient(180deg,#bfe8ff 0%,#e6f7ff 55%,#fff3d6 100%)}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}

.stage{height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:8px 16px}
.hud{display:flex;align-items:center;justify-content:space-between}
.title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;line-height:1}
.subtitle{font-size:12px;color:var(--ink-soft);margin-top:2px}
.hbtns{display:flex;gap:8px}
body.paused *,body.paused *::after{animation-play-state:paused!important}
.mute-btn{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--panel);box-shadow:0 4px 0 var(--ink);font-size:20px;cursor:pointer}
.mute-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}

.statbar{display:flex;gap:8px}
.pill{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border:3px solid var(--ink);
  border-radius:999px;padding:4px 10px;box-shadow:0 4px 0 var(--ink);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px}
.pill.urgent{background:var(--coral);animation:blink .5s infinite alternate}
@keyframes blink{to{transform:scale(1.05)}}

.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.side{flex:0 0 auto;min-height:36dvh;display:flex;flex-direction:column;gap:8px}
.field{flex:1;min-height:0;position:relative;border:3px solid var(--ink);border-radius:var(--radius-lg);box-shadow:0 6px 0 var(--ink);
  overflow:hidden;background:linear-gradient(#cfeeff,#eaf8ff 68%,#fff6dc)}
@media (min-aspect-ratio:5/4){
  .main{flex-direction:row}
  .side{flex:0 0 46%;min-height:0}
}

.turn{display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--ink);border-radius:var(--radius-md);padding:6px 12px;box-shadow:0 4px 0 var(--ink)}
.turn .av{font-size:30px;line-height:1}
.turn .who{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;line-height:1.05}
.turn .say{font-size:13px;color:var(--ink-soft)}
.turn.bot{background:#e1f1ff}

.card{background:var(--panel);border:3px solid var(--ink);border-radius:var(--radius-lg);padding:12px;box-shadow:0 6px 0 var(--ink);flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.qlabel{font-size:13px;color:var(--ink-soft)}
.qrow{display:flex;align-items:center;gap:8px}
.qtext{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(20px,3.4vw,30px);line-height:1.2;flex:1}
.spk{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);box-shadow:0 3px 0 var(--sun-deep);font-size:20px;cursor:pointer;flex:none}
.qhint{font-size:14px;color:var(--ink-soft);min-height:0}
.fb{border-radius:var(--radius-sm);padding:6px 10px;background:#fff;border:2px dashed var(--panel-line);font-size:15px;line-height:1.3}
.fb.good{border-color:var(--good)} .fb.bad{border-color:var(--coral-deep)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.opts.n3 .opt:last-child{grid-column:1/-1}
.opt{font-weight:700;font-size:clamp(16px,2.4vw,22px);padding:10px 8px;min-height:54px;border:3px solid var(--ink);border-radius:var(--radius-md);
  background:var(--blue-btn);box-shadow:0 5px 0 var(--blue-btn-deep);cursor:pointer;position:relative;line-height:1.15}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-btn-deep)}
.opt.ok{background:#b8ecc8;box-shadow:0 5px 0 var(--good)}
.opt.no{background:#ffd0bf;box-shadow:0 5px 0 var(--coral-deep)}
.opt.dim{opacity:.5}
.opt.botpick::after{content:'🤖';position:absolute;right:6px;top:-12px;font-size:22px}
.opts.locked .opt{pointer-events:none}
.skip{align-self:flex-end;border:3px solid var(--ink);border-radius:999px;background:var(--sun);box-shadow:0 4px 0 var(--sun-deep);padding:6px 16px;font-weight:800;cursor:pointer}

.pull{justify-content:center;text-align:center;align-items:stretch}
.pull .big{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(22px,4vw,34px);line-height:1.1}
.pdesc{font-size:15px;color:var(--ink-soft)}
.tbar{height:20px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--mint-deep);transition:width .1s linear}
.tbar.low i{background:var(--coral-deep)}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.probebtn{align-self:center;border:3px solid var(--ink);border-radius:999px;background:var(--mint);box-shadow:0 4px 0 var(--mint-deep);padding:8px 18px;font-weight:800;font-size:16px;cursor:pointer}
.probebtn.on{background:var(--sun);box-shadow:0 4px 0 var(--sun-deep)}

/* ===== TOWER ===== */
.cloud{position:absolute;font-size:34px;opacity:.9;animation:drift 18s linear infinite}
@keyframes drift{from{transform:translateX(-30px)}50%{transform:translateX(30px)}to{transform:translateX(-30px)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(#d49a5a,#b57a3e);border-top:4px solid var(--wood-line)}
.botbox{position:absolute;right:8px;top:8px;display:flex;align-items:flex-start;gap:6px;z-index:5;flex-direction:row-reverse}
.botav{font-size:40px;line-height:1}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:5px 10px;font-size:14px;max-width:170px;opacity:0;transform:translateY(-4px) scale(.9);transition:.2s;margin-top:4px}
.bubble.show{opacity:1;transform:none}
.tower{position:absolute;left:50%;bottom:46px;transform-origin:50% 100%;transform:translateX(-50%) scale(1);transition:transform .45s ease}
.sway{position:relative;transform-origin:50% 100%}
.sway.wob{animation:sway var(--dur,.7s) ease-in-out}
@keyframes sway{
  0%{transform:rotate(0)}20%{transform:rotate(var(--amp))}40%{transform:rotate(calc(var(--amp) * -1))}
  60%{transform:rotate(calc(var(--amp) * .6))}80%{transform:rotate(calc(var(--amp) * -.4))}100%{transform:rotate(0)}}
.field.quake{animation:quake .5s}
@keyframes quake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}

.blk{position:absolute;border:3px solid var(--wood-line);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:left .6s cubic-bezier(.3,.8,.3,1),bottom .6s cubic-bezier(.3,.8,.3,1),transform .25s ease,filter .25s}
.blk::before{content:'';position:absolute;inset:0;border-radius:5px;
  background:repeating-linear-gradient(90deg,rgba(106,67,37,.10) 0 2px,transparent 2px 15px),linear-gradient(180deg,rgba(255,255,255,.38) 0 22%,transparent 22%)}
.blk.t0{background-color:#f0c58a}.blk.t1{background-color:#e7b270}.blk.t2{background-color:#f6d49f}
.blk .ico{position:relative;z-index:2;font-size:20px;line-height:1}
.blk .pips{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:4px;z-index:2}
.pips i{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--wood-line);display:block}
.pips i.on{background:var(--sun-deep)}
.blk.pulling{transform:scale(1.12);z-index:60;filter:drop-shadow(0 8px 6px rgba(47,63,90,.35))}
.blk.shk{animation:shk .28s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-1deg)}75%{transform:translateX(4px) rotate(1deg)}}
.blk.mk-warn{box-shadow:inset 0 0 0 4px var(--coral-deep);background-image:linear-gradient(rgba(232,105,74,.4),rgba(232,105,74,.4))}
.blk.mk-ok{box-shadow:inset 0 0 0 4px var(--good)}
.blk.mk-tight{box-shadow:inset 0 0 0 4px var(--sun-deep)}
.blk.fall{transition:none!important}

/* ===== KHỐI THEO LOẠI ===== */
.blk.gone{transform:translate(90px,-70px) scale(.5) rotate(24deg);opacity:0;pointer-events:none;transition:transform .55s ease-in,opacity .55s ease-in}
.k-st,.k-swin,.k-mer,.k-base{border-color:#46556f}
.k-st::before,.k-swin::before,.k-mer::before,.k-base::before{background:repeating-linear-gradient(0deg,rgba(47,63,90,.14) 0 2px,transparent 2px 17px),repeating-linear-gradient(90deg,rgba(47,63,90,.14) 0 2px,transparent 2px 23px),linear-gradient(180deg,rgba(255,255,255,.35) 0 18%,transparent 18%)}
.k-roof,.k-eave{border-color:#7a3a22}
.k-roof::before,.k-eave::before{background:repeating-linear-gradient(90deg,rgba(60,20,10,.17) 0 2px,transparent 2px 13px),linear-gradient(180deg,rgba(255,255,255,.28) 0 20%,transparent 20%)}
.k-eave{border-radius:4px 4px 14px 14px}
.k-eave .ico{font-size:15px}
.k-win::after,.k-swin::after,.k-twin::after{content:'';position:absolute;left:50%;top:50%;width:min(62%,34px);height:68%;transform:translate(-50%,-50%);z-index:1;
  background:linear-gradient(90deg,transparent 46%,var(--wood-line) 46% 54%,transparent 54%),linear-gradient(0deg,transparent 46%,var(--wood-line) 46% 54%,transparent 54%),#bfe8ff;
  border:3px solid var(--wood-line);border-radius:5px}
.k-door::after,.k-gate::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:58%;height:90%;z-index:1;
  border:3px solid var(--wood-line);border-bottom:none;border-radius:14px 14px 0 0}
.k-door::after{background:radial-gradient(circle at 78% 55%,#ffd873 0 3px,transparent 4px),#7a4a26}
.k-gate::after{width:62%;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.2) 6px 8px),#2f3f5a;border-color:#46556f}
.k-cap{border-color:#b07a1a;background-color:#ffd873}
.k-flag{background:none!important;border-color:transparent!important;cursor:default}
.k-flag::before{inset:auto;left:50%;bottom:0;width:4px;height:100%;border-radius:2px;background:var(--wood-line);transform:translateX(-50%)}
.k-flag::after{content:'';position:absolute;left:calc(50% + 2px);top:2px;width:26px;height:16px;background:var(--coral-deep);clip-path:polygon(0 0,100% 50%,0 100%);transform-origin:left center;animation:flap 1.6s ease-in-out infinite}
@keyframes flap{50%{transform:skewY(7deg) scaleX(.86)}}

.k-rk,.k-port,.k-deck,.k-glass{border-color:#46556f}
.k-rk::before,.k-port::before{background:radial-gradient(circle,rgba(70,85,111,.35) 0 2px,transparent 2.5px) 0 0/16px 100%,linear-gradient(180deg,rgba(255,255,255,.6) 0 20%,transparent 20%)}
.k-port::after{content:'';position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #46556f;z-index:1;
  background:radial-gradient(circle at 35% 35%,#fff 0 3px,transparent 4px),#8fd0f2}
.k-red,.k-funnel,.k-tR,.k-tW{border-color:#7a3a22}
.k-funnel::before{background:linear-gradient(180deg,transparent 0 22%,#2f3f5a 22% 42%,transparent 42%),linear-gradient(90deg,rgba(255,255,255,.25) 0 20%,transparent 20%)}
.k-tR::before,.k-tW::before,.k-red::before{background:linear-gradient(180deg,rgba(255,255,255,.3) 0 18%,transparent 18%)}
.k-iron{border-color:#3f3429}
.k-iron::before{background:repeating-linear-gradient(45deg,rgba(40,30,20,.35) 0 3px,transparent 3px 10px),repeating-linear-gradient(-45deg,rgba(40,30,20,.35) 0 3px,transparent 3px 10px)}
.k-hull{border-color:#1f3b61}
.k-hull::before{background:linear-gradient(180deg,rgba(255,255,255,.25) 0 14%,transparent 14%),linear-gradient(180deg,transparent 60%,#e5775a 60% 78%,transparent 78%)}
.k-tan,.k-twin,.k-clock{border-color:#8a6a35}
.k-tan::before,.k-twin::before,.k-clock::before{background:repeating-linear-gradient(0deg,rgba(90,60,20,.14) 0 2px,transparent 2px 17px),repeating-linear-gradient(90deg,rgba(90,60,20,.14) 0 2px,transparent 2px 23px),linear-gradient(180deg,rgba(255,255,255,.35) 0 18%,transparent 18%)}
.k-clock::after{content:'';position:absolute;left:50%;top:50%;width:36px;height:36px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--wood-line);z-index:1;
  background:linear-gradient(#2f3f5a,#2f3f5a) 50% 20%/3px 30% no-repeat,linear-gradient(#2f3f5a,#2f3f5a) 62% 50%/30% 3px no-repeat,#fffaf0}
.k-glass::before{background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(255,255,255,.6) 6px 9px),repeating-linear-gradient(90deg,transparent 0 11px,rgba(47,63,90,.22) 11px 13px)}
.k-ice{border-color:#b9a98c;border-radius:4px 4px 12px 12px}
.k-cake,.k-cake2,.k-cake3{border-color:#9a6b3a}
.k-cake::before,.k-cake2::before,.k-cake3::before{background:radial-gradient(circle,rgba(154,107,58,.35) 0 2px,transparent 2.5px) 0 0/14px 14px,linear-gradient(180deg,rgba(255,255,255,.35) 0 18%,transparent 18%)}
.k-ant,.k-candle{background:none!important;border-color:transparent!important;cursor:default}
.k-ant::before{inset:auto;left:50%;bottom:0;width:3px;height:100%;border-radius:2px;background:#46556f;transform:translateX(-50%)}
.k-ant::after{content:'';position:absolute;left:50%;top:0;width:10px;height:10px;border-radius:50%;background:var(--coral-deep);transform:translateX(-50%);animation:blink2 1s infinite alternate}
@keyframes blink2{to{opacity:.3}}
.k-candle::before{inset:auto;left:50%;bottom:0;width:12px;height:66%;border-radius:3px;background:repeating-linear-gradient(45deg,#e5775a 0 5px,#fffaf0 5px 10px);border:2px solid #7a3a22;transform:translateX(-50%)}
.k-candle::after{content:'';position:absolute;left:50%;top:0;width:10px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#ffd873;box-shadow:0 0 8px #ffb347;transform:translateX(-50%);animation:flick .5s infinite alternate}
@keyframes flick{to{transform:translateX(-50%) scale(.85,1.12)}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;margin-bottom:14px}
.tchip{border:3px solid var(--ink);border-radius:var(--radius-md);background:#fff;padding:5px 2px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tchip span{font-size:24px}.tchip small{font-size:11px;font-weight:700}
.tchip.on{background:var(--mint);box-shadow:0 3px 0 var(--mint-deep)}
.pick-label{font-size:13px;color:var(--ink-soft);margin:0 0 6px}

.names{display:flex;gap:8px;margin-bottom:14px}
.names input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:999px;padding:8px 12px;font:inherit;font-weight:700;background:#fff;color:var(--ink);text-align:center;-webkit-user-select:text;user-select:text}
.field.two .botbox{display:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;text-align:left}
@media (max-width:480px){.pgrid{grid-template-columns:1fr}}
.pcard{border:3px solid var(--panel-line);border-radius:var(--radius-md);padding:8px 10px;background:#fff;min-width:0}
.pcard.win{border-color:var(--sun-deep);background:#fff8e0}
.pname{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:800;overflow-wrap:anywhere}
.pscore{font-family:'Baloo 2',sans-serif;font-size:28px;font-weight:800;line-height:1}
.pstars{font-size:20px;letter-spacing:2px}

/* ===== EFFECTS ===== */
.spark{position:fixed;pointer-events:none;z-index:200;font-size:22px;animation:spark .65s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2)}}
.toast{position:fixed;left:50%;top:calc(12% + env(safe-area-inset-top));transform:translate(-50%,-20px) scale(.9);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;padding:8px 18px;border-radius:999px;z-index:150;transition:.2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.bad{background:var(--coral-deep)}.toast.good{background:var(--good)}.toast.combo{background:var(--sun-deep);color:var(--ink)}

/* ===== OVERLAYS ===== */
.overlay{position:fixed;inset:0;background:rgba(47,63,90,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.sheet{background:var(--panel);border:4px solid var(--ink);border-radius:var(--radius-lg);box-shadow:0 8px 0 var(--ink);padding:20px 18px;max-width:520px;width:100%;text-align:center;max-height:92dvh;overflow:auto}
.sheet h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32px;margin:4px 0}
.logo{font-size:54px;line-height:1}
.lead{font-size:17px;margin:6px 0 14px;color:var(--ink-soft)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.chip{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:8px 14px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.chip.on{background:var(--mint);box-shadow:0 3px 0 var(--mint-deep)}
.btn{border:3px solid var(--ink);border-radius:999px;background:var(--sun);box-shadow:0 5px 0 var(--sun-deep);padding:10px 22px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.alt{background:var(--blue-btn);box-shadow:0 5px 0 var(--blue-btn-deep);font-size:17px}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.btn.big{font-size:26px;padding:12px 34px}
.etitle{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;line-height:1.15}
.escore{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;line-height:1.1}
.estars{font-size:34px;letter-spacing:4px;margin-bottom:6px}
.esec{font-size:14px;color:var(--ink-soft);margin:8px 0 4px;text-align:left}
.elist{display:flex;flex-wrap:wrap;gap:6px;text-align:left}
.tag{background:#fff;border:2px solid var(--panel-line);border-radius:10px;padding:3px 8px;font-size:13px}
.tag.miss{border-color:var(--coral-deep)}
.ebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<div class="stage">
  <header class="hud">
    <div class="brand">
      <div class="title">Rút Gỗ Đối Đầu</div>
      <div class="subtitle" id="subtitle">Unit 6 · Dream Jobs</div>
    </div>
    <div class="hbtns"><button class="mute-btn" id="homeBtn" aria-label="Về màn hình chính">🏠</button><button class="mute-btn" id="pauseBtn" aria-label="Tạm dừng">⏸</button><button class="mute-btn" id="muteBtn" aria-label="Âm thanh">🔊</button></div>
  </header>

  <div class="statbar">
    <div class="pill" id="scorePill"><span id="scoreLbl">⭐</span> <span id="scoreV">0</span></div>
    <div class="pill" id="timerPill">⏱ <span id="timeV">–</span></div>
    <div class="pill" id="tokPill">🔍 <span id="tokV">0</span></div>
    <div class="pill" id="woodPill">🪵 <span id="woodV">0</span></div>
  </div>

let audioCtx=null, muted=false;
function ensureCtx(){ if(!audioCtx){ const C=window.AudioContext||window.webkitAudioContext; if(C) audioCtx=new C(); } return audioCtx; }
function tone(f,type,dur,gain,toF,delay){
  if(muted) return; const c=ensureCtx(); if(!c) return;
  const t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(toF) o.frequency.exponentialRampToValueAtTime(toF,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,gain,freq,delay){
  if(muted) return; const c=ensureCtx(); if(!c) return;
  const t=c.currentTime+(delay||0), n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=buf; f.type="lowpass"; f.frequency.value=freq;
  g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
}

let blocks=[], S={w:300,h:300}, curTheme=null;

// độ chặt ẩn của mỗi thanh: loose = rút êm, tight = phải chạm 3 lần, crit = gánh công trình, rút là sập
function rollState(){ const r=Math.random(); if(r<.14) return "crit"; if(r<.44) return "tight"; return "loose"; }
function makeBlock(r,type,x,y,w,h,fix){
  const el=document.createElement("div");
  el.className="blk k-"+type;
  el.style.width=w+"px"; el.style.height=h+"px"; el.style.left=x+"px"; el.style.bottom=y+"px";
  const pal=PAL[type]; if(pal) el.style.backgroundColor=pick(pal);
  el.innerHTML='<span class="ico"></span><div class="pips"></div>';
  const b={r,type,x,y,w,h,fix:!!fix,st:fix?"loose":rollState(),taps:0,mark:null,out:false,el};
  el._b=b; sway.appendChild(el); return b;
}
function buildTower(theme){
  curTheme=theme; sway.innerHTML=""; blocks=[];
  const widths=theme.rows.map(row=>row.i.reduce((s,it)=>s+it[0]*U,0)+(row.i.length-1)*GAP);
  const W=Math.max(...widths); let y=0;
  theme.rows.forEach((row,r)=>{
    let x=(W-widths[r])/2;
    row.i.forEach(it=>{ const w=it[0]*U; if(it[1]!=="sp") blocks.push(makeBlock(r,it[1],x,y,w,row.h,it[2]&&it[2].fix)); x+=w+GAP; });
    y+=row.h+GAP;
  });
  S={w:W,h:y};
  $("subtitle").textContent=theme.name+" · "+(two?"2 người":"Đấu với Bot");
  document.querySelector(".ground").style.background="linear-gradient("+theme.ground[0]+","+theme.ground[1]+")";
  fitTower();
}
function alive(){ return blocks.filter(b=>!b.out); }
const rowN=r=>blocks.filter(b=>!b.out&&!b.fix&&b.r===r).length;
function pullable(){ return blocks.filter(b=>!b.out&&!b.fix&&rowN(b.r)>=2); }
function fitTower(){
  const fw=field.clientWidth, fh=field.clientHeight, sh=S.h+10;
  sway.style.width=S.w+"px"; sway.style.height=sh+"px";
  const s=Math.max(.3,Math.min(1.7,(fw*.9)/S.w,(fh-46-40)/sh));
  tower.style.transform="translateX(-50%) scale("+s.toFixed(3)+")";
}
function wobble(amp,dur){
  sway.style.setProperty("--amp",amp+"deg"); sway.style.setProperty("--dur",dur+"s");
  sway.classList.remove("wob"); void sway.offsetWidth; sway.classList.add("wob");
}
function renderPips(b){
  const p=b.el.querySelector(".pips"); p.innerHTML="";
  if(b.taps>0&&b.st==="tight"&&b.mark!=="warn"){ for(let i=0;i<3;i++){ const s=document.createElement("i"); if(i<b.taps) s.className="on"; p.appendChild(s); } }
}
function renderMark(b){
  b.el.classList.remove("mk-warn","mk-ok","mk-tight");
  const ico=b.el.querySelector(".ico"); ico.textContent="";
  if(b.mark==="warn"){ b.el.classList.add("mk-warn"); ico.textContent="💀"; }
  else if(b.mark==="ok"){ b.el.classList.add("mk-ok"); ico.textContent="✅"; }
  else if(b.mark==="tight"){ b.el.classList.add("mk-tight"); ico.textContent="🔒"; }
  renderPips(b);
}
// mỗi 2 lượt rút, thêm 1 thanh gánh công trình ẩn → ván không kéo dài vô tận
function weaken(){
  const c=pullable().filter(x=>x.st!=="crit"&&x.taps===0&&!x.mark);
  if(c.length>1) pick(c).st="crit";
}

/* ----- chạm vào 1 thanh ----- */
function doTap(b,who){
  lastTouched=b;
  if(b.mark==="warn"){ collapse(who); return "collapse"; }
  b.taps++;
  if(b.st==="crit"){
    b.mark="warn"; renderMark(b); wobble(3,.9); playCreak(); b.el.classList.remove("shk"); void b.el.offsetWidth; b.el.classList.add("shk");
    if(who==="player"){ showToast("💀 Thanh này gánh cả tháp!","bad"); say(pick(BANT.warn)); }
    return "warn";
  }
  if(b.st==="loose"||b.taps>=3){ pullOut(b,who,false); return "out"; }
  b.el.classList.remove("shk"); void b.el.offsetWidth; b.el.classList.add("shk");
  playStuck(); renderPips(b); return "stuck";
}
async function pullOut(b,who,forced){
  const ep=epoch; stopTick(); busy=true; phase="anim"; updateHUD();
  const tight=b.st==="tight";
  b.out=true; b.el.classList.add("pulling"); playSlide();
  await sleep(420); if(ep!==epoch||!running) return;
  if(who==="player"){
    const gain=forced?0:(5+(tight?5:0));
    if(gain){ score+=gain; showToast("+"+gain+" 🪵 Rút an toàn!","good"); burstEl(b.el,["🪵","✨"],8); }
    say(pick(BANT.playerSafe));
  }else{ say(pick(BANT.botSafe)); }
  b.el.classList.remove("pulling"); b.el.classList.add("gone"); playPop(); wobble(.9,.6);
  woodN++; pulls++; if(pulls>=2&&pulls%2===0) weaken();
  await sleep(650); if(ep!==epoch||!running) return;
  b.el.style.visibility="hidden";
  busy=false; updateHUD();
  later(nextTurn,900);
}
function forcePull(who){
  if(busy||!running) return;
  const cand=pullable();
  if(!cand.length){ collapse(who); return; }
  let b=(lastTouched&&!lastTouched.out&&cand.includes(lastTouched))?lastTouched:null;
  if(!b){ const safe=cand.filter(x=>x.mark!=="warn"); b=pick(safe.length?safe:cand); }
  showToast(who==="player"?"⏰ Hết giờ! Bị ép rút!":"⏰ Bot hết giờ, bị ép rút!","bad");
  stopTick(); phase="anim";
  if(b.st==="crit"||b.mark==="warn"){ b.el.classList.add("pulling"); wobble(3,.6); playCreak(); later(()=>collapse(who),550); }
  else pullOut(b,who,true);
}

/* ----- sập tháp ----- */
function collapse(who){
  if(!running) return;
  running=false; phase="over"; busy=true; stopTick(); botTok++; clearTimeout(pendT); sway.classList.remove("wob");
  playCrash(); field.classList.add("quake"); setTimeout(()=>field.classList.remove("quake"),520);
  say(pick(who==="player"?BANT.playerCollapse:BANT.botCollapse));
  const items=alive().map(b=>{ b.el.classList.remove("pulling"); b.el.classList.add("fall");
    return {el:b.el,by:b.y,x:0,y:0,vx:(Math.random()-.5)*(300+b.r*70),vy:-(Math.random()*350+100),r:0,vr:(Math.random()-.5)*500}; });
  let last=performance.now(), t0=last;
  function step(now){
    const dt=Math.min(.033,(now-last)/1000); last=now;
    items.forEach(it=>{
      it.vy+=2200*dt; it.y+=it.vy*dt; it.x+=it.vx*dt; it.r+=it.vr*dt;
      if(it.y>it.by){ it.y=it.by; it.vy*=-.3; it.vx*=.7; it.vr*=.6; if(Math.abs(it.vy)<40) it.vy=0; }
      it.el.style.transform="translate("+it.x+"px,"+it.y+"px) rotate("+it.r+"deg)";
    });
    if(now-t0<2200) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  const ep=epoch; setTimeout(()=>{ if(ep===epoch) endGame(who); },2300);
}

function refill(){ queue=shuffle([...VOCAB.map((_,i)=>({k:"v",i})),...GRAM.map((_,i)=>({k:"g",i}))]); }
function nextEntry(){ if(!queue.length) refill(); return queue.shift(); }
function requeue(e){ queue.splice(Math.min(queue.length,3+Math.floor(Math.random()*3)),0,e); }
const sim=(a,b)=>(a[0]===b[0]?2:0)-Math.abs(a.length-b.length)*.3+Math.random()*.5;

function makeQ(entry){
  const L=LEVELS[level];
  if(entry.k==="g"){
    const g=GRAM[entry.i];
    return {entry,type:"gram",label:"Chọn đáp án đúng",text:g.s.replace("___","_____"),hint:L.hint?"💡 "+g.t:"",
      opts:shuffle([{t:g.a,ok:true},...g.x.slice(0,L.nOpt-1).map(t=>({t,ok:false}))]),
      full:g.s.replace("___",g.a)+" — "+g.vi, speak:g.s.replace("___",g.a), key:g.s.replace("___",g.a), keyVi:g.vi, canSpeak:false};
  }
  const v=VOCAB[entry.i];
  const types=["en2vi","vi2en","def"]; if(v.p) types.push("where");
  let cand=types.filter(x=>x!==lastType), type=pick(cand); lastType=type;
  // đáp án nhiễu lấy cùng nhóm (nghề / nơi / từ khác) cho hợp lý
  const same=VOCAB.filter((o,j)=>j!==entry.i&&o.g===v.g);
  let pool=shuffle(same.slice());
  if(type==="def"&&level==="gioi") pool.sort((a,b)=>sim(b.w,v.w)-sim(a.w,v.w));
  const wrong=pool.slice(0,L.nOpt-1);
  const art=w=>(/^[aeiou]/i.test(w)?"an ":"a ")+w;
  if(type==="def"){
    return {entry,type,label:v.g==="j"?"Ai là người này?  “A … is someone who…”":"Từ nào có nghĩa này?",text:v.d,hint:L.hint?"💡 Bắt đầu bằng chữ “"+v.w[0]+"”":"",
      opts:shuffle([{t:v.w,ok:true},...wrong.map(o=>({t:o.w,ok:false}))]),
      full:v.w+" — "+v.vi, speak:v.w, key:v.w, keyVi:v.vi, canSpeak:false};
  }
  if(type==="where"){
    const places=VOCAB.filter(o=>o.g==="p"), pl=places.find(o=>o.w===v.p);
    const wp=shuffle(places.filter(o=>o.w!==v.p)).slice(0,L.nOpt-1);
    return {entry,type,label:"Chọn nơi làm việc đúng",text:"Where does "+art(v.w)+" work?",hint:L.hint?"💡 Nơi làm việc bắt đầu bằng chữ “"+v.p[0]+"”":"",
      opts:shuffle([{t:"In "+art(v.p),ok:true},...wp.map(o=>({t:"In "+art(o.w),ok:false}))]),
      full:cap1(v.w)+" works in "+art(v.p)+" — "+v.vi+" làm việc ở "+pl.vi, speak:"Where does "+art(v.w)+" work? In "+art(v.p)+".", key:v.w+" → "+v.p, keyVi:v.vi+" · "+pl.vi, canSpeak:true};
  }
  if(type==="vi2en"){
    return {entry,type,label:"Tiếng Anh là gì?",text:v.vi,hint:L.hint?"💡 Bắt đầu bằng chữ “"+v.w[0]+"”":"",
      opts:shuffle([{t:v.w,ok:true},...wrong.map(o=>({t:o.w,ok:false}))]),
      full:v.vi+" — "+v.w, speak:v.w, key:v.w, keyVi:v.vi, canSpeak:false};
  }
  return {entry,type,label:"Nghĩa tiếng Việt là gì?",text:v.w,hint:"",
    opts:shuffle([{t:v.vi,ok:true},...wrong.map(o=>({t:o.vi,ok:false}))]),
    full:v.w+" — "+v.vi, speak:v.w, key:v.w, keyVi:v.vi, canSpeak:true};
}
const cap1=t=>t.charAt(0).toUpperCase()+t.slice(1);

function showCard(which){
  $("qCard").classList.toggle("hidden",which!=="q");
  $("pullCard").classList.toggle("hidden",which!=="pull");
}
function setTurn(side){
  const isBot=!two&&side===1;
  $("turnBox").classList.toggle("bot",side===1);
  $("turnAv").textContent=isBot?"🤖":(side===0?"🧒":"🧑");
  $("turnWho").textContent=isBot?"Lượt của Bot":"Lượt của "+sides[side].name;
  $("turnSay").textContent=isBot?"Bot cũng phải trả lời và rút gỗ":"Trả lời đúng → nhiều thời gian rút gỗ hơn";
}
function renderQ(q,interactive){
  const prefix=interactive?(two?sides[turnSide].name+" · ":"")+"Câu "+turnsDone+"/"+MAX_TURNS:"Câu của Bot";
  $("qLabel").textContent=prefix+" · "+q.label;

  $("skipBtn").classList.add("hidden");
  const box=$("opts"); box.innerHTML=""; box.className="opts"+(q.opts.length===3?" n3":"")+(interactive?"":" locked");
  q.opts.forEach((o,i)=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
    if(interactive) b.addEventListener("click",()=>onAnswer(i));
    box.appendChild(b);
  });
}
function markOpts(q,pickIdx,isBot){
  [...$("opts").children].forEach((b,i)=>{
    if(q.opts[i].ok) b.classList.add("ok"); else if(i===pickIdx) b.classList.add("no"); else b.classList.add("dim");
    if(isBot&&i===pickIdx) b.classList.add("botpick");
  });
  $("opts").classList.add("locked");
}
function showFb(html,cls){ const fb=$("fb"); fb.className="fb "+(cls||""); fb.textContent=html; }
function schedulePull(actor,sec,ms,skippable){
  const ep=epoch; pend={actor,sec}; clearTimeout(pendT);
  const go=()=>{ if(ep!==epoch||!running||!pend) return; const p=pend; pend=null; clearTimeout(pendT); startPull(p.actor,p.sec); };
  pendT=defer(go,ms);
  const sk=$("skipBtn"); sk.classList.toggle("hidden",!skippable); sk.onclick=go;
}

/* ----- lượt của người chơi (side 0 hoặc 1) ----- */
function playerTurn(){ humanTurn(0); }
function humanTurn(side){
  if(!running) return;
  if(side===0){
    if(turnsDone>=MAX_TURNS){ if(!two) score+=20; endGame("none"); return; }
    turnsDone++;
  }
  turnSide=side; if(two) switchStats(side);
  phase="question"; curActor="player"; probeMode=false;
  setTurn(side); showCard("q"); field.classList.remove("pulling");
  const q=makeQ(nextEntry()); curQ=q; renderQ(q,true); updateHUD();
  $("timeV").textContent="–"; $("timerPill").classList.remove("urgent");
  if(two) showToast("Đến lượt "+sides[side].name+"!","combo");
}
// sau mỗi lượt rút: đổi người (hoặc đến lượt Bot)
function nextTurn(){
  if(two) humanTurn(1-turnSide);
  else if(turnSide===0){ turnSide=1; botTurn(); }
  else humanTurn(0);
}
function onAnswer(i){
  if(phase!=="question") return; phase="feedback";
  const q=curQ, o=q.opts[i], L=LEVELS[level], btn=$("opts").children[i];
  markOpts(q,i,false);
  if(o.ok){
    score+=10; streak++; correctN++; reviewed.set(q.key,q.keyVi); playCorrect(); burstEl(btn,["⭐","✨"],10);
    showFb("✅ Đúng rồi! Bạn có "+L.tRight+" giây rút gỗ.","good");
    if(streak%3===0){ score+=5; tokens++; showToast("Combo x"+streak+"! +1 🔍 Dò","combo"); }
  }else{
    streak=0; missed.set(q.key,q.keyVi); requeue(q.entry); playWrong();
    showFb("❌ Đáp án: "+q.full+" · Chỉ còn "+L.tWrong+" giây rút gỗ!","bad");
  }
  updateHUD(); setTimeout(()=>speak(q.speak),250);
  schedulePull("player",o.ok?L.tRight:L.tWrong,o.ok?1200:2900,true);
}

/* ----- lượt của Bot ----- */
function botTurn(){
  if(!running) return;
  phase="botq"; curActor="bot"; setTurn(1); showCard("q"); field.classList.remove("pulling"); updateHUD();
  $("timeV").textContent="–"; $("timerPill").classList.remove("urgent");
  say(pick(BANT.botStart));
  const q=makeQ(nextEntry()); curQ=q; renderQ(q,false);
  const L=LEVELS[level];
  later(()=>{
    const ok=Math.random()<L.botAcc;
    const correctIdx=q.opts.findIndex(o=>o.ok);
    const wrongIdx=q.opts.map((o,i)=>i).filter(i=>i!==correctIdx);
    const idx=ok?correctIdx:pick(wrongIdx);
    markOpts(q,idx,true);
    if(ok){ showFb("🤖 Bot trả lời đúng → "+L.tRight+" giây rút gỗ.","good"); say(pick(BANT.botRight)); }
    else { showFb("🤖 Bot sai! Đáp án đúng: "+q.full,"bad"); say(pick(BANT.botWrong)); requeue(q.entry); setTimeout(()=>speak(q.speak),250); }
    schedulePull("bot",ok?L.tRight:L.tWrong,ok?1300:2600,false);
  },1500+Math.random()*600);
}
function botLoop(tok){
  if(tok!==botTok||phase!=="botpull"||!running) return;
  const L=LEVELS[level];
  let b=botNext; botNext=null;
  if(!b&&lastTouched&&!lastTouched.out&&lastTouched.mark!=="warn"&&Math.random()<.85) b=lastTouched;
  if(!b){ const c=pullable().filter(x=>x.mark!=="warn"); b=c.length?pick(c):pick(pullable()); }
  if(!b){ collapse("bot"); return; }
  const res=doTap(b,"bot");
  if(res==="warn"&&Math.random()>L.botCareful) botNext=b;      // bot liều tay: rút tiếp thanh nguy hiểm
  if(res==="warn") say("Rắc rắc…");
  if(res==="warn"||res==="stuck") defer(()=>botLoop(tok),700+Math.random()*500);
}

/* =====================================================================
   BỘ ĐẾM GIỜ RÚT GỖ
   ===================================================================== */
function stopTick(){ clearInterval(tickId); tickId=null; }
function startPull(actor,sec){
  phase=actor==="player"?"pull":"botpull"; curActor=actor; lastTouched=null; probeMode=false; botNext=null;
  if(!pullable().length){ collapse(actor); return; }
  showCard("pull"); field.classList.toggle("pulling",actor==="player");
  $("pullBig").textContent=actor==="player"?(two?sides[turnSide].name+": rút gỗ đi! 🪵":"Rút gỗ đi! 🪵"):"Bot đang rút gỗ… 🤖";
  $("pullDesc").textContent=actor==="player"?"Chạm vào một thanh gỗ để kéo. Hết giờ là bị ép rút!":"Hồi hộp chưa? Xem Bot có làm sập tháp không!";
  $("probeBtn").classList.remove("on");
  pullTotal=sec; pullEnd=performance.now()+sec*1000; lastTickKey=-1; stopTick();
  tickId=setInterval(tick,100); tick(); updateHUD();
  if(actor==="bot"){ const tok=++botTok; defer(()=>botLoop(tok),600+Math.random()*400); }
}
function tick(){
  if(paused) return;
  const left=Math.max(0,(pullEnd-performance.now())/1000);
  $("tbarI").style.width=(left/pullTotal*100)+"%";
  $("tbar").classList.toggle("low",left<=3);
  $("timeV").textContent=Math.ceil(left); $("timerPill").classList.toggle("urgent",left<=3&&left>0);
  if(left<=4){ const key=left<=2?Math.ceil(left*3):Math.ceil(left); if(key!==lastTickKey){ lastTickKey=key; playTick(); } }
  if(left<=0){ stopTick(); $("timerPill").classList.remove("urgent"); forcePull(curActor); }
}

/* ----- chạm thanh gỗ (học sinh) ----- */
sway.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".blk"); if(!el) return;
  const b=el._b;
  if(phase!=="pull"||busy||!running||paused) return;
  if(!pullable().includes(b)){ showToast(b.fix?"Phần trang trí, không rút được":"Thanh này chưa rút được","bad"); return; }
  if(probeMode){
    if(tokens<=0) return;
    b.mark=b.st==="crit"?"warn":(b.st==="tight"?"tight":"ok"); renderMark(b);
    tokens--; probeMode=false; $("probeBtn").classList.remove("on"); playPop(); updateHUD(); return;
  }
  doTap(b,"player");
});
$("probeBtn").addEventListener("click",()=>{
  if(phase!=="pull"||tokens<=0) return;
  probeMode=!probeMode; $("probeBtn").classList.toggle("on",probeMode);
  if(probeMode) showToast("Chạm 1 thanh để dò","combo");
});

/* =====================================================================
   HUD, BẮT ĐẦU, KẾT THÚC
   ===================================================================== */
function updateHUD(){
  showScores(); $("tokV").textContent=tokens; $("woodV").textContent=woodN; $("probeN").textContent=tokens;
  $("probeBtn").classList.toggle("hidden",!(phase==="pull"&&tokens>0&&!busy));
}
function startGame(){
  epoch++; unlockAudio(); clearTimeout(pendT); stopTick(); pend=null; botTok++;
  paused=false; waiting=[]; document.body.classList.remove("paused"); $("pauseOverlay").classList.add("hidden");
  score=0; tokens=0; streak=0; correctN=0; turnsDone=0; pulls=0; woodN=0; lastType="";
  reviewed=new Map(); missed=new Map(); refill();
  two=(mode==="two"); statSide=0; turnSide=0;
  const nm=(id,d)=>{ const v=($(id).value||"").trim(); return v||d; };
  sides=[mkSide(two?nm("name1","Bạn 1"):"bạn"),mkSide(two?nm("name2","Bạn 2"):"Bot")];
  if(two){ try{ localStorage.setItem("rutgo6_n1",$("name1").value); localStorage.setItem("rutgo6_n2",$("name2").value); }catch(e){} }
  field.classList.toggle("two",two);
  buildTower(THEMES[themePick==="random"?pick(Object.keys(THEMES)):themePick]);
  running=true; busy=false; phase="idle";
  $("startOverlay").classList.add("hidden"); $("endOverlay").classList.add("hidden");
  updateHUD(); humanTurn(0);
}
function endGame(loser){
  running=false; phase="over"; stopTick();
  const body=$("eBody"); body.innerHTML="";
  const mkEl=(t,c,x)=>{ const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; };
  const addSec=(parent,label,map,cls)=>{
    if(!map.size) return;
    parent.appendChild(mkEl("div","esec",label+" ("+map.size+")"));
    const box=mkEl("div","elist"); map.forEach((vi,k)=>box.appendChild(mkEl("span","tag "+cls,k+" · "+vi))); parent.appendChild(box);
  };
  const starsOf=sc=>sc>=150?3:sc>=90?2:sc>=40?1:0;
  const starTxt=n=>"⭐".repeat(n)+"☆".repeat(3-n);
  if(two){
    const o=sides[statSide]; o.score=score; o.tokens=tokens; o.streak=streak; o.reviewed=reviewed; o.missed=missed;
    let win=-1, title;
    if(loser==="none"){
      if(sides[0].score!==sides[1].score) win=sides[0].score>sides[1].score?0:1;
      title=win<0?"🏗️ Tháp vẫn đứng! Hai bạn hoà nhau":"🏗️ Tháp vẫn đứng! "+sides[win].name+" thắng nhờ điểm";
    }else{
      const lose=turnSide; win=1-lose; sides[win].score+=30;
      title="💥 "+sides[lose].name+" làm sập tháp! "+sides[win].name+" thắng";
    }
    playWin();
    $("eTitle").textContent=title; $("eScoreBox").classList.add("hidden"); $("eStars").classList.add("hidden");
    const grid=mkEl("div","pgrid");
    [0,1].forEach(i=>{
      const p=sides[i], card=mkEl("div","pcard"+(win===i?" win":""));
      card.appendChild(mkEl("div","pname",(win===i?"👑 ":"")+p.name));
      card.appendChild(mkEl("div","pscore","⭐ "+p.score));
      card.appendChild(mkEl("div","pstars",starTxt(starsOf(p.score))));
      addSec(card,"✅ Đã luyện đúng",p.reviewed,""); addSec(card,"📌 Cần ôn lại",p.missed,"miss");
      grid.appendChild(card);
    });
    body.appendChild(grid);
  }else{
    let title;
    if(loser==="bot"){ score+=30; title="🎉 Bot làm sập tháp! Bạn thắng!"; playWin(); }
    else if(loser==="player"){ title="💥 Tháp sập rồi! Bot thắng"; playWrong(); }
    else { title="🏗️ Tháp vẫn đứng vững! +20 điểm"; playWin(); }
    $("eScoreBox").classList.remove("hidden"); $("eStars").classList.remove("hidden");
    $("eTitle").textContent=title; $("finalScore").textContent=score; $("eStars").textContent=starTxt(starsOf(score));
    addSec(body,"✅ Đã luyện đúng",reviewed,""); addSec(body,"📌 Cần ôn lại",missed,"miss");
  }
  $("endOverlay").classList.remove("hidden");
}

/* ===== tạm dừng / về màn hình chính ===== */
function openPause(mode){
  if(!running||paused||phase==="over") return;
  paused=true; pauseAt=performance.now();
  try{ speechSynthesis.cancel(); }catch(e){}
  document.body.classList.add("paused");
  const home=mode==="home";
  $("pauseTitle").textContent=home?"Về màn hình chính?":"Tạm dừng";
  $("pauseSub").textContent=home?"Ván này sẽ không được lưu.":"Tháp vẫn đứng đó, nghỉ chút nhé!";
  $("resumeBtn").textContent=home?"Ở lại chơi":"▶ Tiếp tục";
  $("restartBtn").classList.toggle("hidden",home);
  $("menuBtn").textContent=home?"Về màn hình chính":"🏠 Màn hình chính";
  $("pauseOverlay").classList.remove("hidden");
}
function resumeGame(){
  if(!paused) return;
  paused=false; pullEnd+=performance.now()-pauseAt;   // giữ nguyên thời gian còn lại
  document.body.classList.remove("paused"); $("pauseOverlay").classList.add("hidden");
  const w=waiting; waiting=[]; w.forEach(f=>f());
}
function goHome(){
  epoch++; running=false; paused=false; waiting=[]; busy=false; phase="idle";
  stopTick(); botTok++; clearTimeout(pendT); pend=null; probeMode=false;
  document.body.classList.remove("paused"); sway.classList.remove("wob"); field.classList.remove("quake","pulling","two"); two=false;
  $("pauseOverlay").classList.add("hidden"); $("endOverlay").classList.add("hidden");
  toastEl.classList.remove("show"); $("bubble").classList.remove("show");
  try{ speechSynthesis.cancel(); }catch(e){}
  score=0; tokens=0; woodN=0; $("timeV").textContent="–"; $("timerPill").classList.remove("urgent");
  buildTower(THEMES[themePick==="random"?"house":themePick]); updateHUD();
  showCard("q"); setTurn(0); $("qLabel").textContent=""; $("qText").textContent=""; $("qHint").textContent=""; $("opts").innerHTML=""; $("fb").className="fb hidden";
  $("startOverlay").classList.remove("hidden");
}
$("pauseBtn").addEventListener("click",()=>openPause("pause"));
$("homeBtn").addEventListener("click",()=>openPause("home"));
$("resumeBtn").addEventListener("click",resumeGame);
$("restartBtn").addEventListener("click",startGame);
$("menuBtn").addEventListener("click",goHome);

/* ===== sự kiện nút ===== */
$("muteBtn").addEventListener("click",()=>{
  muted=!muted; $("muteBtn").textContent=muted?"🔇":"🔊"; if(muted){ try{ speechSynthesis.cancel(); }catch(e){} }
});
$("spkBtn").addEventListener("click",()=>{ if(curQ) speak(curQ.speak); });
$("startBtn").addEventListener("click",startGame);
$("againBtn").addEventListener("click",startGame);
document.querySelectorAll("#levelChips .chip").forEach(c=>c.addEventListener("click",()=>{
  level=c.dataset.level; try{ localStorage.setItem("rutgo6_level",level); }catch(e){}
  document.querySelectorAll("#levelChips .chip").forEach(x=>x.classList.toggle("on",x===c));
}));
try{ const s=localStorage.getItem("rutgo6_level"); if(LEVELS[s]){ level=s; document.querySelectorAll("#levelChips .chip").forEach(x=>x.classList.toggle("on",x.dataset.level===s)); } }catch(e){}
try{ const t=localStorage.getItem("rutgo6_theme"); if(t==="random"||THEMES[t]) themePick=t; }catch(e){}
function buildThemeChips(){
  const box=$("themeChips"); box.innerHTML="";
  const mk=(key,icon,label)=>{
    const b=document.createElement("button"); b.className="tchip"+(themePick===key?" on":""); b.dataset.theme=key;
    b.innerHTML="<span>"+icon+"</span><small>"+label+"</small>";
    b.addEventListener("click",()=>{
      themePick=key; try{ localStorage.setItem("rutgo6_theme",key); }catch(e){}
      box.querySelectorAll(".tchip").forEach(x=>x.classList.toggle("on",x===b));
      if(THEMES[key]&&!running) buildTower(THEMES[key]);
    });
    box.appendChild(b);
  };
  mk("random","🎲","Ngẫu nhiên"); Object.keys(THEMES).forEach(k=>mk(k,THEMES[k].icon,THEMES[k].name));
}
buildThemeChips();
function applyMode(m){
  mode=m; document.querySelectorAll("#modeChips .chip").forEach(x=>x.classList.toggle("on",x.dataset.mode===m));
  $("nameBox").classList.toggle("hidden",m!=="two");
}
document.querySelectorAll("#modeChips .chip").forEach(c=>c.addEventListener("click",()=>{
  applyMode(c.dataset.mode); try{ localStorage.setItem("rutgo6_mode",mode); }catch(e){}
}));
try{
  const m=localStorage.getItem("rutgo6_mode"); if(m==="bot"||m==="two") applyMode(m);
  $("name1").value=localStorage.getItem("rutgo6_n1")||""; $("name2").value=localStorage.getItem("rutgo6_n2")||"";
}catch(e){}
window.addEventListener("resize",fitTower);
window.addEventListener("orientationchange",()=>setTimeout(fitTower,250));

/* ===== khởi tạo: dựng tháp làm nền phía sau màn bắt đầu ===== */
refill(); buildTower(THEMES[themePick]||THEMES.house); updateHUD();
requestAnimationFrame(fitTower);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitTower);
</script>
