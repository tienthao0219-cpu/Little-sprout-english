<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Vòng chạy vượt chướng ngại vật</title>
<script src="../../js/gameset.js"></script>
<script src="../../js/audiounlock.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#3a3466;--pri:#7c6cf0;--pri-d:#5b4bd1;--mint:#4fd1a8;--mint-d:#2fae85;--coral:#ff8b7a;--coral-d:#e8624f;--sun:#ffd166;--sun-d:#e0a62b;--sky:#6ec6ff;--line:#e4dcf7;--vh:1vh}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(160deg,#d9f1ff 0%,#efe3ff 55%,#ffe7f1 100%);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
#app{position:fixed;left:0;top:0;right:0;bottom:0;height:calc(var(--vh) * 100)}
button{font-family:inherit;color:inherit}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
.hidden{display:none !important}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 28px}
.wrap{max-width:880px;margin:0 auto;width:100%}
.card{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 6px 18px rgba(90,70,160,.12);margin-bottom:12px}
h1,h2,h3{margin:0}
h2{font-size:clamp(20px,3.6vh,30px)}
.btn{font-weight:800;border:0;border-radius:16px;padding:12px 18px;color:#fff;background:var(--pri);box-shadow:0 5px 0 var(--pri-d);cursor:pointer;font-size:clamp(15px,2.6vh,21px);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri-d)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.mint:active{box-shadow:0 1px 0 var(--mint-d)}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-d)}
.btn.coral:active{box-shadow:0 1px 0 var(--coral-d)}
.btn.sun{background:var(--sun);color:#6a4a00;box-shadow:0 5px 0 var(--sun-d)}
.btn.sun:active{box-shadow:0 1px 0 var(--sun-d)}
.btn.ghost{background:#fff;color:var(--pri-d);box-shadow:0 5px 0 #d9cff5}
.btn.ghost:active{box-shadow:0 1px 0 #d9cff5}
.btn.big{width:100%;max-width:420px;padding:16px 20px;font-size:clamp(17px,3vh,24px)}
.btn.sm{padding:8px 14px;font-size:clamp(13px,2.2vh,17px);border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.round{width:44px;height:44px;border-radius:50%;border:0;font-size:21px;background:#fff;box-shadow:0 3px 0 #d9cff5;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 #d9cff5}

/* MENU */
.logo{text-align:center;margin:8px 0 6px}
.logo .sub{display:inline-block;background:#fff;border-radius:14px;padding:4px 12px;font-size:13px;font-weight:800;color:var(--coral-d);margin-bottom:8px;max-width:100%}
.logo h1{font-size:clamp(28px,6.2vh,54px);line-height:1.05;color:var(--pri-d);text-shadow:0 3px 0 #fff,0 6px 12px rgba(124,108,240,.25)}
#parade{display:block;width:100%;max-width:720px;margin:0 auto;height:auto}
.menubtns{display:flex;flex-direction:column;align-items:center;gap:14px;margin:6px 0 18px}

/* SETUP / LOBBY / SETTINGS */
.topline{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topline h2{flex:1}
.pcard h3{font-size:18px;margin-bottom:8px}
.nameinp{width:100%;font-size:20px;font-weight:800;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#faf7ff;color:var(--ink);outline:none;margin-bottom:10px}
.nameinp:focus{border-color:var(--pri)}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{border:3px solid var(--line);background:#fff;border-radius:16px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:13px}
.pick canvas{width:64px;height:64px}
.pick.sel{border-color:var(--pri);background:#efeaff;box-shadow:0 0 0 3px rgba(124,108,240,.2)}
.pick.dis{opacity:.35;pointer-events:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:10px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:16px;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri-d)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:700}
.trow:last-child{border-bottom:0}
.sw{width:54px;height:30px;border-radius:16px;background:#d8d2ea;position:relative;border:0;cursor:pointer;flex:0 0 auto}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--mint)}
.sw.on::after{left:27px}
.warn{background:#fff3cd;border:2px solid #ffd166;color:#6a4a00;border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.howto li{margin-bottom:8px;line-height:1.45}
.bigcode{font-size:clamp(44px,12vh,84px);font-weight:900;letter-spacing:10px;color:var(--pri-d);text-align:center;margin:8px 0}
.codeinp{width:100%;text-align:center;font-size:32px;font-weight:900;letter-spacing:8px;padding:10px;border-radius:14px;border:2px solid var(--line);outline:none;color:var(--ink)}
.msg{text-align:center;font-weight:700;margin:8px 0;min-height:24px}
.msg.err{color:var(--coral-d)}

/* GAME */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px}
#topbar .ttl{flex:1;text-align:center;font-weight:900;font-size:clamp(13px,2.2vh,19px);color:var(--pri-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panels{flex:1;min-height:0;display:flex;gap:8px;padding:0 8px 8px}
#panels.dual{flex-direction:row}
@media (orientation:portrait){#panels.dual{flex-direction:column}}
.panel{position:relative;flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;background:rgba(255,255,255,.7);border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(90,70,160,.15)}
.panel.p2{background:rgba(255,246,236,.78)}
.hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px}
.hud .who{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36%;font-size:clamp(13px,2.2vh,18px)}
.hud .stp{font-weight:800;font-size:13px;opacity:.85;white-space:nowrap}
.tmr{flex:1;position:relative;height:22px;background:#ece6fb;border-radius:12px;overflow:hidden;min-width:60px}
.tmr i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#4fd1a8,#ffd166);border-radius:12px}
.tmr.low i{background:linear-gradient(90deg,#ff8b7a,#ff5e5e)}
.tmr b{position:absolute;left:0;right:0;top:0;text-align:center;font-size:14px;line-height:22px;color:#3a3466}
.mini{flex:0 0 auto;position:relative;height:26px;margin:0 22px 2px}
.mini .rail{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:4px;background:#e2daf7}
.mini .mk{position:absolute;top:-4px;font-size:19px;line-height:1;transform:translateX(-50%);transition:left .5s}
.mini .mk.o{opacity:.9;top:8px;font-size:15px}
.mini .fl{position:absolute;right:-16px;top:0;font-size:18px}
.trackwrap{position:relative;flex:1 1 40%;min-height:80px;margin:0 6px;border-radius:14px;overflow:hidden;background:#cdeaff}
.trackwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.pop{position:absolute;left:0;right:0;top:10%;text-align:center;font-weight:900;font-size:clamp(20px,5vh,40px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.22);pointer-events:none;opacity:0}
.pop.bad{color:#ffe1dc}
.pop.show{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.qarea{flex:1 1 60%;min-height:0;position:relative;display:flex;flex-direction:column}
.qwrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px;position:relative}
.qwrap.locked .opts,.qwrap.locked .kb,.qwrap.locked .tiles{pointer-events:none}
.qsub{text-align:center;font-weight:700;opacity:.8;font-size:clamp(13px,2.3vh,18px)}
.qask{text-align:center;font-weight:800;font-size:clamp(12px,2vh,16px);color:var(--pri-d);background:#efeaff;border-radius:12px;padding:3px 10px;align-self:center}
.qrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.qprompt{font-weight:900;font-size:clamp(20px,4.2vh,40px);text-align:center;line-height:1.2;word-break:break-word}
.qprompt.lg{font-size:clamp(16px,3vh,28px)}
.picbox{position:relative;width:100%}
.picsq{position:relative;width:100%;padding-top:100%}
.picin{position:absolute;left:0;top:0;right:0;bottom:0}
.picin svg{width:100%;height:100%;display:block}
.qpic{width:clamp(64px,15vh,140px);flex:0 0 auto}
.spk{width:clamp(48px,8vh,64px);height:clamp(48px,8vh,64px);border-radius:50%;border:0;background:var(--sky);color:#fff;font-size:clamp(22px,4vh,32px);box-shadow:0 4px 0 #3d9fd9;cursor:pointer;flex:0 0 auto}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #3d9fd9}
.hintbox{min-height:clamp(24px,4vh,34px);text-align:center;font-weight:900;font-size:clamp(16px,3vh,26px);letter-spacing:2px;color:var(--pri-d);word-break:break-word}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:clamp(46px,9vh,84px);border-radius:16px;border:3px solid var(--line);background:#fff;box-shadow:0 4px 0 #d9cff5;font-weight:800;font-size:clamp(15px,2.8vh,26px);cursor:pointer;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.15;word-break:break-word}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #d9cff5}
.opt.long{font-size:clamp(13px,2.2vh,20px)}
.opt .kk{font-size:12px;opacity:.5;font-weight:900}
.opt.ok{background:#c9f5e1;border-color:var(--mint)}
.opt.no{background:#ffd9d4;border-color:var(--coral)}
.opts.pics .opt{padding:4px;min-height:0}
.opts.pics .picbox{width:min(100%,clamp(70px,17vh,150px));margin:0 auto}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:clamp(46px,8vh,60px);align-items:center}
.slot{min-width:clamp(30px,5.4vh,42px);height:clamp(40px,7vh,54px);padding:0 4px;border-radius:10px;border:2px dashed #bcaef5;background:#f4efff;font-weight:900;font-size:clamp(20px,3.8vh,30px);display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot.fixed{border-color:transparent;background:transparent;cursor:default}
.slot.fill{border:2px solid var(--pri);background:#fff}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:clamp(40px,7vh,54px);height:clamp(44px,7.6vh,58px);padding:0 8px;border-radius:12px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 #d9cff5;font-weight:900;font-size:clamp(18px,3.4vh,28px);cursor:pointer}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #d9cff5}
.tile.used{visibility:hidden}
.tile.w{font-size:clamp(14px,2.6vh,22px)}
.typed{min-height:clamp(44px,7vh,58px);border-radius:14px;border:3px solid var(--pri);background:#fff;font-weight:900;font-size:clamp(20px,3.8vh,32px);display:flex;align-items:center;justify-content:center;padding:0 10px;letter-spacing:2px;word-break:break-all}
.typed::after{content:"";width:2px;height:1.1em;background:var(--pri);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{display:flex;flex-direction:column;gap:5px}
.kbrow{display:flex;gap:5px;justify-content:center}
.key{flex:1 1 0;max-width:60px;min-height:clamp(34px,6vh,50px);border-radius:10px;border:0;background:#fff;box-shadow:0 3px 0 #d9cff5;font-weight:800;font-size:clamp(15px,2.6vh,22px);cursor:pointer;padding:0}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #d9cff5}
.key.wide{flex:2 1 0;max-width:120px;background:#efeaff}
.key.space{flex:5 1 0;max-width:260px}
.qfoot{display:flex;gap:10px;justify-content:center;margin-top:2px}
.fb{display:flex;flex-direction:column;gap:8px;align-items:stretch;background:#fff4f2;border:3px solid var(--coral);border-radius:18px;padding:10px 12px;margin-top:2px}
.fb .fbh{font-weight:900;font-size:clamp(17px,3.2vh,26px);color:var(--coral-d);text-align:center}
.fb .fbans{font-weight:800;font-size:clamp(15px,2.6vh,22px);text-align:center}
.fb .fbans b{color:var(--mint-d)}
.fb .fbexp{font-weight:600;font-size:clamp(13px,2.3vh,19px);line-height:1.5;background:#fff;border-radius:12px;padding:8px 10px}
.fb .btn{align-self:center}
#overlay{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(58,52,102,.55);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:20;text-align:center;color:#fff}
#overlay.on{display:flex}
#overlay .big{font-size:clamp(60px,18vh,150px);font-weight:900;text-shadow:0 6px 0 rgba(0,0,0,.2);animation:beat .8s ease-out}
@keyframes beat{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
#overlay h2{font-size:clamp(26px,6vh,44px);text-shadow:0 3px 0 rgba(0,0,0,.2)}
#overlay .sm{font-weight:700;font-size:16px;max-width:360px}
#panels.single .trackwrap{flex:0 0 35%}
#panels.single .qwrap{align-items:center}
#panels.single .qwrap>.opts,#panels.single .qwrap>.kb,#panels.single .qwrap>.slots,#panels.single .qwrap>.tiles,#panels.single .qwrap>.typed,#panels.single .qwrap>.fb{width:100%;max-width:880px}
@media (orientation:portrait){#panels.single .trackwrap{flex:0 0 28%}}



/* compact tuning */
@media (orientation:portrait){
  #panels.single .trackwrap{flex:0 0 27%}
  #panels.single .qpic{width:clamp(56px,11vh,110px)}
  #panels.single .key{min-height:clamp(32px,5.2vh,46px)}
  #panels.single .qprompt{font-size:clamp(20px,3.6vh,34px)}
}
#panels.dual .trackwrap{flex:1 1 24%;min-height:70px}
#panels.dual .qwrap{gap:4px;padding:4px 8px 6px}
#panels.dual .qpic{width:clamp(44px,9vh,84px)}
#panels.dual .qprompt{font-size:clamp(16px,3vh,28px)}
#panels.dual .qask{font-size:12px;padding:2px 8px}
#panels.dual .key{min-height:clamp(28px,4.6vh,40px);font-size:clamp(14px,2.2vh,19px)}
#panels.dual .kb{gap:4px}
#panels.dual .kbrow{gap:4px}
#panels.dual .typed{min-height:clamp(36px,5.5vh,46px)}
#panels.dual .hintbox{min-height:20px;font-size:clamp(14px,2.4vh,20px)}
#panels.dual .opt{min-height:clamp(40px,7vh,64px)}
#panels.dual .btn.sm{padding:6px 12px}
#panels.dual .spk{width:44px;height:44px;font-size:20px}

/* TRACK / BOT PICK / DANGER */
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tk{border:3px solid var(--line);background:#fff;border-radius:16px;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tk.sel{border-color:var(--pri);background:#efeaff;box-shadow:0 0 0 3px rgba(124,108,240,.2)}
.tk .te{font-size:30px;line-height:1}.tk .tn{font-weight:900;font-size:17px}.tk .tl{font-weight:800;font-size:13px;color:var(--coral-d)}.tk .td{font-size:12.5px;font-weight:600;opacity:.85;line-height:1.35}
.botpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:10px}
.bk{border:3px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.35}
.bk.sel{border-color:var(--pri);background:#efeaff}
.bk .be{font-size:28px}
.qwarn{align-self:center;background:#ff5e5e;color:#fff;font-weight:900;border-radius:12px;padding:4px 12px;font-size:clamp(12px,2.1vh,17px);animation:blink2 1s infinite}
@keyframes blink2{50%{opacity:.7}}
.mini .dg{position:absolute;top:10px;font-size:11px;transform:translateX(-50%)}
/* COMBO / ITEMS / RUSH / FREEZE */
.hud2{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 12px 3px;font-weight:800;font-size:14px;min-height:26px}
.cmb i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#e2daf7;margin-right:3px;transition:background .2s}
.cmb i.on{background:#ff8a3d;box-shadow:0 0 7px #ff8a3d}
.cmbt{font-size:12px;color:var(--coral-d);font-weight:900}
.cn{background:#fff3cf;border-radius:10px;padding:1px 8px}
.itm{margin-left:auto;border:0;border-radius:12px;padding:3px 10px;font-weight:900;background:#fff;box-shadow:0 2px 0 #d9cff5;font-size:14px;cursor:pointer}
.itm.passive{opacity:.9;cursor:default}
.itm.pulse{background:#ffe9a8;animation:blink2 .8s infinite}
.panel.rush{box-shadow:0 0 0 3px #ff5e5e,0 0 18px rgba(255,80,80,.6);animation:rushp .7s infinite alternate}
@keyframes rushp{to{box-shadow:0 0 0 3px #ff9a5e,0 0 28px rgba(255,120,60,.85)}}
.qwarn.rushw{background:#ff8a3d}
.freeze{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(150,220,255,.88);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;color:#1d5a8a;z-index:5}
.fbbar{height:8px;border-radius:6px;background:#f3dcd8;overflow:hidden}
.fbbar i{display:block;height:100%;width:100%;background:var(--coral)}
.fbbtns{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.fb.ok{background:#eefaf5;border-color:var(--mint)}
.fb.ok .fbh{color:var(--mint-d)}
.mini .bg{position:absolute;top:9px;font-size:11px;transform:translateX(-50%)}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ptop h3{margin:0}
.pcoin{background:#fff3cf;border-radius:12px;padding:2px 10px;font-weight:900}
.pick.lk canvas{filter:grayscale(1) brightness(.85);opacity:.7}
.pick.lk{background:#f4f1fb}
/* RESULT */
.rtitle{text-align:center;font-size:clamp(26px,5.6vh,44px);font-weight:900;color:var(--pri-d);margin:6px 0}
.rsub{text-align:center;font-weight:700;margin-bottom:12px}
.rtab{width:100%;border-collapse:collapse;font-weight:700}
.rtab th,.rtab td{padding:7px 6px;text-align:center;border-bottom:1px dashed var(--line)}
.rtab th:first-child,.rtab td:first-child{text-align:left}
.wl{border-left:5px solid var(--coral);background:#fff7f5;border-radius:12px;padding:8px 12px;margin-bottom:8px;font-weight:600;font-size:15px;line-height:1.45}
.wl .q{font-weight:900}
.wl b{color:var(--mint-d)}

/* ===== Đáp án A B C D nhiều màu, nổi khối 3D ===== */
.opts .opt{--c1:#ff8a98;--c2:#ff4d6a;--cd:#b8263f;position:relative;color:#fff;border:0;justify-content:flex-start;gap:12px;padding:8px 14px 8px 10px;
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 100%);text-shadow:0 2px 0 rgba(0,0,0,.28);

<script type="text/plain" id="gsCode">
/**
 * PHÒNG CHƠI ONLINE cho game "Vòng chạy vượt chướng ngại vật"
 * ------------------------------------------------------------------
 * CÁCH CÀI (làm một lần, khoảng 3 phút):
 *  1. Vào https://script.google.com → "Dự án mới" (New project).
 *  2. Xoá hết code mẫu, dán toàn bộ file này vào, bấm Lưu.
 *  3. Bấm "Triển khai" (Deploy) → "Triển khai mới" (New deployment)
 *       - Loại: Ứng dụng web (Web app)
 *       - Thực thi với tư cách (Execute as): Tôi (Me)
 *       - Ai có quyền truy cập (Who has access): Bất kỳ ai (Anyone)
 *     Bấm Triển khai, cấp quyền khi Google hỏi.
 *  4. Copy "URL ứng dụng web" (kết thúc bằng /exec).
 *  5. Mở file game HTML, dán URL đó vào  onlineUrl: '...'  ở đầu file.
 *
 * Lưu ý: mỗi lần SỬA code này phải "Triển khai" → "Quản lý bản triển khai" → chọn
 * bản cũ → Sửa → Phiên bản mới, thì thay đổi mới có hiệu lực (link giữ nguyên).
 * Phòng chơi lưu tạm trong bộ nhớ đệm, tự xoá sau 6 giờ. Không lưu thông tin cá nhân,
 * chỉ có tên hiển thị, nhân vật và tiến độ cuộc đua.
 */

var TTL = 21600;          // giây: phòng tồn tại tối đa 6 giờ
var COUNTDOWN_MS = 4000;  // từ lúc chủ phòng bấm Bắt đầu đến lúc chạy

function doGet(e) {
  var out;
  try { out = handle_(e && e.parameter ? e.parameter : {}); }
  catch (err) { out = { ok: false, error: 'Lỗi máy chủ: ' + err }; }
  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}

function handle_(p) {
  var lock = LockService.getScriptLock();
  lock.waitLock(8000);
  try {
    var cache = CacheService.getScriptCache();
    var now = Date.now();
    var act = String(p.action || '');
    var room, key;

    if (act === 'create') {
      var code = '';
      for (var tries = 0; tries < 30; tries++) {
        code = String(1000 + Math.floor(Math.random() * 9000));
        if (!cache.get('room_' + code)) break;
      }
      room = { code: code, status: 'waiting', startAt: 0, winner: '', created: now, track: String(p.track || 'park').replace(/[^a-z]/g, '').substring(0, 12) || 'park',
               players: { p1: newPlayer_(p, now), p2: null } };
      save_(cache, room);
      return view_(room, 'p1', now);
    }

    key = String(p.room || '').replace(/\D/g, '');
    room = load_(cache, key);
    if (!room) return { ok: false, error: 'Không tìm thấy phòng ' + key + '. Kiểm tra lại mã hoặc tạo phòng mới.' };

    if (act === 'join') {
      if (room.players.p2) return { ok: false, error: 'Phòng này đã đủ 2 bạn.' };
      if (room.status !== 'waiting') return { ok: false, error: 'Phòng này đã bắt đầu chơi.' };
      room.players.p2 = newPlayer_(p, now);
      save_(cache, room);
      return view_(room, 'p2', now);
    }

    var me = String(p.me || '');
    if (me !== 'p1' && me !== 'p2') return { ok: false, error: 'Thiếu thông tin người chơi.' };
    var mine = room.players[me];
    if (!mine) return { ok: false, error: 'Bạn không thuộc phòng này.' };

    if (act === 'start') {
      if (me !== 'p1') return { ok: false, error: 'Chỉ chủ phòng mới bấm Bắt đầu.' };
      if (!room.players.p2) return { ok: false, error: 'Chưa có bạn thứ hai trong phòng.' };
      if (room.status === 'waiting') { room.status = 'countdown'; room.startAt = now + COUNTDOWN_MS; }
      mine.seen = now; save_(cache, room);
      return view_(room, me, now);
    }

    if (act === 'leave') {
      mine.left = true; mine.seen = now; save_(cache, room);
      return view_(room, me, now);
    }

    // sync: cập nhật tiến độ của mình và trả về toàn bộ trạng thái
    mine.seen = now;
    if (room.status === 'countdown' && now >= room.startAt) room.status = 'playing';
    if (room.status !== 'waiting') {
      var pos = Math.max(0, Math.min(99, parseInt(p.pos, 10) || 0));
      if (pos >= mine.pos || !mine.done) mine.pos = pos;
      mine.right = parseInt(p.right, 10) || 0;
      mine.wrong = parseInt(p.wrong, 10) || 0;
      mine.fz = Math.max(mine.fz || 0, parseInt(p.fz, 10) || 0);   // số lần đã dùng vật phẩm Đóng băng
      if (String(p.done) === '1' && !mine.done) {
        mine.done = true; mine.ft = parseFloat(p.t) || 0;
        if (!room.winner) room.winner = me;   // ai báo về đích trước máy chủ thì thắng
      }
    }
    save_(cache, room);
    return view_(room, me, now);
  } finally {
    lock.releaseLock();
  }
}

function newPlayer_(p, now) {
  var name = String(p.name || 'Bạn').replace(/[<>&"]/g, '').substring(0, 14) || 'Bạn';
  var ch = Math.max(0, Math.min(5, parseInt(p.ch, 10) || 0));
  return { name: name, ch: ch, pos: 0, right: 0, wrong: 0, fz: 0, done: false, ft: 0, left: false, seen: now };
}
function load_(cache, code) { var s = cache.get('room_' + code); return s ? JSON.parse(s) : null; }
function save_(cache, room) { cache.put('room_' + room.code, JSON.stringify(room), TTL); }
function view_(room, me, now) {
  return { ok: true, room: room.code, me: me, serverNow: now, status: room.status, startAt: room.startAt,
           winner: room.winner, track: room.track || 'park', players: room.players };
}

</script>

/* ============================ ONLINE ============================ */
var ON = { room: '', me: '', timer: null, off: 0, st: null, busy: false, again: false, started: false, fail: 0 };
function onlineNow() { return Date.now() + ON.off; }
function api(params) {
  var base = CFG.onlineUrl, qs = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  var url = base + (base.indexOf('?') >= 0 ? '&' : '?') + qs + '&_=' + Date.now();
  return new Promise(function (res, rej) {
    var done = false, t = setTimeout(function () { if (!done) { done = true; rej(new Error('timeout')); } }, 9000);
    fetch(url).then(function (r) { return r.json(); }).then(function (j) { if (done) return; done = true; clearTimeout(t); res(j); }).catch(function (e) { if (done) return; done = true; clearTimeout(t); rej(e); });
  });
}
function startPolling() { if (ON.timer) clearInterval(ON.timer); ON.timer = setInterval(onlineSync, 1500); }
function stopOnlinePolling(leave) {
  if (ON.timer) { clearInterval(ON.timer); ON.timer = null; }
  if (leave && ON.room) { try { api({ action: 'leave', room: ON.room, me: ON.me }).catch(function () {}); } catch (e) {} ON.room = ''; ON.me = ''; ON.started = false; ON.st = null; ON.fail = 0; }
}
function onlineKick(force) { if (!ON.room) return; if (ON.busy) { ON.again = true; return; } onlineSync(); }
function onlineSync() {
  if (!ON.room) return;
  if (ON.busy) return;
  ON.busy = true;
  var me = (race && race.mode === 'online') ? race.players[0] : null;
  var params = { action: 'sync', room: ON.room, me: ON.me, pos: me ? me.pos : 0, right: me ? me.stats.right : 0, wrong: me ? me.stats.wrong : 0, done: me && me.finished ? 1 : 0, t: me && me.finishT != null ? me.finishT.toFixed(1) : 0, fz: me ? me.fz : 0 };
  api(params).then(function (st) {
    ON.busy = false; ON.fail = 0;
    if (!st || !st.ok) { onlineProblem((st && st.error) || 'Lỗi không rõ'); return; }
    onlineApply(st);
    if (ON.again) { ON.again = false; onlineSync(); }
  }).catch(function () {
    ON.busy = false; ON.fail++;
    if (ON.fail >= 6) onlineProblem('Mất kết nối mạng. Kiểm tra wifi/4G rồi thử lại.');
  });
}
function onlineProblem(msg) {
  if (race && race.mode === 'online' && race.state !== 'over') {
    stopOnlinePolling(false);
    showOverlay('<h2>😢 Mất kết nối</h2><div class="sm">' + esc(msg) + '</div><button class="btn ghost" id="ovMenu2">🏠 Về menu</button>');
    $('#ovMenu2').onclick = function () { goMenu(); };
    race.paused = true;
  } else if (screenId === 'lobby') { stopOnlinePolling(true); lobbyView(); lobbyMsg(msg, true); }
}
function onlineApply(st) {
  ON.off = st.serverNow - Date.now(); ON.st = st;
  var opK = ON.me === 'p1' ? 'p2' : 'p1', op = st.players[opK];
  if (screenId === 'lobby') {
    lobbyView();
    if (st.status === 'countdown' && st.startAt && !ON.started && op) {
      ON.started = true;
      startRace('online', { oppName: op.name, oppCh: op.ch, startAt: st.startAt, track: st.track, seed: st.room });
    }
    return;
  }
  if (!race || race.mode !== 'online' || race.state === 'over') return;
  var r = race.players[1], me = race.players[0];
  if (op) {
    r.name = op.name; r.ch = op.ch;
    var guard = 0;
    while (r.pos < op.pos && guard++ < 20) moveForward(r);
    while (r.pos > op.pos && guard++ < 40) moveBack(r);
    r.stats.right = op.right; r.stats.wrong = op.wrong;
    if (op.done) { r.finished = true; r.finishT = op.ft; }
    if ((op.fz || 0) > me.fzSeen) { me.fzSeen = op.fz; applyFreeze(me); }
    if (op.left && !race.winner && !st.winner) {
      race.oppLeft = true; race.winner = me; race.pending = false;
      if (race.state === 'playing') { race.state = 'ending'; lockAll(); }
    }
  }
  if (st.winner && !race.winner) {
    race.winner = (st.winner === ON.me) ? me : r; race.pending = false;
    if (race.state === 'playing') { race.state = 'ending'; lockAll(); }
    if (race.winner === r) r.finished = true;
  }
  refreshHud();
}

    '<div class="trow"><span>' + (p2 ? CHARS[p2.ch].emoji + ' ' + esc(p2.name) : 'Đang chờ bạn kia...') + (!host && p2 ? ' (bạn)' : '') + '</span><span>' + (p2 ? '✅ Đã vào' : '⏳') + '</span></div></div>';
  if (host) h += '<div class="center"><button class="btn mint big" id="btnStart"' + (p2 ? '' : ' disabled') + '>▶ Bắt đầu!</button></div>';
  else h += '<div class="center"><b>Đợi bạn chủ phòng bấm “Bắt đầu”...</b></div>';

function doCreate() {
  lobbyMsg('Đang tạo phòng...');
  api({ action: 'create', name: (S.names[0] || '').trim() || 'Bạn', ch: S.chars[0], track: resolveTrack().id }).then(function (r) {
    if (!r.ok) { lobbyMsg(r.error || 'Không tạo được phòng', true); return; }
    ON.room = r.room; ON.me = r.me; ON.started = false; ON.fail = 0; ON.off = r.serverNow - Date.now(); ON.st = r; startPolling(); lobbyView();
  }).catch(function () { lobbyMsg('Không kết nối được máy chủ. Kiểm tra mạng và link Apps Script.', true); });
}
function doJoin() {
  var code = ($('#codeInp').value || '').replace(/\D/g, '');
  if (code.length !== 4) { lobbyMsg('Hãy nhập đủ 4 số của mã phòng.', true); return; }
  lobbyMsg('Đang vào phòng...');
  api({ action: 'join', room: code, name: (S.names[0] || '').trim() || 'Bạn', ch: S.chars[0] }).then(function (r) {
    if (!r.ok) { lobbyMsg(r.error || 'Không vào được phòng', true); return; }
    ON.room = r.room; ON.me = r.me; ON.started = false; ON.fail = 0; ON.off = r.serverNow - Date.now(); ON.st = r; startPolling(); lobbyView();
  }).catch(function () { lobbyMsg('Không kết nối được máy chủ. Kiểm tra mạng và link Apps Script.', true); });
}
function doStart() {
  lobbyMsg('Đang bắt đầu...');
  api({ action: 'start', room: ON.room, me: ON.me }).then(function (r) {
    if (!r.ok) { lobbyMsg(r.error || 'Chưa bắt đầu được', true); return; }
    onlineApply(r);
  }).catch(function () { lobbyMsg('Mất kết nối, thử lại nhé.', true); });
}

  audioInit(); unlockSpeech();
  if (!VOCAB.length && !GRAMMAR.length) { $('#setupMsg').textContent = 'Chưa có dữ liệu từ vựng/ngữ pháp trong file.'; return; }
  if (!activeTypes().length) { $('#setupMsg').textContent = 'Chưa có dạng câu hỏi nào dùng được. Vào Cài đặt để bật dạng câu hoặc kiểm tra dữ liệu.'; return; }
  saveS();
  if (pendingMode === 'online') openLobby(); else startRace(pendingMode);
};
$('#chaseSw').onclick = function () { S.chase = !S.chase; saveS(); $('#chaseSw').classList.toggle('on', S.chase); };
$('#lobbyBack').onclick = function () { stopOnlinePolling(true); show('setup'); };
$('#btnPause').onclick = function () { if (race) setPause(!race.paused); };
$('#btnSound').onclick = function () { S.sound = !S.sound; saveS(); $('#btnSound').textContent = S.sound ? '🔊' : '🔇'; };
$('#btnAgain').onclick = function () { if (!race) { show('menu'); return; } var m = race.mode; if (m === 'online') { openLobby(); } else startRace(m); };
$('#btnHome').onclick = function () { goMenu(); };
window.addEventListener('pagehide', function () { stopOnlinePolling(true); });
document.addEventListener('visibilitychange', function () { if (document.hidden && race && race.state === 'playing' && race.mode !== 'online') setPause(true); });

if (/[?&]debug=1/.test(location.search)) {
  window.__dbg = {
    get race() { return race; }, answer: answer,
    ok: function (p) { var q = p.q; var a = q.kind === 'choice' ? q.choices.findIndex(function (c) { return c.ok; }) : (q.kind === 'order' ? q.words.slice() : q.answerText); answer(p, a, false); },
    bad: function (p) { var q = p.q; var a = q.kind === 'choice' ? q.choices.findIndex(function (c) { return !c.ok; }) : (q.kind === 'order' ? q.words.slice().reverse() : 'zzz'); answer(p, a, false); },
    setTypes: function (ids) { TYPES.forEach(function (t) { S.types[t.id] = ids.indexOf(t.id) >= 0; }); },
    next: function (p) { if (p.fbBtn) p.fbBtn.click(); }, start: startQuestion, BUILD: BUILD
  };
}

raf = requestAnimationFrame(frame);
})();

</script>
