<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: một sân chơi toàn màn hình. Vườn trái cây nắng cho game chém, vũ trụ tối cho game bắn câu. Giao diện menu là giấy kem + nút bo tròn dày. */
:root{
  --ink:#1d2540; --ink2:#5a638c; --paper:#fff4dc; --card:#ffffff; --line:#ecdfc2; --soft:#f7efdc;
  --sun:#ffc43d; --sun-ink:#3b2a00; --mint:#16b87a; --coral:#ff6a5b; --sky:#32b5ec; --grape:#7a5cff;
  --good:#12a066; --bad:#e04858; --shadow:0 5px 0 rgba(29,37,64,.16);
  --paper2:#ffe8f0; --hud:rgba(16,22,52,.82); --panel:#ffffff; --panel-ink:#1d2540;
  --display:'Baloo 2','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2f4ff;--ink2:#a9b2da;--paper:#131936;--paper2:#1b1c4a;--card:#1e2650;--line:#323d72;--soft:#2a3364;--shadow:0 5px 0 rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f2f4ff;--ink2:#a9b2da;--paper:#131936;--paper2:#1b1c4a;--card:#1e2650;--line:#323d72;--soft:#2a3364;--shadow:0 5px 0 rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:700;font-size:clamp(14px,2.4vmin + 6px,19px);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ---------- buttons & chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.7em 1.3em;border-radius:18px;background:var(--sun);color:var(--sun-ink);font-family:var(--display);font-weight:800;font-size:1.1em;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(29,37,64,.16)}
.btn.big{font-size:1.35em;padding:.65em 1.8em}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.btn.mint{background:var(--mint);color:#fff}
.btn.coral{background:var(--coral);color:#fff}
.btn:focus-visible,.chip:focus-visible,.tbtn:focus-visible,.ibtn:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.chip{padding:.45em .95em;border-radius:999px;background:var(--card);border:3px solid var(--line);font-weight:800;color:var(--ink);line-height:1.15}
.chip.on{background:var(--sun);border-color:#e3a300;color:var(--sun-ink)}
.chip.sm{padding:.3em .7em;font-size:.88em}
.avb{width:2.5em;height:2.5em;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:1.25em;overflow:hidden;padding:0}
.avb.on{border-color:var(--grape);box-shadow:0 0 0 3px rgba(122,92,255,.3)}
.avb img,.av img{width:100%;height:100%;object-fit:cover}

/* ---------- screens ---------- */
#screens{position:absolute;inset:0;z-index:10}
#screens:empty{display:none}
.screen{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:var(--paper);display:flex;flex-direction:column;align-items:center}
.wrap{width:min(940px,100%);display:flex;flex-direction:column;gap:14px;margin-block:auto;min-width:0}
.brand{text-align:center;display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2em,9vmin,4em);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.brand h1 em{font-style:normal;color:var(--coral)}
.brand p{color:var(--ink2);font-size:1.05em}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.gcard{position:relative;text-align:left;border-radius:28px;padding:18px 18px 16px;color:#fff;box-shadow:0 8px 0 rgba(29,37,64,.22);overflow:hidden;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;transition:transform .1s}
.gcard:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(29,37,64,.22)}
.gcard.fruit{background:linear-gradient(160deg,#35c46a 0%,#87d84a 55%,#ffc43d 120%)}
.gcard.space{background:linear-gradient(160deg,#2a1b7a 0%,#5b3fd6 60%,#32b5ec 130%)}
.gcard svg{position:absolute;right:-4px;top:-10px;width:46%;max-width:210px;height:auto;opacity:.95}
.gcard h2{font-family:var(--display);font-weight:800;font-size:1.7em;line-height:1.05;position:relative}
.gcard p{font-size:.98em;opacity:.95;position:relative;max-width:20em}
.gcard .tags{display:flex;gap:6px;flex-wrap:wrap;position:relative}
.gcard .tags span{background:rgba(255,255,255,.25);padding:.15em .65em;border-radius:99px;font-size:.82em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.panel{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-family:var(--display);font-weight:800;font-size:1.15em;display:flex;align-items:center;gap:.4em}
.panel h3 small{font-family:var(--body);font-weight:700;color:var(--ink2);font-size:.78em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prow input{flex:1 1 140px;min-width:0;padding:.55em .8em;border-radius:14px;border:3px solid var(--line);background:var(--card);font-weight:800}
.avs{display:flex;gap:6px;flex-wrap:wrap}
.top{display:flex;align-items:center;gap:10px}
.top h2{font-family:var(--display);font-weight:800;font-size:1.5em;flex:1}
.hint{color:var(--ink2);font-size:.9em;font-weight:700}
textarea{width:100%;min-height:150px;padding:.7em;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;-webkit-user-select:text;user-select:text;resize:vertical}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:6px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));max-width:980px;margin-inline:auto}
#bar{display:flex;align-items:stretch;gap:8px}
.pcard{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:18px;background:var(--hud);color:#fff;border:3px solid transparent;transition:border-color .2s,transform .2s}
.pcard.on{border-color:var(--sun);transform:translateY(2px)}
.pcard .av{flex:none;width:2.1em;height:2.1em;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.3em;overflow:hidden}
.pcard .pi{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.pcard b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92em}
.pcard .sc{font-family:var(--display);font-weight:800;font-size:1.25em;color:var(--sun)}
#qn{flex:none;align-self:center;background:var(--hud);color:#fff;padding:.3em .8em;border-radius:99px;font-size:.85em;white-space:nowrap}
.ibtn{pointer-events:auto;flex:none;width:2.9em;border-radius:18px;background:var(--hud);color:#fff;font-size:1.15em}
#timebar{height:9px;border-radius:9px;background:rgba(16,22,52,.4);overflow:hidden}
#timebar i{display:block;height:100%;width:100%;background:var(--mint);border-radius:9px}
#qpanel{background:var(--panel);color:var(--panel-ink);border-radius:22px;padding:9px 14px 10px;box-shadow:0 6px 0 rgba(16,22,52,.22);display:flex;flex-direction:column;gap:5px}
#qtop{display:flex;align-items:center;gap:8px;justify-content:space-between}
#qbadge{font-size:.78em;padding:.1em .75em;border-radius:99px;background:var(--sky);color:#fff;font-weight:900;letter-spacing:.02em}
#qbadge.g{background:var(--grape)}
#qstreak{font-size:.82em;color:#d9650a}
#qmain{display:flex;align-items:center;gap:12px}
#qpic{font-size:2.8em;line-height:1;flex:none}
#qbody{min-width:0;flex:1}
#qtext{font-family:var(--display);font-weight:800;font-size:1.3em;line-height:1.15;text-wrap:balance}
#qsub{font-weight:800;font-size:1.05em;color:#3d4672;margin-top:2px;line-height:1.3}
#qsub small{font-weight:700;color:#6a73a0}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--coral);text-align:center;color:var(--coral)}
.en{color:#5b3fd6}
#qhint{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:900;font-size:1.15em;letter-spacing:.12em;color:#b36b00;background:#fff3d1;border-radius:12px;padding:.15em .7em;align-self:flex-start}
#slots{display:flex;flex-wrap:wrap;gap:2px;min-height:2.1em}
.sl{display:inline-grid;place-items:center;min-width:1.9em;height:2.1em;padding:0 .45em;border-radius:11px;border:2.5px dashed #aab3da;margin:2px;font-weight:900;color:#1d2540;transition:transform .15s}
.sl.done{background:#d3f6e4;border:2.5px solid var(--good);color:#075c3a;transform:scale(1.04)}
.sl.given{background:#eceffc;border:2.5px solid #c9cfee}
.sl.ghost{color:#9aa4d3;border-color:#8f99cc;background:#f3f5fd}
#typerow{display:flex;gap:8px;pointer-events:auto}
#typerow input{flex:1;min-width:0;padding:.5em .8em;border-radius:14px;border:3px solid #c7cdea;background:#fff;color:#1d2540;font-weight:900;font-size:1.15em;-webkit-user-select:text;user-select:text}
#typerow .btn{padding:.4em 1em;font-size:1em}
#qtools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{pointer-events:auto;padding:.3em .85em;border-radius:99px;background:#eef1ff;color:#2b3570;border:2.5px solid #c9d0f5;font-weight:900;font-size:.88em}
.tbtn:disabled{opacity:.45}
.tbtn.hot{background:#fff3d1;border-color:#ffcf5c;color:#8a5a00}
#fx{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;font-family:var(--display);font-weight:800;font-size:clamp(1.8em,7vmin,3.4em);color:#fff;text-shadow:0 4px 0 rgba(16,22,52,.55),0 0 22px rgba(255,200,60,.9);animation:pop .9s ease-out forwards;text-align:center;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
#coach{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;pointer-events:none;background:rgba(16,22,52,.88);color:#fff;border-radius:99px;padding:.55em 1.2em;font-size:1em;text-align:center;max-width:92%;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}
#banner{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none;background:rgba(16,22,52,.35)}
#banner .bc{background:var(--card);color:var(--ink);border-radius:30px;padding:18px 34px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25);animation:pop2 .35s ease-out;display:flex;flex-direction:column;align-items:center;gap:4px}
#banner .av{font-size:3.4em;width:1.4em;height:1.4em;border-radius:50%;background:var(--soft);display:grid;place-items:center;overflow:hidden}
#banner h2{font-family:var(--display);font-weight:800;font-size:1.7em}
@keyframes pop2{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(14,20,50,.6);backdrop-filter:blur(3px);padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.mcard{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--card);color:var(--ink);border-radius:28px;box-shadow:0 10px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;animation:pop2 .25s ease-out}
.mh{padding:14px 20px;font-family:var(--display);font-weight:800;font-size:1.5em;color:#fff;background:var(--coral);border-radius:28px 28px 0 0}
.mh.ok{background:var(--mint)} .mh.pause{background:var(--grape)} .mh.sun{background:var(--sun);color:var(--sun-ink)}
.mb{padding:14px 20px;display:flex;flex-direction:column;gap:10px;-webkit-user-select:text;user-select:text}
.mf{padding:4px 20px 18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ans{font-size:1.15em}
.ans b{color:var(--good);font-size:1.15em}
.mine{color:var(--bad)}
.why{display:flex;gap:10px;background:var(--soft);border-radius:16px;padding:10px 12px;line-height:1.4}
.why>span{font-size:1.4em}
.why small{color:var(--ink2)}
.rolechips{display:flex;flex-wrap:wrap;gap:6px}
.rc{display:flex;flex-direction:column;align-items:center;background:var(--soft);border-radius:12px;padding:3px 9px;line-height:1.15}
.rc i{font-style:normal;font-size:.7em;color:var(--grape);font-weight:900}
.say{padding:.05em .5em;border-radius:99px;background:var(--soft);font-size:.9em}
.revlist{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.revlist div{background:var(--soft);border-radius:12px;padding:6px 10px;font-size:.95em}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sc-card{background:var(--soft);border-radius:20px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent}
.sc-card.win{border-color:var(--sun);background:#fff3cf;color:#3b2a00}
.sc-card .av{font-size:2.4em;width:1.5em;height:1.5em;border-radius:50%;background:var(--card);display:grid;place-items:center;overflow:hidden}
.sc-card .big{font-family:var(--display);font-weight:800;font-size:2em;line-height:1}
.stars{font-size:1.5em;letter-spacing:.1em}
.conf{position:absolute;top:-10%;font-size:1.6em;animation:fall linear forwards;pointer-events:none;z-index:40}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}
.skrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.skrow img{height:64px;border-radius:10px;border:2px solid var(--line);background:#fff}
.skrow select{padding:.3em .5em;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800}
@media (prefers-reduced-motion:reduce){#coach,.mcard,#banner .bc{animation:none}}

/* ===== lớp trang trí: xinh hơn ===== */
.screen{background:var(--paper);background:radial-gradient(circle at 10% 6%,color-mix(in srgb,var(--sky) 26%,transparent) 0 17%,transparent 18%),radial-gradient(circle at 94% 16%,color-mix(in srgb,var(--coral) 22%,transparent) 0 15%,transparent 16%),radial-gradient(circle at 86% 94%,color-mix(in srgb,var(--grape) 20%,transparent) 0 19%,transparent 20%),radial-gradient(circle at 4% 90%,color-mix(in srgb,var(--mint) 20%,transparent) 0 14%,transparent 15%),radial-gradient(color-mix(in srgb,var(--ink) 8%,transparent) 1.6px,transparent 1.7px) 0 0/24px 24px,linear-gradient(180deg,var(--paper),var(--paper2))}
.decos{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.decos span{position:absolute;opacity:.85;font-size:clamp(1.5em,5.5vmin,3em);animation:floaty 7s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(29,37,64,.12))}
@keyframes floaty{50%{transform:translateY(-16px) rotate(9deg)}}
.wrap{position:relative;z-index:1}
.brand h1{font-size:clamp(2.4em,10vmin,4.4em);-webkit-text-stroke:.16em #fff;paint-order:stroke fill;text-shadow:0 .07em 0 rgba(29,37,64,.22);letter-spacing:.005em}
.brand h1 .w1{color:#ff6a5b}.brand h1 .w2{color:#7a5cff}
.brand p{font-size:1.1em}
.btn{background:linear-gradient(180deg,#ffdc6a,#ffb81f);box-shadow:0 5px 0 #d89300,0 10px 20px rgba(255,160,0,.22)}
.btn:active{box-shadow:0 1px 0 #d89300}
.btn.mint{background:linear-gradient(180deg,#46dc9f,#13a468);box-shadow:0 5px 0 #0b7a4c,0 10px 20px rgba(20,170,110,.22)}
.btn.coral{background:linear-gradient(180deg,#ff8b7d,#ff5a6a);box-shadow:0 5px 0 #c93a4a}
.btn.alt{background:var(--card);box-shadow:0 4px 0 var(--line)}
.chip{box-shadow:0 3px 0 rgba(29,37,64,.09)}
.chip.on{background:linear-gradient(180deg,#ffdc6a,#ffb81f);border-color:#e3a300;box-shadow:0 3px 0 #d89300}
.panel{border-radius:28px;box-shadow:0 6px 0 rgba(29,37,64,.07)}
.panel h3 .ic{display:inline-grid;place-items:center;width:1.8em;height:1.8em;border-radius:12px;background:var(--soft);font-style:normal;font-size:.95em}
.gcard{border:4px solid rgba(255,255,255,.55);border-radius:32px;min-height:230px}
.gcard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% -6%,rgba(255,255,255,.45),transparent 52%);pointer-events:none}
.gcard::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
.gcard h2{font-size:1.85em;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.gcard svg{width:52%;max-width:230px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.12))}
.gcard:hover{transform:translateY(-3px)}
.sc-card{border-radius:24px}
.mh{background:linear-gradient(135deg,#ff7a6b,#ff5a78)}
.mh.ok{background:linear-gradient(135deg,#3fd89a,#13a468)}.mh.pause{background:linear-gradient(135deg,#8d6bff,#5b8cff)}.mh.sun{background:linear-gradient(135deg,#ffdc6a,#ffb81f);color:var(--sun-ink)}
.mcard{border:4px solid rgba(255,255,255,.6)}
.pcard{background:linear-gradient(180deg,rgba(44,54,120,.9),rgba(18,24,60,.9));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.2)}
#pc0 .av{box-shadow:0 0 0 3px var(--sun)}#pc1 .av{box-shadow:0 0 0 3px var(--sky)}
.pcard.on{box-shadow:0 4px 0 rgba(0,0,0,.2),0 0 18px rgba(255,196,61,.65),inset 0 1px 0 rgba(255,255,255,.2)}
.ibtn{background:linear-gradient(180deg,rgba(44,54,120,.9),rgba(18,24,60,.9));box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.2)}
#timebar{height:11px;border:2px solid rgba(255,255,255,.75);background:rgba(16,22,52,.35)}
#timebar i{background-image:linear-gradient(90deg,rgba(255,255,255,.28) 0 25%,transparent 25% 50%,rgba(255,255,255,.28) 50% 75%,transparent 75%);background-size:22px 22px}
#qpanel{border:4px solid #fff;background:linear-gradient(180deg,#ffffff,#f4f2ff);border-radius:26px;box-shadow:0 8px 0 rgba(16,22,52,.2)}
#qpanel.in{animation:qin .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes qin{from{transform:translateY(-22px) scale(.95);opacity:0}to{transform:none;opacity:1}}
#qbadge{background:linear-gradient(180deg,#4cc4f4,#2a9bd6);box-shadow:0 2px 0 rgba(0,0,0,.15)}#qbadge.g{background:linear-gradient(180deg,#9a7dff,#6a4be0)}
.tbtn{box-shadow:0 2px 0 #c9d0f5}
@media (prefers-reduced-motion:reduce){.decos span,#qpanel.in{animation:none}}

/* ===== hồ sơ, buổi học, thưởng, hiệu ứng ===== */
.strip{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.who{display:flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:.2em .8em;font-size:1.05em;box-shadow:0 3px 0 rgba(29,37,64,.08)}
.who input{width:7.5em;border:0;background:transparent;font-weight:900;color:var(--ink);outline:0;-webkit-user-select:text;user-select:text}
.pillstat{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:.3em .85em;font-weight:900;box-shadow:0 3px 0 rgba(29,37,64,.08);color:var(--ink)}

function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('arcade-skins',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('s').objectStore('s').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function idbDel(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('s','readwrite');t.objectStore('s').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function trimCell(cv){
  const w=cv.width,h=cv.height,x=cv.getContext('2d',{willReadFrequently:true}),im=x.getImageData(0,0,w,h),d=im.data;
  if(d[3]>200){
    const br=d[0],bg=d[1],bb=d[2],tol=96,seen=new Uint8Array(w*h),st=[];
    const ok=i=>{const p=i*4;return Math.abs(d[p]-br)+Math.abs(d[p+1]-bg)+Math.abs(d[p+2]-bb)<tol};
    const push=i=>{if(!seen[i]&&ok(i)){seen[i]=1;st.push(i)}};
    for(let i=0;i<w;i++){push(i);push((h-1)*w+i)} for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
    while(st.length){const i=st.pop(),cx=i%w,cy=(i/w)|0; d[i*4+3]=0; if(cx>0)push(i-1); if(cx<w-1)push(i+1); if(cy>0)push(i-w); if(cy<h-1)push(i+w);}
    x.putImageData(im,0,0);
  }
  let x0=w,y0=h,x1=0,y1=0; for(let j=0;j<h;j++)for(let i=0;i<w;i++) if(d[(j*w+i)*4+3]>24){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
  if(x1<=x0||y1<=y0)return cv;
  const bw=x1-x0+1,bh=y1-y0+1,s=Math.round(Math.max(bw,bh)*1.04),o=document.createElement('canvas'); o.width=o.height=s;
  o.getContext('2d').drawImage(cv,x0,y0,bw,bh,(s-bw)/2,(s-bh)/2,bw,bh); return o;
}
async function sheetToCells(blob,cols,rows){
  const url=URL.createObjectURL(blob);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const cw=Math.floor(img.naturalWidth/cols),ch=Math.floor(img.naturalHeight/rows),out=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
    cv.getContext('2d',{willReadFrequently:true}).drawImage(img,c*cw,r*ch,cw,ch,0,0,cw,ch); out.push(trimCell(cv));
  }
  URL.revokeObjectURL(url); return out;
}
async function loadSkin(kind){
  try{ const rec=await idbGet(kind); if(!rec){SK[kind]=[];} else SK[kind]=await sheetToCells(rec.blob,rec.cols,rec.rows); }catch(e){SK[kind]=[]}
  if(kind==='avatar')SK.avUrl=SK.avatar.map(c=>c.toDataURL('image/png'));
}

const TR=[];
function addTrail(x,y){TR.push({x,y,t:performance.now()}); if(TR.length>40)TR.shift()}
function drawTrail(){
  const now=performance.now(); while(TR.length&&now-TR[0].t>260)TR.shift(); if(TR.length<2)return;

    case 'lessonNext': LS.i++; lessonRun(); break;
    case 'lessonEnd': showLessonEnd(); break;
    case 'next': M.afterExplain(); break;
    case 'resume': M.resume(); break;
    case 'restart': $('#modal').classList.add('hidden'); M.paused=false; M.start(M.lastCfg); break;
    case 'snd': SND.on=!SND.on; store.set('ea.snd',SND.on); if(!SND.on)try{speechSynthesis.cancel()}catch(e){} if(M.paused){M.paused=false;M.pause();} else if($('.games'))showHome(); break;
    case 'mus': MUS.on=!MUS.on; store.set('ea.mus',MUS.on); if(M.paused){M.paused=false;M.pause();} else if($('.games'))showHome(); break;
    case 'say': speak(b.dataset.t); break;
    case 'mine': openMine(); break;
    case 'mineSave': { store.set('ea.mine',$('#mineTa').value); $('#modal').classList.add('hidden'); if($('.top h2'))showSetup(); break; }
    case 'close': $('#modal').classList.add('hidden'); break;
    case 'skins': openSkins(); break;
    case 'skinDel': { await idbDel(b.dataset.v).catch(()=>{}); await loadSkin(b.dataset.v); openSkins(); break; }
    case 'pets': openPets(); break;
    case 'weak': openWeak(false); break;
    case 'weakclear': if(b.textContent.includes('lần nữa')){ MEM.clear(ST.names[0]||'Bé 1'); $('#modal').classList.add('hidden'); showHome(); } else openWeak(true); break;
    case 'weakgo': { $('#modal').classList.add('hidden'); ST.game='fruit'; ST.mode='solo'; ST.weak=true; ST.n=Math.max(ST.n,8); persistSt(); const cfg=baseCfg(); M.lastCfg=cfg; M.start(cfg); break; }
    case 'copyWrong': openCopy(M.wrong); break;
    case 'copyLesson': openCopy(LS.wrong); break;
    case 'copyDo': { const ta=$('#copyTa'); ta.select(); let ok=false; try{ await navigator.clipboard.writeText(ta.value); ok=true }catch(err){ try{ ok=document.execCommand('copy') }catch(e2){} } $('#copySt').textContent=ok?'✅ Đã sao chép!':'Không tự sao chép được. Hãy nhấn giữ vào khung chữ và chọn Sao chép.'; break; }
  }
});
document.addEventListener('change',async e=>{
  if(e.target.id==='nmHome'){ ST.names[0]=e.target.value.trim()||'Bé 1'; persistSt(); if($('.games'))showHome(); return; }
  const f=e.target.closest('input[data-skin]'); if(!f||!f.files[0])return; const kind=f.dataset.skin;
  const sel=$(`select[data-grid="${kind}"]`),[c,r]=sel.value.split('x').map(Number);
  try{ const blob=f.files[0]; const cells=await sheetToCells(blob,c,r); if(!cells.length)throw 0; await idbSet(kind,{blob,cols:c,rows:r}); await loadSkin(kind); }catch(err){}
  openSkins();
});
function syncNames(){ [0,1].forEach(p=>{const i=$('#nm'+p); if(i)ST.names[p]=i.value.trim()||('Bé '+(p+1))}); const t=$('#teamIn'); if(t)ST.team=t.value; persistSt(); }
$('#bPause').addEventListener('click',()=>{ac();M.pause()});
$('#bHint').addEventListener('click',()=>M.useHint());
$('#bHear').addEventListener('click',()=>{ac(); const q=M.q; if(q)speak(q.speak||q.say)});
$('#typerow').addEventListener('submit',e=>{e.preventDefault();ac();M.submitType($('#typeIn').value,false)});
addEventListener('keydown',e=>{
  if(M.eng===SE&&M.phase==='play'&&!M.paused&&!SE.isBot&&document.activeElement.tagName!=='INPUT'){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){SE.tx=clamp(SE.tx+(e.key==='ArrowLeft'?-1:1)*L.W*.12,0,L.W);SE.idle=0;e.preventDefault()}
    else if(e.key===' '||e.key==='ArrowUp'){const a=SE.ast.filter(x=>!x.used&&x.dead<=0).sort((p,q)=>Math.abs(p.px-SE.sx)-Math.abs(q.px-SE.sx))[0]; if(a)SE.request(a); e.preventDefault()}
  }
  if(e.key==='Escape'||(e.key==='p'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))){ if(M.paused)M.resume(); else M.pause(); } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&M.phase==='play')M.pause(); });

/* ---- con trỏ / ngón tay ---- */
let down=false,lastP=null,mouseX=0;
const ptOf=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); try{cv.setPointerCapture(e.pointerId)}catch(_){} down=true; const p=ptOf(e); lastP=p; addTrail(p.x,p.y); if(M.phase==='play'&&M.eng&&!M.paused)M.eng.tap(p); });
cv.addEventListener('pointermove',e=>{ const p=ptOf(e); mouseX=(p.x/L.W-.5)*2; if(!down)return; addTrail(p.x,p.y); if(M.phase==='play'&&M.eng&&!M.paused&&lastP)M.eng.slice(lastP,p); lastP=p; });
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{down=false;lastP=null}));

/* =====================================================================
   13. VÒNG LẶP
===================================================================== */
let last=performance.now(),T=0,mxs=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; cx.setTransform(L.dpr,0,0,L.dpr,0,0); cx.clearRect(0,0,L.W,L.H);
  const eng=M.eng;
  if(eng&&M.phase!=='idle'){
    const d=M.paused?0:dt; if(TS.t>0)TS.t-=d; const gd=d*(TS.t>0?.35:1); T+=gd; mxs=lerp(mxs,eng===SE?SE.mx:mouseX,.05);
    if(!M.paused){ M.update(dt); eng.update(gd); if(SHAKE.t>0)SHAKE.t-=dt; if(MASC.t>0)MASC.t-=dt; }
    cx.save(); if(SHAKE.t>0){const k=SHAKE.a*SHAKE.t/.3; cx.translate(rnd(-1,1)*k,rnd(-1,1)*k);}
    eng.bg(T,mxs,gd); eng.draw(); if(!M.paused)drawTrail(); cx.restore();
    drawMascot(T);
  }
  requestAnimationFrame(frame);
}
async function init(){
  resize(); showHome();
  ['fruit','rock','avatar'].forEach(k=>loadSkin(k));
  requestAnimationFrame(frame);
}
window.__A={M,FE,SE,ST,L,LS,PROF,MEM,PETS,V:()=>V,VB,SENT,GMCD,GFD,buildQs,hintMask,TY,VT,showSetup,showHome,startFromSetup,baseCfg,lessonStart,lessonRun,GRADE_TYPES};
init();
})();
