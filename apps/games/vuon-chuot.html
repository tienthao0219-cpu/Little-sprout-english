<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script src="../../js/gameset.js"></script>
<script src="../../js/audiounlock.js"></script>
<title>Đập Chuột Template</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Bố cục: 1 cột trên điện thoại; từ 1000px: khu vườn bên trái, bảng phản hồi bên phải. Game một theme pastel cố định (theo style guide EASYENG). */
:root{
  color-scheme:light;
  --ink:#3c3355; --ink-soft:#6b6280; --panel:#fffaf3; --panel-line:#f1dfc4; --cream:#fff6e5;
  --pink:#ffc7d6; --pink-deep:#ff8aa8; --pink-darker:#e15c86; --sky:#bfe2ff; --blue:#8fd0f2; --blue-deep:#5fb3e0;
  --gold:#ffd873; --gold-deep:#f0a63c; --good:#35be7c; --bad:#ee5c78; --lilac:#dccbff; --lilac-d:#8e75e0; --mint:#bfebd8; --mint-d:#5dc39a;
  --r-lg:30px; --r-md:20px; --r-sm:12px; --shadow:0 8px 22px rgba(94,78,150,.16);
  --f-head:"Baloo 2","Comic Sans MS",system-ui,sans-serif; --f-body:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--f-body);font-weight:600;color:var(--ink);overflow-x:hidden;min-height:100%;
  background:radial-gradient(900px 500px at 6% -8%,var(--pink) 0,transparent 60%),radial-gradient(800px 500px at 100% 0,var(--sky) 0,transparent 60%),radial-gradient(900px 600px at 50% 120%,var(--mint) 0,transparent 60%),var(--cream)}
h1,h2,h3,.btn,.big{font-family:var(--f-head)}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lilac-d);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-block:10px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- header ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.brand h1{font-size:clamp(22px,3.4vw,32px);line-height:1.05;font-weight:800;color:var(--pink-darker)}
.brand p{margin:2px 0 0;font-size:clamp(12px,1.5vw,14px);color:var(--ink-soft)}
.tools{display:flex;align-items:center;gap:8px}
.coinpill{position:relative;display:flex;align-items:center;gap:6px;padding:3px 14px 3px 6px;border-radius:99px;background:#fff;border:3px solid var(--gold-deep);box-shadow:var(--shadow);font-family:var(--f-head);font-weight:800;font-size:22px}
.coinpill.bump{animation:bump .45s}
.iconbtn{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:var(--lilac);box-shadow:var(--shadow);display:grid;place-items:center;padding:0;font-size:22px}
.iconbtn:active,.btn:active,.setcard:active,.lvl:active,.spk:active{transform:scale(.96)}

/* ---- chung ---- */
.card{background:var(--panel);border:3px solid #fff;border-radius:var(--r-lg);box-shadow:var(--shadow),0 5px 0 var(--panel-line)}
.btn{border:0;border-radius:99px;padding:10px 20px;font-weight:700;font-size:17px;background:var(--lilac);color:var(--ink);box-shadow:0 4px 0 rgba(58,51,88,.16);transition:transform .1s;text-decoration:none;display:inline-block;text-align:center}
.btn.primary{background:var(--mint-d);color:#fff;box-shadow:0 4px 0 #3e9c79}
.btn.pink{background:var(--pink-deep);color:#fff;box-shadow:0 4px 0 #c8567f}
.btn.ghost{background:#fff;border:3px solid var(--lilac);padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--lilac);font-size:13px;font-weight:700}
.sec-title{font-size:22px;margin:18px 2px 8px}
.pop{animation:pop .4s both}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes bump{50%{transform:scale(1.12)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-46px);opacity:0}}
.shakeit{animation:shake .4s}

/* ---- menu ---- */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center;padding:16px 20px;overflow:hidden}
.hero h2{font-size:clamp(26px,4vw,40px);line-height:1.05}
.hero p{margin:8px 0 0;font-size:clamp(14px,1.8vw,17px);color:var(--ink-soft)}
.hero .pic{aspect-ratio:16/9;border-radius:22px;background-size:cover;background-position:center;border:3px solid #fff;box-shadow:var(--shadow)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.setcard{text-align:left;padding:12px 14px;border-radius:22px;background:#fff;border:4px solid var(--lilac);display:grid;gap:4px;box-shadow:0 5px 0 rgba(94,78,150,.14);min-width:0}
.setcard.on{border-color:var(--lilac-d);background:#f4eeff}
.setcard h3{font-size:19px;overflow-wrap:anywhere}.setcard small{color:var(--ink-soft);font-size:13px}
.setcard:disabled{opacity:.5}
.kind{justify-self:start;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:800;color:#fff;background:var(--blue-deep)}.kind.g{background:var(--pink-deep)}.kind.m{background:var(--lilac-d)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lvl{display:grid;gap:4px;text-align:left;padding:0 0 12px;border-radius:24px;background:#fff;border:3px solid #fff;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.lvl .sky{aspect-ratio:16/8;background-size:cover;background-position:center}
.lvl h3,.lvl p,.lvl .chip{margin:0 14px}.lvl h3{font-size:19px;margin-top:6px}.lvl p{font-size:14px;color:var(--ink-soft)}.lvl .chip{justify-self:start;background:#fff3c9;color:#8a5a00}
.lvl:disabled{filter:grayscale(.7);opacity:.7;cursor:not-allowed}
ol.how{margin:0;padding-left:22px;display:grid;gap:6px;line-height:1.45}
.tset{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px}
.tset label{display:flex;gap:8px;align-items:center;padding:4px 0}
.tset input{width:20px;height:20px;accent-color:var(--lilac-d)}
details.card{padding:12px 16px;margin-top:16px}details summary{cursor:pointer;font-family:var(--f-head);font-weight:800;font-size:19px}
details .tset{margin-top:10px}
.note{margin:8px 0 0;font-size:14px;color:var(--ink-soft)}

/* ---- play ---- */
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px}
.hud .pill{display:flex;align-items:center;gap:4px;font-family:var(--f-head);font-weight:800;font-size:17px;white-space:nowrap}
.hearts{display:flex;gap:2px}.heart-ic{width:28px;height:28px}
.tbar{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:800}
.tbar .progress{flex:1}
.progress{height:12px;border-radius:99px;background:#fff;border:3px solid var(--lilac);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink-deep),var(--gold-deep));transition:width .3s}
.combo{font-family:var(--f-head);font-weight:800;background:var(--gold);color:#7a4b00;padding:2px 12px;border-radius:99px;animation:bump .6s}
.grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:14px;align-items:start}
.main{min-width:0}
.prompt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-radius:22px;padding:10px 16px 12px;box-shadow:0 5px 0 var(--panel-line);margin-bottom:10px;min-height:72px}
.prompt .vis{flex:none;width:72px;height:72px;border-radius:14px;border:3px solid var(--lilac);background:#fff;display:grid;place-items:center;overflow:hidden}
.prompt .vis img{width:100%;height:100%;object-fit:contain}
.prompt .pq{flex:1;min-width:200px;text-align:center}
.tagc{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--blue-deep);padding:2px 10px;border-radius:20px;margin-bottom:4px}
.txt{font-family:var(--f-head);font-weight:800;font-size:clamp(17px,2.2vw,23px);line-height:1.25;overflow-wrap:anywhere}
.txt b{color:var(--pink-darker)}
.blank{display:inline-block;min-width:60px;border-bottom:4px solid var(--lilac-d);color:var(--lilac-d)}
.sub{display:block;font-family:var(--f-body);font-size:14px;color:var(--ink-soft);font-weight:600;margin-top:2px}
.lts{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;margin-top:6px}
.word{display:flex;gap:4px}
.lt{min-width:1.35em;height:1.55em;padding:0 .15em;border-radius:10px;background:var(--sky);display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:clamp(20px,3.4vw,30px);box-shadow:0 3px 0 rgba(58,51,88,.15)}
.lt.bl{background:#fff;border:3px dashed var(--lilac-d);color:var(--lilac-d)}
.spkrow{display:flex;gap:10px;justify-content:center;margin-top:6px}
.spk{width:60px;height:60px;border-radius:50%;border:4px solid #fff;background:var(--blue-deep);box-shadow:var(--shadow);display:grid;place-items:center;padding:0;color:#fff}
.spk.slow{background:var(--mint-d)}.spk svg{width:30px;height:30px}
.typerow{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.typerow input{flex:1;min-width:160px;max-width:380px;border:4px solid var(--lilac);border-radius:18px;padding:8px 14px;font-family:var(--f-head);font-weight:700;font-size:22px;color:var(--ink);background:#fff}
.typerow input:focus{border-color:var(--lilac-d);outline:0}
.hintline{font-family:var(--f-head);font-weight:800;letter-spacing:.18em;color:var(--lilac-d);font-size:20px;margin-top:4px;min-height:1px}

.scene{--k:1;position:relative;container-type:inline-size;width:min(100%,max(520px,calc((100dvh - 330px) * 1.776)));max-width:100%;aspect-ratio:1400/788;overflow:hidden;margin:0 auto;border-radius:26px;border:3px solid #fff;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;touch-action:manipulation}
@media (hover:hover) and (pointer:fine){.scene{cursor:none}}
.bgimg{position:absolute;inset:0;background-size:auto 100%;background-position:center;background-repeat:no-repeat}
.tint{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none}
.holes{position:absolute;inset:0;z-index:1}
.hole-slot{position:absolute;left:calc(50% + (var(--x) - 50%) / var(--k));top:var(--y);width:calc(var(--w) / var(--k));aspect-ratio:1/.92;transform:translate(-50%,-88%)}
.mole-wrap{position:absolute;bottom:6%;left:50%;width:78%;transform:translate(-50%,70%) scale(.75);opacity:0;z-index:2;cursor:pointer;touch-action:manipulation;pointer-events:none}
.mole-wrap.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto;animation:moPopUp .32s cubic-bezier(.34,1.56,.64,1) forwards}
.mole-wrap.hide{animation:moPopDown .22s ease-in forwards}
.mole-wrap.correct .mole-body{animation:moSpinWin .5s ease}
.mole-wrap.wrong .mole-body{animation:moShakeNo .4s ease}
@keyframes moPopUp{0%{transform:translate(-50%,72%) scale(.75);opacity:0}55%{transform:translate(-50%,-6%) scale(1.06);opacity:1}100%{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes moPopDown{to{transform:translate(-50%,72%) scale(.75);opacity:0}}
@keyframes moSpinWin{0%{transform:rotate(0)}50%{transform:rotate(14deg) scale(1.08)}100%{transform:rotate(0)}}
@keyframes moShakeNo{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(4deg)}60%{transform:translateX(-5px) rotate(-3deg)}80%{transform:translateX(5px) rotate(3deg)}}
.sign{position:absolute;left:50%;bottom:88%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:.4em;width:max-content;max-width:215%;padding:.22em .5em;background:linear-gradient(180deg,#e7c393,#c99a63);border:2px solid #a97a44;border-radius:9px;font-family:var(--f-head);font-weight:800;font-size:max(10px,calc(1.9cqw / var(--k)));line-height:1.1;color:#4a2f14;text-shadow:0 1px 0 rgba(255,255,255,.35);box-shadow:0 3px 0 rgba(0,0,0,.12);z-index:6}
.sign .txt{font-size:inherit;text-align:center;overflow-wrap:anywhere;line-height:1.1}
.sign .ltr{flex:none;width:1.55em;height:1.55em;border-radius:50%;display:grid;place-items:center;font-size:.85em;color:#fff;background:var(--lilac-d);text-shadow:none}
.sign .ltr.c1{background:var(--pink-deep)}.sign .ltr.c2{background:var(--blue-deep)}.sign .ltr.c3{background:var(--mint-d)}
.sign.bn{white-space:nowrap}
.sign.pic{flex-direction:column;gap:.2em;padding:.25em .4em}
.sign.pic .oa{display:block;width:calc(7.6cqw / var(--k))}.sign.pic .oa img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain}
.mole-wrap.golden .sign{background:linear-gradient(180deg,#ffe9a8,#ffd873);color:#8a5a00;border-color:#e0a828}
.mole-wrap.heartmole .sign{background:linear-gradient(180deg,#ffd6e2,#ffc7d6);color:#a83a5e;border-color:#e28aa8}
.mole-wrap.showans .sign{background:linear-gradient(180deg,#d4f7e3,#8be6b9);border-color:#1e9a5f;color:#0f5a38;box-shadow:0 3px 0 #1e9a5f,0 0 14px #5dd39e;animation:moShow .45s ease-in-out infinite alternate}
@keyframes moShow{to{transform:translateX(-50%) scale(1.07)}}
.mole-body{position:relative;width:100%;padding-top:82%;z-index:1}
.mole-head{position:absolute;inset:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 38% 32%,#ad7a52,#8a5c39 88%);box-shadow:inset 0 -8px 10px rgba(0,0,0,.16)}
.mole-wrap.golden .mole-head{background:radial-gradient(circle at 38% 32%,#ffe6a0,#f0a63c 88%)}
.mole-wrap.heartmole .mole-head{background:radial-gradient(circle at 38% 32%,#ffd3de,#e0748f 88%)}
.mole-belly{position:absolute;left:20%;right:20%;bottom:0;height:44%;background:#f6e6cf;border-radius:50% 50% 40% 40%}
.ear{position:absolute;top:-6%;width:20%;padding-top:20%;background:inherit;border-radius:50%}.ear.l{left:6%}.ear.r{right:6%}
.eye{position:absolute;top:34%;width:15%;padding-top:15%;background:#3c2a1a;border-radius:50%}.eye.l{left:24%}.eye.r{right:24%}
.eye:after{content:"";position:absolute;top:14%;left:18%;width:38%;height:38%;background:#fff;border-radius:50%}
.cheek{position:absolute;top:50%;width:15%;padding-top:11%;background:#ff9db3;border-radius:50%;opacity:.75}.cheek.l{left:10%}.cheek.r{right:10%}
.nose{position:absolute;top:47%;left:50%;width:10%;padding-top:8%;background:#5a3a24;border-radius:50%;transform:translateX(-50%)}
.smile{position:absolute;top:57%;left:50%;width:26%;height:14%;border-bottom:3px solid #3c2a1a;border-radius:0 0 50% 50%;transform:translateX(-50%)}
.whisker{position:absolute;top:52%;width:20%;height:2px;background:#3c2a1a;opacity:.55}.whisker.l1{left:-6%}.whisker.l2{left:-8%;top:57%}.whisker.r1{right:-6%}.whisker.r2{right:-8%;top:57%}
.mole-wrap.stat{position:relative;left:auto;bottom:auto;transform:none;opacity:1;width:100%;pointer-events:none;animation:none}
.mole-wrap.king-m .crown{position:absolute;left:50%;top:-34%;width:62%;translate:-50% 0;z-index:3}
.mole-wrap.ouch .eye{transform:scaleY(.2)}.mole-wrap.ouch .smile{height:22%;border:3px solid #3c2a1a;border-radius:50%;top:62%;width:16%}
.king{position:absolute;left:50%;top:1.5%;translate:-50% 0;width:calc(13% / var(--k));z-index:0;display:flex;flex-direction:column;align-items:center;gap:.6cqw}
.king .mk-art{width:100%;display:block;animation:moBob .7s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes moBob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.mk-hp{display:flex;gap:.6cqw}.mk-hp i{width:3cqw;height:1.4cqw;border-radius:1cqw;background:var(--bad)}.mk-hp i.off{background:#c9c2dc}
.king.hurt{animation:shake .45s}
.tagpill{position:absolute;left:2%;top:2%;z-index:8;padding:.5cqw 2cqw;border-radius:99px;background:rgba(255,255,255,.92);font-family:var(--f-head);font-weight:800;font-size:max(11px,1.8cqw);pointer-events:none}
.pause{position:absolute;left:50%;top:2%;translate:-50% 0;z-index:9;padding:.8cqw 2.4cqw;border-radius:99px;background:var(--bad);color:#fff;font-family:var(--f-head);font-weight:800;font-size:clamp(12px,2.2cqw,20px);white-space:nowrap;pointer-events:none;box-shadow:var(--shadow)}
.scene.bossmode .pause{top:26%}
.popfx{position:absolute;z-index:10;translate:-50% -50%;font-family:var(--f-head);font-weight:800;font-size:max(14px,3cqw);white-space:nowrap;pointer-events:none;-webkit-text-stroke:.35cqw #fff;paint-order:stroke fill;animation:floatUp .9s ease-out forwards}
.popfx.hit{color:var(--good)}.popfx.miss{color:var(--bad)}
#hammer{position:fixed;top:0;left:0;width:54px;height:54px;pointer-events:none;z-index:999;transform:translate(-9999px,-9999px) rotate(-18deg);transform-origin:82% 78%;transition:opacity .25s;opacity:0}
#hammer.active{opacity:1}#hammer.swing{animation:hmSwing .22s ease}
@keyframes hmSwing{0%{transform:translate(var(--hx),var(--hy)) rotate(-18deg)}45%{transform:translate(var(--hx),var(--hy)) rotate(28deg) scale(1.05)}100%{transform:translate(var(--hx),var(--hy)) rotate(-18deg)}}
.burst-layer{position:fixed;inset:0;pointer-events:none;z-index:900}
.spark{position:absolute;font-size:18px;will-change:transform,opacity;animation:sparkFly .6s ease-out forwards}
@keyframes sparkFly{0%{transform:translate(0,0) scale(.6) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));opacity:0}}
.panel{padding:14px 16px;display:grid;gap:10px}
.feedback{padding:10px 14px;border-radius:16px;background:#fff;border:3px dashed var(--lilac);line-height:1.45;min-height:64px}
.feedback.ok{border:3px solid var(--good);background:#e3f8ee}.feedback.no{border:3px solid var(--bad);background:#ffe9ee}
.served{margin:0;font-size:13.5px;color:var(--ink-soft)}

/* ---- over ---- */
.over{padding:20px;max-width:680px;margin:0 auto;display:grid;gap:12px;justify-items:center;text-align:center}
.stars{display:flex;gap:6px}.stars svg{width:46px;height:46px}
.big{font-weight:800;font-size:44px;line-height:1}
.wl{width:100%;text-align:left;display:grid;gap:6px}
.wl div{background:#fff;border:3px solid var(--lilac);border-radius:14px;padding:6px 12px;overflow-wrap:anywhere}
.wl b{color:var(--pink-darker)}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:990;padding:8px 18px;border-radius:99px;background:var(--ink);color:#fff;font-family:var(--f-head);font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}

@media (max-width:1000px){.grid{grid-template-columns:1fr}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .scene{--k:.7;width:100%;aspect-ratio:1.244}
  .prompt{padding:8px 12px 10px}.prompt .vis{width:60px;height:60px}
  .sign{font-size:max(10px,calc(2.4cqw / var(--k)))}
  .king{width:16%}
}
@media (prefers-reduced-motion:reduce){.hole-slot *,.king .mk-art,.popfx{animation-duration:.01s!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1 id="gTitle">Đập Chuột</h1><p id="gSub"></p></div>
    <div class="tools">

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const norm = s => String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[.,!?;:]/g, '').replace(/\s+/g, ' ').trim();
const letters = s => String(s).replace(/[^a-z]/gi, '');

const lse = (kind, o) => { try { if (window.parent && window.parent !== window) window.parent.postMessage(Object.assign({lse:1, kind}, o), '*'); } catch (e) {} };

/* ---------- state + lưu ---------- */
const S = {coins:0, muted:false, unlocked:1, unlockAll:false, best:{}, hits:0, types:{}, sel:'all', wrong:[]};
try { Object.assign(S, JSON.parse(localStorage.getItem(CFG.SAVE_KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(S)); } catch (e) {} };
const G = {mode:'menu', lv:1, rounds:0, t0:0, sel:'all', fix:false};
const timers = new Set();
function later(ms, fn){ const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; }
function clearLater(){ timers.forEach(clearTimeout); timers.clear(); }

/* ---------- âm thanh ---------- */
let SND = null;
function initSnd(){ if (SND) return; SND = {}; for (const k in ASSETS.snd) { try { SND[k] = new Audio(ASSETS.snd[k]); } catch (e) {} } }
function sfx(k){ if (S.muted || !SND || !SND[k]) return; try { SND[k].currentTime = 0; const p = SND[k].play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
const CAN_SPEAK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let VOICE = null;
function pickVoice(){ try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
if (CAN_SPEAK) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
function speak(t, rate){ if (!CAN_SPEAK || !t) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = VOICE ? VOICE.lang : 'en-GB'; if (VOICE) u.voice = VOICE; u.rate = rate || .85; speechSynthesis.speak(u); } catch (e) {} }

/* ---------- hình vẽ nhỏ ---------- */
const heartSVG = on => `<svg class="heart-ic" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 35C5 24 3 14 9 9c4-3 9-2 11 3 2-5 7-6 11-3 6 5 4 15-11 26z" fill="${on ? '#EE5C78' : '#E3DDF0'}" stroke="${on ? '#C8435F' : '#C9C2DC'}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
const starSVG = on => `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l5 11.5 12.5 1.2-9.4 8.3 2.8 12.3L20 29.8 9.1 36.3l2.8-12.3-9.4-8.3L15 14.5z" fill="${on ? '#FFC93C' : '#E8E2F2'}" stroke="${on ? '#E0A100' : '#C9C2DC'}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
const SPK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
const MOLE_PARTS = '<div class="ear l"></div><div class="ear r"></div><div class="whisker l1"></div><div class="whisker l2"></div><div class="whisker r1"></div><div class="whisker r2"></div><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="nose"></div><div class="smile"></div><div class="mole-belly"></div>';
const MOLE_CROWN = '<svg class="crown" viewBox="0 0 60 40"><path d="M6 34L2 8l14 12L30 2l14 18L58 8l-4 26z" fill="#FFD36B" stroke="#C99200" stroke-width="3" stroke-linejoin="round"/><circle cx="30" cy="2" r="3.5" fill="#EE5C78"/><circle cx="14" cy="22" r="3" fill="#5DAEEB"/><circle cx="46" cy="22" r="3" fill="#35BE7C"/></svg>';
const moleStat = (king, mood) => `<div class="mole-wrap stat ${king ? 'king-m' : ''} ${mood || ''}"><div class="mole-body"><div class="mole-head">${MOLE_PARTS}</div>${king ? MOLE_CROWN : ''}</div></div>`;

/* ---------- hiệu ứng ---------- */
function burst(x, y, emojis, n){
  const layer = $('burst');
  for (let i = 0; i < n; i++) { const sp = document.createElement('span'); sp.className = 'spark'; sp.textContent = rand(emojis);
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 50;
    sp.style.setProperty('--dx', Math.cos(a) * d + 'px'); sp.style.setProperty('--dy', (Math.sin(a) * d - 20) + 'px'); sp.style.setProperty('--rot', (Math.random() * 140 - 70) + 'deg');
    sp.style.left = x + 'px'; sp.style.top = y + 'px'; layer.appendChild(sp); setTimeout(() => sp.remove(), 650); }
}
function confetti(){ for (let k = 0; k < 8; k++) setTimeout(() => burst(Math.random() * innerWidth, 80 + Math.random() * 240, ['🎉','⭐','✨','🌟','💖'], 8), k * 90); }
function popFx(x, y, text, cls){ const sc = $('scene'); const s = document.createElement('div'); s.className = 'popfx ' + cls; s.textContent = text; s.style.left = x + '%'; s.style.top = y + '%'; sc.appendChild(s); setTimeout(() => s.remove(), 950); }
function shake(el){ el.classList.remove('shakeit'); void el.offsetWidth; el.classList.add('shakeit'); setTimeout(() => el.classList.remove('shakeit'), 450); }
let toastT; function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }
function addCoins(n){ S.coins += n; $('coins').textContent = S.coins; const p = $('coinPill'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }

/* ============================================================
   NGÂN HÀNG CÂU HỎI: sinh câu từ SETS
   ============================================================ */
const setById = id => SETS.find(s => s.id === id);
const audioOK = () => CAN_SPEAK;
const typeEnabled = id => S.types[id] !== false;
const eligibleSets = () => SETS.filter(s => s.items.length && (s.kind === 'grammar' || s.items.length >= 4));
const VOW = 'aeiou', CON = 'bcdfghjklmnprstwy';
const otherLetter = ch => { const pool = VOW.includes(ch.toLowerCase()) ? VOW : CON; const c = pool.split('').filter(x => x !== ch.toLowerCase()); return rand(c); };
function pickOthers(set, it, key, n){ const seen = new Set([norm(it[key])]), out = []; for (const o of shuffle(set.items)) { const v = o[key]; if (v == null || v === '' || seen.has(norm(v))) continue; seen.add(norm(v)); out.push(o); if (out.length >= n) break; } return out; }
function mutatePhrase(en){
  const ws = en.split(' '), idx = ws.map((w, i) => w.length >= 3 ? i : -1).filter(i => i >= 0), wi = rand(idx), w = ws[wi].split('');
  if (Math.random() < .55) { const c = []; for (let i = 0; i < w.length - 1; i++) if (w[i] !== w[i + 1]) c.push(i); if (c.length) { const i = rand(c); [w[i], w[i + 1]] = [w[i + 1], w[i]]; ws[wi] = w.join(''); return ws.join(' '); } }
  const i = Math.floor(Math.random() * w.length); w[i] = otherLetter(w[i]); ws[wi] = w.join(''); return ws.join(' ');
}
function mutants(en, n){ const out = new Set(); for (let t = 0; t < 120 && out.size < n; t++) { const m = mutatePhrase(en); if (m !== en) out.add(m); } let g = 0; while (out.size < n && g++ < 40) { const m = mutatePhrase(mutatePhrase(en)); if (m !== en) out.add(m); } return [...out].slice(0, n); }
function segMutants(seg, n){ const out = new Set(); for (let t = 0; t < 120 && out.size < n; t++) { const m = seg.split('').map(c => Math.random() < .7 || seg.length === 1 ? otherLetter(c) : c).join(''); if (m !== seg) out.add(m); } return [...out]; }
const scrambleWord = w => { if (w.length < 3) return w; let s = w; for (let i = 0; i < 30 && s === w; i++) s = shuffle(w.split('')).join(''); return s; };

function capable(set, it, id){
  if (set.kind === 'grammar') return id === 'gap' || (id === 'gapType' && !it.noType && typeof it.opts[it.ans] === 'string');
  switch (id) {
    case 'def': return !!it.def;
    case 'missing': case 'scramble': return letters(it.en).length >= 3;
    case 'listenPic': return !!it.img && set.items.filter(x => x.img).length >= 4;
    default: return true;
  }
}
function allowedTypes(set, it, lv){
  const all = TYPES[set.kind].filter(t => typeEnabled(t.id) && !lv.skip.includes(t.id) && !(t.audio && !audioOK())).map(t => t.id);
  const ok = all.filter(id => capable(set, it, id));
  return ok.length ? ok : [set.kind === 'grammar' ? 'gap' : 'en2vi'];
}
const bag = {}, hist = {last:null, lastType:null};
function nextIdx(set){ if (!bag[set.id] || !bag[set.id].length) bag[set.id] = shuffle(set.items.map((_, i) => i)); return bag[set.id].pop(); }
function pickSpec(lv){
  const pool = G.sel === 'all' ? eligibleSets() : [setById(G.sel)].filter(Boolean);
  const base = pool.length ? pool : eligibleSets();
  for (let t = 0; t < 30; t++) {
    const set = rand(base), idx = nextIdx(set);
    if (hist.last && hist.last.sid === set.id && hist.last.idx === idx && set.items.length > 1 && t < 25) continue;
    let types = allowedTypes(set, set.items[idx], lv); const nt = types.filter(x => x !== hist.lastType); if (nt.length) types = nt;
    const sp = {sid:set.id, idx, type:rand(types)}; hist.last = sp; hist.lastType = sp.type; return sp;
  }
}
function finalize(q, correct, wrong){ const opts = shuffle([correct].concat(wrong)); q.opts = opts; q.ans = opts.indexOf(correct); return q; }
const vocabWhy = it => `<b>${esc(it.en)}</b> = ${esc(it.vi)}${it.ipa ? ' ' + esc(it.ipa) : ''}${it.ex ? ' · ' + esc(it.ex) : ''}`;

function makeQ(sp){
