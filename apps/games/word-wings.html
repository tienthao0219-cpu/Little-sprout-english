let tipTimer=0;
function tip(txt,ms=3200){ const t=$('#tip'); t.textContent=txt; t.classList.remove('hidden'); clearTimeout(tipTimer); tipTimer=setTimeout(()=>t.classList.add('hidden'),ms); }
function sndLabel(){ $('#bSnd').textContent='🔊 Âm thanh: '+(Snd.on?'Bật':'Tắt'); $('#bSnd2').textContent=Snd.on?'🔊':'🔇'; }
function toggleSound(){ Snd.set(!Snd.on); SAVE.sound=Snd.on; persist(); sndLabel(); if(Snd.on)Snd.play('click'); }

/* ---------- HUD ---------- */
function renderHUD(){
  S.hudDirty=false;
  $('#lvlname').textContent=`Màn ${S.level+1} · ${LEVELS[S.level].name}`;
  $('#score').innerHTML=S.players.map((p,i)=>`<div class="pchip ${i===S.cur&&S.players.length>1?'on':''} ${S.players.length>3?'many':''}"><div class="nm"><span>${esc(p.name)}</span><span class="ac">${p.streak>=2?'🔥'+p.streak+' ':''}✔${p.correct}/${p.total}</span></div><div class="sc">${p.score.toLocaleString('vi-VN')}</div><div class="bi">${p.birds.map(t=>`<i class="bd" style="background:linear-gradient(135deg,${BIRDS[t].c1},${BIRDS[t].c2})"></i>`).join('')}${S.loaded&&i===S.cur?`<i class="bd" style="background:#fff;outline:2px solid #ffe27a"></i>`:''}</div></div>`).join('');
}

/* ---------- Bắt đầu màn ---------- */
let Q=null;
function newPlayer(name,bot){ return {name,bot,score:0,birds:[...LEVELS[S.level].birds],correct:0,total:0,streak:0,mistakes:[]}; }
function startLevel(idx){
  Snd.unlock(); S.cfg=CFG; S.level=idx; buildWorld(idx,CFG.diff);
  const hn=Array.from({length:CFG.humans},(_,i)=>(CFG.names[i]||'').trim()||(CFG.humans===1?'Bạn':`Bạn ${i+1}`));
  const bn=Array.from({length:CFG.bots},(_,i)=>CFG.bots===1?'Bot 🤖':`Bot ${i+1} 🤖`);
  S.players=hn.map(n=>newPlayer(n,false)).concat(bn.map(n=>newPlayer(n,true)));
  S.cur=0; S.loaded=null; S.aim=null; S.drag=null; S.botPlan=null; S.ending=false; Q=null;
  S.phase='intro'; S.introT=0; S.cam.mode='intro'; S.cam.x=0; S.paused=false;
  hideScreens(); closeModal(); banner(); $('#hud').classList.remove('hidden'); $('#qwrap').classList.add('hidden');
  Quiz.recent=[]; Quiz.recentG=[]; S.hudDirty=true;
  tip(`${THEMES[LEVELS[idx].theme].name} — ${S.world.pigs.length} Slime đang chờ bạn!`,3000);
  checkRotate();
}

/* ---------- Lượt chơi ---------- */
function after(sec,fn){ S.timers.push({t:sec,fn}); }
function nextTurn(){
  if(S.world.pigs.every(p=>p.dead))return finish(true);
  // chọn người chơi kế tiếp còn chim
  const n=S.players.length; let found=-1;
  for(let k=0;k<n;k++){ const i=(S.cur+k)%n; if(S.players[i].birds.length){ found=i; break; } }
  if(found<0)return finish(false);
  S.cur=found; S.hudDirty=true; S.phase='question'; S.cam.mode='sling'; S.loaded=null; S.aim=null;
  const pl=S.players[S.cur];
  if(pl.bot)botQuestion();
  else if(S.players.filter(p=>!p.bot).length>1)readyCard(pl);
  else askQuestion();
}
function endTurn(){
  S.phase='between'; S.cam.mode='sling'; S.hudDirty=true;
  if(S.world.pigs.every(p=>p.dead))return finish(true);
  if(S.players.length>1){ S.cur=(S.cur+1)%S.players.length; }
  after(.8,nextTurn);
}
function readyCard(pl){
  const c=$('#qcard'); $('#qwrap').classList.remove('hidden');
  c.innerHTML=`<div style="text-align:center;padding:10px"><div style="font-size:46px">🎮</div><h2 style="margin:4px 0">Lượt của ${esc(pl.name)}</h2><p style="font-weight:700;color:var(--ink2);margin:0 0 12px">Đưa thiết bị cho ${esc(pl.name)} nhé! Còn ${pl.birds.length} chim.</p><button class="btn teal" id="bReady">Sẵn sàng!</button></div>`;
  $('#bReady').onclick=()=>{ Snd.play('click'); askQuestion(); };
}

/* ---------- Câu hỏi ---------- */
const HM=[1,.75,.5,.25];
function askQuestion(){
  const q=makeQuestion(CFG), pl=S.players[S.cur];
  const lim=DIFF[CFG.diff].time?Math.round(DIFF[CFG.diff].time*q.timeK):0;
  Q={q,hints:0,t0:S.clock,limit:lim,done:false,ans:[],pool:q.tokens?q.tokens.map((t,i)=>({t,i,used:false})):null};
  $('#qwrap').classList.remove('hidden');
  const c=$('#qcard');
  let body='';
  if(q.ui==='mcq') body=`<div class="choices ${q.picGrid?'pics':''}" id="chs">${q.choices.map((ch,i)=>`<button class="choice" data-i="${i}">${ch.html}</button>`).join('')}</div>`;
  else if(q.ui==='type') body=`<div class="typebox"><input id="tin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Gõ đáp án…" enterkeyhint="done"></div>`;
  else body=`<div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>`;
  c.innerHTML=`<div class="qhead"><span class="qtag">${q.tag}</span>${S.players.length>1?`<span class="who">${esc(pl.name)}</span>`:''}</div>
    ${lim?'<div class="timer"><i id="tbar"></i></div>':''}
    <div class="qtitle">${q.title}</div><div class="qprompt">${q.prompt}</div><div class="hintbox" id="hbox"></div>${body}
    <div class="qfoot" id="qfoot"><button class="btn sm" id="bHint">💡 Gợi ý <b id="hc">0</b>/3</button>${q.ui==='mcq'?'<span></span>':`<span style="display:flex;gap:8px">${q.tokens?'<button class="btn sm coral" id="bClr" style="box-shadow:0 4px 0 var(--coral-d)">↺ Xóa</button>':''}<button class="btn teal" id="bGo">Trả lời ✔</button></span>`}</div>`;
  c.scrollTop=0;
  if(q.ui==='mcq'){ $('#chs').onclick=e=>{ const b=e.target.closest('.choice'); if(!b||Q.done)return; Q.sel=b; submit(q.choices[+b.dataset.i].text,q.choices[+b.dataset.i],false); }; }
  else if(q.ui==='type'){ const inp=$('#tin'); inp.onkeydown=e=>{ if(e.key==='Enter')$('#bGo').click(); }; inp.onfocus=()=>$('#qwrap').classList.add('top'); inp.onblur=()=>setTimeout(()=>$('#qwrap').classList.remove('top'),150); $('#bGo').onclick=()=>submit(inp.value,null,false); if(!('ontouchstart' in window))setTimeout(()=>inp.focus(),60); }
  else { drawTiles(); $('#bGo').onclick=()=>submit(curAns(),null,false); $('#bClr').onclick=()=>{ Q.pool.forEach(p=>p.used=false); Q.ans=[]; drawTiles(); Snd.play('click'); };
    $('#tiles').onclick=e=>{ const b=e.target.closest('.tile'); if(!b||Q.done)return; const i=+b.dataset.i; if(Q.pool[i].used)return; Q.pool[i].used=true; Q.ans.push(i); Snd.play('click'); drawTiles(); };
    $('#slots').onclick=e=>{ const b=e.target.closest('.tile'); if(!b||Q.done)return; const k=+b.dataset.k; const i=Q.ans[k]; Q.pool[i].used=false; Q.ans.splice(k,1); drawTiles(); }; }
  $('#bHint').onclick=()=>{ if(Q.done||Q.hints>=3)return; Q.hints++; Snd.play('click'); $('#hc').textContent=Q.hints; const lv=['','chữ cái đầu','đầu + giữa','đầu + giữa + cuối'][Q.hints]; $('#hbox').innerHTML=`${hintPattern(q.hintBase,Q.hints)}<small>Gợi ý ${Q.hints}: ${lv} (điểm ×${HM[Q.hints]})</small>`; if(Q.hints>=3)$('#bHint').disabled=true; };
  c.onclick=e=>{ const b=e.target.closest('.spk'); if(b){ speak(b.dataset.say); } };
  if(q.speak)setTimeout(()=>speak(q.speak),350);
}
function curAns(){ return Q.ans.map(i=>Q.pool[i].t).join(Q.q.ui==='order'?' ':''); }
function drawTiles(){
  $('#slots').innerHTML=Q.ans.map((i,k)=>`<button class="tile" data-k="${k}">${esc(Q.pool[i].t)}</button>`).join('')||'<span style="color:#9aa3c4;font-weight:800;align-self:center">Chạm các ô bên dưới để xếp…</span>';
  $('#tiles').innerHTML=Q.pool.map((p,i)=>`<button class="tile ${p.used?'used':''}" data-i="${i}">${esc(p.t)}</button>`).join('');
}
function submit(userVal,choice,timeout){
  if(!Q||Q.done)return; Q.done=true; const q=Q.q, pl=S.players[S.cur];
  const ok=!timeout&&!!q.check(userVal,choice);
  pl.total++; let pts=0,quality;
  const remain=Q.limit?Math.max(0,1-(S.clock-Q.t0)/Q.limit):0;
  if(ok){ pl.correct++; pl.streak++; pts=Math.round((100+Math.round(40*remain))*HM[Q.hints]+Math.min(pl.streak-1,5)*10); pl.score+=pts; quality=Q.hints===0?'super':'good'; Snd.play('good'); }
  else { pl.streak=0; quality='weak'; Snd.play('bad'); }
  S.hudDirty=true;
  // đánh dấu giao diện
  if(q.ui==='mcq'){ const bs=[...document.querySelectorAll('.choice')]; q.choices.forEach((c,i)=>{ if(c.ok)bs[i].classList.add('ok'); else if(choice===c)bs[i].classList.add('bad'); }); }
  const inp=$('#tin'); if(inp)inp.disabled=true;
  document.querySelectorAll('.tile').forEach(t=>t.style.pointerEvents='none');
  let why='';
  if(!ok){ why=timeout?`⏰ Hết giờ! Đáp án đúng: ${q.answer}.<br>${q.type.startsWith('g_')?esc(q.g.exp):`${q.w.ex?`<i>${esc(q.w.ex)}</i>`:''}`}`:q.explainWrong(userVal,choice);
    pl.mistakes.push({tag:q.tag,html:why,ans:q.answer}); }
  const pw=quality==='super'?'⚡ Chim SIÊU MẠNH (×1.3 sức công phá)!':quality==='good'?'🐦 Chim bình thường (đã dùng gợi ý).':'🩹 Chim bị yếu (×0.6 sức công phá). Đọc kỹ giải thích để lần sau trả lời đúng nhé!';
  const fb=document.createElement('div'); fb.className='fb '+(ok?'ok':'bad');
  fb.innerHTML=ok?`<h4>🎉 Chính xác! <span style="color:var(--ok)">+${pts} điểm${pl.streak>1?` · 🔥 chuỗi ${pl.streak}`:''}</span></h4>${q.type.startsWith('g_')||q.ui!=='mcq'||true?q.okNote:''}<div class="pw">${pw}</div>`
    :`<h4>${timeout?'⏰ Hết giờ':'❌ Chưa đúng'} — cùng xem tại sao nhé</h4><div class="why">${why}</div>${q.type.startsWith('g_')||q.ui==='mcq'?'':''}<div class="pw">${pw}</div>`;
  $('#qcard').insertBefore(fb,$('#qfoot'));
  $('#qfoot').innerHTML=`<span></span><button class="btn teal" id="bShoot">Nạp chim & ngắm bắn 🎯</button>`;
  $('#hbox').innerHTML='';
  $('#bShoot').onclick=()=>{ Snd.play('click'); $('#qwrap').classList.add('hidden'); $('#qwrap').classList.remove('top'); loadBird(quality); };
  $('#qcard').scrollTop=$('#qcard').scrollHeight;
  Q.done=true;
}

/* ---------- Bot ---------- */
function botQuestion(){
  const q=makeQuestion(CFG), pl=S.players[S.cur]; banner(`🤖 <b>${esc(pl.name)}</b> đang suy nghĩ…`);
  const ok=Math.random()<DIFF[CFG.diff].botAcc;
  after(rr(1.3,2.4),()=>{
    pl.total++; if(ok){ pl.correct++; pl.streak++; pl.score+=100; Snd.play('good'); } else { pl.streak=0; Snd.play('bad'); }
    S.hudDirty=true;
    const ans=q.type.startsWith('g_')?q.answer:`<b>${q.w.w}</b> = ${esc(q.w.vi)} ${q.w.e}`;
    banner(`🤖 ${esc(pl.name)} trả lời ${ok?'<b style="color:#7dffb0">ĐÚNG ✔</b>':'<b style="color:#ff9aa5">SAI ✖</b>'}<br><span style="font-size:.8em;font-weight:700">Đáp án: ${ans}</span>`);
    after(2.0,()=>{ banner(); loadBird(ok?(Math.random()<.5?'super':'good'):'weak'); botShoot(); });
  });
}
function botShoot(){
  const p=botPlan(CFG.diff); S.botPlan={a:p.a,pull:p.pull,tx:p.tx,t:0,dur:1.1,released:false};
}

/* ---------- Nạp chim / bắn ---------- */
function loadBird(quality){
  const pl=S.players[S.cur]; if(!pl.birds.length)return endTurn();
  const type=pl.birds.shift(); S.loaded={type,q:quality,t0:S.clock}; S.aim=null; S.phase='aim'; S.cam.mode='sling'; S.hudDirty=true;
  Snd.play('star');
  if(!pl.bot){ tip(quality==='weak'?'Kéo chim ra sau rồi thả để bắn (chim đang yếu)':`Kéo chim ra sau & thả. ${BIRDS[type].skill}`,4200); }
}
function releaseShot(){
  const pos=S.aim; if(!S.loaded||!pos)return;
  const dx=SLING.x-pos.x,dy=SLING.y-pos.y,k=VMAX/MAXPULL, q=S.loaded.q, power=q==='super'?1.3:q==='weak'?.6:1;
  launchBird(S.loaded.type,pos.x,pos.y,dx*k,dy*k,power);
  S.lastType=S.loaded.type; S.loaded=null; S.aim=null; S.drag=null; S.phase='fly'; S.turnT=0; S.calmT=0; S.cam.mode='follow'; S.hudDirty=true;
  if(!S.players[S.cur].bot&&S.lastType!=='red')tip('Chạm màn hình để dùng kỹ năng! '+BIRDS[S.lastType].skill,3000);
}

/* ---------- Kết thúc màn ---------- */
function finish(win){
  if(S.phase==='over')return; S.phase='over'; S.cam.mode='free'; banner();
  const solo=S.players.length===1, pl0=S.players[0];
  if(win){ S.players.forEach(p=>{}); }
  const left=S.players.map(p=>p.birds.length);
  let html='';
  if(solo){
    const acc=pl0.total?pl0.correct/pl0.total:0;
    if(win){ pl0.score+=left[0]*10000; if(left[0])floatText(SLING.x+200,300,`Chim còn lại +${left[0]*10000}`,'#fff'); }
    const stars=win?1+(left[0]>=1?1:0)+(acc>=.8?1:0):0;
    if(win){ SAVE.stars[S.level]=Math.max(SAVE.stars[S.level]||0,stars); SAVE.best[S.level]=Math.max(SAVE.best[S.level]||0,pl0.score); persist(); }
    after(1.4,()=>{ Snd.play(win?'win':'lose'); resultModal(html=soloHTML(win,stars,acc,left[0])); });
  } else {
    const ranked=[...S.players].sort((a,b)=>b.score-a.score), winners=ranked.filter(p=>p.score===ranked[0].score);
    after(1.4,()=>{ Snd.play(winners.some(p=>!p.bot)?'win':'lose'); resultModal(versusHTML(ranked,winners)); });
  }
}
function misHTML(pl,open){
  if(!pl.mistakes.length)return '<div style="margin-top:8px;font-weight:800;color:var(--ok)">🌟 Không có câu nào sai — tuyệt vời!</div>';
  return `<details class="mis" ${(open===undefined?pl.mistakes.length<=3:open)?'open':''}><summary>📝 Ôn lại ${pl.mistakes.length} câu sai</summary>${pl.mistakes.map(m=>`<div class="m"><span class="qtag">${m.tag}</span><br>${m.html}</div>`).join('')}</details>`;
}
function soloHTML(win,stars,acc,left){
  const p=S.players[0];
  return `<div style="font-size:56px">${win?'🏆':'😵'}</div><h2>${win?'Chiến thắng!':'Chưa thành công'}</h2>
  ${win?`<div class="stars">${[1,2,3].map(n=>`<i class="${n<=stars?'f':''}" style="animation-delay:${n*.25}s">⭐</i>`).join('')}</div>`:'<p style="font-weight:700;color:var(--ink2)">Hết chim rồi, vẫn còn Slime. Thử lại nhé!</p>'}
  <div class="stats"><div class="stat"><b>${p.score.toLocaleString('vi-VN')}</b><span>Điểm</span></div><div class="stat"><b>${p.correct}/${p.total}</b><span>Câu đúng (${Math.round(acc*100)}%)</span></div><div class="stat"><b>${left}</b><span>Chim còn lại</span></div></div>
  ${win?`<div style="font-size:13px;color:var(--ink2);font-weight:700">⭐ Phá hết Slime · ⭐⭐ còn thừa chim · ⭐⭐⭐ đúng từ 80% câu hỏi</div>`:''}
  ${misHTML(p)}
  <div class="btns"><button class="btn sun" data-a="retry">↻ Chơi lại</button>${win&&S.level<LEVELS.length-1?'<button class="btn teal" data-a="next">Màn tiếp ▶</button>':''}<button class="btn" data-a="levels">Chọn màn</button><button class="btn ghost" style="background:#e9ecfa;color:var(--ink);box-shadow:0 5px 0 #c9cfe6" data-a="menu">Menu</button></div>`;
}
function versusHTML(ranked,winners){
  const tie=winners.length>1, medals=['🥇','🥈','🥉'];
  const title=tie?`🤝 Hoà nhau: ${winners.map(p=>esc(p.name)).join(', ')}`:`🏆 ${esc(winners[0].name)} thắng!`;
  const humans=S.players.filter(p=>!p.bot);
  return `<div style="font-size:56px">${tie?'🤝':'🏆'}</div><h2>${title}</h2>
  ${ranked.map((p,i)=>`<div class="rk ${winners.includes(p)?'w':''}"><span class="md">${winners.includes(p)?'🥇':(medals[i]||'🎖')}</span><span>${esc(p.name)}<small>Đúng ${p.correct}/${p.total} câu</small></span><b class="sc2">${p.score.toLocaleString('vi-VN')}</b></div>`).join('')}
  ${humans.map(p=>`<div style="text-align:left;font-weight:900;margin-top:8px">${esc(p.name)}</div>${misHTML(p,humans.length===1)}`).join('')}
  <div class="btns"><button class="btn sun" data-a="retry">↻ Đấu lại</button><button class="btn" data-a="levels">Chọn màn</button><button class="btn ghost" style="background:#e9ecfa;color:var(--ink);box-shadow:0 5px 0 #c9cfe6" data-a="menu">Menu</button></div>`;
}
function resultModal(html){ modal(html); $('#qwrap').classList.add('hidden'); }
$('#mbox').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b)return; Snd.play('click'); const a=b.dataset.a;
  if(a==='resume')togglePause(false);
  else if(a==='retry')startLevel(S.level);
  else if(a==='next')startLevel(S.level+1);
  else if(a==='levels')toLevels();
  else if(a==='menu')toMenu();
  else if(a==='snd'){ toggleSound(); b.textContent='🔊 Âm thanh: '+(Snd.on?'Bật':'Tắt'); }
  else if(a==='close')closeModal();
});
function leaveGame(){ S.world=null; S.phase='menu'; S.paused=false; S.birds=[]; Q=null; S.loaded=null; closeModal(); banner(); $('#hud').classList.add('hidden'); $('#qwrap').classList.add('hidden'); $('#tip').classList.add('hidden'); $('#rotate').classList.add('hidden'); S.timers=[]; }
function toMenu(){ leaveGame(); show('sMenu'); }
function toLevels(){ leaveGame(); buildLevels(); show('sLevels'); }

/* ---------- Pause ---------- */
function togglePause(v){
  if(!S.world||S.phase==='over')return;
  S.paused=v;
  if(v){ modal(`<div style="font-size:44px">⏸</div><h2>Tạm dừng</h2><p style="font-weight:700;color:var(--ink2);margin:0">Thời gian và trận đấu đã dừng lại.</p><div class="btns" style="flex-direction:column;align-items:stretch"><button class="btn teal" data-a="resume">▶ Tiếp tục</button><button class="btn sun" data-a="retry">↻ Chơi lại màn này</button><button class="btn" data-a="levels">🗺 Chọn màn</button><button class="btn ghost" style="background:#e9ecfa;color:var(--ink);box-shadow:0 5px 0 #c9cfe6" data-a="snd">🔊 Âm thanh: ${Snd.on?'Bật':'Tắt'}</button><button class="btn coral" data-a="menu">🏠 Về menu</button></div>`); }
  else closeModal();
}

/* ---------- How to ---------- */
function howTo(){
  modal(`<h2>📖 Cách chơi</h2><ol class="howto">
  <li><b>Trả lời để nạp chim.</b> Mỗi lượt bạn nhận 1 câu hỏi từ vựng hoặc ngữ pháp. Trả lời đúng mà không dùng gợi ý → <b>chim siêu mạnh ×1.3</b>. Dùng gợi ý → chim bình thường. Sai hoặc hết giờ → chim yếu ×0.6 và bạn được xem <b>giải thích vì sao sai</b>.</li>
  <li><b>Kéo chim ra sau rồi thả</b> để bắn. Phá hết Slime xanh để thắng. Kéo vào khoảng trống để <b>cuộn màn hình sang phải</b> xem các công trình ở xa (có mini-map phía trên).</li>
  <li><b>Chạm màn hình khi chim đang bay</b> để dùng kỹ năng: 🔵 Mây tách 3 chim · 🟡 Nắng tăng tốc · ⚫ Bom phát nổ. Hãy phá TNT để nổ dây chuyền!</li>
  <li><b>💡 Gợi ý 3 mức:</b> (1) chữ cái đầu · (2) đầu + giữa · (3) đầu + giữa + cuối. Mỗi mức trừ bớt điểm.</li>
  <li><b>Chế độ:</b> Chơi đơn (16 màn, 4 thế giới); đấu 1–1; nhiều bạn thay phiên trên cùng thiết bị (tối đa 6); hoặc đấu với một hay nhiều Bot. Bạn tự chọn số người chơi và số Bot ở màn thiết lập. Mọi người cùng bắn một công trình, ai điểm cao nhất thắng.</li>
  <li><b>Ảnh minh hoạ:</b> nếu bạn đặt ảnh <code>assets/vocab_1.png … vocab_6.png</code> (mỗi ảnh 9 hình) cạnh file game, các câu “nghe chọn hình” sẽ dùng ảnh đó; nếu chưa có, game dùng emoji.</li></ol>
  <div class="btns"><button class="btn teal" data-a="close">Đã hiểu!</button></div>`);
}

/* ---------- Xoay ngang ---------- */
let rotDismissed=false;
function checkRotate(){ const portrait=innerHeight>innerWidth&&innerWidth<820; $('#rotate').classList.toggle('hidden',!(portrait&&S.world&&!rotDismissed)); }

/* =========================================================
   VÒNG LẶP CHÍNH
   ========================================================= */
let lastT=performance.now(), hudT=0;
function updateCamera(dt){
  if(!S.world)return;
  const vw=S.view.vw, maxX=Math.max(0,S.world.width-vw);
  let tx=S.cam.x;
  if(S.cam.mode==='intro'){
    S.introT+=dt; const t=S.introT, a=2.6, hold=.5, b=1.6;
    const e=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    const far=maxX, home=clamp(SLING.x-vw*.2,0,maxX);
    if(t<a)S.cam.x=home+(far-home)*e(t/a); else if(t<a+hold)S.cam.x=far; else if(t<a+hold+b)S.cam.x=far+(home-far)*e((t-a-hold)/b); else { S.cam.mode='sling'; S.cam.x=home; nextTurn(); }
    return;
  }
  if(S.cam.mode==='sling')tx=clamp(SLING.x-vw*.2,0,maxX);
  else if(S.cam.mode==='follow'){ const b=[...S.birds].reverse().find(b=>b.alive); if(b)tx=clamp(b.x-vw*.33,0,maxX); }
  else tx=clamp(S.cam.x,0,maxX);
  S.cam.x+=(tx-S.cam.x)*(1-Math.exp(-(S.cam.mode==='follow'?6:4)*dt));
}
function update(dtReal){
  S.clock+=S.paused?0:dtReal; // đồng hồ trò chơi dừng khi pause
  if(!S.world||S.paused)return;
  let dt=Math.min(dtReal,1/20);
  if(S.slow>0){ S.slow-=dtReal; dt*=.3; }
  if(S.flash>0)S.flash=Math.max(0,S.flash-dtReal*.8);
  S.shake*=Math.pow(.02,dtReal);
  runTimers(dt);
  if(!S.world)return;
  physicsStep(dt);
  updateCamera(dtReal);
  // bot kéo ná
  const bp=S.botPlan;
  if(bp&&S.loaded&&S.phase==='aim'){
    bp.t+=dt; const u=Math.min(1,bp.t/bp.dur), e=1-Math.pow(1-u,3), th=bp.a*Math.PI/180, pull=bp.pull*e;
    S.aim={x:SLING.x-Math.cos(th)*pull,y:SLING.y+Math.sin(th)*pull};
    if(bp.t>bp.dur+.4){ S.botPlan=null; const type=S.loaded.type; S.botAb={type,x:bp.tx-(type==='yellow'?280:type==='blue'?340:100)}; releaseShot(); }
  }
  if(S.phase==='fly'){
    S.turnT+=dt;
    if(S.botAb){ const b=activeBird(); if(b&&!b.used&&b.x>=S.botAb.x&&b.t>.3){ useAbility(); S.botAb=null; } }
    const any=S.birds.some(b=>b.alive);
    if(S.world.pigs.every(p=>p.dead)&&!S.ending){ S.ending=true; after(1.7,()=>finish(true)); }
    if(!S.ending){
      if(!any&&calm())S.calmT+=dt; else S.calmT=0;
      if(S.calmT>.9||S.turnT>16){ S.birds=[]; S.botAb=null; endTurn(); }
    }
  }
  // thời gian câu hỏi
  if(Q&&!Q.done&&Q.limit){
    const r=1-(S.clock-Q.t0)/Q.limit; const bar=$('#tbar'); if(bar)bar.style.transform=`scaleX(${Math.max(0,r)})`;
    if(r<=0){ const inp=$('#tin'); submit(inp?inp.value:(Q.ans?curAnsSafe():''),null,true); }
  }
  if(S.hudDirty){ hudT+=dtReal; if(hudT>.08){ hudT=0; renderHUD(); } }
}
function curAnsSafe(){ try{return curAns();}catch(e){return '';} }
function frame(now){
  const dt=Math.max(0,Math.min(.1,(now-lastT)/1000)); lastT=now;   /* không cho dt âm ở khung hình đầu (gây lỗi nền khi trang nạp chậm) */
  if(!S.world)S.clock+=dt; else update(dt);
  render();
  requestAnimationFrame(frame);
}

/* =========================================================
   ĐIỀU KHIỂN (chuột / cảm ứng)
   ========================================================= */
let pan=null;
const toWorld=e=>({x:e.clientX/S.view.s+S.cam.x,y:WH-(S.view.h-e.clientY)/S.view.s});
cv.addEventListener('pointerdown',e=>{
  Snd.unlock(); if(S.paused||!S.world)return;
  const p=toWorld(e);
  if(S.phase==='aim'&&S.loaded&&!S.players[S.cur].bot&&Math.hypot(p.x-SLING.x,p.y-SLING.y)<170){
    S.drag={id:e.pointerId}; cv.setPointerCapture(e.pointerId); moveAim(p); e.preventDefault(); return;
  }
  if(S.phase==='fly'){ if(useAbility())Snd.play('click'); return; }
  if(S.phase!=='over'&&S.phase!=='intro'){ pan={id:e.pointerId,x0:e.clientX,cam0:S.cam.x}; cv.setPointerCapture(e.pointerId); }
  else if(S.phase==='intro'){ S.introT=99; }
});
function moveAim(p){
  let dx=p.x-SLING.x,dy=p.y-SLING.y; const d=Math.hypot(dx,dy); if(d>MAXPULL){ dx*=MAXPULL/d; dy*=MAXPULL/d; }
  let x=SLING.x+Math.min(dx,-4), y=SLING.y+dy; if(y>GROUND-22)y=GROUND-22;
  S.aim={x,y};
}
cv.addEventListener('pointermove',e=>{
  if(S.paused||!S.world)return;
  if(S.drag){ moveAim(toWorld(e)); }
  else if(pan&&pan.id===e.pointerId){ S.cam.mode='free'; S.cam.x=pan.cam0-(e.clientX-pan.x0)/S.view.s; const mx=Math.max(0,S.world.width-S.view.vw); S.cam.x=clamp(S.cam.x,0,mx); }
});
function endPtr(e){
  if(S.drag){ const pos=S.aim; S.drag=null; if(pos&&Math.hypot(SLING.x-pos.x,SLING.y-pos.y)>32)releaseShot(); else S.aim=null; }
  if(pan){ pan=null; if(S.phase==='aim'||S.phase==='question'){ /* giữ nguyên góc nhìn người chơi chọn */ } }
}
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* nút */
$('#bPlay').onclick=()=>{ Snd.unlock(); Snd.play('click'); buildSetup(); show('sSetup'); };
$('#bHow').onclick=()=>{ Snd.play('click'); howTo(); };
$('#bSnd').onclick=toggleSound; $('#bSnd2').onclick=toggleSound;
$('#bBack1').onclick=()=>{ Snd.play('click'); show('sMenu'); };
$('#bNext1').onclick=()=>{ Snd.play('click'); if(!CFG.types.size)CFG.types=new Set(DIFF[CFG.diff].types); buildLevels(); show('sLevels'); };
$('#bBack2').onclick=()=>{ Snd.play('click'); show('sSetup'); };
$('#bPause').onclick=()=>{ Snd.play('click'); togglePause(true); };
$('#bRotOk').onclick=()=>{ rotDismissed=true; checkRotate(); };
addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.world&&S.phase!=='over')togglePause(!S.paused); });
document.addEventListener('visibilitychange',()=>{ if(!window.WW_NOPAUSE&&document.hidden&&S.world&&!S.paused&&S.phase!=='over')togglePause(true); });
addEventListener('resize',()=>{ resize(); checkRotate(); }); addEventListener('orientationchange',()=>setTimeout(()=>{resize();checkRotate();},250));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

resize(); sndLabel(); if(!HUB) preloadSheets();
requestAnimationFrame(frame);
/* Công cụ kiểm thử cân bằng: mô phỏng nhanh một màn với bot (không dùng khi chơi) */
function simLevel(idx,diff,q='super'){
  CFG.diff=diff; S.cfg=CFG; S.level=idx; buildWorld(idx,diff); S.players=[newPlayer('t',false)]; S.cur=0; S.birds=[]; S.timers=[];
  const pl=S.players[0], res={total:S.world.pigs.length,kills:[],t:[]};
  while(pl.birds.length&&S.world.pigs.some(p=>!p.dead)){
    const type=pl.birds.shift(); S.loaded={type,q,t0:0};
    const p=botPlan(diff), th=p.a*Math.PI/180; S.aim={x:SLING.x-Math.cos(th)*p.pull,y:SLING.y+Math.sin(th)*p.pull};
    S.botAb={type,x:p.tx-(type==='yellow'?280:type==='blue'?340:100)}; releaseShot();
    let t=0,c=0; const dt=1/60;
    while(t<16){ runTimers(dt); physicsStep(dt); t+=dt;
      if(S.botAb){ const b=activeBird(); if(b&&!b.used&&b.x>=S.botAb.x&&b.t>.3){ useAbility(); S.botAb=null; } }
      if(!S.birds.some(b=>b.alive)&&calm())c+=dt; else c=0; if(c>.9)break; }
    S.birds=[]; res.kills.push(S.world.pigs.filter(p=>p.dead).length); res.t.push(+t.toFixed(1));
  }
  res.win=S.world.pigs.every(p=>p.dead); res.left=pl.birds.length; res.blocksLeft=S.world.blocks.filter(b=>!b.dead).length; res.score=pl.score;
  return res;
}
window.WW={buildMode,simLevel,S,CFG,startLevel,nextTurn,askQuestion,makeQuestion,LEVELS,VOCAB,GRAMMAR,Q:()=>Q,loadBird,releaseShot,botPlan,endTurn,finish,SAVE,submit,preloadSheets};

})();
</script>
