<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ra Khơi Đánh Cá</title>
<script src="../../js/gameset.js"></script>
<script src="../../js/audiounlock.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --blue:#e3f2fd; --blue-2:#bfe0fb; --blue-d:#4f9fe0;
  --mint:#e0f2f1; --mint-2:#b5e3dd; --mint-d:#2fa595;
  --yellow:#fff9c4; --yellow-2:#ffef91; --yellow-d:#d99a00;
  --pink:#ffe3ee; --pink-2:#ffbad3; --pink-d:#e2578c;
  --lav:#ece6ff;
  --ink:#38445f; --ink-soft:#66759a;
  --good:#2fb673; --good-bg:#d8f6e5; --bad:#ec5566; --bad-bg:#ffe0e4;
  --card:rgba(255,255,255,.78);
  --shadow:0 10px 28px rgba(96,132,190,.18);
  --f-head:"Baloo 2","Quicksand","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Quicksand","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:var(--f-body);font-weight:600;color:var(--ink);background:var(--blue);line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,249,196,.95) 0,transparent 42%),
    radial-gradient(circle at 92% 14%,rgba(255,227,238,.85) 0,transparent 40%),
    radial-gradient(circle at 80% 90%,rgba(224,242,241,.95) 0,transparent 46%),
    linear-gradient(160deg,#e3f2fd 0%,#e8f6f4 55%,#fff9d8 100%)}
button{font-family:inherit;font-weight:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.2}
.wrap{max-width:980px;margin:0 auto;padding:10px 14px 118px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 2px 10px}
.brand{cursor:pointer;min-width:0}
.brand .title{font-family:var(--f-head);font-weight:800;font-size:clamp(22px,5.4vw,34px);line-height:1.05;
  background:linear-gradient(90deg,var(--blue-d),var(--pink-d) 70%,var(--yellow-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{font-size:13px;color:var(--ink-soft);font-weight:700}
.tools{display:flex;align-items:center;gap:8px}
.teacher-chip{display:flex;align-items:center;gap:8px;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:999px;padding:4px 14px 4px 4px;box-shadow:var(--shadow);border:2px solid #fff}
.teacher-chip img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 14%;background:var(--pink);border:2px solid var(--pink-2)}
.teacher-chip b{display:block;font-family:var(--f-head);font-size:15px;line-height:1.1}
.teacher-chip small{display:block;font-size:11px;color:var(--ink-soft);line-height:1.1}
.mute{width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:var(--card);box-shadow:var(--shadow);font-size:18px}

/* cards */
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.9);
  border-radius:22px;box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:14px}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.h-sec{font-size:24px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.h-sec img{width:54px;animation:float 3.4s ease-in-out infinite}
.lead{color:var(--ink-soft);margin:2px 0 12px;font-size:14.5px}

/* buttons */
.btn{border:0;border-radius:999px;padding:11px 22px;font-family:var(--f-head);font-weight:700;font-size:17px;
  background:linear-gradient(180deg,#8fc9f5,var(--blue-d));color:#fff;box-shadow:0 5px 0 #3b82bd,0 10px 18px rgba(79,159,224,.28);transition:transform .08s}
.btn:active{transform:scale(.96) translateY(2px)}
.btn.pink{background:linear-gradient(180deg,#ff9bc0,var(--pink-d));box-shadow:0 5px 0 #b93c6d,0 10px 18px rgba(226,87,140,.25)}
.btn.mint{background:linear-gradient(180deg,#79d8c9,var(--mint-d));box-shadow:0 5px 0 #1f7d70,0 10px 18px rgba(47,165,149,.25)}
.btn.sun{background:linear-gradient(180deg,#ffe36a,#f4b400);color:#5a4300;box-shadow:0 5px 0 #b98700,0 10px 18px rgba(244,180,0,.25)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d3dcef,0 8px 14px rgba(96,132,190,.14);border:2px solid #e6edfa}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.sm{font-size:14px;padding:7px 14px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 12px;font-family:var(--f-head);font-weight:700;font-size:15px;box-shadow:0 3px 8px rgba(96,132,190,.15)}
.chip.blue{background:var(--blue-2)} .chip.yel{background:var(--yellow-2)} .chip.pink{background:var(--pink-2)} .chip.mint{background:var(--mint-2)}
.say{border:0;background:var(--yellow);border-radius:50%;width:32px;height:32px;font-size:15px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.sayable{cursor:pointer}

.prog{height:12px;border-radius:99px;background:#fff;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.08);margin-top:10px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint-d),var(--blue-d));transition:width .5s}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:#fff;font-family:var(--f-head);font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(96,132,190,.2)}
.dot.cur{outline:3px solid var(--blue-d);outline-offset:1px}
.dot.ok{background:var(--good-bg);color:var(--good)}.dot.bad{background:var(--bad-bg);color:var(--bad)}.dot.skip{background:var(--yellow-2)}
.qtext{font-family:var(--f-head);font-weight:700;font-size:clamp(19px,4.6vw,25px);line-height:1.3;margin:8px 0 12px;display:flex;gap:8px;align-items:flex-start}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:3px solid #fff;background:#fff;border-radius:18px;padding:11px 14px;font-size:16.5px;font-weight:700;box-shadow:0 4px 0 #dbe5f6;transition:transform .08s,background .15s}
.opt:active{transform:scale(.97)}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-family:var(--f-head)}
.opt.sel{border-color:var(--blue-d);background:var(--blue)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 #a7e2c1}
.opt.right b{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 #f3b3bb;animation:shake .4s}
.opt.wrong b{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{pointer-events:none}
.coach{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px;border-radius:20px}
.coach.good{background:var(--good-bg)}.coach.bad{background:var(--bad-bg)}
.coach img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:3px solid #fff;background:var(--pink);flex:none;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.coach .bubble{position:relative;background:#fff;border-radius:16px;padding:9px 13px;flex:1;font-size:14.5px}
.coach .bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.coach .bubble b{font-family:var(--f-head);font-size:17px;display:block}
.autobar{height:5px;border-radius:9px;background:rgba(255,255,255,.7);overflow:hidden;margin-top:8px}
.autobar i{display:block;height:100%;width:100%;background:var(--blue-d);transform-origin:left;animation:shrink 2.6s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.qnav{display:flex;justify-content:space-around;gap:6px;margin-top:16px;padding-top:12px;border-top:2px dashed rgba(96,132,190,.25)}
.qn{border:0;background:#fff;border-radius:18px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:64px;box-shadow:0 3px 0 #d3dcef;transition:transform .08s}
.qn:active{transform:scale(.93)}
.qn img{height:38px;width:auto}
.qn span{font-family:var(--f-head);font-size:12px;font-weight:700;color:var(--ink-soft)}
.qn[disabled]{opacity:.4}
.modegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:10px}
.mcard{border:2px solid #fff;border-radius:22px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.mcard img{height:74px;animation:float 3.4s ease-in-out infinite}
.mcard b{display:block;font-family:var(--f-head);font-size:19px}
.mcard small{display:block;font-size:12.5px;color:var(--ink-soft)}
.res{text-align:center}
.res .big{font-family:var(--f-head);font-weight:800;font-size:56px;line-height:1;background:linear-gradient(90deg,var(--blue-d),var(--pink-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.stars{font-size:38px;letter-spacing:4px;margin:4px 0}
.review{text-align:left;margin-top:12px}
.review .mistake{font-size:14px}

/* games */
.gtimer{display:flex;align-items:center;gap:10px;margin:8px 0 4px}
.tbar{flex:1;height:14px;border-radius:99px;background:#fff;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mint-d),var(--blue-d));border-radius:99px}
.tbar.low i{background:linear-gradient(90deg,var(--pink-d),#ff9a5a)}
.tnum{font-family:var(--f-head);font-weight:800;font-size:24px;min-width:34px;text-align:right}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.opts3{grid-template-columns:1fr}}
.setup label{display:block;font-family:var(--f-head);font-weight:700;margin:10px 0 4px}
.inp{width:100%;border:3px solid #fff;border-radius:16px;padding:10px 14px;font-family:var(--f-body);font-weight:700;font-size:16px;background:#fff;color:var(--ink);box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}
.inp:focus{outline:3px solid var(--blue-2)}
.choice{display:flex;gap:10px;flex-wrap:wrap}
.choice button{flex:1;min-width:130px;border:3px solid #fff;background:#fff;border-radius:18px;padding:10px;font-family:var(--f-head);font-weight:700;font-size:16px;box-shadow:0 3px 0 #d3dcef}
.choice button.on{border-color:var(--blue-d);background:var(--blue)}
.tray{min-height:64px;border:3px dashed var(--blue-2);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(255,255,255,.7);margin:10px 0}
.tray.ok{border-color:var(--good);background:var(--good-bg)}.tray.no{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.tray .ph{color:var(--ink-soft);font-size:14px;padding:0 6px}
.pool{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:8px 0 12px}
.tile{border:0;border-radius:14px;padding:8px 15px;font-family:var(--f-head);font-weight:700;font-size:19px;background:linear-gradient(180deg,#fff,var(--yellow));box-shadow:0 4px 0 #e2cf57;transition:transform .08s}
.tile:active{transform:scale(.94)}
.tile.used{opacity:.25;pointer-events:none}
.tile.in{background:linear-gradient(180deg,#fff,var(--mint-2));box-shadow:0 4px 0 #86c9be}
.punct{font-family:var(--f-head);font-weight:800;font-size:22px;align-self:center}
.tip{background:var(--yellow);border-radius:14px;padding:8px 12px;font-size:14px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-30px;z-index:99;font-size:26px;pointer-events:none;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.hide{display:none!important}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@keyframes flt{from{transform:translateY(20px);opacity:1}to{transform:translateY(-24px);opacity:0}}
.mfb{min-height:6px}
.tile.sm{padding:4px 11px;font-size:16px;border-radius:12px;box-shadow:0 3px 0 #86c9be}
.qtag{display:inline-block;font-family:var(--f-head);font-weight:700;font-size:13px;color:var(--pink-d);background:#fff;border-radius:99px;padding:2px 12px;margin-top:10px;box-shadow:0 2px 6px rgba(226,87,140,.18)}
.qsub{color:var(--blue-d);font-weight:700;margin:-6px 0 10px 2px;font-size:15px}
.flag{display:block;width:100%;height:auto;border-radius:10px;border:2px solid #fff;background:#fff;box-shadow:0 3px 10px rgba(56,68,95,.25)}
.fc .flag{width:116px;margin:2px 0 4px}
.qflag{display:flex;justify-content:center;margin:6px 0 8px}
.qflag .flag{width:min(170px,58%)}
.blank{display:inline-block;min-width:54px;border-bottom:4px solid var(--pink-d);color:var(--pink-d);text-align:center;line-height:1}
.chip.bk{background:var(--pink-2)}
.ov{position:fixed;inset:0;z-index:300;background:rgba(56,68,95,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media(min-width:700px){.ov{align-items:center}}
.ovbox{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:26px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
.shoprow{display:flex;gap:10px;align-items:center;background:var(--blue);border-radius:18px;padding:10px 12px;margin-top:8px;text-align:left}
.shoprow .se{font-size:30px;flex:none}
.shoprow small{color:var(--ink-soft)}
.flyr{position:fixed;top:78px;right:14px;z-index:260;background:#fff;border-radius:99px;padding:6px 14px;font-family:var(--f-head);font-weight:800;box-shadow:var(--shadow);animation:flyUp 1.3s forwards;pointer-events:none}
@keyframes flyUp{0%{opacity:0;transform:translateY(10px) scale(.8)}15%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-34px)}}
.combo{position:fixed;top:28%;left:50%;z-index:250;transform:translate(-50%,0);font-family:var(--f-head);font-weight:800;font-size:clamp(34px,10vw,56px);color:#fff;-webkit-text-stroke:2px var(--pink-d);text-shadow:0 5px 0 var(--pink-d);animation:comboP 1s forwards;pointer-events:none;white-space:nowrap}
@keyframes comboP{0%{opacity:0;transform:translate(-50%,10px) scale(.4)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.coach .rw{display:inline-block;background:var(--yellow-2);border-radius:99px;padding:0 8px;font-size:13px;margin-left:4px}
.opt.flagopt{justify-content:center;padding:8px 10px}
.opt.flagopt .flag{width:96px}
.opt.dim{opacity:.35}
/* Fishing Pond */
.pond{position:relative;height:254px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#bfe9ff,#7cc8ee 55%,#4fa6d6);border:3px solid #fff;box-shadow:var(--shadow);margin-top:10px}
.fish{position:absolute;border:0;background:none;padding:0;display:flex;align-items:center;gap:3px;white-space:nowrap;animation:swimR var(--d,9s) linear infinite;animation-delay:var(--dl,0s);touch-action:manipulation}
.fish .fw2{background:#fff;border-radius:99px;padding:5px 12px;font-family:var(--f-head);font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.fish .fe{font-size:30px;display:inline-block;transform:scaleX(-1)}
.fish.L{animation-name:swimL;flex-direction:row-reverse}
.fish.L .fe{transform:none}
@keyframes swimR{from{left:-45%}to{left:108%}}
@keyframes swimL{from{left:108%}to{left:-45%}}
.fish.gone{display:none}
.fish.no .fw2{background:var(--bad-bg);color:var(--bad);animation:shake .4s}

/* ===== v3: thẻ nhân vật, câu cá, nhảy sông ===== */
.who{display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,#fff,#e8f4ff);border:3px solid #fff;border-radius:18px;padding:8px 12px;box-shadow:0 4px 12px rgba(96,132,190,.16);margin:6px 0 4px}
.who .wa{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);display:block;flex:none}
.who .wa svg{display:block;width:100%;height:100%}
.who .wn{flex:1;line-height:1.15}.who .wn b{font-family:var(--f-head);font-size:20px;display:block}.who .wn small{color:var(--ink-soft);font-size:12.5px}
.who .flag{width:82px;flex:none}
.gpanel{margin-top:6px}
.gpanel .qflag .flag{width:min(120px,44%)}
.gpanel .qtext{margin:6px 0 4px}
.pfloat{position:absolute;z-index:5;font-family:var(--f-head);font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 0 var(--pink-d);pointer-events:none;animation:flt .95s ease-out forwards;white-space:nowrap}
.pond.frozen .fish{animation-play-state:paused}
.pond.frozen{box-shadow:0 0 0 4px #bfe9ff,var(--shadow);filter:saturate(.8) brightness(1.05)}
.fish.gold .fw2{background:linear-gradient(180deg,#fff2a8,#ffd54a);color:#5a4300}
.fish.gold .fe{filter:drop-shadow(0 0 6px #ffd54a)}
.fish.gone{display:none}
.fish.caught{animation:caughtUp .7s ease-in forwards}
@keyframes caughtUp{0%{transform:translateY(0) scale(1)}60%{transform:translateY(-70px) scale(1.15) rotate(-10deg)}100%{transform:translateY(-150px) scale(.2);opacity:0}}
.fish.splash{animation:sink .8s ease-in forwards;filter:grayscale(1)}
@keyframes sink{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(90px) rotate(70deg);opacity:0}}
.bucket{margin:8px 0 0;padding:6px 12px;background:#fff;border-radius:16px;font-size:22px;letter-spacing:2px;min-height:38px;box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}
.bucket small{font-size:13px;letter-spacing:0;color:var(--ink-soft)}
/* ===== v4: nhân vật, cảnh câu cá, ra khơi, đồ nghề ===== */
.face-s{display:none}
.scared .face-h{display:none}.scared .face-s{display:inline}
.scared .ang{animation:shake .5s 3}
.tug .ang{animation:tug .6s}
@keyframes tug{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-5px) rotate(-1.8deg)}60%{transform:translateY(2px)}}
.boat{animation:bobB 3.2s ease-in-out infinite}
@keyframes bobB{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(4px) rotate(.8deg)}}
.net.dip{animation:netDip .9s ease-in-out}
@keyframes netDip{0%,100%{transform:translateY(0)}45%{transform:translateY(34px)}}
.fscene{position:relative;border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow);margin-top:10px;background:#6fc0ea}
.fscn,.seasc{display:block;width:100%;height:auto}
.fscene .pond{border:0;border-radius:0;box-shadow:none;margin-top:-1px;height:196px;background:linear-gradient(180deg,#6fc0ea,#4a9fd0)}
.fish .fsvg{width:46px;height:auto;flex:none;display:block}
.fish.R .fsvg{transform:none}

    <div class="tools"><span class="chip yel" id="hudCoin">🪙 0</span><button class="mute" id="muteBtn" onclick="toggleMute()" aria-label="Bật/tắt âm thanh">🔊</button><button class="mute" id="gearBtn" onclick="openTeacher()" aria-label="Khu vực giáo viên">⚙️</button></div></header>
  <main id="view"></main>

<script>
/* ==================================================================
   ░░  1. CẤU HÌNH — sửa tên, số lượt, tỉ lệ…  ░░
   ================================================================== */
const CFG={
  id:'fish2-sample',                 // đổi id khi nhân bản template cho unit khác → xu/đồ nghề lưu riêng cho từng bản
  title:'Ra Khơi Đánh Cá',
  subtitle:'Unit 1 · My Friends (dữ liệu mẫu — thay bằng bài của bạn)',
  rounds:3, need:5,    // số lượt/vòng, số cá (câu đúng) cần câu mỗi lượt
  vocabShare:0.6,              // tỉ lệ câu từ vựng (0.6 = 60% từ vựng, 40% ngữ pháp); giáo viên đổi được trong ⚙️
  startCoins:60,               // số xu lúc bắt đầu
  zalo:'',                     // đã bỏ số Zalo mặc định của bản mẫu
  teacherPin:''                // mã mở ⚙️ Giáo viên; để '' = không hỏi mã
};

/* --- (chỉ để tạo hình cờ cho DỮ LIỆU MẪU; xoá khối này nếu bạn dùng ảnh riêng) --- */
const FLAG=(function(){
const star=(cx,cy,R,r,n=5)=>{const p=[];for(let i=0;i<n*2;i++){const a=(-90+i*180/n)*Math.PI/180,d=i%2?r:R;p.push((cx+Math.cos(a)*d).toFixed(2)+','+(cy+Math.sin(a)*d).toFixed(2))}return p.join(' ')};
let _cp=0;
const jack=(x,y,w,h)=>{const id='cp'+(++_cp);return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="0 0 60 40" preserveAspectRatio="none"><clipPath id="${id}"><path d="M30,20 h30 v20 z v20 h-30 z h-30 v-20 z v-20 h30 z"/></clipPath><rect width="60" height="40" fill="#012169"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/><path d="M0,0 L60,40 M60,0 L0,40" clip-path="url(#${id})" stroke="#c8102e" stroke-width="5"/><path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="13"/><path d="M30,0 V40 M0,20 H60" stroke="#c8102e" stroke-width="8"/></svg>`};
const stripes=(n,c1,c2)=>{let s='';for(let i=0;i<n;i++)s+=`<rect y="${(i*40/n).toFixed(2)}" width="60" height="${(40/n+.1).toFixed(2)}" fill="${i%2?c2:c1}"/>`;return s};
const FL={
 /* Mỹ: 13 sọc (đỏ đầu – đỏ cuối), ô xanh cao 7 sọc, 50 ngôi sao xếp 9 hàng (6-5-6-5-6-5-6-5-6) */
 america:()=>{const ch=40*7/13;let s=stripes(13,'#b22234','#fff')+`<rect width="24" height="${ch.toFixed(2)}" fill="#3c3b6e"/>`;

function fillPat(en){
  const words=en.split(' ');let wi=0;words.forEach((w,i)=>{if(w.length>words[wi].length)wi=i});
  const L=words[wi].length,nb=L>=8?3:L>=6?2:1;
  const cand=shuffle([...Array(L-1).keys()].map(i=>i+1)),idx=[];
  for(const c of cand){if(idx.length>=nb)break;if(idx.every(j=>Math.abs(j-c)>1))idx.push(c)}
  for(const c of cand){if(idx.length>=nb)break;if(!idx.includes(c))idx.push(c)}
  const pat=[],ans=[];
  words.forEach((w,i)=>{if(i)pat.push(' ');[...w].forEach((ch,j)=>{if(i===wi&&idx.includes(j)){pat.push(null);ans.push(ch.toLowerCase())}else pat.push(ch)})});
  return {pat,ans};
}

}

   case 'vi2en':return Object.assign(b,{kind:'mc',tag:'Việt → Anh',q:`“${w.vi}” tiếng Anh là gì?`,o:[w.en].concat(wrongEn()),ansText:w.en});
   case 'def':return Object.assign(b,{kind:'mc',tag:'Định nghĩa',q:w.def,sub:'Đây là từ nào?',o:[w.en].concat(wrongEn()),ansText:w.en});
   case 'missing':{const f=fillPat(w.en);return Object.assign(b,{kind:'missing',tag:'Missing letter',q:`Điền chữ cái còn thiếu`+(w.vi?` · nghĩa: “${w.vi}”`:''),pic:w.pic,pat:f.pat,ans:f.ans,ansText:w.en});}
   case 'scramble':{const letters=[...w.en.replace(/\s/g,'')];return Object.assign(b,{kind:'order',tag:'Scramble',q:`Xếp các chữ cái thành từ`+(w.vi?` · nghĩa: “${w.vi}”`:''),pic:w.pic,tiles:shuffleDiff(letters,''),target:letters.join(''),join:'',end:'',ansText:w.en});}
   case 'listenWord':return Object.assign(b,{kind:'mc',tag:'Nghe chọn từ',q:'🎧 Nghe rồi chọn từ đúng',qsay:w.en,autoSay:true,o:[w.en].concat(wrongEn()),ansText:w.en});
   case 'listenPic':return Object.assign(b,{kind:'mc',tag:'Nghe chọn hình',q:'🎧 Nghe rồi chọn hình đúng',qsay:w.en,autoSay:true,optPic:true,o:[w.en].concat(others(w,3,x=>!!x.pic).map(x=>x.en))});
   case 'type':return Object.assign(b,{kind:'type',tag:'Type',q:`“${w.vi}” tiếng Anh là gì?`,sub:'Gõ đáp án vào ô bên dưới',pic:w.pic,answers:[w.en].concat(w.alt||[]),ansText:w.en,ph:'Gõ từ tiếng Anh…'});
  }
}
function mkG(g){
  const b={id:'g:'+(g.id||g._i),src:'grammar',type:'g_'+g.type,w:'g'+g._i,exp:g.exp||'',pic:g.pic,tag:g.tag};
  if(g.type==='fill'){const a=[].concat(g.a);return Object.assign(b,{kind:'type',tag:g.tag||'Điền từ còn thiếu',q:g.q,answers:a,ansText:g.q.replace(/_{3,}/,a[0]),ph:'Gõ từ còn thiếu…'})}
  if(g.type==='order'){const t=g.tiles.slice();return Object.assign(b,{kind:'order',tag:g.tag||'Sắp xếp thành câu',q:g.q||'Sắp xếp các từ thành câu đúng',tiles:shuffleDiff(t,' '),target:t.join(' '),join:' ',end:g.end||'',ansText:t.join(' ')+(g.end||'')})}
  return Object.assign(b,{kind:'mc',tag:g.tag||'Chọn đáp án đúng',q:g.q,qsay:g.say,o:g.o.slice(),ansText:g.o[0]});
}
/* n câu hỏi: trộn từ vựng + ngữ pháp theo tỉ lệ, xoay vòng giữa các dạng đang bật */
function gameQs(n){
  const vt=shuffle(VTYPES.map(t=>t.k).filter(typeOn)),G=GRAMMAR.filter(g=>typeOn('g_'+g.type));
  let nV=Math.round(n*SET.vocabShare);
  if(!vt.length)nV=0;else if(!G.length)nV=n;
  const nG=G.length?n-nV:0,out=[];
  if(!vt.length&&!G.length){vt.push('en2vi');nV=n}
  const pool={};
  for(let i=0;i<nV;i++){
    const t=vt[i%vt.length];
    if(!pool[t]||!pool[t].length)pool[t]=shuffle(wordsWith(elig[t]));
    out.push(mkV(t,pool[t].pop()));
  }
  const gl=shuffle(G);
  for(let i=0;i<nG;i++){
    if(i&&i%gl.length===0)gl.splice(0,gl.length,...shuffle(G));
    out.push(mkG(gl[i%gl.length]));
  }
  return shuffle(out);
}

/* ================================================================
   KHUNG TRẢ LỜI CHO CÂU KHÔNG PHẢI TRẮC NGHIỆM (gõ · điền chữ · sắp xếp)
   mountAnswer(host,q,cb) → {reset(), reveal(), lock()}
   cb(ok) được gọi khi bấm “Kiểm tra”
   ================================================================ */
function mountAnswer(host,q,cb){
  host.innerHTML='';
  const H={locked:false};
  const shake=el=>{el.classList.remove('shk');void el.offsetWidth;el.classList.add('shk')};
  if(q.kind==='type'){
    host.innerHTML=`<div class="ansrow"><input class="inp ansinp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(q.ph||'Gõ đáp án…')}"><button class="btn sm sun go">Kiểm tra ✓</button></div>`;
    const inp=$('.ansinp',host),go=$('.go',host);
    const submit=()=>{if(H.locked)return;const v=clean(inp.value);if(!v)return;cb(q.answers.some(a=>clean(a)===v))};
    go.onclick=submit;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit()}};
    H.reset=()=>{shake(inp);inp.select()};
    H.reveal=()=>{inp.value=q.answers[0];H.lock()};
    H.lock=()=>{H.locked=true;inp.disabled=true;go.disabled=true};
    setTimeout(()=>{try{inp.focus()}catch(e){}},80);
  }else if(q.kind==='missing'){
    host.innerHTML=`<div class="mrow">${q.pat.map(c=>c===null?'<input class="mbox" type="text" maxlength="1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">':c===' '?'<span class="mgap"></span>':`<span class="mch">${esc(c)}</span>`).join('')}</div><div class="ansrow" style="justify-content:center"><button class="btn sm sun go">Kiểm tra ✓</button></div>`;
    const bx=$$('.mbox',host),go=$('.go',host);
    bx.forEach((b,i)=>{
      b.addEventListener('input',()=>{b.value=b.value.slice(-1);if(b.value&&bx[i+1])bx[i+1].focus()});
      b.addEventListener('keydown',e=>{
        if(e.key==='Backspace'&&!b.value&&bx[i-1]){bx[i-1].focus();bx[i-1].value=''}
        else if(e.key==='Enter'){e.preventDefault();submit()}
      });
    });
    const submit=()=>{if(H.locked)return;if(bx.some(b=>!b.value))return toast('Điền đủ các ô nhé ✏️');cb(bx.every((b,i)=>b.value.toLowerCase()===q.ans[i]))};
    go.onclick=submit;
    H.reset=()=>{bx.forEach(b=>{b.value=''});shake($('.mrow',host));if(bx[0])bx[0].focus()};
    H.reveal=()=>{bx.forEach((b,i)=>{b.value=q.ans[i]});H.lock()};
    H.lock=()=>{H.locked=true;bx.forEach(b=>{b.disabled=true});go.disabled=true};
    setTimeout(()=>{try{bx[0]&&bx[0].focus()}catch(e){}},80);
  }else if(q.kind==='order'){
    host.innerHTML=`<div class="tray" id="trayX"></div><div class="pool" id="poolX"></div><div class="ansrow" style="justify-content:center"><button class="btn ghost sm clr">↺ Làm lại</button><button class="btn sm sun go" disabled>Kiểm tra ✓</button></div>`;
    const tray=$('#trayX',host),pool=$('#poolX',host),go=$('.go',host),clr=$('.clr',host);
    let picked=[];
    const paint=()=>{
      tray.innerHTML=picked.length?picked.map((i,k)=>`<button class="tile in${q.join===''?' sm':''}" data-k="${k}">${esc(q.tiles[i])}</button>`).join('')+(q.end?`<span class="punct">${esc(q.end)}</span>`:''):'<span class="ph">Chạm các ô bên dưới theo đúng thứ tự…</span>';
      pool.innerHTML=q.tiles.map((t,i)=>`<button class="tile${picked.indexOf(i)>=0?' used':''}${q.join===''?' sm':''}" data-i="${i}">${esc(t)}</button>`).join('');
      go.disabled=H.locked||picked.length<q.tiles.length;
      $$('.tile.in',tray).forEach(b=>b.onclick=()=>{if(H.locked)return;picked.splice(+b.dataset.k,1);sfx('click');paint()});
      $$('.tile',pool).forEach(b=>b.onclick=()=>{if(H.locked)return;const i=+b.dataset.i;if(picked.indexOf(i)>=0)return;picked.push(i);sfx('click');paint()});
    };
    clr.onclick=()=>{if(H.locked)return;picked=[];paint()};
    go.onclick=()=>{if(H.locked||picked.length<q.tiles.length)return;const s=picked.map(i=>q.tiles[i]).join(q.join);cb(clean(s)===clean(q.target)&&(q.join!==''||s.toLowerCase()===q.target.toLowerCase()))};
    H.reset=()=>{tray.classList.add('no');setTimeout(()=>{tray.classList.remove('no');picked=[];paint()},550)};
    H.reveal=()=>{
      const used=[];picked=[];
      (q.join===''?[...q.target]:q.target.split(' ')).forEach(tok=>{
        for(let i=0;i<q.tiles.length;i++){if(used.indexOf(i)<0&&q.tiles[i]===tok){used.push(i);picked.push(i);break}}
      });
      H.locked=true;paint();tray.classList.add('ok');
    };
    H.lock=()=>{H.locked=true;paint()};
    paint();
  }
  return H;
}

let actx=null,bufs={},els={},audioReady=false;
function getCtx(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
  }catch(e){}
  return actx;
}
function initAudio(){
  if(audioReady)return;audioReady=true;
  const c=getCtx();
  Object.keys(SND).forEach(k=>{
    try{const a=new Audio(SND[k]);a.preload='auto';a.volume=.95;els[k]=a}catch(e){}
    if(c){
      try{
        const bin=atob(SND[k].split(',')[1]);const u=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
        const p=c.decodeAudioData(u.buffer,b=>{bufs[k]=b},()=>{});
        if(p&&p.catch)p.catch(()=>{});
      }catch(e){}
    }
  });
}
['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,()=>{initAudio();getCtx()},{passive:true}));
function tone(f,d,type='sine',vol=.15,delay=0){
  try{
    const c=getCtx();if(!c)return;
    const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);
  }catch(e){}
}
const synth={
  correct(){tone(880,.14,'sine',.22,0);tone(1320,.24,'sine',.22,.1)},
  wrong(){tone(190,.28,'sawtooth',.15,0);tone(140,.34,'sawtooth',.15,.14)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.2,i*.13))},
  click(){tone(660,.05,'square',.06)},
  tick(){tone(1000,.05,'square',.06)},
  splash(){tone(500,.12,'triangle',.12,0);tone(760,.14,'triangle',.12,.08)},
  pop(){tone(420,.08,'sine',.2,0);tone(640,.1,'sine',.2,.05)}
};
function sfx(n){
  if(muted)return;
  initAudio();
  const c=getCtx();
  if(c&&bufs[n]){
    try{const s=c.createBufferSource();s.buffer=bufs[n];const g=c.createGain();g.gain.value=1;s.connect(g);g.connect(c.destination);s.start(0);return}catch(e){}
  }
  const a=els[n];
  if(a){try{a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{synth[n]&&synth[n]()});return}catch(e){}}
  synth[n]&&synth[n]();
}
function toggleMute(){muted=!muted;store.set('muted',muted);$('#muteBtn').textContent=muted?'🔇':'🔊';if(muted&&window.speechSynthesis)speechSynthesis.cancel()}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function mkUtter(text){
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;u.pitch=1.05;
  const v=voices.find(v=>/en[-_]US/i.test(v.lang)&&/female|samantha|zira|aria|jenny|google us/i.test(v.name))||voices.find(v=>/en[-_]US/i.test(v.lang));
  if(v)u.voice=v;return u;
}

}

function tween(dur,step,done){
  const t0=gnow(),o={stop:false};

    if(o.stop)return;
    const p=Math.max(0,Math.min(1,(gnow()-t0)/dur));
    try{step(p)}catch(e){}

  };

}

function showHow(){popup(howHTML(),'Đã hiểu!')}

const FSZ={s:{v:3,sc:.62,n:'cá nhỏ',w:24,pct:8.5},m:{v:6,sc:.9,n:'cá vừa',w:32,pct:12.5},b:{v:12,sc:1.25,n:'cá lớn',w:44,pct:17.5}};
const SZK={s:0,m:1,b:2};
function pickSize(){
  const D=[[.7,.25,.05],[.5,.35,.15],[.3,.4,.3]][gt('net')-1].slice();
  D[2]+=S.r*.05;D[0]-=S.r*.05;
  const x=Math.random();return x<D[0]?'s':x<D[0]+D[1]?'m':'b';
}
const holdVal=()=>S.hold.reduce((a,f)=>a+f.val,0);
function sGeo(){
  const h=$('#sea'),R=h&&rects(h);if(!R||!R.width)return null;
  const sv=$('svg.seasc',h),sr=(sv&&rects(sv))||R,W=sr.width,H=sr.height;if(!W||!H)return null;
  const kx=W/360,ky=H/280,ox=sr.left-R.left,oy=sr.top-R.top;
  const K=seaGeom(gt('boat'),gt('outfit')),at=o=>({x:ox+(44+S.dx+o.x)*kx,y:oy+(40+o.y)*ky});
  return {R,W,H,kx,ky,ox,oy,K,tip:at(K.tip),deck:at(K.deck),head:at(K.head)};
}
function seaLoop(){
  if(GM.view!=='s'||S.done)return;
  if(!PAUSED){
    const now=gnow();
    if(now>S.tgtT){S.tgt=-28+Math.random()*92;S.tgtT=now+3200+Math.random()*2800}
    const prev=S.dx;S.dx+=(S.tgt-S.dx)*(S.boatFast?.08:.012);
    S.vx=S.vx*.8+(S.dx-prev)*.2;
    const bg=$('#boatG');
    if(bg)bg.setAttribute('transform',`translate(${(44+S.dx).toFixed(2)} 40) rotate(${Math.max(-3,Math.min(3,S.vx*14)).toFixed(2)} 100 80)`);
  }
  S.raf=requestAnimationFrame(seaLoop);
}
function sFu(){const sea=$('#sea'),r=sea&&rects(sea);if(sea)sea.style.setProperty('--fu',((r&&r.width)?r.width/100:4)+'px')}
function sHud(){
  setT('#sN',`🐟 ${S.got}/${S.need}`);setT('#sH','🧺 '+holdVal()+' 🪙');setT('#sHorn','📯 còi: '+S.horn+(ME.items.shield?` · 🛡️${ME.items.shield}`:''));setT('#sC','🔥 '+S.combo);
  const d=$('#sD');if(d){d.style.display=S.dbl?'':'none';d.textContent='🌈 cá kế tiếp ×2'}
  const h=$('#sHold');if(h)h.innerHTML='🧺 '+(S.hold.length?S.hold.map(f=>fishMini(SZK[f.size],FSZ[f.size].w)).join(''):'<small>khoang cá còn trống…</small>');
}
function sFifty(){
  if(ME.items.fifty<=0||S.fifty||S.locked||S.done||PAUSED)return;
  ME.items.fifty--;meSave();S.fifty=true;sfx('click');
  const els=$$('#swim .sfish');
  shuffle(S.opts.map((t,k)=>k).filter(k=>S.opts[k]!==S.q.o[0]&&!els[k].classList.contains('gone'))).slice(0,1).forEach(k=>els[k].classList.add('gone'));
  sPower();
}
function sSpawn(cls,size,left,top){
  const sea=$('#sea');if(!sea)return null;
  const d=document.createElement('div');d.className=cls;d.style.left=left;d.style.top=top;d.style.width=(11*FSZ[size].sc)+'%';
  d.innerHTML=fishSVG(SZK[size]);sea.appendChild(d);setTimeout(()=>d.remove(),1400);return d;
}
function sDrawNet(g,x,y,r){
  const rope=$('#sRope'),O=$('#sNetO'),N=$('#sNc'),M=$('#sNm');if(!rope||!O||!N||!M)return;
  rope.setAttribute('d',`M${g.tip.x} ${g.tip.y} L${x} ${y}`);
  O.style.display='';N.setAttribute('cx',x);N.setAttribute('cy',y);N.setAttribute('r',r);
  let m='';for(const k of [-.5,0,.5]){const h=Math.sqrt(Math.max(r*r-(k*r)*(k*r),0));m+=`M${x+k*r} ${y-h} V${y+h} M${x-h} ${y+k*r} H${x+h} `}
  M.setAttribute('d',m);
}
function sNetHide(){const O=$('#sNetO'),rope=$('#sRope'),sea=$('#sea');if(O)O.style.display='none';if(rope)rope.setAttribute('d','');if(sea)sea.classList.remove('netaway')}
function sCast(el,ok,after){
  const g0=sGeo(),pr=rects(el);
  if(!g0||!pr||!pr.width){after&&after();return}
  const fx=pr.left-g0.R.left+pr.width/2,fy=pr.top-g0.R.top+pr.height/2;
  S.tgt=Math.max(-30,Math.min(70,(fx-g0.ox)/g0.kx-44-g0.K.tip.x));S.tgtT=gnow()+6000;S.boatFast=true;   // thuyền chạy tới chỗ con cá
  const sea=$('#sea');if(sea)sea.classList.add('netaway');
  const r0=Math.max(FSZ.s.w*.5*g0.kx*1.3,[13,19,24][gt('net')-1]*g0.kx*1.2),r1=Math.max(r0,pr.width*.42);
  tween(650,()=>{},()=>{
    S.boatFast=false;S.tgtT=gnow()+2500;
    tween(420,p=>{const g=sGeo();if(!g)return;const e=1-Math.pow(1-p,2),x=g.tip.x+(fx-g.tip.x)*e,y=g.tip.y+(fy-g.tip.y)*e;sDrawNet(g,x,y,r0+(r1-r0)*e)},()=>{
      if(!ok){
        el.classList.add('dart');
        tween(520,p=>{const g=sGeo();if(!g)return;const e=p*p,x=fx+(g.tip.x-fx)*e,y=fy+(g.tip.y-fy)*e;sDrawNet(g,x,y,r1*(1-.7*e))},()=>{sNetHide();after&&after()});
        return;
      }
      const fly=document.createElement('div');fly.className='flyfish';const sv=el.querySelector('.fsvg');fly.innerHTML=sv?sv.outerHTML:'';if(el.classList.contains('L')){const im=fly.querySelector('img');if(im)im.style.transform='scaleX(-1)'}
      const fw=Math.max(34,pr.width*.5);fly.style.width=fw+'px';if(sea)sea.appendChild(fly);el.classList.add('taken');
      tween(850,p=>{const g=sGeo();if(!g)return;const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,
          tx=g.deck.x,ty=g.deck.y-g.H*.07,cx=(fx+tx)/2,cy=Math.min(fy,ty)-g.H*.12,q=1-e,
          x=q*q*fx+2*q*e*cx+e*e*tx,y=q*q*fy+2*q*e*cy+e*e*ty;
        sDrawNet(g,x,y,r1*(1-.5*e));fly.style.transform=`translate(${x-fw/2}px,${y-fw*.28}px) rotate(${-20*e}deg) scale(${1-.45*e})`},()=>{
        fly.remove();const g=sGeo();
        tween(320,p=>{const gg=sGeo();if(!gg)return;sDrawNet(gg,gg.tip.x+(gg.deck.x-gg.tip.x)*(1-p),gg.tip.y+(gg.deck.y-gg.tip.y)*(1-p)-gg.H*.07*(1-p),r0*(1-p*.7))},()=>{sNetHide();after&&after()});
      });
    });
  });
}
function sLuckRoll(){
  if(S.got<2||S.events>=2)return null;
  const r=Math.random();
  if(r<.07)return 'storm';if(r<.14)return 'gull';if(r<.20)return 'rainbow';if(r<.25)return 'dolphin';return null;
}
function sLuck(k){
  if(S.done||GM.view!=='s')return;
  S.events++;const g=sGeo();
  const useShield=()=>{if(ME.items.shield>0){ME.items.shield--;meSave();return true}return false};
  if(k==='storm'){
    const prot=gt('boat')===3?'boat':useShield()?'shd':'';
    fxRain('#sea');
    if(prot)banner(prot==='boat'?'⛵ Thuyền máy vững vàng qua bão — cá an toàn!':'🛡️ Khiên bảo vệ: cá không bị sóng cuốn!','good','#sea');
    else{const n=S.hold.length;S.lost+=n;S.hold=[];banner(n?`⛈ Bão ập tới! Sóng cuốn trôi ${n} con cá!`:'⛈ Bão ập tới! May mà khoang cá còn trống.','bad','#sea');sfx('wrong')}
  }else if(k==='gull'){
    const prot=gt('outfit')===3?'hat':useShield()?'shd':'';
    fxBird('poop',g&&(prot==='hat'?g.head:g.deck),'#sea','#fff');
    if(prot)banner(prot==='hat'?'🎩 Nón rộng vành hứng giúp! Hải âu ị trúng nón, cá an toàn.':'🛡️ Khiên bảo vệ cá khỏi hải âu!','good','#sea');
    else{const lost=S.hold.pop();if(lost)S.lost++;banner(lost?`🕊 Hải âu ị trúng khoang cá! Mất 1 con cá (−${lost.val} 🪙).`:'🕊 Hải âu ị trượt — khoang trống nên không mất gì!','bad','#sea');sfx('wrong')}
  }else if(k==='rainbow'){
    S.dbl=true;fxRainbow('#sea');banner('🌈 Cầu vồng may mắn! Con cá kế tiếp được ×2 xu.','good','#sea');sfx('win');
  }else if(k==='dolphin'){
    ovAdd('dolphin',dolphinSVG(),2600,'#sea');S.hold.push({size:'b',val:FSZ.b.v+outfitBonus()});banner('🐬 Cá heo nhảy múa và tặng bạn 1 con cá lớn!','good','#sea');sfx('correct');
  }
  sHud();
}
function sNext(){
  if(S.r<S.nr-1){S.r++;sRound();window.scrollTo({top:0,behavior:'smooth'})}
  else sFinal();
}
function sQuit(){
  clearInterval(S.timer);clearTimeout(S.next);clearTimeout(S.sFx);twStop();
  const coins=holdVal();S.roundCoins=coins;S.earned+=coins;if(coins)award(coins,6);S.hold=[];
  sFinal(true);
}

  $('#view').innerHTML=introHTML('Ra khơi đánh cá',seaScene(0),'⛵ '+esc(CFG.title),
   `<b>${esc(CFG.subtitle)}</b><br>${poolInfo()}<br><br>Có <b>${CFG.rounds} vòng</b> ra biển, mỗi vòng cần <b>${CFG.need} câu đúng</b>. Chạm cá mang đáp án đúng để thả lưới; sai thì cá mập đến!`,

function sStart(quick,fixQs){
  stopAll();runReset();
  S.quick=!!quick;S.fix=!!fixQs;S.fixQs=fixQs||null;
  S.need=fixQs?Math.min(fixQs.length,6):(quick?3:CFG.need);S.nr=fixQs?1:(quick?2:CFG.rounds);
  Object.assign(S,{r:0,earned:0,combo:0,maxCombo:0,lost:0,caught:0,done:false,events:0,bonus:0,quit:false,panel:null});
  sRound();
}
function fixIt(){const L=Object.keys(RUN.wrong).map(k=>RUN.wrong[k]);if(L.length)sStart(1,L.slice(0,6))}
function sRound(){
  Object.assign(S,{qs:S.fixQs?shuffle(S.fixQs):gameQs(S.need+6),i:0,got:0,hold:[],horn:hornsPerRound(),roundCoins:0,locked:false,wrongSet:{},dbl:false,events:0,dx:0,tgt:12,tgtT:0,vx:0,boatFast:false});
  GM.view='s';sScreen();sQ();
  clearInterval(S.timer);S.timer=setInterval(sTick,250);
  try{cancelAnimationFrame(S.raf)}catch(e){}
  S.raf=requestAnimationFrame(seaLoop);
}

       <div class="hold" id="sHold"></div></div>
     <div class="gside">
      <div class="row" style="justify-content:space-between"><span class="chip blue" id="sN">🐟 0/${S.need}</span><span class="chip yel" id="sH">🧺 0 🪙</span><span class="chip mint" id="sHorn">📯 0</span><span class="chip pink" id="sC">🔥 0</span><span class="chip mint" id="sD" style="display:none"></span></div>
      ${goalBox('sea','compact')}
      <div class="gtimer"><div class="tbar" id="sTb"><i id="sBar"></i></div><span class="tnum" id="sNum">60</span></div>
      <div class="gpanel" id="sQ"></div>
      <div id="sAns" class="gans"></div>
      <div class="tip sask" id="sAsk" style="margin-top:8px;text-align:center">👆 Chạm vào <b>con cá mang đáp án đúng</b> (hoặc trả lời ở khung trên). Cá lớn được nhiều xu hơn!</div>
      <div class="row" id="sPw" style="margin:6px 0"></div>
      <div id="sFb" class="mfb"></div>
     </div></div></section>`;
  const N=$('#sNc'),st=['#8a7a5a','#3f93c8','#e0a800'][gt('net')-1],col=['#d9d2c0','#9fd8ff','#ffd54a'][gt('net')-1];
  if(N){N.setAttribute('fill',col);N.setAttribute('fill-opacity','.5');N.setAttribute('stroke',st);N.setAttribute('stroke-width','3');$('#sNm').setAttribute('stroke',st);$('#sNm').setAttribute('stroke-width','1.2')}
  sFu();sHud();

function sPower(){
  const h=$('#sPw');if(!h)return;
  h.innerHTML=S.q&&S.q.kind==='mc'&&ME.items.fifty>0&&!S.fifty&&!S.locked?`<button class="btn ghost sm" onclick="sFifty()">🔍 50:50 (×${ME.items.fifty})</button>`:'';
}
/* cá "trang trí" cho câu không phải trắc nghiệm */
function sDeco(){
  const swim=$('#swim');if(!swim)return null;
  const d=(11+Math.random()*3).toFixed(1),L=Math.random()<.5,size=pickSize();
  const el=document.createElement('div');el.className='fish sfish deco sz-'+size+' '+(L?'L':'R');el.dataset.size=size;
  el.style.top=[2,36,68][Math.floor(Math.random()*3)]+'%';el.style.setProperty('--d',d+'s');el.style.setProperty('--dl',(-(d*.4)).toFixed(1)+'s');
  el.innerHTML=`<span class="fw2 qm">?</span><span class="fwrap">${fishSVG(Math.floor(Math.random()*4))}</span>`;swim.appendChild(el);return el;
}
function sQ(){
  if(!S.qs[S.i])S.qs.push(...gameQs(6));
  const q=S.qs[S.i];S.q=q;S.locked=false;S.fifty=false;S.t=60;S.t0=gnow();S.panel=null;
  $('#sQ').innerHTML=qPanel(q);
  sFu();
  const swim=$('#swim'),A=$('#sAns');
  if(q.kind==='mc'){
    A.innerHTML='';S.opts=pick3(q);
    /* mỗi đáp án là 1 con cá có kích cỡ khác nhau; cá mang đáp án đúng có cỡ theo lưới */
    const ci=S.opts.findIndex(t=>t===q.o[0]),cs=pickSize(),others2=shuffle(['s','m','b'].filter(x=>x!==cs));
    S.sz=S.opts.map((t,k)=>k===ci?cs:others2.pop());
    swim.innerHTML=S.opts.map((t,k)=>{
      const d=(11+Math.random()*5).toFixed(1),dl=-(Math.random()*d).toFixed(1),L=k%2===1;
      return `<button class="fish sfish sz-${S.sz[k]} ${L?'L':'R'}" data-k="${k}" style="top:${[2,36,68][k]}%;--d:${d}s;--dl:${dl}s"><span class="fw2${optCls(q,t)}">${optHTML(q,t)}</span><span class="fwrap">${fishSVG(k)}</span></button>`}).join('');
    $$('#swim .sfish[data-k]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();sTap(+b.dataset.k)}));
  }else{
    S.opts=[];S.sz=[];swim.innerHTML='';sDeco();sDeco();
    S.panel=mountAnswer(A,q,ok=>sSubmit(ok));
  }
  $('#sFb').innerHTML='';sPower();sHud();
  if(q.autoSay)setTimeout(()=>{if(GM.view==='s'&&S.q===q&&!PAUSED)speak(q.qsay)},300);
}
function sSubmit(ok){
  if(S.locked||S.done||PAUSED||GM.view!=='s')return;
  let el=$$('#swim .sfish.deco').filter(e=>!e.classList.contains('taken')&&!e.classList.contains('dart'))[0];
  if(!el)el=sDeco();
  sResolve(ok,el,el.dataset.size);
}
function sTap(k){
  if(S.locked||S.done||PAUSED||GM.view!=='s')return;
  const q=S.q,els=$$('#swim .sfish[data-k]'),el=els[k];
  if(!el||el.classList.contains('gone')||el.classList.contains('taken')||el.classList.contains('dart'))return;
  const ok=S.opts[k]===q.o[0];
  els.forEach((b,j)=>{if(j===k)return;if(S.opts[j]===q.o[0])b.classList.add('right');else b.classList.add('dim')});
  sResolve(ok,el,S.sz[k]);
}
function sResolve(ok,el,size){
  const q=S.q;
  S.locked=true;clearTimeout(S.sFx);stopFish(el);
  if(S.panel)S.panel.lock();
  if(ok){
    const dt=(gnow()-S.t0)/1000;let val=FSZ[size].v+outfitBonus()+(dt<6?1:0);
    const dbl=S.dbl;if(dbl){val*=2;S.dbl=false}
    S.hold.push({size,val});S.got++;S.caught++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);
    sfx('correct');runOk(q);if(S.combo>=3)comboFx(S.combo);
    const evk=sLuckRoll();
    $('#sFb').innerHTML=coachHTML(true,`Bắt được ${FSZ[size].n}! `+(dbl?'🌈 Nhân đôi! ':'')+pick(PRAISE)+` <span class="rw">+${val} 🪙</span>`,esc(q.exp||q.ansText||''));
    if(q.speakAns)speak(q.speakAns);
    sPower();
    sCast(el,true,()=>{sHud();if(evk)setTimeout(()=>sLuck(evk),250)});
    clearTimeout(S.next);S.next=setTimeout(()=>{if(S.got>=S.need)return sHarborGo();S.i++;sQ()},evk?5200:2900);
  }else{
    el.classList.add('no');
    sWrong(false);sCast(el,false,null);
  }
}
function sWrong(timeout){
  const q=S.q;S.locked=true;S.combo=0;
  let msg,lostFish=null,safe=false;
  if(S.horn>0){S.horn--;safe=true;msg='📯 Còi xua cá mập! Cá mập bỏ đi, bạn không mất cá.'}
  else if(ME.items.shield>0){ME.items.shield--;meSave();safe=true;msg='🛡️ Khiên bảo vệ đã cứu bạn khỏi cá mập!'}
