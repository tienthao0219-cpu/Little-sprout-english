<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>School Activities Hub — Unit 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff8ec; --sky:#cfe9ff; --sky-d:#6bb6f2; --pink:#ffd3e4; --pink-d:#ff86b3;
  --mint:#d3f5e4; --mint-d:#4fc99a; --lemon:#fff2b0; --lemon-d:#f5c93a;
  --lav:#e3dcff; --lav-d:#9a86f0; --peach:#ffe1cc; --peach-d:#ffa56b;
  --ink:#463c6b; --ink-soft:#7b7299; --good:#2fbf8a; --bad:#ff5c7a;
  --card:rgba(255,255,255,.8); --sh:0 8px 24px rgba(120,100,180,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Quicksand','Be Vietnam Pro',system-ui,-apple-system,sans-serif;font-weight:600;color:var(--ink);
  background:
    radial-gradient(circle at 8% 0%,#ffe6f1 0,transparent 38%),
    radial-gradient(circle at 96% 8%,#d7edff 0,transparent 40%),
    radial-gradient(circle at 18% 100%,#dcf7e8 0,transparent 44%),
    linear-gradient(180deg,#fff9ee,#f5efff);
  background-attachment:fixed;min-height:100vh;padding-bottom:96px;
}
h1,h2,h3,h4,.btn,.nav button,.chip,.qcount{font-family:'Baloo 2','Quicksand',sans-serif}
h2{margin:0 0 6px;font-size:26px}
h3{margin:0 0 6px;font-size:20px}
p{margin:6px 0}
button{font-family:inherit;color:inherit}
.hide{display:none!important}

/* ===== Header ===== */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px;max-width:1080px;margin:0 auto}
.brand h1{margin:0;font-size:32px;line-height:1.05;font-weight:800;background:linear-gradient(90deg,#ff86b3,#9a86f0 50%,#6bb6f2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.brand p{margin:2px 0 0;color:var(--ink-soft);font-size:14px}
.tools{display:flex;align-items:center;gap:8px}
.coinpill{display:flex;align-items:center;gap:6px;background:var(--lemon);border:2px solid var(--lemon-d);border-radius:999px;padding:3px 12px 3px 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px}
.coinpill svg{width:24px;height:24px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:2px solid #fff;background:var(--card);box-shadow:var(--sh);font-size:20px;cursor:pointer}
.iconbtn:active{transform:scale(.94)}
.teacher{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid #fff;border-radius:999px;padding:3px 14px 3px 3px;box-shadow:var(--sh);font-family:'Baloo 2',sans-serif;font-weight:700}
.teacher .av{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--pink);display:block}
.teacher .av svg,.teacher .av img{width:100%;height:100%;display:block;object-fit:cover}

main{max-width:1080px;margin:0 auto;padding:8px 14px 20px}
.card{background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.95);border-radius:22px;box-shadow:var(--sh);padding:16px;margin:12px 0}
.pop{animation:pop .45s ease both}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.sub{color:var(--ink-soft);font-size:15px;margin:0 0 8px}
.floaty{animation:float 3s ease-in-out infinite}

/* ===== Buttons ===== */
.btn{border:0;border-radius:999px;padding:10px 22px;font-size:17px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(180deg,#8cc9f7,var(--sky-d));box-shadow:0 4px 0 rgba(70,60,107,.16);min-height:44px}
.btn:active{transform:scale(.96)}
.btn.pink{background:linear-gradient(180deg,#ffa6c8,var(--pink-d))}
.btn.mint{background:linear-gradient(180deg,#7fe0b9,var(--mint-d))}
.btn.lemon{background:linear-gradient(180deg,#ffe27a,var(--lemon-d));color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--lav);box-shadow:none}
.btn.sm{padding:6px 14px;font-size:15px;min-height:36px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.chip.sky{background:var(--sky)}.chip.pink{background:var(--pink)}.chip.mint{background:var(--mint)}.chip.lemon{background:var(--lemon)}.chip.lav{background:var(--lav)}.chip.peach{background:var(--peach)}

/* ===== Bottom nav ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:2px solid #fff;box-shadow:0 -6px 20px rgba(120,100,180,.14)}
.nav button{position:relative;flex:1;max-width:150px;border:0;background:transparent;border-radius:16px;padding:6px 2px 4px;cursor:pointer;color:var(--ink-soft);font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button svg{width:26px;height:26px}
.nav button.on{background:var(--lav);color:var(--ink)}
.nav button:active{transform:scale(.95)}
.nav .dn{position:absolute;top:2px;right:18%;width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;font-size:10px;line-height:16px;text-align:center;display:none}
.nav button.done .dn{display:block}

/* ===== Flashcard ===== */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fc{height:268px;cursor:pointer}
.fc-in{height:100%;transition:transform .15s ease-in;border-radius:22px}
.fc-f,.fc-b{height:100%;border-radius:22px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;box-shadow:var(--sh);border:3px solid #fff}
.fc-f{background:linear-gradient(180deg,#fff,var(--sky))}
.fc-b{background:linear-gradient(180deg,#fff,var(--pink));display:none;justify-content:center;gap:10px}
.fc.flip .fc-f{display:none}.fc.flip .fc-b{display:flex}
.fc.g-why .fc-f{background:linear-gradient(180deg,#fff,var(--lemon))}
.fc.g-extra .fc-f{background:linear-gradient(180deg,#fff,var(--mint))}
.fc-pic{width:112px;height:112px;margin-top:6px}
.fc-pic svg,.fc-pic img{width:100%;height:100%;object-fit:contain;display:block}
.fc-en{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:21px;line-height:1.1;margin-top:6px}
.fc-ipa{color:var(--ink-soft);font-size:14px;margin-top:2px}
.fc-pos{margin-top:4px;font-size:12px;color:var(--ink-soft);background:#fff;border-radius:999px;padding:1px 10px}
.fc-vi{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;line-height:1.15}
.fc-ex{font-size:16px;background:#fff;border-radius:14px;padding:8px 10px;line-height:1.3}
.say{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:var(--lav);font-size:17px;cursor:pointer;box-shadow:0 2px 6px rgba(70,60,107,.15)}
.say:active{transform:scale(.9)}
.fsec-t{display:flex;align-items:center;gap:8px;margin:18px 4px 8px}
.progbar{height:12px;border-radius:99px;background:#fff;overflow:hidden;border:2px solid var(--lav)}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-d),var(--lav-d),var(--sky-d));border-radius:99px;transition:width .3s}

/* ===== Grammar ===== */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2px solid var(--lav);background:#fff;border-radius:999px;padding:8px 18px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:17px;cursor:pointer}
.tab.on{background:var(--lav);}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.tile{border-radius:14px;padding:8px 14px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;border:2px solid rgba(70,60,107,.12)}
.tile.q{background:var(--sky)}.tile.a{background:var(--pink)}.tile.v{background:var(--mint)}.tile.s{background:var(--lemon)}.tile.p{background:var(--lav)}
.plus{font-weight:800;color:var(--ink-soft)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rule{border-radius:18px;padding:12px 14px;border:2px solid rgba(70,60,107,.1)}
.rule.m{background:var(--mint)}.rule.l{background:var(--lemon)}
.rule h4{margin:0 0 4px;font-size:18px}
.bubbles{display:grid;gap:10px;margin-top:6px}
.bub{display:flex;gap:10px;align-items:flex-start}
.bub.r{flex-direction:row-reverse}
.bub .face{width:54px;height:54px;border-radius:50%;overflow:hidden;background:var(--pink);flex:none;border:3px solid #fff;box-shadow:var(--sh)}
.bub .face svg,.bub .face img{width:100%;height:100%;display:block;object-fit:cover}
.bub .say2{background:var(--sky);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:18px;line-height:1.35;position:relative}
.bub.r .say2{background:var(--pink);border-radius:18px 18px 6px 18px}
.bub .say2 button{border:0;background:#fff;border-radius:50%;width:30px;height:30px;margin-left:6px;cursor:pointer;font-size:14px;vertical-align:middle}
table.t{border-collapse:separate;border-spacing:0 6px;width:100%}
table.t td,table.t th{padding:8px 12px;background:#fff;text-align:left}
table.t td:first-child,table.t th:first-child{border-radius:12px 0 0 12px}
table.t td:last-child,table.t th:last-child{border-radius:0 12px 12px 0}
table.t th{background:var(--lav);font-family:'Baloo 2',sans-serif}
.builder{background:linear-gradient(180deg,#fff,var(--lav));border-radius:20px;padding:14px;border:2px solid #fff}
.pickrow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.pk{border:2px solid var(--lav);background:#fff;border-radius:999px;padding:6px 14px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;cursor:pointer}
.pk.on{background:var(--pink);border-color:var(--pink-d)}
.pk.on2{background:var(--sky);border-color:var(--sky-d)}
.pk.on3{background:var(--lemon);border-color:var(--lemon-d)}
.bout{background:#fff;border-radius:16px;padding:10px 14px;margin-top:6px;font-size:20px;line-height:1.5}
.bout b.hl{background:var(--lemon);border-radius:8px;padding:0 6px}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.reasons .rs{background:#fff;border-radius:18px;padding:8px;text-align:center;border:2px solid var(--lav)}
.reasons .rs svg,.reasons .rs img{width:64px;height:64px;display:block;margin:0 auto}

/* ===== Practice ===== */
.pmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pm{border:0;border-radius:24px;padding:18px 14px;text-align:center;cursor:pointer;box-shadow:var(--sh);border:3px solid #fff}
.pm:active{transform:scale(.97)}
.pm .big{width:84px;height:84px;margin:0 auto 4px;display:block}
.pm h3{font-size:24px}
.pm.v{background:linear-gradient(180deg,#fff,var(--sky))}.pm.g{background:linear-gradient(180deg,#fff,var(--pink))}.pm.x{background:linear-gradient(180deg,#fff,var(--mint))}
.stars{font-size:22px;letter-spacing:2px;color:var(--lemon-d)}
.qtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qnav{display:flex;gap:8px}
.qnav button{display:flex;flex-direction:column;align-items:center;gap:0;border:2px solid #fff;background:var(--card);border-radius:16px;min-width:62px;padding:6px 8px;box-shadow:var(--sh);cursor:pointer;font-size:22px;line-height:1.1}
.qnav button small{font-family:'Baloo 2',sans-serif;font-size:12px;color:var(--ink-soft)}
.qnav button:active{transform:scale(.94)}
.qcount{background:var(--lav);border-radius:999px;padding:6px 18px;font-size:20px;font-weight:800}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.pill{width:38px;height:38px;border-radius:50%;border:2px solid var(--lav);background:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;cursor:pointer}
.pill.cur{border-color:var(--ink);box-shadow:0 0 0 3px var(--lav)}
.pill.ok{background:var(--good);border-color:var(--good);color:#fff}
.pill.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.pill.skip{background:var(--lemon);border-color:var(--lemon-d)}
.qcard{padding:18px}
.qstem{font-size:18px;color:var(--ink-soft);margin-bottom:6px}
.qmain{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;line-height:1.25;margin:4px 0 12px}
.qpic{width:130px;height:130px;margin:0 auto 6px;display:block}
.qpic svg,.qpic img{width:100%;height:100%;object-fit:contain}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:3px solid var(--lav);background:#fff;border-radius:18px;padding:12px 14px;font-size:19px;font-weight:700;cursor:pointer;min-height:56px}
.opt .ltr{width:32px;height:32px;border-radius:50%;background:var(--lav);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;flex:none}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--sky-d);background:var(--sky)}
.opt.ok{border-color:var(--good);background:#d5f7e8}
.opt.bad{border-color:var(--bad);background:#ffe0e6}
.fillbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fillbox input,.hwin{font:inherit;font-weight:700;font-size:20px;padding:10px 14px;border-radius:16px;border:3px solid var(--lav);background:#fff;color:var(--ink);min-width:200px;outline:none}
.fillbox input:focus,.hwin:focus{border-color:var(--sky-d)}
.fillbox input.ok,.hwin.ok{border-color:var(--good);background:#d5f7e8}
.fillbox input.bad,.hwin.bad{border-color:var(--bad);background:#ffe0e6}
.hintline{font-family:'Baloo 2',sans-serif;font-size:22px;letter-spacing:3px;background:var(--lemon);border-radius:12px;padding:2px 12px;display:inline-block;margin-top:8px}
.slots{min-height:62px;border:3px dashed var(--lav);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;background:#fff;margin-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tk{border:2px solid var(--sky-d);background:var(--sky);border-radius:14px;padding:8px 14px;font-size:20px;font-weight:700;cursor:pointer;font-family:'Quicksand',sans-serif}
.tk.used{opacity:.25;pointer-events:none}
.tk:active{transform:scale(.95)}
.fb{display:flex;gap:12px;align-items:center;border-radius:20px;padding:12px 14px;margin-top:14px;position:relative;overflow:hidden}
.fb.ok{background:#d5f7e8;border:3px solid var(--good)}
.fb.bad{background:#ffe6eb;border:3px solid var(--bad)}
.fb .mas{width:88px;height:88px;flex:none}
.fb .mas svg,.fb .mas img{width:100%;height:100%;object-fit:contain}
.fb .txt{font-size:18px;line-height:1.4}
.fb .txt b.t{font-family:'Baloo 2',sans-serif;font-size:22px;display:block}
.fb .auto{position:absolute;left:0;bottom:0;height:5px;background:var(--ink);opacity:.25;animation:autoBar linear forwards}
@keyframes autoBar{from{width:100%}to{width:0}}
.result{text-align:center}
.bigscore{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:56px;line-height:1}
.wrongrow{background:#fff;border-radius:14px;padding:8px 12px;text-align:left;margin:6px 0;font-size:16px}

/* ===== Game ===== */
.gmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.gcard{border-radius:24px;padding:16px;text-align:center;border:3px solid #fff;box-shadow:var(--sh);cursor:pointer}
.gcard:active{transform:scale(.97)}
.gcard .mini{width:90px;height:90px;margin:0 auto}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.shopi{background:#fff;border-radius:20px;padding:12px;border:2px solid var(--lav);text-align:center}
.shopi svg{width:56px;height:56px}
.pips{display:flex;justify-content:center;gap:5px;margin:4px 0}
.pips i{width:14px;height:14px;border-radius:50%;background:var(--lav);display:block}
.pips i.on{background:var(--lemon-d)}
.ghud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.hearts{display:flex;gap:3px}
.hearts svg{width:30px;height:30px}
.gstat{background:#fff;border-radius:999px;padding:4px 14px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;border:2px solid var(--lav)}
.gstat.combo{background:var(--lemon);border-color:var(--lemon-d)}
.gq{text-align:center;padding:12px 14px}
.gq .qmain{margin:2px 0 6px}
.gq .qpic{width:84px;height:84px}
.gbar{height:14px;border-radius:99px;background:#fff;border:2px solid var(--lav);overflow:hidden;margin-top:6px}
.gbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mint-d),var(--lemon-d),var(--pink-d));transition:width .1s linear}
.gfield{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-radius:24px;background:linear-gradient(180deg,#d8f5c9,#bfeaa8);border:4px solid #fff;box-shadow:var(--sh);position:relative;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.hole{position:relative;height:140px;overflow:hidden;cursor:pointer}
.mound{position:absolute;left:0;right:0;bottom:0;height:46px;border-radius:50% 50% 18px 18px/60% 60% 18px 18px;background:linear-gradient(180deg,#a97f58,#7e5a3d);z-index:3}
.mound::before{content:"";position:absolute;left:12%;right:12%;top:-6px;height:20px;border-radius:50%;background:#4b3426}
.mole{position:absolute;left:4px;right:4px;bottom:20px;height:112px;transform:translateY(120%);transition:transform .2s ease-out;z-index:2;display:flex;justify-content:center}
.mole.up{transform:translateY(0)}
.mole .msvg{width:84px;height:84px;margin-top:0}
.mole .msvg svg,.mole .msvg img{width:100%;height:100%;display:block;object-fit:contain}
.mole .msvg img{object-position:center bottom}
.mole.img .msvg{height:74px;width:100%}
.mole.img .sign{bottom:4px}
.mole.img{height:112px;z-index:4}
.mole .sign{position:absolute;left:0;right:0;bottom:30px;z-index:4;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 4px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;line-height:1.05;text-align:center;box-shadow:0 3px 0 rgba(70,60,107,.25);min-height:34px;display:flex;align-items:center;justify-content:center}
.mole.gold .sign{background:var(--lemon);border-color:var(--lemon-d)}
.mole.gift .sign{background:var(--lav);border-color:var(--lav-d)}
.mole.hit{animation:shake .25s}
.mole.bad .sign{background:#ffe0e6;border-color:var(--bad)}
.float{position:absolute;left:0;right:0;top:20px;text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);z-index:5;pointer-events:none;animation:flo .8s ease-out forwards}
@keyframes flo{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-44px)}}
.overlay{position:fixed;left:0;right:0;top:0;bottom:0;z-index:80;background:rgba(70,60,107,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .box{background:#fff;border-radius:26px;padding:22px;max-width:420px;width:100%;text-align:center;box-shadow:var(--sh)}
.gfb{position:absolute;left:10px;right:10px;bottom:10px;z-index:9;border-radius:18px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:16px;background:#ffe6eb;border:3px solid var(--bad)}
.gfb .mas{width:54px;height:54px;flex:none}
.gfb .mas svg,.gfb .mas img{width:100%;height:100%}

/* ===== Homework ===== */
.hwrow{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;margin:8px 0}
.hwrow .n{width:30px;height:30px;border-radius:50%;background:var(--lav);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800}
.hwq{font-size:19px;line-height:1.8}
.hwin{min-width:0;width:130px;padding:4px 10px;font-size:18px;border-radius:12px}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function sample(a,n){return shuffle(a).slice(0,n)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ---------- Âm thanh: tổng hợp bằng Web Audio (không cần file) ---------- */
let AC=null;
function actx(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C){try{AC=new C()}catch(e){}}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function tone(f,t,d,type,vol){
  const c=actx();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;
  const t0=c.currentTime+t;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.2,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.05);
}
const SFX={
  click(){tone(660,0,.07,'triangle',.12)},
  correct(){tone(660,0,.12,'sine',.22);tone(880,.1,.12,'sine',.22);tone(1175,.2,.24,'sine',.22)},
  wrong(){tone(220,0,.18,'sawtooth',.14);tone(165,.16,.3,'sawtooth',.14)},
  coin(){tone(988,0,.08,'square',.08);tone(1319,.07,.2,'square',.08)},
  whack(){tone(170,0,.1,'triangle',.3);tone(90,.05,.14,'sine',.3)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.28,'triangle',.22))},
  lose(){[392,330,262].forEach((f,i)=>tone(f,i*.16,.32,'sawtooth',.12))},
  pop(){tone(420,0,.06,'sine',.1)},
  tick(){tone(880,0,.05,'square',.07)}
};
function sfx(n){if(S.mute)return;try{SFX[n]()}catch(e){}}

let VOICE=null;
function pickVoice(){try{const v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];VOICE=v.filter(x=>/en[-_]GB/i.test(x.lang))[0]||v.filter(x=>/^en/i.test(x.lang))[0]||null}catch(e){}}

  if(S.mute||!window.speechSynthesis||!text)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';if(VOICE)u.voice=VOICE;u.rate=.85;speechSynthesis.speak(u)}catch(e){}
}

/* =====================================================================
   NGÂN HÀNG CÂU HỎI (sinh tự động, mỗi lần chơi ra câu khác nhau)
   ===================================================================== */
function mcq(correct,wrongs,extra){
  const w=[];wrongs.forEach(x=>{if(x!==correct&&w.indexOf(x)<0)w.push(x)});
  const opts=shuffle([correct].concat(w.slice(0,3)));
  return Object.assign({type:'mc',opts:opts,ans:opts.indexOf(correct)},extra);
}
/* ----- TỪ VỰNG ----- */
function vPic(v){return mcq(v.en,sample(VOCAB.filter(x=>x.id!==v.id),3).map(x=>x.en),{key:'v:'+v.id,vid:v.id,mode:'v',stem:'Hình này là gì? Chọn từ tiếng Anh đúng.',img:v.id,main:'',short:true,speak:v.en,why:'Hình này là "'+v.en+'" — '+v.vi+'.'})}
function vVi(v){return mcq(v.en,sample(VOCAB.filter(x=>x.id!==v.id),3).map(x=>x.en),{key:'v:'+v.id,vid:v.id,mode:'v',stem:'Chọn từ tiếng Anh có nghĩa là:',main:v.vi,short:true,speak:v.en,why:'"'+v.vi+'" trong tiếng Anh là "'+v.en+'".'})}
function vEn(v){return mcq(v.vi,sample(VOCAB.filter(x=>x.id!==v.id),3).map(x=>x.vi),{key:'v:'+v.id,vid:v.id,mode:'v',stem:'Chọn nghĩa tiếng Việt đúng:',main:v.en,speak:v.en,why:'"'+v.en+'" nghĩa là "'+v.vi+'".'})}
function vFill(v){return {type:'fill',key:'v:'+v.id,vid:v.id,mode:'v',stem:'Nhìn hình và gõ từ tiếng Anh:',img:v.id,main:v.vi,accept:[v.en],hintBase:v.en,speak:v.en,why:'Đáp án là "'+v.en+'" — '+v.vi+'.'}}
function vTF(v){
  const same=Math.random()<.5;const shown=same?v:pick(VOCAB.filter(x=>x.id!==v.id));
  return {type:'mc',opts:['Đúng ✔','Sai ✘'],ans:same?0:1,key:'v:'+v.id,vid:v.id,mode:'v',stem:'Hình và từ này có khớp nhau không?',img:v.id,main:shown.en,short:true,
    why:same?'Đúng! Hình này là "'+v.en+'".':'Sai. Hình này là "'+v.en+'", không phải "'+shown.en+'".'};
}
function vOddAct(){const a=pick(ACT);return mcq(a.en,sample(WHY.concat(EXTRA.filter(x=>x.id!=='activity')),3).map(x=>x.en),{key:'v:odd-act',vid:'odd-act',mode:'v',stem:'Từ nào là một hoạt động ở trường (school activity)?',main:'',short:true,speak:a.en,why:'"'+a.en+'" là hoạt động ở trường. Các từ còn lại không phải hoạt động.'})}
function vOddWhy(){const w=pick(WHY);return mcq(w.en,sample(ACT,3).map(x=>x.en),{key:'v:odd-why',vid:'odd-why',mode:'v',stem:'Từ nào dùng để nói LÝ DO thích (đứng sau "it\'s")?',main:'',short:true,speak:w.en,why:'"'+w.en+'" dùng sau "it\'s" để nói lý do: it\'s '+w.en+'.'})}
function vocabPool(){
  const out=[];
  VOCAB.forEach(v=>{out.push(()=>vPic(v),()=>vVi(v),()=>vEn(v),()=>vFill(v),()=>vTF(v))});
  out.push(vOddAct,vOddWhy);
  return out;
}
function vocabSet(n){
  const gens=shuffle(vocabPool()),used={},out=[];
  for(let i=0;i<gens.length&&out.length<n;i++){const q=gens[i]();if(used[q.vid])continue;used[q.vid]=1;out.push(q)}
  return out;
}
/* ----- NGỮ PHÁP ----- */
function gAux(){const s=pick(QSUB),t=isThird(s),c=t?'does':'do';
  return mcq(c,['do','does','is','are'],{key:'g:aux',mode:'g',stem:'Chọn từ đúng điền vào chỗ trống:',main:'What school activity ____ '+s+' like?',short:true,speak:'What school activity '+c+' '+s+' like?',
    why:t?'"'+s+'" là ngôi thứ ba số ít (he / she / tên riêng) → dùng "does".':'"'+s+'" → dùng "do" (I / you / we / they).'})}
function gLikes(){const s=pick(ASUB),a=pick(ACT),t=isThird(s),c=t?'likes':'like';
  return mcq(c,['like','likes','liking','is liking'],{key:'g:likes',mode:'g',stem:'Chọn dạng đúng của động từ "like":',main:s+' ____ '+a.ing+'.',short:true,speak:s+' '+c+' '+a.ing+'.',
    why:t?'"'+s+'" là he / she / tên riêng → động từ thêm -s: likes.':'"'+s+'" → động từ giữ nguyên: like.'})}
function gIng(){const s=pick(ASUB),a=pick(ACT),f=ACTV[a.id],t=isThird(s),l=t?'likes':'like';
  return mcq(f.ing,[f.v,f.s,'is '+f.ing],{key:'g:ing',mode:'g',stem:'Sau "like" ta dùng V-ing. Chọn đáp án đúng:',main:s+' '+l+' ____ '+f.o+'.',short:true,speak:s+' '+l+' '+a.ing+'.',
    why:'Sau "like" dùng V-ing: '+f.v+' → '+f.ing+'.'+(f.v==='solve'?' (solve bỏ e rồi thêm -ing)':'')})}
function gReply(){
  const q=pick(QSUB),A=ansOf(q),t=isThird(q),a=pick(ACT),f=ACTV[a.id],c=t?'does':'do';
  const good=A+' '+(t?'likes':'like')+' '+a.ing+'.';
  return mcq(good,[A+' '+(t?'like':'likes')+' '+a.ing+'.',A+' '+(t?'likes':'like')+' '+f.v+' '+f.o+'.',A+' '+(t?'does':'do')+' '+a.ing+'.'],
    {key:'g:reply',mode:'g',stem:'Chọn câu TRẢ LỜI đúng:',main:'What school activity '+c+' '+q+' like?',speak:good,
     why:'Trả lời: '+A+' '+(t?'likes':'like')+' + V-ing. '+(t?'Ngôi thứ ba nên like thêm -s.':'Chủ ngữ này dùng like.')})}
function gWhyAux(){const s=pick(QSUB),t=isThird(s),c=t?'does':'do',a=pick(ACT);
  return mcq(c,['do','does','is','are'],{key:'g:whyaux',mode:'g',stem:'Chọn từ đúng điền vào chỗ trống:',main:'Why ____ '+s+' like '+a.ing+'?',short:true,speak:'Why '+c+' '+s+' like '+a.ing+'?',
    why:t?'Câu hỏi "Why": '+s+' là ngôi thứ ba → "does".':'Câu hỏi "Why": '+s+' → "do".'})}
function gThink(){const s=pick(['I','We','They','He','She']),t=isThird(s),c=t?'thinks':'think',w=pick(WHY);
  return mcq(c,['think','thinks','thinking','thought'],{key:'g:think',mode:'g',stem:'Chọn dạng đúng của động từ "think":',main:'Because '+low(s)+' ____ it\'s '+w.en+'.',short:true,speak:'Because '+low(s)+' '+c+" it's "+w.en+'.',
    why:t?'"'+s+'" là he / she → think thêm -s: thinks.':'"'+s+'" → think giữ nguyên.'})}
function gWhyReply(){
  const q=pick(QSUB),A=ansOf(q),t=isThird(q),c=t?'does':'do',a=pick(ACT),w=pick(WHY),th=t?'thinks':'think';
  const good='Because '+low(A)+' '+th+" it's "+w.en+'.';
  return mcq(good,['Because '+low(A)+' '+(t?'think':'thinks')+" it's "+w.en+'.','Because '+low(A)+' '+th+' '+w.en+'.','Because '+low(A)+' '+(t?'likes':'like')+" it's "+w.en+'.'],
    {key:'g:whyreply',mode:'g',stem:'Chọn câu TRẢ LỜI đúng:',main:'Why '+c+' '+q+' like '+a.ing+'?',speak:good,
     why:'Mẫu trả lời: Because + S + '+(t?'thinks':'think')+" + it's + tính từ. Đừng quên \"it's\"!"})}
function gFillAux(){const s=pick(QSUB),c=isThird(s)?'does':'do';
  return {type:'fill',key:'g:fillaux',mode:'g',stem:'Gõ từ còn thiếu (do hay does?):',main:'What school activity ____ '+s+' like?',accept:[c],hintBase:c,speak:'What school activity '+c+' '+s+' like?',why:'"'+s+'" → dùng "'+c+'".'}}
function gFillWhy(){const s=pick(QSUB),c=isThird(s)?'does':'do',a=pick(ACT);
  return {type:'fill',key:'g:fillwhy',mode:'g',stem:'Gõ từ còn thiếu (do hay does?):',main:'Why ____ '+s+' like '+a.ing+'?',accept:[c],hintBase:c,speak:'Why '+c+' '+s+' like '+a.ing+'?',why:'"'+s+'" → dùng "'+c+'".'}}
function gFillThink(){const s=pick(['I','We','They','He','She']),c=isThird(s)?'thinks':'think',w=pick(WHY);
  return {type:'fill',key:'g:fillthink',mode:'g',stem:'Gõ động từ "think" đúng dạng:',main:'Because '+low(s)+' ____ it\'s '+w.en+'.',accept:[c],hintBase:c,speak:'Because '+low(s)+' '+c+" it's "+w.en+'.',why:'"'+s+'" → "'+c+'".'}}
function gFillIng(){const s=pick(ASUB),a=pick(ACT),f=ACTV[a.id],l=isThird(s)?'likes':'like';
  return {type:'fill',key:'g:fillingq',mode:'g',stem:'Điền dạng đúng của động từ trong ngoặc:',main:s+' '+l+' ____ '+f.o+'. ('+f.v+')',accept:[f.ing],hintBase:f.ing,speak:s+' '+l+' '+a.ing+'.',why:'Sau "like" dùng V-ing: '+f.v+' → '+f.ing+'.'}}
function orderQ(){
  const type=pick(['q1','a1','q2','a2']),s=pick(QSUB),A=ansOf(s),t=isThird(s),a=pick(ACT),w=pick(WHY);
  const aux=t?'does':'do';let target,stem;
  if(type==='q1'){target='What school activity '+aux+' '+s+' like?';stem='Sắp xếp thành CÂU HỎI về hoạt động yêu thích ở trường:'}
  else if(type==='a1'){target=A+' '+(t?'likes':'like')+' '+a.ing+'.';stem='Sắp xếp thành câu TRẢ LỜI về hoạt động yêu thích:'}
  else if(type==='q2'){target='Why '+aux+' '+s+' like '+a.ing+'?';stem='Sắp xếp thành CÂU HỎI về lý do thích:'}
  else{target='Because '+low(A)+' '+(t?'thinks':'think')+" it's "+w.en+'.';stem='Sắp xếp thành câu TRẢ LỜI nêu lý do:'}
  return {type:'order',key:'g:order:'+type,mode:'g',stem:stem,main:'',target:target,tiles:shuffle(target.split(' ')),speak:target,why:'Câu đúng là: "'+target+'"'};
}
function gTF(){
  const s=pick(ASUB),a=pick(ACT),t=isThird(s),w=pick(WHY),kind=pick(['like','think','aux']);let good,bad,why;
  if(kind==='like'){good=s+' '+(t?'likes':'like')+' '+a.ing+'.';bad=s+' '+(t?'like':'likes')+' '+a.ing+'.';why=t?'"'+s+'" là he / she / tên riêng → phải là "likes".':'"'+s+'" → phải là "like" (không thêm -s).'}
  else if(kind==='think'){const th=t?'thinks':'think';good='Because '+low(s)+' '+th+" it's "+w.en+'.';bad='Because '+low(s)+' '+(t?'think':'thinks')+" it's "+w.en+'.';why=t?'he / she / tên riêng → "thinks".':'I / we / they → "think".'}
  else{const q=pick(QSUB),tq=isThird(q);good='Why '+(tq?'does':'do')+' '+q+' like '+a.ing+'?';bad='Why '+(tq?'do':'does')+' '+q+' like '+a.ing+'?';why=tq?'"'+q+'" → dùng "does".':'"'+q+'" → dùng "do".'}
  const ok=Math.random()<.5;
  return {type:'mc',opts:['Đúng ✔','Sai ✘'],ans:ok?0:1,key:'g:tf',mode:'g',stem:'Câu này ĐÚNG hay SAI ngữ pháp?',main:ok?good:bad,short:true,speak:good,
    why:ok?'Đúng rồi! '+why:'Câu sai. Câu đúng là: "'+good+'" — '+why};
}
function grammarPool(){return [gAux,gLikes,gIng,gReply,gWhyAux,gThink,gWhyReply,gFillAux,gFillWhy,gFillThink,gFillIng,orderQ,orderQ,gTF,gTF]}
function grammarSet(n){
  const gens=shuffle(grammarPool()),out=[],seen={};
  for(let i=0;i<gens.length&&out.length<n;i++){const q=gens[i]();const k=q.key+'|'+q.main+'|'+(q.target||'');if(seen[k])continue;seen[k]=1;out.push(q)}
  return out;
}
function buildSet(mode,n){
  if(mode==='v')return vocabSet(n);
  if(mode==='g')return grammarSet(n);
  const h=Math.floor(n/2),v=vocabSet(h),g=grammarSet(n-h),out=[];
  for(let i=0;i<Math.max(v.length,g.length);i++){if(v[i])out.push(v[i]);if(g[i])out.push(g[i])}
  return out;
}
/* câu hỏi cho GAME: chỉ lấy dạng trắc nghiệm có đáp án ngắn (hiện trên bảng chuột) */
function gameSet(round,n){
  const out=[],seen={};
  const gens=[];
  const vg=()=>pick([()=>vPic(pick(VOCAB)),()=>vVi(pick(VOCAB)),()=>vTF(pick(VOCAB)),vOddAct,vOddWhy]);
  const gg=()=>pick([gAux,gLikes,gIng,gWhyAux,gThink,gTF]);
  let guard=0;
  while(out.length<n&&guard++<400){
    const q=round==='v'?vg()():round==='g'?gg()():(out.length%2?gg()():vg()());
    const k=q.key+'|'+q.main+'|'+(q.img||'')+'|'+q.opts.join('/');
    if(seen[k]||q.type!=='mc'||!q.short)continue;seen[k]=1;out.push(q);
  }
  return out;
}
function hintText(base,level){
  return base.split(' ').map(w=>{
    if(level<=0)return w.replace(/./g,'_');
    return w.split('').map((ch,i)=>(i===0||(level>=2&&i===w.length-1))?ch:'_').join('');
  }).join('  ');
}

  }else{
    body='<div class="slots">'+(P.built.length?P.built.map((k,pos)=>'<button class="tk" data-act="qunt" data-pos="'+pos+'">'+esc(q.tiles[k])+'</button>').join(''):'<span class="sub" style="margin:6px">Chạm vào các từ bên dưới để xếp câu...</span>')+'</div>'+
      '<div class="bank">'+q.tiles.map((t,k)=>'<button class="tk '+(P.built.indexOf(k)>-1?'used':'')+'" data-act="qtile" data-k="'+k+'">'+esc(t)+'</button>').join('')+'</div>'+
      (ans?'':'<div style="margin-top:8px"><button class="btn sm ghost" data-act="qclear">Xếp lại</button></div>');
  }
  let fb='';
  if(ans){
    fb='<div class="fb '+(r.ok?'ok':'bad')+'"><div class="mas">'+mascot(r.ok?'happy':'oops')+'</div><div class="txt"><b class="t">'+(r.ok?pick(PRAISE):'Chưa đúng rồi!')+'</b>'+

  }
  const act=ans?'':'<div style="margin-top:14px" class="row"><button class="btn mint" data-act="qcheck">Kiểm tra ✔</button><span class="sub" style="margin:0">hoặc nhấn Enter</span></div>';
  const card='<section class="card qcard pop '+(ans?'locked':'')+'"><div class="qstem">'+esc(q.stem)+'</div>'+
    (q.img?'<div class="qpic">'+pic(q.img)+'</div>':'')+(q.main?'<div class="qmain">'+mainHtml(q)+'</div>':'')+body+act+fb+'</section>';

function qcheck(){
  const q=P.qs[P.i];if(!q||isAns(P.i))return;
  let ok=false,given='';
  if(q.type==='mc'){if(P.sel==null){toast('Chọn một đáp án trước nhé!');return}ok=P.sel===q.ans;given=q.opts[P.sel]}
  else if(q.type==='fill'){if(!norm(P.fillVal)){toast('Gõ đáp án trước nhé!');return}ok=q.accept.some(a=>norm(a)===norm(P.fillVal));given=P.fillVal}
  else{if(P.built.length<q.tiles.length){toast('Hãy xếp hết các từ nhé!');return}given=P.built.map(k=>q.tiles[k]).join(' ');ok=norm(given)===norm(q.target)}
  P.res[P.i]={ok:ok,given:given,sel:P.sel,fillVal:P.fillVal,built:P.built.slice()};
  sfx(ok?'correct':'wrong');
  if(q.speak)setTimeout(()=>{speak(q.speak)},ok?450:350);
  clearAuto();
  const at=P.i;
  P.auto=setTimeout(()=>{if(ui.tab==='practice'&&P.screen==='quiz'&&P.i===at)qadvance()},CFG.autoNextMs);
  render(true);
}
function qadvance(){
  clearAuto();
  let nxt=-1;
  for(let k=P.i+1;k<P.qs.length;k++){if(!isAns(k)){nxt=k;break}}
  if(nxt<0)nxt=firstUnans(P.i);
  if(nxt<0){finishPractice();return}
  loadQ(nxt);render(true);window.scrollTo(0,0);
}
H.qgo=el=>{clearAuto();loadQ(parseInt(el.getAttribute('data-i'),10));sfx('click');render(true)};
H.qnext=()=>{
  clearAuto();
  if(P.i<P.qs.length-1){loadQ(P.i+1);sfx('click');render(true);return}
  const u=firstUnans(P.i);
  if(u>=0){toast('Còn câu chưa làm: câu '+(u+1));loadQ(u);render(true)}
  else if(isAns(P.i))finishPractice();
  else toast('Em chưa trả lời câu này nhé!');
};
H.qskip=()=>{
  if(!isAns(P.i))P.res[P.i]={skip:true};
  clearAuto();
  if(P.i<P.qs.length-1){loadQ(P.i+1)}else{const u=firstUnans(P.i);if(u>=0){toast('Còn câu chưa làm: câu '+(u+1));loadQ(u)}}
  sfx('click');render(true);
};
H.qundo=()=>{
  clearAuto();
  if(isAns(P.i)){P.res[P.i]=null;loadQ(P.i);toast('Đã xoá kết quả. Làm lại câu này nhé!')}
  else if(P.i>0){const k=P.i-1;P.res[k]=null;loadQ(k);toast('Quay lại câu '+(k+1)+'. Làm lại nhé!')}
  sfx('click');render(true);
};
H.qhome=()=>{clearAuto();P.screen='menu';sfx('click');render();window.scrollTo(0,0)};
function finishPractice(){
  clearAuto();
  const n=P.qs.length,right=P.res.filter(r=>r&&!r.skip&&r.ok).length,pct=right/n;
  P.gained=right;addCoins(right);
  if(!P.fix){
    const b=S.best['p'+P.mode];if(b==null||pct>b)S.best['p'+P.mode]=pct;save();
    if(pct>=.7)markDone('practice','Luyện tập xong rồi, giỏi quá! 🎉');
  }
  P.screen='result';sfx(pct>=.7?'win':'lose');if(pct>=.7)confetti();
  render();window.scrollTo(0,0);
}
function pResult(){
  const n=P.qs.length,right=P.res.filter(r=>r&&!r.skip&&r.ok).length,pct=right/n;
  const wrong=P.qs.map((q,k)=>({q:q,k:k})).filter(o=>!(P.res[o.k]&&P.res[o.k].ok));
  return '<section class="card result pop"><div style="width:130px;height:130px;margin:0 auto" class="floaty">'+mascot(pct>=.7?'happy':'think')+'</div>'+
    '<div class="bigscore">'+right+'/'+n+'</div><div class="stars">'+stars(pct)+'</div>'+
    '<p style="font-size:20px">'+(pct>=.9?'Xuất sắc luôn! 🌟':pct>=.7?'Giỏi lắm! 👏':pct>=.4?'Khá rồi, luyện thêm nữa nhé!':'Đừng nản, mình làm lại nào! 💪')+'</p>'+
    '<p class="chip lemon" style="font-size:18px">+'+P.gained+' xu</p>'+
    '<div class="row" style="justify-content:center;margin-top:10px">'+
    '<button class="btn" data-act="pagain">Làm bài mới</button>'+
    (wrong.length?'<button class="btn pink" data-act="pfix">Fix it! ('+wrong.length+' câu)</button>':'')+
    '<button class="btn ghost" data-act="qhome">Về menu</button></div></section>'+
    (wrong.length?'<section class="card pop"><h3>Các câu cần xem lại</h3>'+wrong.map(o=>'<div class="wrongrow"><b>'+(o.k+1)+'.</b> '+esc((o.q.main||o.q.stem).replace('____','___'))+' → <b style="color:var(--good)">'+esc(answerText(o.q))+'</b></div>').join('')+'</section>':'');
}
H.pagain=()=>startPractice(P.mode);
H.pfix=()=>{
  const wrong=P.qs.filter((q,k)=>!(P.res[k]&&P.res[k].ok)).map(q=>{
    const c=Object.assign({},q);if(c.type==='mc'){const t=c.opts[c.ans];c.opts=shuffle(c.opts);c.ans=c.opts.indexOf(t)}if(c.type==='order')c.tiles=shuffle(c.tiles);return c});
  startPractice(P.mode,wrong,true);
};

H.hwcopy=()=>{
  const hw=S.hw;let t='BÀI TẬP VỀ NHÀ · School Activities (Unit 7)\nTên: '+(hw.name||'(chưa ghi)')+'\n\nPHẦN 1: Điền từ\n';
  HWF.forEach((q,i)=>{t+=(i+1)+'. '+q.t.replace('___',hw.fill[i]||'___')+'\n'});
  t+='\nPHẦN 2: Hỏi bạn\n';
  hw.surv.forEach((r,i)=>{t+='Bạn '+(i+1)+(r.n?' ('+r.n+')':'')+':\n'+survLines(r).replace(/<br>/g,'\n').replace(/→/g,'-')+'\n'});
  t+='\nPHẦN 3: Viết về em\n'+(hw.write||'(chưa viết)')+'\n';
  const done=()=>{toast('Đã sao chép! Dán vào tin nhắn gửi cô nhé 📋');sfx('coin')};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done))}else fallbackCopy(t,done);
  }catch(e){fallbackCopy(t,done)}
};
function fallbackCopy(t,done){
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done()}catch(e){toast('Không sao chép được, em chụp màn hình gửi cô nhé!')}
  ta.remove();
}

function viewGame(){return GM.screen==='play'?gPlay():GM.screen==='result'?gResult():gMenu()}
function gMenu(){

function reshuffled(q){const c=Object.assign({},q);if(c.type==='mc'&&c.opts.length>2){const t=c.opts[c.ans];c.opts=shuffle(c.opts);c.ans=c.opts.indexOf(t)}return c}
function startGame(round,qs,fix){

function hud(){

function setQ(k){
  GM.qi=k;GM.cur=GM.qs[k];GM.qLock=false;GM.tleft=CFG.gameQTime;hideAll();

function hideAll(){GM.holes.forEach(h=>{clearTimeout(h.t);h.up=false;h.lock=false;if(h.el){h.el.classList.remove('up','hit','bad','gold','gift')}})}
function popDown(h){clearTimeout(h.t);h.up=false;h.lock=true;if(h.el)h.el.classList.remove('up');setTimeout(()=>{h.lock=false},380)}
function popUp(h,kind,idx,golden){
  const q=GM.cur,el=h.el;h.kind=kind;h.idx=idx;h.golden=golden;h.up=true;
  el.className='mole'+(golden?' gold':kind==='gift'?' gift':'')+((golden&&IMGS.mole_gold)||(kind==='gift'&&IMGS.mole_gift)||(!golden&&kind!=='gift'&&IMGS.mole)?' img':'');
  el.querySelector('.msvg').innerHTML=moleHTML(golden?'gold':kind==='gift'?'gift':'normal','ok');
  el.querySelector('.sign').textContent=kind==='gift'?'🎁 ???':q.opts[idx];
  void el.offsetWidth;el.classList.add('up');
  clearTimeout(h.t);h.t=setTimeout(()=>{popDown(h)},CFG.stayMs+S.shop.slow*500);
}
function spawn(){
  if(GM.paused||GM.over||!GM.cur||GM.qLock)return;
  const up=GM.holes.filter(h=>h.up);if(up.length>=4)return;
  const free=GM.holes.filter(h=>!h.up&&!h.lock);if(!free.length)return;
  const q=GM.cur,h=pick(free);
  if(!up.some(x=>x.kind==='gift')&&Math.random()<.08){popUp(h,'gift',0,false);return}
  const shown=up.filter(x=>x.kind==='opt').map(x=>x.idx);
  const hasRight=shown.indexOf(q.ans)>-1;
  let idx;
  if(!hasRight&&Math.random()<.6)idx=q.ans;
  else{const cand=q.opts.map((_,k)=>k).filter(k=>shown.indexOf(k)<0);if(!cand.length)return;idx=pick(cand)}
  popUp(h,'opt',idx,idx===q.ans&&Math.random()<.2);
}
function tick(){
  if(GM.paused||GM.over||!GM.cur||GM.qLock)return;
  GM.tleft-=.1;
  const b=$('#gbar');if(b)b.style.width=Math.max(0,GM.tleft/CFG.gameQTime*100)+'%';
  if(GM.tleft<=0)missed(null);
}
H.whack=el=>{
  const i=parseInt(el.getAttribute('data-h'),10);
  if(GM.paused||GM.over||GM.qLock||!GM.cur)return;
  const h=GM.holes[i];if(!h||!h.up)return;
  if(h.kind==='gift'){giftHit(h);return}
  if(h.idx===GM.cur.ans)hitRight(h);else missed(h);
};
function floatText(h,txt){
  const hole=h.el.parentNode;const f=document.createElement('div');f.className='float';f.textContent=txt;hole.appendChild(f);setTimeout(()=>{f.remove()},850);
}
function hitRight(h){
  GM.qLock=true;GM.combo++;
  const mult=GM.combo>=6?3:GM.combo>=3?2:1,g=h.golden?2:1;
  const coins=(2+S.shop.coin)*mult*g;
  GM.score+=10*mult*g;GM.right++;GM.gained+=coins;addCoins(coins);
  sfx('whack');setTimeout(()=>sfx('correct'),130);setTimeout(()=>sfx('coin'),400);
  h.el.classList.add('hit');floatText(h,'+'+coins+(h.golden?' ✨':''));
  GM.holes.forEach(x=>{if(x!==h&&x.up)popDown(x)});
  if(GM.cur.speak)setTimeout(()=>speak(GM.cur.speak),250);
  hud();
  GM.nextT=setTimeout(nextQ,1000);
}
function giftHit(h){
  popDown(h);sfx('whack');
  if(Math.random()<.6){const c=5;GM.gained+=c;addCoins(c);floatText(h,'+'+c+' xu 🎁');setTimeout(()=>sfx('coin'),200)}
  else{const c=Math.min(3,S.coins);addCoins(-c);GM.gained-=c;floatText(h,'-'+c+' xu 🦝');setTimeout(()=>sfx('wrong'),200);toast('Chuột trộm lấy mất '+c+' xu!')}
  hud();
}
function missed(h){
  /* h = chuột bị đập sai; null = hết giờ */
  GM.qLock=true;GM.combo=0;GM.lives--;
  const q=GM.cur;
  if(h){sfx('whack');h.el.classList.add('bad');h.el.querySelector('.msvg').innerHTML=moleHTML('normal','bad')}
  setTimeout(()=>sfx('wrong'),h?150:0);
  GM.holes.forEach(x=>{if(x!==h&&x.up)popDown(x)});
  const id=q.key+'|'+q.main+'|'+(q.img||'');
  if(!GM.wrong.some(w=>w.id===id))GM.wrong.push({id:id,q:q});
  if(GM.lives>0&&(GM.requeued[id]||0)<2){GM.requeued[id]=(GM.requeued[id]||0)+1;GM.qs.push(reshuffled(q))}
  hud();
  const f=document.createElement('div');f.className='gfb';f.id='gfb';
  f.innerHTML='<div class="mas">'+mascot('oops')+'</div><div>'+(h?'Chưa đúng! ':'Hết giờ! ')+'Đáp án: <b>'+esc(q.opts[q.ans])+'</b><br><span style="font-size:14px">'+esc(q.why)+'</span></div>';
  const fld=$('#gfield');if(fld)fld.appendChild(f);
  if(q.speak)setTimeout(()=>speak(q.speak),300);
  GM.nextT=setTimeout(()=>{if(GM.lives<=0)endRound(false);else nextQ()},2000);
}
function nextQ(){
  if(GM.over)return;
  if(GM.qi+1>=GM.qs.length)endRound(true);else setQ(GM.qi+1);
}
function endRound(win){
  if(GM.over)return;
  GM.over=true;GM.win=win;
  clearInterval(GM.spawnT);clearInterval(GM.tickT);clearTimeout(GM.nextT);GM.running=false;
  let bonus=0;
  if(win){bonus=5+2*GM.lives;GM.gained+=bonus;addCoins(bonus);if(!GM.fix){if(GM.score>S.gbest)S.gbest=GM.score;save();markDone('game','Em đã hoàn thành một vòng game! 🎉')}sfx('win');confetti()}
  else sfx('lose');
  GM.bonus=bonus;GM.screen='result';render();window.scrollTo(0,0);
}
function gResult(){
  const wrong=GM.wrong;
  return '<section class="card result pop"><div style="width:130px;height:130px;margin:0 auto" class="floaty">'+mascot(GM.win?'happy':'oops')+'</div>'+
    '<h2>'+(GM.win?'Hoàn thành vòng chơi! 🎉':'Hết tim rồi! Cố lên nhé 💪')+'</h2>'+
    '<div class="bigscore">⭐ '+GM.score+'</div>'+
    '<p style="font-size:19px">Đập đúng <b>'+GM.right+'</b> câu · Xu nhận được: <b>'+GM.gained+'</b>'+(GM.bonus?' (gồm thưởng hoàn thành +'+GM.bonus+')':'')+'</p>'+
    '<p class="sub">Điểm cao nhất: '+S.gbest+'</p>'+
    '<div class="row" style="justify-content:center;margin-top:8px"><button class="btn" data-act="gagain">Chơi lại</button>'+
    (wrong.length?'<button class="btn pink" data-act="gfix">Fix it! ('+wrong.length+' câu)</button>':'')+
    '<button class="btn ghost" data-act="gmenu">Về menu</button></div></section>'+
    (wrong.length?'<section class="card pop"><h3>Các câu cần xem lại</h3>'+wrong.map(o=>'<div class="wrongrow">'+(o.q.img?'<b>[hình]</b> ':'')+esc((o.q.main||o.q.stem).replace('____','___'))+' → <b style="color:var(--good)">'+esc(o.q.opts[o.q.ans])+'</b><div class="sub" style="margin:2px 0 0">'+esc(o.q.why)+'</div></div>').join('')+'</section>':'');
}
H.gagain=()=>startGame(GM.round);
H.gfix=()=>startGame(GM.round,GM.wrong.map(o=>reshuffled(o.q)),true);
H.gmenu=()=>{GM.screen='menu';sfx('click');render();window.scrollTo(0,0)};
H.gpause=()=>{
  if(GM.paused||GM.over)return;GM.paused=true;sfx('click');
  $('#modal').innerHTML='<div class="overlay"><div class="box"><div style="width:100px;height:100px;margin:0 auto">'+mascot('think')+'</div><h2>Tạm dừng</h2><p class="sub">Nghỉ một chút nhé!</p><div class="row" style="justify-content:center"><button class="btn mint" data-act="gresume">▶ Tiếp tục</button><button class="btn ghost" data-act="gquit">Thoát</button></div></div></div>';
};
H.gresume=()=>{GM.paused=false;$('#modal').innerHTML='';sfx('click')};
H.gquit=()=>{stopGame();GM.screen='menu';render()};
document.addEventListener('visibilitychange',function(){if(document.hidden&&GM.screen==='play'&&GM.running&&!GM.paused&&!GM.over)H.gpause()});


/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
(function boot(){
  $('#coinIcon').innerHTML=ICON.coin;
  $('#teacherAv').innerHTML=teacherAv();
  const mb=$('#muteBtn');
  const setMute=()=>{mb.textContent=S.mute?'🔇':'🔊'};
  mb.addEventListener('click',function(){S.mute=!S.mute;save();setMute();if(S.mute&&window.speechSynthesis){try{speechSynthesis.cancel()}catch(e){}}else sfx('click')});
  setMute();updCoins();render();
})();

</script>
