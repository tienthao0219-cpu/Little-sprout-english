<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Unit 1 Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== 1. BIẾN MÀU & FONT (candy pastel, đồng bộ các Hub khác) ===================== */
:root{
  --cream:#FFF6E5; --mint:#BFEBD8; --mint-d:#5DC39A; --pink:#FFC9DC; --pink-d:#F27FA6;
  --sky:#BFE2FF; --sky-d:#5DAEEB; --butter:#FFE7A0; --butter-d:#F2B93B; --peach:#FFD2B5;
  --lilac:#DCCBFF; --lilac-d:#8E75E0; --ink:#3A3358; --ink-soft:#766F94;
  --good:#35BE7C; --bad:#EE5C78; --card:rgba(255,255,255,.78); --shadow:0 8px 22px rgba(94,78,150,.16);
  --f-head:"Baloo 2","Nunito","Comic Sans MS",system-ui,sans-serif;
  --f-body:"Quicksand","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{height:100%;display:flex;flex-direction:column;overflow:hidden;padding-bottom:72px;font-family:var(--f-body);font-weight:600;color:var(--ink);
  background:radial-gradient(900px 500px at 6% -10%,var(--sky) 0%,transparent 60%),radial-gradient(800px 500px at 100% 0%,var(--butter) 0%,transparent 60%),radial-gradient(900px 600px at 50% 120%,var(--mint) 0%,transparent 60%),var(--cream)}
h1,h2,h3,h4,.btn,.nav button,.tile,.opt .ltr{font-family:var(--f-head)}
h1,h2,h3,h4,p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lilac-d);outline-offset:2px}
img{max-width:100%}

/* ===================== 2. HEADER ===================== */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;padding:8px 16px 4px}
.brand h1{font-size:clamp(20px,3vw,30px);line-height:1.05;font-weight:800;background:linear-gradient(90deg,#5DAEEB,#8E75E0 50%,#F27FA6);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin-top:2px;font-size:clamp(11px,1.4vw,14px);color:var(--ink-soft)}
.tools{display:flex;align-items:center;gap:8px}
.coinpill{position:relative;display:flex;align-items:center;gap:6px;padding:3px 14px 3px 6px;border-radius:999px;background:#fff;border:3px solid var(--butter-d);box-shadow:var(--shadow);font-family:var(--f-head);font-weight:800;font-size:21px;font-variant-numeric:tabular-nums}
.coinpill svg{width:30px;height:30px}
.coinpill.bump{animation:bump .45s}
.coinfx{position:absolute;left:34px;top:-8px;white-space:nowrap;font-family:var(--f-head);font-weight:800;color:var(--good);font-size:22px;pointer-events:none;animation:floatUp 1s ease-out forwards}
.iconbtn{width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:var(--lilac);box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.iconbtn svg{width:24px;height:24px}
.iconbtn.off{background:#E7E3F1}
.teacher{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 3px;background:#fff;border-radius:999px;box-shadow:var(--shadow);font-family:var(--f-head);font-weight:700;font-size:15px}
.teacher img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--pink)}

/* ===================== 3. KHUNG CHUNG ===================== */
main{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 14px}
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:3px solid #fff;border-radius:24px;box-shadow:var(--shadow)}
.pop{animation:pop .4s both}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:17px;background:var(--lilac);color:var(--ink);box-shadow:0 4px 0 rgba(58,51,88,.16);transition:transform .1s}
.btn.primary{background:var(--mint-d);color:#fff;box-shadow:0 4px 0 #3E9C79}
.btn.pink{background:var(--pink-d);color:#fff;box-shadow:0 4px 0 #C8567F}
.btn.sky{background:var(--sky-d);color:#fff;box-shadow:0 4px 0 #3F86BE}
.btn.ghost{background:#fff;border:3px solid var(--lilac)}
.btn.sm{padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn:active,.iconbtn:active,.opt:active,.tile:active,.nav button:active,.qic:active,.pcard:active,.tile-card:active{transform:scale(.96)}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 2px 10px}
.title-row h2{font-size:clamp(20px,2.6vw,28px)}
.title-row p{font-size:14px;color:var(--ink-soft)}
.chip{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--lilac);font-size:13px;font-weight:700}
.progress{height:12px;border-radius:99px;background:#fff;border:3px solid var(--lilac);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink-d),var(--butter-d));transition:width .5s}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:14px}
.sec-h{font-size:19px;margin:6px 2px 8px}

/* ===================== 4. TRANG CHỦ ===================== */
.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 24px;background:linear-gradient(120deg,rgba(191,226,255,.9),rgba(255,231,160,.85))}
.hero h2{font-size:clamp(26px,4vw,42px);line-height:1.02}
.hero p{margin:6px 0 12px;font-size:clamp(14px,1.8vw,18px);max-width:520px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-boy{flex:none;height:190px;width:auto;animation:float 3.4s ease-in-out infinite}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 10px;text-align:center;border:3px solid #fff;border-radius:22px;box-shadow:var(--shadow);transition:transform .1s;position:relative}
.tile-card img{width:72px;height:72px;object-fit:contain}
.tile-card h3{font-size:18px}.tile-card small{font-size:13px;color:var(--ink-soft);min-height:2.6em}
.tile-card .progress{width:100%}
.tile-card .dn{position:absolute;right:8px;top:8px;width:24px;height:24px}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px}
.lesson{padding:10px 14px;border-radius:18px;background:#fff;border:3px solid var(--lilac)}
.lesson b{font-family:var(--f-head);font-size:17px}.lesson p{margin-top:2px;font-size:14px;color:var(--ink-soft);line-height:1.4}
.homebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px}
.streak{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-head);font-weight:800;font-size:18px;padding:3px 14px 3px 8px;border-radius:99px;background:#FFF0D6;border:3px solid var(--butter-d)}
.streak svg{width:22px;height:22px}
.resetrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-soft)}

/* ===================== 5. FLASHCARD ===================== */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:14px}
.fc{perspective:900px;height:244px;cursor:pointer;text-align:center;border-radius:22px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:4px solid #fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px}
.fc-f{background:#fff}
.fc-b{transform:rotateY(180deg);background:linear-gradient(160deg,var(--mint),var(--sky))}
.fc.seen .fc-f{border-color:var(--mint-d)}
.fc-art{width:108px;height:108px;margin-bottom:6px;display:grid;place-items:center}.fc-art svg,.qart svg,.opt .oart svg{width:100%;height:100%;display:block}
.fc-en{font-family:var(--f-head);font-size:20px;line-height:1.05;font-weight:700}
.fc-ipa{font-size:14px;color:var(--ink-soft)}
.spk{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--lilac);display:grid;place-items:center;padding:0}
.spk svg{width:20px;height:20px}
.fc-b b{font-family:var(--f-head);font-size:25px;line-height:1.05}
.fc-b .ex{margin-top:6px;font-size:16px;font-weight:700;line-height:1.25}
.fc-b .exvi{font-size:13px;color:var(--ink-soft)}
.fc-b .pc{font-family:var(--f-head);font-weight:800;color:var(--lilac-d)}

/* ===================== 6. GRAMMAR BOX ===================== */
.gcard{padding:16px 18px;border-radius:24px;border:3px solid #fff;box-shadow:var(--shadow)}
.gcard.l1{background:linear-gradient(160deg,#E6F3FF,#fff)}.gcard.l2{background:linear-gradient(160deg,#FFE6EF,#fff)}
.gcard.tip{background:linear-gradient(160deg,#FFF3C9,#fff)}.gcard.snd{background:linear-gradient(160deg,#EEE6FF,#fff)}.gcard.mt{background:linear-gradient(160deg,#E4F7EE,#fff)}
.gcard h3{font-size:22px;margin-bottom:8px}.gcard .sub{font-size:14px;color:var(--ink-soft);margin-bottom:8px}
.gcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.tag{padding:3px 14px;border-radius:99px;font-family:var(--f-head);font-weight:800;font-size:15px;color:#fff;min-width:64px;text-align:center}
.tag.q{background:var(--sky-d)}.tag.a{background:var(--good)}.tag.x{background:var(--bad)}.tag.n{background:var(--butter-d)}
.formula{font-family:var(--f-head);font-weight:700;font-size:clamp(18px,2.2vw,24px);padding:6px 16px;border-radius:16px;background:#fff;border:3px solid var(--lilac);overflow-wrap:anywhere}
.formula.q{border-color:var(--sky-d)}.formula.a{border-color:var(--good)}.formula.x{border-color:var(--bad)}.formula em{font-style:normal;color:var(--pink-d)}.formula u{text-decoration:none;color:var(--good)}
.exs{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.exbox{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:18px;background:#fff;border:3px dashed var(--lilac);flex:1;min-width:240px}
.exbox .mini{flex:none;width:56px;height:56px}.exbox .mini svg{width:100%;height:100%}
.exbox p{font-family:var(--f-head);font-weight:700;font-size:18px;line-height:1.2}
.exbox p span{color:var(--good)}.exbox p small{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink-soft);font-weight:600}
.exbox .spk{position:static;flex:none;margin-left:auto;width:32px;height:32px}
.vs{display:flex;gap:12px;flex-wrap:wrap}
.vs>div{flex:1;min-width:210px;padding:10px 14px;border-radius:16px;background:#fff;font-family:var(--f-head);font-size:19px;font-weight:700}
.vs .bad{border:3px solid var(--bad)}.vs .okk{border:3px solid var(--good)}
.vs s{text-decoration-thickness:3px;text-decoration-color:var(--bad)}
.ing{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ing div{padding:6px 12px;border-radius:14px;background:#fff;border:3px solid var(--butter);font-family:var(--f-head);font-weight:700;font-size:17px}
.ing i{font-style:normal;color:var(--ink-soft)}.ing b{color:var(--pink-d)}
.stress{display:flex;gap:18px;flex-wrap:wrap}
.stress div{padding:8px 18px;border-radius:18px;background:#fff;border:3px solid var(--lilac);font-family:var(--f-head);font-size:28px;font-weight:800;display:flex;align-items:center;gap:10px}
.stress b{color:var(--pink-d);font-size:36px;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:4px}
.stress small{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);font-weight:700}

/* ----- thang đo tần suất ----- */
.meter{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 18px;align-items:center}
.mcol{display:flex;gap:10px;height:300px;margin:26px 0}
.mtrack{position:relative;width:44px;height:100%;border-radius:99px;background:#fff;border:4px solid #fff;box-shadow:var(--shadow),inset 0 0 0 3px var(--lilac);touch-action:none;cursor:grab}
.mtrack:active{cursor:grabbing}
.mbar{position:absolute;inset:0;border-radius:99px;overflow:hidden;background:linear-gradient(to top,#B9B3D2 0 10%,#FF9A5C 10% 30%,#EE5C78 30% 50%,#F2B93B 50% 70%,#F27FA6 70% 90%,#35BE7C 90% 100%)}
.mmask{position:absolute;left:0;right:0;top:0;background:rgba(255,255,255,.82)}
.mknob{position:absolute;left:50%;width:58px;height:34px;translate:-50% 50%;border-radius:99px;background:#fff;border:5px solid var(--c,var(--lilac-d));box-shadow:0 4px 10px rgba(58,51,88,.3);display:grid;place-items:center}
.mknob::after{content:"";width:22px;height:10px;border-top:3px solid var(--lilac);border-bottom:3px solid var(--lilac)}
.mlabs{position:relative;width:122px}
.mlab{position:absolute;left:0;translate:0 50%;display:flex;flex-direction:column;align-items:flex-start;gap:0;line-height:1.1;text-align:left;border:0;background:none;font-family:var(--f-head);font-weight:800;font-size:17px;padding:3px 10px;border-radius:16px;color:var(--ink-soft);white-space:nowrap;transition:background .2s,color .2s}
.mlab small{font-family:var(--f-body);font-weight:700;font-size:12px;opacity:.85}
.mlab.on{background:var(--c);color:#fff}
.mface{display:grid;gap:6px;justify-items:center;text-align:center}
.mface svg{width:min(100%,250px);height:auto;display:block}
.mmsg{grid-column:1/-1;display:grid;gap:10px}
.mdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;font-family:var(--f-head);font-weight:700}
.mdots i{width:22px;height:22px;border-radius:50%;background:#EFEAFB;border:3px solid var(--lilac);transition:background .25s}
.mdots i.on{background:var(--c);border-color:var(--c)}
.msent{padding:10px 14px;border-radius:18px;background:#fff;border:3px solid var(--c,var(--lilac));font-family:var(--f-head);font-weight:700;font-size:clamp(20px,2.8vw,28px);line-height:1.2;text-align:center}
.msent em{font-style:normal;color:#fff;background:var(--c);border-radius:10px;padding:0 8px}
.mpick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.seg{display:flex;gap:4px;padding:4px;background:#fff;border-radius:999px;border:3px solid var(--lilac)}
.seg button{border:0;border-radius:999px;padding:3px 14px;background:transparent;font-family:var(--f-head);font-weight:700;font-size:16px}
.seg .on{background:var(--butter)}
.sel{border:3px solid var(--lilac);border-radius:14px;padding:6px 10px;background:#fff;font-weight:700;font-size:16px;max-width:100%}
.hint{font-size:13px;color:var(--ink-soft);text-align:center}

/* ===================== 7. PRACTICE / QUIZ ===================== */
.pmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:24px;border:3px solid #fff;box-shadow:var(--shadow);text-align:left;transition:transform .1s;color:var(--ink)}
.pcard h3{font-size:22px}.pcard p{font-size:14px;color:var(--ink-soft)}.pcard .best{font-family:var(--f-head);font-weight:800;color:#B07A00}
.qwrap{max-width:900px;margin:0 auto;display:grid;gap:10px}
.qbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px}
.qic{width:46px;height:46px;border:3px solid #fff;border-radius:50%;background:var(--butter);box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.qic img{width:30px;height:30px;object-fit:contain}
.qcount{font-family:var(--f-head);font-size:20px;margin:0 6px;white-space:nowrap}
.qcount b{color:var(--pink-d);font-size:26px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:2px solid var(--lilac);background:#fff;font-family:var(--f-head);font-weight:700;font-size:13px;padding:0}
.dots .cur{background:var(--lilac-d);color:#fff;border-color:var(--lilac-d)}
.dots .ok{background:var(--good);color:#fff;border-color:var(--good)}.dots .no{background:var(--bad);color:#fff;border-color:var(--bad)}.dots .sk{background:var(--butter);border-color:var(--butter-d)}
.qbody{padding:16px 20px;display:grid;gap:12px}
.qprompt{font-family:var(--f-head);font-weight:700;font-size:clamp(20px,2.6vw,28px);line-height:1.2;overflow-wrap:anywhere}
.qprompt .blank{display:inline-block;min-width:64px;border-bottom:4px solid var(--lilac-d);text-align:center;color:var(--lilac-d)}
.qsub{font-size:14px;color:var(--ink-soft)}
.qmid{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.qart{width:120px;height:120px;flex:none}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 14px;text-align:left;background:#fff;border:4px solid var(--lilac);border-radius:20px;box-shadow:0 5px 0 rgba(94,78,150,.14);transition:transform .1s}
.opt .ltr{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:var(--lilac-d)}
.opt:nth-child(2) .ltr{background:var(--pink-d)}.opt:nth-child(3) .ltr{background:var(--sky-d)}.opt:nth-child(4) .ltr{background:var(--mint-d)}
.opt .otxt{font-family:var(--f-head);font-weight:700;font-size:clamp(17px,2.1vw,22px);line-height:1.1;overflow-wrap:anywhere}
.opt.sel{border-color:var(--lilac-d);background:#F4EEFF}
.opt.good{background:var(--good);border-color:#1E9A5F;color:#fff;animation:flashGood .6s ease 2}
.opt.bad{background:#FFE1E7;border-color:var(--bad);color:#A22C47;animation:shake .45s}
.opt:disabled{cursor:default}
.fillin{width:100%;max-width:440px;border:4px solid var(--lilac);border-radius:18px;padding:10px 14px;font-family:var(--f-head);font-weight:700;font-size:24px;color:var(--ink);background:#fff}
.fillin.ok{border-color:var(--good);background:#E3F8EE}.fillin.no{border-color:var(--bad);background:#FFE9EE}
.built{min-height:62px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;border-radius:16px;background:#fff;border:3px dashed var(--lilac-d)}
.built.ok{border-color:var(--good);background:#E3F8EE}.built.no{border-color:var(--bad);background:#FFE9EE}
.pool{display:flex;gap:8px;flex-wrap:wrap}
.tile{min-width:46px;height:50px;padding:0 14px;border-radius:14px;border:3px solid #fff;background:var(--sky);box-shadow:0 4px 0 rgba(58,51,88,.15);font-weight:700;font-size:22px}
.tile.used{visibility:hidden}.built .tile{background:var(--butter)}
.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:20px;border:3px solid;flex:1;min-width:260px}
.fb.ok{background:#E3F8EE;border-color:var(--good)}.fb.no{background:#FFE9EE;border-color:var(--bad)}
.fbk{flex:none;width:58px;height:112px}.fbk img{width:100%;height:100%;object-fit:contain}
.fbk img.happy{animation:bump .8s ease 2}.fbk img.oops{animation:shake .5s}
.fbt b{font-family:var(--f-head);font-size:20px}.fbt p{margin-top:2px;font-size:15px;line-height:1.4}
.result{max-width:760px;margin:0 auto;padding:18px 22px;text-align:center;display:grid;gap:10px;justify-items:center}
.result .fbk{width:90px;height:170px}
.score{font-family:var(--f-head);font-weight:800;font-size:48px;color:var(--pink-d);line-height:1}
.stars{display:flex;gap:6px;justify-content:center}.stars svg{width:44px;height:44px}
.wlist{width:100%;text-align:left;display:grid;gap:6px}
.witem{padding:8px 12px;border-radius:14px;background:#fff;border:3px solid var(--pink);font-size:15px;line-height:1.35}
.witem b{font-family:var(--f-head)}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ===================== 8. GAME: ĐÀO VÀNG ===================== */
.gmenu{display:grid;gap:14px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.lvl{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:12px 14px;border-radius:20px;border:3px solid #fff;box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.lvl h3{font-size:19px}.lvl p{font-size:13px;color:var(--ink-soft)}
.lvl.lock{filter:grayscale(.85);opacity:.6;cursor:not-allowed}
.lvl .st{display:flex;gap:2px}.lvl .st svg{width:24px;height:24px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.up{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:18px;background:#fff;border:3px solid var(--lilac)}
.up h4{font-size:17px}.up p{font-size:13px;color:var(--ink-soft);line-height:1.3}
.lvdots{display:flex;gap:4px}.lvdots i{width:14px;height:14px;border-radius:50%;background:#E3DDF0;border:2px solid var(--lilac)}.lvdots i.on{background:var(--mint-d);border-color:var(--mint-d)}
.up .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.price{display:flex;align-items:center;gap:4px;font-family:var(--f-head);font-weight:800;font-size:18px}.price svg{width:22px;height:22px}
.lockbox{padding:14px 18px;background:#FFE9EE;border:3px dashed var(--bad);border-radius:18px;font-size:16px;line-height:1.4}
.gplay{max-width:900px;margin:0 auto;display:grid;gap:8px}
.gq{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px}
.gq .qart{width:78px;height:78px}
.gq .qtxt{flex:1;min-width:180px}
.gq .qprompt{font-size:clamp(18px,2.4vw,26px)}
.gstat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-head);font-weight:800;font-size:17px}
.hearts{display:flex;gap:2px}.hearts svg{width:26px;height:26px}
.combo{padding:1px 10px;border-radius:99px;background:var(--pink-d);color:#fff;font-size:14px}
.tbar{height:14px;border-radius:99px;background:#fff;border:3px solid var(--lilac);overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--butter-d));transform-origin:left}
.tbar.low i{background:var(--bad)}
.cvwrap{position:relative;width:min(100%,max(340px,calc((100dvh - 400px) * 1.3333)));margin:0 auto;border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow);background:#CFE8FF;touch-action:manipulation}
.cvwrap canvas{display:block;width:100%;height:auto;aspect-ratio:4/3}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,246,229,.88);padding:14px;text-align:center}
.overlay .box{max-width:92%;display:grid;gap:10px;justify-items:center}
.overlay .opts{width:100%}
.dropbtn{width:100%;max-width:440px;margin:0 auto;font-size:22px;padding:12px 20px}
.gfb{min-height:64px}
.gnote{font-size:13px;color:var(--ink-soft);text-align:center}
.giftrow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* ===================== 9. HOMEWORK ===================== */
.hwc{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.hwc > *{min-width:0}
.hwc input,.hwc select,.hwc textarea{max-width:100%;min-width:0}
.hwc h3{font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hwc h3 .chip.dn{background:var(--mint)}
.passage{padding:12px 16px;border-radius:18px;background:#FFFBEF;border:3px dashed var(--butter-d);font-size:17px;line-height:1.6}
.passage .hl{background:var(--pink);border-radius:6px;padding:0 6px;font-weight:800}
.rq{display:grid;gap:8px;padding:10px 12px;border-radius:18px;background:#fff;border:3px solid var(--lilac)}
.rq.ok{border-color:var(--good);background:#F0FBF6}.rq.no{border-color:var(--bad);background:#FFF3F5}
.rq .qprompt{font-size:19px}
.rq .opts{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.rq .opt{min-height:48px;padding:4px 10px}
.rq .opt .otxt{font-size:17px}
.rq .why{font-size:14px;color:var(--ink-soft)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.form label{display:grid;gap:3px;font-size:13px;color:var(--ink-soft);font-weight:700}
.form input,.form select{width:100%;border:3px solid var(--lilac);border-radius:14px;padding:8px 12px;font-weight:700;font-size:17px;color:var(--ink);background:#fff}
.letter{padding:14px 18px;border-radius:20px;background:linear-gradient(160deg,#FFF6C9,#E6F3FF);border:4px dashed var(--butter-d);font-size:18px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}
.letter em{font-style:normal;background:#fff;border-radius:8px;padding:0 6px;color:var(--lilac-d)}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 70px;gap:8px;align-items:center}
.pbar{height:18px;border-radius:99px;background:#EFEAFB;overflow:hidden}.pbar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.pface{width:66px;height:66px}.pface svg{width:100%;height:100%}
.pout{display:grid;gap:8px}
.pline{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:8px;align-items:center;padding:6px 12px;border-radius:16px;background:#fff;border:3px solid var(--lilac);font-family:var(--f-head);font-weight:700;font-size:18px}

/* ===================== 10. NAV ===================== */
.nav{display:flex;gap:6px;justify-content:center;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.76);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:3px solid #fff;box-shadow:0 -6px 18px rgba(94,78,150,.12);position:fixed;bottom:0;left:0;right:0;z-index:10}
.nav button{position:relative;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 8px;border:3px solid transparent;border-radius:20px;background:transparent;font-weight:700;font-size:17px;text-align:left;line-height:1.05;transition:transform .1s}
.nav button img{width:42px;height:42px;object-fit:contain}
.nav button[aria-selected="true"]{background:var(--butter);border-color:var(--butter-d)}
.nav .done{position:absolute;right:3px;top:1px;width:20px;height:20px}
.toasts{position:fixed;left:0;right:0;bottom:92px;z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 10px}
.toast{max-width:min(92vw,460px);background:#fff;border:3px solid var(--butter-d);border-radius:18px;padding:10px 16px;font-family:var(--f-head);font-weight:700;font-size:17px;box-shadow:var(--shadow);animation:pop .3s both;transition:opacity .5s}
.toast.out{opacity:0}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall var(--d) linear forwards}

/* ===================== 11. HOẠT ẢNH ===================== */
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes flashGood{0%,100%{filter:none}50%{filter:brightness(1.25)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-38px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.face .tw{animation:twinkle 1.1s infinite;transform-box:fill-box;transform-origin:center}
.face .tw2{animation-delay:.5s}
.face .eyes{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}

/* ===================== 12. RESPONSIVE ===================== */
@media (max-width:860px){
  body{overflow:auto;height:auto;min-height:100dvh}
  main{flex:none;overflow:visible;padding-bottom:calc(var(--nav-h,96px) + 28px + env(safe-area-inset-bottom,0px))}
  .tiles{grid-template-columns:repeat(2,1fr)}.lessons,.gcols{grid-template-columns:1fr}
  .hero{flex-direction:column;text-align:center;padding:14px}.hero .cta{justify-content:center}.hero-boy{height:130px}
  .teacher span,.brand p{display:none}.teacher{padding:3px}
  .nav{gap:2px;padding-left:4px;padding-right:4px}
  .nav button{flex:1;flex-direction:column;gap:0;padding:2px 1px;font-size:10.5px;text-align:center;border-radius:14px;min-width:0}
  .nav button img{width:32px;height:32px}
  .nav button span{overflow-wrap:normal;word-break:normal}
  .opts{grid-template-columns:1fr}
  .qart{width:96px;height:96px}
  .mcol{height:270px}.mlabs{width:108px}.mlab{font-size:16px}
  .prow{grid-template-columns:1fr 1fr}.prow .pface{grid-column:1/-1}
}
@media (max-width:520px){
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fc{height:222px}.fc-art{width:88px;height:88px}.fc-en{font-size:17px}.fc-b b{font-size:21px}.fc-b .ex{font-size:14px}
}
@media (max-width:420px){
  .mcol{gap:6px}.mlabs{width:100px}.mtrack{width:38px}.mknob{width:50px}
  .meter{gap:8px 8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.hintline{font-family:var(--f-head);font-weight:800;font-size:22px;letter-spacing:2px;color:var(--lilac-d);word-break:break-word;min-height:1.2em}
.hintrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px}

.pcard .prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:700}
.fc-art .face{width:auto;height:100%;max-width:100%}

.mtc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

.mt{--pc:var(--lilac-d);--pb:#F1EAFF;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 12px;border-radius:20px;border:3px solid #fff;background:linear-gradient(160deg,#fff,#F6F1FF);box-shadow:0 4px 0 rgba(94,78,150,.16),0 6px 12px rgba(94,78,150,.1);font-family:var(--f-head);font-weight:700;font-size:clamp(15px,2vw,18px);line-height:1.25;color:var(--ink);text-align:left;overflow-wrap:anywhere;transition:transform .12s}
.mt:active{transform:translateY(2px)}
.mt span{min-width:0;flex:1}
.mt .mn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pc);color:#fff;font-size:14px;display:grid;place-items:center}
.mt.L .mn{background:#C9BEE6}
.mt.pick{border-color:var(--pc);background:var(--pb);transform:translateY(-2px);box-shadow:0 6px 0 rgba(94,78,150,.22)}
.mt.cc{border-color:var(--pc);background:var(--pb)}
.mt.cc .mn,.mt.pick .mn{background:var(--pc)}
.mt.c0{--pc:#F27FA6;--pb:#FFE1EC}.mt.c1{--pc:#5DAEEB;--pb:#DDEFFF}.mt.c2{--pc:#35BE7C;--pb:#DDF5EA}.mt.c3{--pc:#F2B93B;--pb:#FFF3C9}.mt.c4{--pc:#8E75E0;--pb:#EBE3FF}.mt.c5{--pc:#FF9A5C;--pb:#FFE5D3}
.mt.good{background:linear-gradient(160deg,#4BD08F,#2FB57A);border-color:#1E9A5F;color:#fff}.mt.good .mn{background:rgba(255,255,255,.35)}
.mt.bad{background:#FFE1E7;border-color:var(--bad);color:#A22C47}.mt.bad .mn{background:var(--bad)}
@media (max-width:460px){.mtc{gap:8px}.mt{padding:8px 9px;font-size:14.5px;min-height:58px}.mt .mn{width:22px;height:22px;font-size:13px}}

/* công thức trong Grammar Box */
.fxs{display:grid;gap:10px}
.fxs:not(.one){grid-template-columns:repeat(2,minmax(0,1fr))}
.fxg{display:grid;gap:8px;align-content:start;opacity:.5;transform:scale(.98);transition:opacity .25s,transform .25s}
.fxg.on{opacity:1;transform:none}
.fx{position:relative;display:grid;gap:5px;width:100%;text-align:left;padding:10px 46px 10px 12px;border-radius:20px;background:#fff;border:3px solid var(--c);box-shadow:0 4px 0 rgba(94,78,150,.12);color:var(--ink);transition:transform .1s;min-width:0}
.fx:active{transform:scale(.98)}
.fxt{justify-self:start;padding:1px 10px;border-radius:99px;background:var(--c);color:#fff;font-family:var(--f-head);font-weight:800;font-size:13px}
.fxr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-head);font-weight:700;font-size:clamp(16px,2.1vw,20px);line-height:1.2}
.fxr em{font-style:normal;padding:1px 9px;border-radius:12px;background:#F3EEFF;border:2px solid #fff}
.fxr em.k{background:var(--c);color:#fff}
.fxr em.s{background:#fff;border:2px dashed var(--c);color:var(--ink-soft);font-weight:600}
.fxr em.s span,.fxr em.k span{font-weight:800}
.fx small{font-size:13px;color:var(--ink-soft);font-weight:700;line-height:1.3}
.fx .sp{position:absolute;right:10px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--lilac);display:grid;place-items:center}.fx .sp svg{width:18px;height:18px}
.gb .fxs.one{max-width:none}
@media (max-width:560px){.fxs:not(.one){grid-template-columns:1fr}.fxg{opacity:1;transform:none}.fxg:not(.on){display:none}}

/* hộp 2: kéo số ki-lô-mét */
.dsbox{display:grid;gap:8px}
.dsscene{border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 16px rgba(94,78,150,.2);touch-action:none;cursor:ew-resize;line-height:0;background:#DDF0FF;max-width:520px;width:100%;margin-inline:auto}
.dsscene svg{width:100%;height:auto;display:block}
.dss{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.dsl{border:3px solid #fff;border-radius:16px;padding:2px 12px;font-family:var(--f-head);font-weight:800;font-size:18px;line-height:1.05;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);opacity:.55;transition:opacity .2s,transform .2s}
.dsl small{display:block;font-family:var(--f-body);font-size:12px;font-weight:700}
.dsl.near{background:#2FA57E}.dsl.far{background:#F28A3C}.dsl.on{opacity:1;transform:scale(1.08)}
.dstrack{position:relative;height:22px;border-radius:99px;background:linear-gradient(90deg,#BFEBD8,#FFF3C9,#FFD2B5);border:3px solid #fff;box-shadow:inset 0 2px 5px rgba(94,78,150,.2);touch-action:none;cursor:pointer;margin:0 18px}
.dsticks{position:absolute;inset:0 4px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.dsticks i{width:3px;height:8px;border-radius:2px;background:rgba(58,51,88,.28)}
.dsknob{position:absolute;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--c,#35BE7C);border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);color:#fff;font-family:var(--f-head);font-weight:800;font-size:17px;display:grid;place-items:center;line-height:1}
.dsread{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.dstag{display:inline-grid;justify-items:center;padding:2px 16px;border-radius:99px;color:#fff;font-family:var(--f-head);font-weight:800;font-size:20px;line-height:1.1}
.dstag small{font-family:var(--f-body);font-size:12px}
.dstag.near{background:#2FA57E}.dstag.far{background:#F28A3C}
.dsnum{font-family:var(--f-head);font-weight:700;font-size:20px;color:var(--ink)}.dsnum b{font-size:28px;color:var(--pink-d)}

/* mèo mascot */
.gb header{align-items:center}.gb header>div{min-width:0;flex:1}
.gbcat{flex:none;margin-left:auto;width:84px;height:84px;border-radius:24px;overflow:hidden;border:4px solid #fff;box-shadow:0 5px 14px rgba(94,78,150,.25);background:#fff;animation:float 3.6s ease-in-out infinite}

.catyn{flex:none;width:76px;height:76px;border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 4px 12px rgba(94,78,150,.22);background:#fff}
@media (max-width:460px){.gbcat{width:68px;height:68px;border-radius:20px}.catyn{width:64px;height:64px}}

/* ===== Unit 1: bổ sung ===== */
svg.ar{border-radius:24%;overflow:hidden;display:block}
.gbcat svg,.catyn svg{width:100%;height:100%;display:block}
.gbcat{background:transparent}
.intro{display:grid;gap:10px;padding:12px;border-radius:22px;background:rgba(255,255,255,.7);border:3px dashed var(--lilac)}

.inlab input{border:3px solid var(--lilac);border-radius:14px;padding:8px 12px;font-weight:700;font-size:18px;font-family:var(--f-head);background:#fff;color:var(--ink);width:100%;max-width:260px}
.introrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.iplace{width:96px;height:96px;border-radius:24px;overflow:hidden;border:4px solid #fff;box-shadow:0 5px 14px rgba(94,78,150,.25);display:block}
.iplace svg{width:100%;height:100%}
.introut{display:grid;gap:8px}.introut .bub{width:100%}
.fvc{grid-template-columns:repeat(4,minmax(0,1fr))}.fvi{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}

.rvic{font-style:normal}

const clone = o => JSON.parse(JSON.stringify(o));
function merge(base, extra) {
  if (!extra || typeof extra !== 'object') return base;
  for (const k of Object.keys(base)) {
    if (!(k in extra)) continue;
    if (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = merge(base[k], extra[k]);
    else base[k] = extra[k];
  }
  for (const k of ['seen', 'mist', 'lastQ']) if (extra[k]) base[k] = extra[k];

}

function ico(id) {
  const it = wordBy(id); if (!it) return '';
  if (IMG[id]) return `<svg class="ar" viewBox="0 0 100 100" role="img" aria-label="${esc(it.en)}"><rect width="100" height="100" fill="${it.bg}"/><image href="${IMG[id]}" x="4" y="4" width="92" height="92" preserveAspectRatio="xMidYMid meet"/></svg>`;
  return `<svg class="ar" viewBox="0 0 100 100" role="img" aria-label="${esc(it.en)}"><rect width="100" height="100" fill="${it.bg}"/>${ART[id]}</svg>`;
}
/* mặt bạn nam / bạn nữ (Grammar Box 3 và câu his / her) */
function faceSVG(g) {
  if (IMG[g]) return `<svg class="ar" viewBox="0 0 100 100" role="img" aria-label="${g === 'boy' ? 'Bạn nam' : 'Bạn nữ'}"><rect width="100" height="100" fill="${g === 'boy' ? '#BFE2FF' : '#FFC9DC'}"/><image href="${IMG[g]}" x="4" y="4" width="92" height="92" preserveAspectRatio="xMidYMid meet"/></svg>`;
  const hair = g === 'boy'
    ? '<path d="M30 42a20 20 0 0140 0c-9-6-31-6-40 0z" fill="#3A3358"/>'
    : '<circle cx="26" cy="44" r="8" fill="#3A3358"/><circle cx="74" cy="44" r="8" fill="#3A3358"/><path d="M30 42a20 20 0 0140 0c-9-6-31-6-40 0z" fill="#3A3358"/><path d="M33 34l34 2" stroke="#F27FA6" stroke-width="5" stroke-linecap="round"/>';
  return `<svg class="ar" viewBox="0 0 100 100" role="img" aria-label="${g === 'boy' ? 'Bạn nam' : 'Bạn nữ'}"><rect width="100" height="100" fill="${g === 'boy' ? '#BFE2FF' : '#FFC9DC'}"/><path d="M20 100Q22 72 50 70Q78 72 80 100Z" fill="${g === 'boy' ? '#5DAEEB' : '#F27FA6'}" ${ST} stroke-linejoin="round"/>${g === 'girl' ? hair : ''}<circle cx="50" cy="50" r="20" fill="#FFE0C8" ${ST}/>${g === 'boy' ? hair : '<path d="M30 46a20 20 0 0140 0c-9-6-31-6-40 0z" fill="#3A3358"/>'}<circle cx="43" cy="52" r="2.2" fill="#3A3358"/><circle cx="57" cy="52" r="2.2" fill="#3A3358"/><path d="M44 59q6 5 12 0" fill="none" stroke="#C8567F" stroke-width="2.6" stroke-linecap="round"/></svg>`;
}

/* =====================================================================
   NGÂN HÀNG CÂU HỎI (dùng chung cho Practice, Fix it!)
   Mỗi câu có id cố định để lưu "câu hay sai" và cho quay lại ở lần sau.
   Các câu luyện tập do Claude soạn theo mẫu câu cô gửi (không chép từ sách).
   ===================================================================== */
const BANK = [];
const mk = (id, kind, fn) => BANK.push({id, kind, fn});
function mcOpts(correct, pool, n = 4) {
  const wrong = shuffle([...new Set(pool)].filter(x => x !== correct)).slice(0, n - 1);
  const opts = shuffle([correct, ...wrong]);
  return {opts, ans: opts.indexOf(correct)};
}
const mcq = (prompt, correct, wrongs, exp, extra = {}) => () => {
  const opts = shuffle([correct, ...wrongs]);
  return Object.assign({type: 'mc', prompt, opts, ans: opts.indexOf(correct), exp}, extra);
};
const BLANK = '<span class="blank">____</span>';
const SUB_PICK = 'Chọn đáp án đúng.';
const keyRe = w => new RegExp('\\b' + w.en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
const CONCRETE = ['class', 'city', 'countryside', 'dolphin', 'panda', 'sandwich', 'tabletennis', 'pink', 'pizza', 'basketball', 'swimming'];

/* ---------- TỪ VỰNG (hình, nghĩa, điền từ, xếp chữ) ---------- */
WORDS.forEach(w => {
  if (CONCRETE.includes(w.id)) mk('v:pic:' + w.id, 'vocab', () => Object.assign({type: 'mc', prompt: 'Đây là gì?', art: ico(w.id), exp: `Đây là <b>${w.en}</b> (${w.vi}).`, say: w.en}, mcOpts(w.en, WORDS.map(x => x.en))));
  mk('v:vi:' + w.id, 'vocab', () => Object.assign({type: 'mc', prompt: `Nghĩa của từ “${w.en}”`, art: ico(w.id), exp: `<b>${w.en}</b> = ${w.vi}.`, say: w.en}, mcOpts(w.vi, WORDS.map(x => x.vi))));
  mk('v:en:' + w.id, 'vocab', () => Object.assign({type: 'mc', prompt: `Tiếng Anh của “${w.vi}”`, exp: `${cap(w.vi)} là <b>${w.en}</b>.`}, mcOpts(w.en, WORDS.map(x => x.en))));
  mk('v:fill:' + w.id, 'vocab', () => ({type: 'fill', prompt: 'Điền từ còn thiếu.', sub: `Gợi ý nghĩa: ${w.vi}`, art: ico(w.id), line: w.ex.replace(keyRe(w), '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>'), accept: [w.en], exp: `Câu đầy đủ: <b>${esc(w.ex)}</b> (${w.vi}).`}));
  if (!/\s/.test(w.en)) mk('v:scr:' + w.id, 'vocab', () => {
    const letters = w.en.split(''); let t = shuffle(letters), n = 0; while (t.join('') === w.en && n++ < 9) t = shuffle(letters);
    return {type: 'order', join: '', prompt: 'Sắp xếp các chữ cái.', sub: `Nghĩa: ${w.vi}`, art: ico(w.id), tiles: t, target: w.en, exp: `Từ đúng là <b>${w.en}</b> (${w.vi}).`};
  });
});

/* ---------- GÕ ĐÁP ÁN (có nút Gợi ý) ---------- */
WORDS.forEach(w => {
  if (CONCRETE.includes(w.id)) mk('t:pic:' + w.id, 'type', () => ({type: 'fill', prompt: 'Nhìn hình, gõ từ tiếng Anh.', sub: '', art: ico(w.id), accept: [w.en], exp: `Nghĩa: ${w.vi}.`}));
  mk('t:vi:' + w.id, 'type', () => ({type: 'fill', prompt: `Gõ tiếng Anh: “${w.vi}”`, sub: '', accept: [w.en], exp: `${cap(w.vi)} là <b>${w.en}</b>.`}));
});

/* ---------- ANH ⇔ VIỆT (chỉ các từ trọng tâm) ---------- */
CORE.forEach(w => {
  mk('e:a1:' + w.id, 'envi', () => Object.assign({type: 'mc', prompt: `Nghĩa của từ “${w.en}”`, sub: 'Anh → Việt', exp: `<b>${w.en}</b> = ${w.vi}.`, say: w.en}, mcOpts(w.vi, CORE.map(x => x.vi))));
  mk('e:a2:' + w.id, 'envi', () => Object.assign({type: 'mc', prompt: `Tiếng Anh của “${w.vi}”`, sub: 'Việt → Anh', exp: `${cap(w.vi)} là <b>${w.en}</b>.`}, mcOpts(w.en, CORE.map(x => x.en))));

/* Nút Gợi ý khi gõ: lần 1 = chữ đầu, lần 2 = đầu + giữa, lần 3 = đầu + giữa + cuối (chỉ từ dài >= 5 chữ) */
const hintWordIdx = (n, lv) => {
  const r = new Set(); if (lv >= 1) r.add(0);
  if (lv >= 2) { if (n <= 2) { for (let i = 0; i < n; i++) r.add(i); } else r.add(Math.floor((n - 1) / 2)); }
  if (lv >= 3 && n >= 5) r.add(n - 1);
  return r;
};
const hintMax = t => t.split(' ').some(w => w.length >= 5) ? 3 : 2;
const hintMask = (t, lv) => t.split(' ').map(w => { const r = hintWordIdx(w.length, lv); return w.split('').map((c, i) => r.has(i) ? c : '_').join(' '); }).join('   ');
function answerText(Q) {
  if (Q.type === 'mc') return Q.opts[Q.ans];
  if (Q.type === 'fill') return Q.accept[0];
  if (Q.type === 'match') return Q.left.map((l, i) => l + ' → ' + Q.right[Q.key[i]]).join('  ·  ');
  return Q.target;
}

function flipCard(el) {
  const id = el.dataset.id, flipped = el.classList.toggle('flip');

function buildQuiz(mode, custom) {
  let ids;
  if (custom) ids = shuffle(custom);
  else {
    const PQ = modeLen(mode), pool = poolFor(mode), pid = new Set(pool.map(b => b.id)), last = new Set((S.lastQ && S.lastQ[mode]) || []);
    if (mode === 'envi') {
      /* Đủ các từ trọng tâm, cả hai chiều. Xáo trộn và tránh hai câu cùng một từ đứng liền nhau. */
      const act = id => id.split(':')[2];
      const all = CORE.flatMap(a => ['e:a1:' + a.id, 'e:a2:' + a.id]), clash = L => L.some((x, i) => i && act(x) === act(L[i - 1]));
      ids = shuffle(all); for (let t = 0; t < 200 && clash(ids); t++) ids = shuffle(all);
    } else {
      const m = shuffle(Object.keys(S.mist).filter(id => pid.has(id))).slice(0, 3), rest = pool.filter(b => !m.includes(b.id)), need = PQ - m.length;
      const pickN = (arr, n) => { let p = sample(arr.filter(b => !last.has(b.id)), n); if (p.length < n) p = [...p, ...sample(arr.filter(b => last.has(b.id)), n - p.length)]; return p; };
      let pick;
      if (mode === 'grammar') { const per = Math.ceil(need / GKINDS.length); pick = sample(GKINDS.flatMap(k => pickN(rest.filter(b => b.kind === k), per)), need); }

  qgo: t => { sfx('click'); qGo(+t.dataset.i); },
  qhome: () => { clearTimeout(quizTimer); ui.p.view = 'menu'; sfx('click'); render(); },
  qagain: () => { if (quiz.mode === 'fix') { ui.p.view = 'menu'; render(); } else startQuiz(quiz.mode); },
  qfix: () => { const ids = quiz.qs.filter((q, j) => !quiz.ans[j].ok).map(q => q.id); startQuiz('fix', ids); },
  ...RV_ACTIONS
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && actions[t.dataset.act]) { e.preventDefault(); actions[t.dataset.act](t, e); return; }
  const fc = e.target.closest('.fc'); if (fc) flipCard(fc);
});
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('[data-act="qhint"]')) e.preventDefault(); });
document.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg && tg.classList && tg.classList.contains('fc') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); flipCard(tg); return; }
  if (e.key === 'Enter' && ui.tab === 'practice' && ui.p.view === 'quiz' && quiz) {
    e.preventDefault();
    if (quiz.ans[quiz.i].done) qNext(false); else qCheck(); return;
  }
});
$('muteBtn').addEventListener('click', () => { S.mute = !S.mute; save(); if (S.mute && canSpeak) try { speechSynthesis.cancel(); } catch (e) {} muteIcon(); if (!S.mute) sfx('click'); });

/* ---------- khởi động ---------- */
$('imgTeacher').src = A.teacher; $('coinIcon').innerHTML = COIN(30); paintCoins(); muteIcon(); render();

</script>
</body></html>
