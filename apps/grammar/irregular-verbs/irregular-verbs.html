<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irregular Verbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7ff; --card:#fff; --ink:#3a3f5c; --muted:#868ba6; --line:#ece4f4;
  --pink:#ff9ebb; --pink-s:#ffe6ee; --blue:#8cc7ff; --blue-s:#e8f3ff; --mint:#7fd3b4; --mint-s:#e6f8f1; --mint-d:#2b8a70;
  --lav:#b9a8f0; --lav-s:#f0eaff; --sun:#ffd86b; --sun-s:#fff6d6; --peach:#ffb38a; --peach-s:#fff0e6;
  --bad:#ff7d97; --bad-s:#ffe9ee; --ok:#4fc79b;
  --r:20px;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fh:'Baloo 2','Nunito',system-ui,sans-serif;
  --stick:0px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 0% 0%,#ffe3ee 0,transparent 42%),radial-gradient(circle at 100% 10%,#e0f1ff 0,transparent 40%),radial-gradient(circle at 50% 100%,#e9f9f1 0,transparent 45%);
  background-attachment:fixed;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.55}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.15}
.app{max-width:860px;margin:0 auto;padding:12px 14px 120px}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* ---------- đầu trang ---------- */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.top .logo{flex:1;min-width:0}
.logo h1{font-size:26px;color:#7a5cd6;letter-spacing:.2px}
.logo small{display:block;color:var(--muted);font-weight:700;font-size:13.5px}
.ibtn{width:46px;height:46px;border-radius:15px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:21px;flex:none;box-shadow:0 3px 0 var(--line)}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ibtn svg{width:28px;height:28px}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#ffd6e5,#e3d9ff 55%,#cfeaff);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:0 5px 0 #d9cdf5}
.hero img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:18px;padding:4px;border:3px solid #fff;flex:none}
.hero b{font-family:var(--fh);font-size:20px;display:block}
.hero span{font-weight:700;font-size:14.5px;opacity:.85}
details.guide{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:0;margin-bottom:12px}
details.guide summary{cursor:pointer;font-weight:800;padding:12px 16px;list-style:none;display:flex;align-items:center;gap:8px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:'▾';margin-left:auto;color:var(--muted)}
details.guide[open] summary::after{content:'▴'}
details.guide .gb{padding:0 16px 14px;font-size:15px}
details.guide ol{margin:6px 0 8px;padding-left:20px}
details.guide li{margin:4px 0}

/* ---------- chọn chế độ ---------- */
.sec{font-family:var(--fh);font-weight:800;font-size:18px;margin:14px 2px 8px;display:flex;align-items:center;gap:8px}
.sec small{font-family:var(--font);font-weight:700;color:var(--muted);font-size:13px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.12s}
.mode .mi{font-size:26px;line-height:1}
.mode b{font-family:var(--fh);font-size:19px;line-height:1.1;letter-spacing:.2px}
.mode span{font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.25}
.mode.on{border-color:var(--lav);background:linear-gradient(180deg,#fff,var(--lav-s));box-shadow:0 5px 0 #d9cdf5;transform:translateY(-2px)}
.mode.on b{color:#7a5cd6}
.mode:nth-child(1).on{border-color:var(--pink);background:linear-gradient(180deg,#fff,var(--pink-s));box-shadow:0 5px 0 #ffc7d8}.mode:nth-child(1).on b{color:#e0527f}
.mode:nth-child(2).on{border-color:var(--blue);background:linear-gradient(180deg,#fff,var(--blue-s));box-shadow:0 5px 0 #bfdcfa}.mode:nth-child(2).on b{color:#3b86d6}

/* ---------- công cụ ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;white-space:nowrap;min-height:38px}
.chip.on{background:var(--mint-s);border-color:var(--mint);color:var(--mint-d)}
.chip.warn.on{background:var(--peach-s);border-color:var(--peach);color:#c2672c}
.chip.act{background:var(--lav-s);border-color:#d9cdf5;color:#6a4fcb}
.seg{display:flex;background:#f1ebfa;border-radius:14px;padding:4px;gap:4px;margin-top:10px}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:#6a4fcb;box-shadow:0 2px 0 #e2d8f6}
.stick{position:sticky;top:0;z-index:6;margin:10px -14px 0;padding:8px 14px 6px;background:rgba(251,247,255,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.search{position:relative}
.search input{width:100%;border:3px solid var(--line);border-radius:16px;padding:12px 44px 12px 44px;font:inherit;font-weight:700;background:#fff;color:var(--ink);outline:none;min-height:50px}
.search input:focus{border-color:var(--lav)}
.search .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.search .cl{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;background:#f1ebfa;font-weight:900;color:var(--muted)}
.az{display:flex;gap:5px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.az::-webkit-scrollbar{display:none}
.az button{flex:none;min-width:34px;height:34px;border-radius:10px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:14px;color:#6a4fcb;text-transform:uppercase}
.az button:active{background:var(--lav-s)}

/* ---------- danh sách ---------- */
.lh{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;scroll-margin-top:calc(var(--stick) + 8px)}
.lh .lt{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;font-family:var(--fh);font-weight:800;font-size:22px;display:grid;place-items:center;text-transform:uppercase}
.lh small{color:var(--muted);font-weight:700}
.lh .mini{margin-left:auto;font-weight:800;font-size:13px;color:#6a4fcb;background:var(--lav-s);border-radius:999px;padding:6px 12px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 10px;margin-bottom:8px;cursor:pointer;min-height:76px;transition:.1s}
.row.sel{border-color:var(--mint);background:linear-gradient(90deg,var(--mint-s),#fff 60%)}
.row .tick{width:32px;height:32px;border-radius:10px;border:3px solid #d8d1e6;background:#fff;display:grid;place-items:center;color:transparent;font-weight:900;font-size:18px;flex:none}
.row.sel .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.row .th{width:64px;height:64px;border-radius:14px;background:#fff;border:2px solid var(--line);object-fit:contain;flex:none;padding:2px}
.row .rw{flex:1;min-width:0}
.row .v1{font-family:var(--fh);font-weight:800;font-size:22px;line-height:1.1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .fm{font-weight:800;font-size:15.5px;color:#6a4fcb;margin-top:1px}
.row .vi{font-weight:700;font-size:14px;color:var(--muted);margin-top:1px}
.row .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--peach)}
.row .dot.g{background:var(--ok)}
.spk{width:40px;height:40px;border-radius:13px;background:var(--blue-s);display:grid;place-items:center;font-size:19px;flex:none;border:2px solid #cfe5fb}
.spk:active{background:#cfe5fb}
.blur{filter:blur(7px);transition:.15s;cursor:pointer;user-select:none}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:30px 10px}

/* ---------- thanh dưới ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:3px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(120,100,180,.12)}
.bar .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .cnt{flex:0 0 auto;min-width:54px;font-weight:800;line-height:1.1}
.bar .btn{flex:1;padding:10px 8px;font-size:15.5px}
.bar .cnt b{font-family:var(--fh);font-size:24px;color:var(--mint-d)}
.bar .cnt small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.btn{border-radius:16px;font-weight:800;font-size:16px;padding:12px 16px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.pri{background:linear-gradient(135deg,#a6e6cf,#5fcfa4);border-color:#5fcfa4;box-shadow:0 4px 0 var(--mint-d);color:#124a3a}
.btn.pri:active{box-shadow:0 1px 0 var(--mint-d)}
.btn.pnk{background:linear-gradient(135deg,#ffc2d6,#ff9ebb);border-color:#ff9ebb;box-shadow:0 4px 0 #d9638b;color:#6b1535}
.btn.pnk:active{box-shadow:0 1px 0 #d9638b}
.btn.big{width:100%;min-height:58px;font-size:18px}
.btn.sm{min-height:42px;padding:8px 14px;font-size:14.5px;border-radius:13px}

/* ---------- lớp phủ ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(58,63,92,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
.ov .sheet{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:24px;margin-bottom:10px}
.sheet .row2{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sheet .lab{font-weight:800;margin:12px 0 6px;color:#6a4fcb}
.dimg{width:100%;max-width:300px;aspect-ratio:1;object-fit:contain;display:block;margin:0 auto 8px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:6px}
.dforms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.dforms div{background:var(--lav-s);border-radius:16px;padding:8px 4px;text-align:center}
.dforms small{display:block;color:var(--muted);font-weight:800;font-size:12px}
.dforms b{font-family:var(--fh);font-size:21px;display:block;line-height:1.15}
.dforms button{margin-top:4px}
.note{background:var(--sun-s);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:700;margin:8px 0}

/* ---------- flashcard ---------- */
.gbar{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.gbar .x{width:46px;height:46px;border-radius:15px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--line)}
.gbar .x svg{width:28px;height:28px}
.gbar .prog{flex:1;height:14px;background:#efe8fa;border-radius:99px;overflow:hidden}
.gbar .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:99px;transition:width .3s}
.gbar .qn{font-weight:800;color:var(--muted);font-size:14px;white-space:nowrap}
.gbar .cb{font-weight:800;color:#e0752b;font-size:15px;min-width:52px;text-align:right}
.fwrap{perspective:1200px;margin:6px 0 12px}
.fcard{position:relative;width:100%;min-height:380px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:3px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:0 6px 0 #e4daf3}
.face.back{transform:rotateY(180deg);background:linear-gradient(180deg,#fff,var(--lav-s))}
.face img{width:min(250px,62vw);height:min(250px,62vw);object-fit:contain}
.face .big{font-family:var(--fh);font-weight:800;font-size:44px;line-height:1.05}
.face .mid{font-family:var(--fh);font-weight:800;font-size:30px;line-height:1.15;color:#6a4fcb}
.face .tip{color:var(--muted);font-weight:700;font-size:14px}
.face .viB{font-weight:800;font-size:22px;color:#e0527f}
.fnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.fnav2{display:flex;gap:10px;margin-top:10px}
.fnav2 .btn{flex:1}

/* ---------- câu hỏi ---------- */
.qcard{background:#fff;border:3px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 5px 0 #e4daf3}
.qtype{display:inline-flex;gap:6px;align-items:center;background:var(--lav-s);color:#6a4fcb;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;margin-bottom:8px}
.qtype.retry{background:var(--sun-s);color:#a97a00}
.qp{font-size:19px;font-weight:800;margin:4px 0 10px}
.qp .w{font-family:var(--fh);font-size:34px;color:#e0527f;display:block;line-height:1.1}
.qp .pic{width:min(210px,56vw);height:min(210px,56vw);object-fit:contain;display:block;margin:4px auto 6px}
.qp .sent{font-size:21px;line-height:1.7}
.qp .blank{display:inline-block;min-width:70px;border-bottom:3px solid #6a4fcb;text-align:center;color:#6a4fcb}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media(max-width:520px){.opts{grid-template-columns:1fr}.modes{gap:6px}.mode b{font-size:16px}.mode{padding:10px 4px}.face .big{font-size:38px}}
.opt{background:#fff;border:3px solid var(--line);border-radius:16px;padding:13px 14px;font-weight:800;font-size:18px;min-height:58px;text-align:left;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;gap:10px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt b{width:28px;height:28px;border-radius:9px;background:#f1ebfa;display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt.ok{background:var(--mint-s);border-color:var(--ok);box-shadow:0 4px 0 #3aa57f}
.opt.bad{background:var(--bad-s);border-color:var(--bad);box-shadow:0 4px 0 #d9607a;animation:shake .35s}
.opt.pic{justify-content:center;padding:8px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.inp{width:100%;border:3px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;font-weight:800;font-size:22px;outline:none;min-height:56px;background:#fff;color:var(--ink);margin-top:6px}
.inp:focus{border-color:var(--lav)}
.inp.ok{border-color:var(--ok);background:var(--mint-s)}
.inp.bad{border-color:var(--bad);background:var(--bad-s)}
.lab2{font-weight:800;color:var(--muted);font-size:14px;margin-top:8px;display:block}
.hintp{font-family:ui-monospace,Consolas,monospace;font-weight:800;letter-spacing:3px;color:#6a4fcb;margin:6px 0 0;min-height:24px;font-size:18px}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:56px;margin:8px 0}
.slot{width:44px;height:52px;border-radius:12px;border:3px dashed #d3c9ea;display:grid;place-items:center;font-family:var(--fh);font-weight:800;font-size:26px;text-transform:lowercase;background:#fff}
.slot.f{border-style:solid;border-color:var(--lav);background:var(--lav-s)}
.slots.ok .slot{border-color:var(--ok);background:var(--mint-s)}
.slots.bad .slot{border-color:var(--bad);background:var(--bad-s)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.tile{width:46px;height:52px;border-radius:12px;background:#fff;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--fh);font-weight:800;font-size:26px}
.tile:disabled{opacity:.25;box-shadow:none}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tfs{background:var(--lav-s);border-radius:18px;padding:14px;font-family:var(--fh);font-weight:800;font-size:26px;text-align:center;line-height:1.3}
.tfs span{color:var(--muted);font-size:18px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.mt .col{display:flex;flex-direction:column;gap:8px}
.mc{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 8px;font-weight:800;font-size:16.5px;min-height:54px;text-align:center;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;line-height:1.2}
.mc.pick{border-color:var(--lav);background:var(--lav-s)}
.mc.done{border-color:var(--ok);background:var(--mint-s);opacity:.55;box-shadow:none}
.mc.bad{border-color:var(--bad);background:var(--bad-s);animation:shake .35s}
.fb{margin-top:12px;border-radius:20px;padding:12px 14px;font-weight:700}
.fb.ok{background:var(--mint-s);border:3px solid var(--ok)}
.fb.bad{background:var(--bad-s);border:3px solid var(--bad)}
.fb h3{font-size:21px;margin-bottom:4px}
.fb .ans{font-family:var(--fh);font-size:24px;font-weight:800;color:#124a3a;line-height:1.25}
.fb .acts{display:flex;gap:8px;margin-top:10px;align-items:center}
.fb .acts .btn{flex:1}
.fb img{width:84px;height:84px;object-fit:contain;float:right;margin-left:8px;background:#fff;border-radius:14px;border:2px solid var(--line)}

/* ---------- kết quả ---------- */
.res{text-align:center}
.res .stars{font-size:44px;letter-spacing:4px;margin:4px 0}
.res .score{font-family:var(--fh);font-weight:800;font-size:54px;color:#7a5cd6;line-height:1}
.res .score small{font-size:26px;color:var(--muted)}
.res .cheer{font-weight:800;margin:6px 0 12px;font-size:17px}
.rl{text-align:left;margin-top:10px}
.rl .it{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 10px;margin-bottom:8px}
.rl .it img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:12px;border:2px solid var(--line);flex:none}
.rl .it b{font-family:var(--fh);font-size:19px;display:block;line-height:1.15}
.rl .it span{display:block;color:#6a4fcb;font-weight:800;font-size:15px}
.rl .it i{display:block;font-style:normal;color:var(--muted);font-weight:700;font-size:13.5px}
.rbtns{display:grid;gap:10px;margin-top:14px}
.confetti{position:fixed;top:-30px;font-size:26px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;font-weight:800;border-bottom:2px dashed var(--line)}
.sw{width:54px;height:32px;border-radius:99px;background:#ddd5ee;position:relative;flex:none;transition:.15s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}.sw.on::after{left:25px}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ============================================================
   IRREGULAR VERBS – app ôn động từ bất quy tắc (Little Sprout English)
   Dữ liệu: V1, V2, V3, nghĩa tiếng Việt, hình minh hoạ (images/<id>.webp)
   ============================================================ */
const IMGV = '1';                       // đổi số này khi thay hình để trình duyệt tải hình mới
const KEY = 'irregularVerbs.v1';

    case 'selPart': { const ids = VERBS.filter(v => v.part === +el.dataset.p).map(v => v.id); const s = selSet(); const on = ids.every(i => s.has(i)); ids.forEach(i => on ? s.delete(i) : s.add(i)); setSel([...s]); refreshSel(); break; }
    case 'selRv': setSel(VERBS.filter(v => needs(v.id)).map(v => v.id)); S.tab = 'sel'; refreshSel(); break;
    case 'selLetter': { const l = el.dataset.l, ids = filtered().filter(v => v.v1[0] === l).map(v => v.id); const s = selSet(); const on = ids.every(i => s.has(i)); ids.forEach(i => on ? s.delete(i) : s.add(i)); setSel([...s]); refreshSel(); break; }
    case 'selFound': { const s = selSet(); filtered().forEach(v => s.add(v.id)); setSel([...s]); refreshSel(); break; }
    case 'tab': S.tab = el.dataset.t; renderTools(); renderList(); break;
    case 'clearQ': S.q = ''; $('#q').value = ''; el.classList.add('hidden'); renderList(); break;
    case 'jump': { const t = document.getElementById('sec-' + el.dataset.l); if (t) t.scrollIntoView({behavior: 'smooth', block: 'start'}); break; }
    case 'flash': startFlash(); break;
    case 'practice': startQuiz(store.sel.slice()); break;
    case 'home': case 'fquit': renderHome(); break;
    case 'flipc': F.flip = !F.flip; document.querySelector('.fcard').classList.toggle('flip', F.flip); sfxClick(); break;
    case 'fsay': { const v = F.list[F.i]; sayV(v, F.mode === 'A' ? 1 : 0); break; }
    case 'fshuf': F.shuffled = !F.shuffled; F.list = F.shuffled ? shuffle(F.list.slice()) : SORTED.filter(v => F.base.includes(v)); F.i = 0; F.flip = false; renderFlash(); break;
    case 'funk': flashMark(false); break;
    case 'fknow': flashMark(true); break;
    case 'fprev': if (F.i) { F.i--; F.flip = false; renderFlash(); } break;
    case 'fnext': flashNext(false); break;
    case 'flashUnk': startFlash([...F.unk]); break;
    case 'practiceUnk': startQuiz([...F.unk]); break;
    case 'qquit': openOv(`<h2>⏸ Tạm dừng</h2><p class="muted" style="font-weight:700">Nghỉ một chút nhé! Em muốn tiếp tục hay thoát?</p><div class="rbtns"><button class="btn pri big" data-act="closeOv">▶ Tiếp tục</button><button class="btn big" data-act="qexit">🏠 Thoát về danh sách</button></div>`); break;
    case 'qexit': closeOv(); renderHome(); break;
    case 'opt': answerOpt(+el.dataset.i); break;
    case 'check': checkTyped(); break;
    case 'hint': hint(); break;
    case 'tile': tile(+el.dataset.i); break;
    case 'untile': untile(+el.dataset.k); break;
    case 'scrClear': scrClear(); break;
    case 'tf': answerTF(el.dataset.v); break;
    case 'mL': matchL(id); break;
    case 'mR': matchR(id); break;
    case 'next': nextQ(); break;
    case 'fixit': startQuiz(Q.wrong.slice(), {fix: true}); break;
    case 'again': startQuiz(store.sel.slice()); break;
  }
});
renderHome();
window.__iv = {VERBS, store, S, get Q() { return Q; }, startQuiz, build, nextQ, finishQuiz};
</script>
