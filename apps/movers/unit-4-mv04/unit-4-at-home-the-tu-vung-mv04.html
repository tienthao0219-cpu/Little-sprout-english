<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 4 · At home - Thẻ từ vựng</title>
<style>
:root{--sky:#57c7f5;--sky2:#2da8e8;--pink:#ff8fb5;--pink2:#f56f9d;--mint:#79dca4;--ink:#23445d;--cream:#fffdf8;--shadow:0 14px 30px rgba(45,124,166,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 16px 16px,rgba(255,255,255,.72) 0 3px,transparent 4px) 0 0/34px 34px,linear-gradient(180deg,#dff6ff 0%,#f7fdff 48%,#fff5fa 100%);overflow-x:hidden}
.app{width:min(1500px,96vw);margin:auto;padding:24px 10px 56px}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:18px 22px;border:3px solid rgba(72,177,230,.42);border-radius:28px;background:rgba(255,255,255,.87);box-shadow:var(--shadow);backdrop-filter:blur(7px)}
.title-wrap{display:flex;gap:15px;align-items:center}.logo{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:32px;background:linear-gradient(145deg,#fff3ae,#ffd35f);border:4px solid #fff;outline:3px solid #efb638;box-shadow:0 6px 0 #e3a729}
h1{margin:0;font-size:clamp(24px,3vw,42px);line-height:1;color:#2b91c8;letter-spacing:.2px}.sub{margin:7px 0 0;font-size:14px;font-weight:900;color:#6d8da2}.level{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:5px 9px;border-radius:999px;background:#effbf5;color:#35a66d;border:2px solid #bcebcf;font-size:12px;vertical-align:middle}
.controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:9px}.btn{border:0;border-radius:15px;padding:11px 15px;font:inherit;font-weight:1000;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(50,91,124,.2);transition:.15s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(50,91,124,.18)}.btn.off{filter:grayscale(.6) brightness(1.08)}.blue{background:linear-gradient(#68cbf6,#36a9e5)}.green{background:linear-gradient(#7bdda6,#45bd7a)}.pink{background:linear-gradient(#ff9abb,#f576a0)}.amber{background:linear-gradient(#ffd36e,#f2b53a)}
.progress-row{display:flex;align-items:center;gap:12px;margin:18px 6px 15px}.progress-label{font-weight:1000;color:#5e7e93;font-size:14px;white-space:nowrap}.progress{height:13px;flex:1;border-radius:999px;background:#d8edf7;overflow:hidden;box-shadow:inset 0 1px 2px rgba(33,105,145,.1)}.progress>span{display:block;width:0;height:100%;background:linear-gradient(90deg,#55c6f2,#ff91b7);transition:width .25s}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 12px 14px;min-height:316px;border-radius:25px;cursor:pointer;user-select:none;outline:none;border:4px solid #fff;outline:3px solid rgba(66,169,224,.48);background:linear-gradient(160deg,#fff,#f3fbff 68%,#e2f5ff);box-shadow:var(--shadow);transition:transform .15s,outline-color .2s}
.card:hover{transform:translateY(-3px)}.card:focus-visible{box-shadow:0 0 0 5px rgba(255,142,181,.35)}
.card.heard{outline-color:rgba(69,189,122,.62)}
.card.playing{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
.num{position:absolute;left:10px;top:10px;width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:#e8f8ff;color:#2a9bd4;border:2px solid #b8e5f9;font-size:13px;font-weight:1000}
.card.heard .num{background:#e6f8ee;color:#35a66d;border-color:#bcebcf}
.pic{position:relative;flex:1;width:100%;display:grid;place-items:center;min-height:0;padding:6px 0 4px}
.pic:before{content:"";position:absolute;width:74%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,236,244,.88),rgba(220,247,255,.06) 70%)}
.pic img{position:relative;z-index:1;max-width:94%;max-height:176px;object-fit:contain;filter:drop-shadow(0 8px 5px rgba(40,112,153,.1))}
.word{font-size:clamp(22px,2.1vw,32px);line-height:1.05;font-weight:1000;color:#e0558a;overflow-wrap:anywhere;margin-top:6px}.ipa{margin-top:6px;display:inline-block;padding:3px 12px;border-radius:999px;background:#e8f8ff;color:#2a8cbf;border:2px solid #b8e5f9;font-size:clamp(14px,1.2vw,17px);font-weight:900;font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS",system-ui,sans-serif;letter-spacing:.2px}
.tag{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:999px;background:#fff0f6;color:#d2557f;font-size:.5em;font-weight:1000;vertical-align:middle;text-transform:none}
.vi{margin-top:5px;font-size:clamp(15px,1.35vw,19px);font-weight:900;color:#2b91c8;line-height:1.2}
.sound{margin-top:10px;border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:1000;font-size:14px;color:#2e84b1;background:#e8f7ff;cursor:pointer;box-shadow:0 4px 0 rgba(77,145,183,.22)}
.sound:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(77,145,183,.2)}
.hide-vi .vi{visibility:hidden}.hide-word .word,.hide-word .ipa{visibility:hidden}.hide-word .card.reveal .word,.hide-word .card.reveal .ipa,.hide-vi .card.reveal .vi{visibility:visible}
.footer{text-align:center;margin:22px 0 0;color:#6f8ba0;font-size:13px;font-weight:900}.count-chip{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;background:#fff;border:2px solid #cbeaf8;color:#4d91b7;margin-right:6px}
@media(max-width:1180px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:900px){.hero{grid-template-columns:1fr}.controls{justify-content:flex-start}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:640px){.app{width:96vw;padding-top:14px}.hero{padding:14px;border-radius:21px}.logo{width:50px;height:50px;font-size:26px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card{min-height:262px}.pic img{max-height:130px}.controls{display:grid;grid-template-columns:1fr 1fr;width:100%}.btn{padding:10px 7px;font-size:12px}.level{display:none}}
@media (prefers-reduced-motion:reduce){.card.playing{animation:none}}
.home-btn{min-width:46px}
.tabs2{display:flex;flex-wrap:wrap;gap:8px;margin:0 6px 14px}.tabs2 button{border:3px solid #cbeaf8;background:#fff;color:#4d91b7;border-radius:999px;padding:8px 16px;font:inherit;font-weight:1000;cursor:pointer}.tabs2 button.on{background:#2da8e8;border-color:#2da8e8;color:#fff}.tabs2 button small{opacity:.8;font-weight:900;margin-left:4px}
/* ===== Tab Luyện tập ===== */
.modebar{display:flex;gap:8px;margin:14px 6px 12px}
.modebar button{flex:1;border:3px solid #cbeaf8;background:#fff;color:#4d91b7;border-radius:16px;padding:10px 8px;font:inherit;font-weight:1000;font-size:17px;cursor:pointer}
.modebar button.on{background:#2da8e8;border-color:#2da8e8;color:#fff;box-shadow:0 4px 0 #1b86bf}
#practice{display:none}
body.mode-practice #practice{display:flex}
body.mode-practice .hero,body.mode-practice .progress-row,body.mode-practice #tabs2,body.mode-practice #grid,body.mode-practice .footer{display:none}
body.mode-practice .app{padding-top:8px;padding-bottom:8px}
#practice{flex-direction:column;min-height:calc(100dvh - 16px);gap:8px;color:var(--ink)}
.pr-bar{display:flex;align-items:center;gap:10px;flex:none}
.pr-bar .pb{border:3px solid #cbeaf8;background:#fff;border-radius:12px;min-width:40px;height:40px;font:inherit;font-weight:1000;color:#4d91b7;cursor:pointer;padding:0 10px}
.pr-prog{flex:1;height:12px;border-radius:999px;background:#d8edf7;overflow:hidden}.pr-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#55c6f2,#ff91b7);transition:width .25s}
.pr-qn{font-weight:1000;font-size:14px;color:#5e7e93;white-space:nowrap}
.pr-card{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:3px solid #cbeaf8;border-radius:22px;padding:12px;box-shadow:var(--shadow);overflow:hidden}
.pr-type{display:inline-flex;align-self:flex-start;gap:6px;font-weight:1000;font-size:13px;color:#2b91c8;background:#e8f6ff;border-radius:999px;padding:4px 12px}
.pr-label{font-weight:900;color:#6d8da2;font-size:15px;margin:6px 0 2px}
.pr-top{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.pr-top img.pic{height:100%;max-height:min(34dvh,340px);max-width:min(78vw,340px);object-fit:contain;filter:drop-shadow(0 8px 5px rgba(40,112,153,.12))}
.pr-top .pw{font-size:clamp(26px,6dvh,44px);font-weight:1000;color:#e0558a;text-align:center;line-height:1.1}
.pr-top .pv{font-size:clamp(22px,5dvh,34px);font-weight:1000;color:#2b91c8;text-align:center}
.pr-bot{flex:none;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pr-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr-opt{border:3px solid #cbeaf8;background:#fff;border-radius:16px;min-height:52px;padding:8px;font:inherit;font-weight:1000;font-size:clamp(16px,2.8dvh,20px);color:#23445d;cursor:pointer}
.pr-opt:hover:not(:disabled){border-color:#2da8e8}
.pr-opt.right{background:#e3f8ec;border-color:#45bd7a}.pr-opt.wrong{background:#ffe9ee;border-color:#ff8fa5}.pr-opt.dim{opacity:.55}
.pr-pics{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:min(430px,44dvh);margin:0 auto}
.pr-pics .pr-opt{aspect-ratio:1;padding:4px;display:grid;place-items:center}.pr-pics img{max-width:92%;max-height:92%;object-fit:contain}
.pr-in{width:100%;border:3px solid #9fd8f5;border-radius:16px;padding:12px;font:inherit;font-weight:1000;font-size:22px;text-align:center;color:#23445d;background:#fff}
.pr-in.ok{border-color:#45bd7a;background:#e3f8ec}.pr-in.no{border-color:#ff8fa5;background:#ffe9ee}
.pr-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pr-act .grow{flex:1}
.pr-btn{border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:1000;font-size:16px;cursor:pointer;color:#fff;background:#2da8e8;box-shadow:0 4px 0 #1b86bf}
.pr-btn.pink{background:#ff8fb5;box-shadow:0 4px 0 #e0558a}.pr-btn.ghost{background:#fff;color:#4d91b7;border:3px solid #cbeaf8;box-shadow:none}.pr-btn:disabled{opacity:.5}
.pr-link{background:none;border:0;font:inherit;font-weight:900;color:#4d91b7;text-decoration:underline;cursor:pointer}
.pr-hint{background:#fff6e0;border:2px dashed #f2c46c;border-radius:12px;padding:6px 10px;font-weight:800;font-size:15px}.pr-hint:empty{display:none}
.pr-hint .mono{display:block;font-family:ui-monospace,Consolas,monospace;letter-spacing:3px;font-size:20px}
.pr-fb{border-radius:14px;padding:8px 12px;font-weight:900}.pr-fb.good{background:#e3f8ec;color:#1f7a49}.pr-fb.bad{background:#ffe9ee;color:#b3304f}
.pr-fb b{font-size:19px}
.pr-slots{font-family:ui-monospace,Consolas,monospace;font-size:clamp(26px,5.5dvh,38px);letter-spacing:5px;font-weight:1000;color:#23445d;text-align:center}
.pr-slots u{color:#e0558a;text-decoration:none;border-bottom:4px solid #e0558a}
.pr-tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:50px}
.pr-tile{min-width:44px;height:50px;border-radius:12px;border:3px solid #d98300;background:#ffcfa6;color:#fff;font:inherit;font-weight:1000;font-size:26px;cursor:pointer;box-shadow:0 4px 0 #d98300;padding:0 8px;text-transform:lowercase}
.pr-tile.used{visibility:hidden}.pr-tray .pr-tile{background:#fff;color:#23445d;border-color:#9fd8f5;box-shadow:0 4px 0 #cbeaf8}
.pr-match{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0;width:100%}
.pr-col{display:flex;flex-direction:column;gap:8px;min-height:0}
.pr-mb{flex:1 1 0;min-height:46px;border:3px solid #cbeaf8;background:#fff;border-radius:14px;font:inherit;font-weight:1000;font-size:clamp(16px,2.8dvh,20px);color:#23445d;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px 8px;transition:opacity .25s,transform .25s}
.pr-mb img{max-height:100%;max-width:100%;height:100%;object-fit:contain}
.pr-mb.sel{border-color:#2da8e8;background:#e9f6ff;transform:scale(1.03)}.pr-mb.bad{border-color:#ff8fa5;background:#ffe9ee}
.pr-mb.gone{opacity:0;visibility:hidden;pointer-events:none;transform:scale(.7)}
.pr-setup,.pr-res{background:#fff;border:3px solid #cbeaf8;border-radius:22px;padding:16px;box-shadow:var(--shadow);overflow:auto;flex:1}
.pr-setup h2,.pr-res h2{margin:0 0 6px;color:#2b91c8}
.pr-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.pr-chip{border:3px solid #cbeaf8;background:#fff;color:#4d91b7;border-radius:999px;padding:8px 14px;font:inherit;font-weight:1000;cursor:pointer}.pr-chip.on{background:#2da8e8;border-color:#2da8e8;color:#fff}
.pr-res .stars{font-size:48px;text-align:center}.pr-res .stars .off{filter:grayscale(1);opacity:.3}
.pr-res .big{font-size:34px;font-weight:1000;color:#2b91c8;text-align:center}
.pr-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.pr-grid3 div{background:#f3fbff;border-radius:14px;padding:8px;text-align:center}.pr-grid3 b{display:block;font-size:22px;color:#23445d}.pr-grid3 span{font-size:12px;color:#6d8da2;font-weight:900}
.pr-miss{display:flex;gap:10px;align-items:center;border-bottom:1px dashed #cbeaf8;padding:6px 0}.pr-miss img{width:46px;height:46px;object-fit:contain}.pr-miss b{color:#e0558a}.pr-miss span{color:#2b91c8;font-weight:900;margin-left:auto}
.pr-btns{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:12px auto 0}
.pr-btns .pr-btn{width:100%}
@media (max-height:620px){.pr-top img.pic{max-height:26dvh}}
body.mode-practice .modebar{display:none}
.word.long{font-size:clamp(15px,4.3vw,21px);overflow-wrap:normal;word-break:normal}.grid>.card{min-width:0}.pic .badge{position:relative;z-index:1;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:1000;color:#fff;background:linear-gradient(145deg,#7bdda6,#35a66d);border:5px solid #fff;box-shadow:0 8px 0 rgba(53,166,109,.25)}
</style>

let cards=[...originalCards], playingAll=false, stopAll=false, topicSel="all", view=cards;
const heard=new Set();
const grid=document.getElementById('grid'),app=document.getElementById('app'),progressText=document.getElementById('progressText'),progressBar=document.getElementById('progressBar');
let voice=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return null; const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  const rank=v=>{ let r=0; const n=v.name||'';
    if(/en[-_]GB/i.test(v.lang)) r+=30; else if(/en[-_]US/i.test(v.lang)) r+=20; else if(/en[-_](AU|IE|CA|NZ)/i.test(v.lang)) r+=10;
    if(/google uk english female|sonia|libby|natural|samantha|serena|kate|karen|moira|ava|susan/i.test(n)) r+=10;
    if(/espeak|compact|novelty|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|trinoids|whisper|zarvox|albert|fred|junior|kathy|ralph/i.test(n)) r-=50;
    return r; };
  return vs.filter(v=>/^en([-_]|$)/i.test(v.lang)).sort((a,b)=>rank(b)-rank(a))[0]||null; }
function loadVoice(){ voice=null; }
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=loadVoice; }catch(e){} }
function speak(text,done){
  if(!('speechSynthesis' in window)){ if(done) done(); return; }
  try{
    const ss=speechSynthesis;
    const go=()=>{ const u=new SpeechSynthesisUtterance(text); if(!voice) voice=pickVoice(); u.lang=voice?voice.lang:'en-GB'; if(voice) u.voice=voice; u.rate=.85; u.pitch=1; u.volume=1;
      if(done){ u.onend=done; u.onerror=done; } ss.speak(u); if(ss.paused) ss.resume(); };
    if(ss.speaking||ss.pending){ ss.cancel(); setTimeout(go,80); } else go();
  }catch(e){ if(done) done(); }
}
function updateProgress(){ const h=view.filter(c=>heard.has(c.id)).length; progressText.textContent=`${h} / ${view.length} đã nghe`; progressBar.style.width=`${view.length?h/view.length*100:0}%`; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function play(i,el,done){
  const c=view[i]; heard.add(c.id); el.classList.add('heard','playing'); setTimeout(()=>el.classList.remove('playing'),480);
  updateProgress(); speak(c.say||c.word,done);
}
function render(){
  grid.innerHTML='';
  view=cards.filter(c=>topicSel==='all'||c.topic===topicSel);
  view.forEach((c,i)=>{
    const t=document.createElement('article'); t.className='card'+(heard.has(c.id)?' heard':''); t.tabIndex=0; t.setAttribute('role','button'); t.setAttribute('aria-label',c.word+' — '+c.vi);
    t.innerHTML=`<span class="num">${i+1}</span><div class="pic">${c.image?`<img src="${c.image}" alt="${esc(c.word)}">`:(c.badge?`<div class="badge">${esc(c.badge)}</div>`:'')}</div><div class="word${c.word.length>10?' long':''}">${esc(c.word)}${c.tag?`<span class="tag">${esc(c.tag)}</span>`:''}</div>${c.ipa?`<div class="ipa">/${esc(c.ipa)}/</div>`:''}<div class="vi">${esc(c.vi)}</div><button class="sound" type="button" aria-label="Nghe ${esc(c.word)}">🔊 Nghe</button>`;
    const go=e=>{ if(e && e.target.closest && e.target.closest('.sound')) e.stopPropagation(); t.classList.add('reveal'); play(i,t); };
    t.addEventListener('click',go);
    t.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(e); } });
    grid.appendChild(t);
  });
  updateProgress();
}
document.getElementById('shuffleBtn').onclick=()=>{ cards=[...cards].sort(()=>Math.random()-.5); render(); };
document.getElementById('resetBtn').onclick=()=>{ stopAll=true; speechSynthesis.cancel(); heard.clear(); cards=[...originalCards]; render(); };
const viBtn=document.getElementById('viBtn'), wordBtn=document.getElementById('wordBtn');
viBtn.onclick=()=>{ const off=app.classList.toggle('hide-vi'); viBtn.textContent='🇻🇳 Nghĩa: '+(off?'TẮT':'BẬT'); viBtn.classList.toggle('off',off); grid.querySelectorAll('.card').forEach(c=>c.classList.remove('reveal')); };
wordBtn.onclick=()=>{ const off=app.classList.toggle('hide-word'); wordBtn.textContent='🔤 Từ + IPA: '+(off?'TẮT':'BẬT'); wordBtn.classList.toggle('off',off); grid.querySelectorAll('.card').forEach(c=>c.classList.remove('reveal')); };
document.getElementById('playAll').onclick=function(){
  if(playingAll){ stopAll=true; speechSynthesis.cancel(); return; }

<script>/* ===== Tab Luyện tập (dùng danh sách thẻ của unit) ===== */
(function(){
const root=document.getElementById('practice'); if(!root) return;
const W_ALL=originalCards.slice();
const TYPES={
  en2vi:{icon:'🔠',label:'Anh → Việt'}, vi2en:{icon:'🔡',label:'Việt → Anh'},
  lw:{icon:'🎧',label:'Nghe chọn từ'}, lp:{icon:'🖼️',label:'Nghe chọn hình',pic:1},
  type:{icon:'⌨️',label:'Nhìn & gõ từ',pic:1}, missing:{icon:'🔤',label:'Điền chữ cái'},
  match:{icon:'🔗',label:'Nối cặp'}, scramble:{icon:'🔀',label:'Sắp xếp chữ'}, listen:{icon:'✍️',label:'Nghe & gõ'}
};
const TTS=('speechSynthesis' in window);
const $=(s,r)=> (r||root).querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[^a-z]/g,'');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const label=c=>c.word+(c.tag?' '+c.tag:'');
const report=o=>{try{if(window.parent&&window.parent!==window)window.parent.postMessage(Object.assign({lse:1},o),'*');}catch(e){}};
let muted=false,actx=null;
function tone(seq){ if(muted) return; try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; actx=actx||new C(); if(actx.state==='suspended') actx.resume();
  let t=actx.currentTime; seq.forEach(([f,d])=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.03); t+=d*.85; }); }catch(e){} }
const sfxOk=()=>tone([[660,.12],[880,.18]]), sfxBad=()=>tone([[260,.18],[200,.25]]);
const say=(t,slow)=>{ if(muted||!TTS) return; speak(t); };

let sel='all', enabled=Object.keys(TYPES), S=null;
const topics=[]; W_ALL.forEach(c=>{ if(c.topic&&topics.indexOf(c.topic)<0) topics.push(c.topic); });
const pool=()=>W_ALL.filter(c=>sel==='all'||c.topic===sel);
const hasImg=c=>!!c.image;

function setup(){
  S=null;
  const n=pool().length;
  root.innerHTML=`<div class="pr-bar"><button class="pb" data-a="cards">← Thẻ từ</button><div style="flex:1;text-align:center;font-weight:1000;color:#2b91c8">🎯 Luyện tập</div><button class="pb" data-a="mute">${muted?'🔇':'🔊'}</button></div>
  <div class="pr-setup"><h2>Luyện tập từ vựng</h2>
  ${topics.length?`<div><b>Chủ đề</b></div><div class="pr-chips"><button class="pr-chip ${sel==='all'?'on':''}" data-t="all">Tất cả (${W_ALL.length})</button>${topics.map(t=>`<button class="pr-chip ${sel===t?'on':''}" data-t="${esc(t)}">${esc(t)} (${W_ALL.filter(c=>c.topic===t).length})</button>`).join('')}</div>`:''}
  <div><b>Dạng bài</b> <small style="color:#6d8da2">(bấm để bật/tắt, các dạng được trộn xen kẽ)</small></div>
  <div class="pr-chips">${Object.keys(TYPES).map(k=>`<button class="pr-chip ${enabled.indexOf(k)>=0?'on':''}" data-ty="${k}">${TYPES[k].icon} ${TYPES[k].label}</button>`).join('')}</div>
  <p style="color:#6d8da2;font-weight:800;margin:6px 0">${n} từ · mỗi lượt khoảng ${Math.min(16,Math.max(8,n))} câu. Câu sai sẽ quay lại cho đến khi đúng.</p>
  <div class="pr-btns"><button class="pr-btn pink" data-a="start" ${(!enabled.length||n<4)?'disabled':''}>▶ Bắt đầu luyện tập</button></div></div>`;
}
function build(words,fixOnly){
  const types=enabled.filter(t=>!(TYPES[t].pic&&words.filter(hasImg).length<4)&&!(t==='match'&&words.length<3));
  const N=fixOnly?words.length:Math.min(16,Math.max(8,words.length));
  const order=[]; let bag=[];
  while(order.length<N){ if(!bag.length) bag=shuf(words); order.push(bag.pop()); }
  let last='';
  return order.map(c=>{ let ts=types.filter(t=>t!==last&&!(TYPES[t].pic&&!hasImg(c))); if(!ts.length) ts=types.filter(t=>!(TYPES[t].pic&&!hasImg(c))); if(c.word.replace(/[^a-z]/gi,'').length<3) ts=ts.filter(t=>t!=='scramble'&&t!=='missing')||ts; if(!ts.length) ts=['en2vi'];
    const t=rnd(ts); last=t; return {c,type:t,att:1}; });
}
function start(words,fix){
  const q=build(words,fix);
  S={q,i:0,total:q.length,score:0,streak:0,best:0,first:new Set(),missed:new Map(),answered:false,done:0,fix:!!fix,hints:0};
  show();
}
function opts4(c,key){ // key: 'vi' | 'word'
  const txt=x=>key==='vi'?x.vi:label(x);
  const others=shuf(pool().filter(x=>x.id!==c.id&&txt(x)!==txt(c)&&x.word!==c.word));
  const seen=new Set([txt(c)]); const out=[c];
  others.forEach(x=>{ if(out.length<4&&!seen.has(txt(x))){ seen.add(txt(x)); out.push(x); } });
  return shuf(out);
}
function pat(c,n){ const w=c.word; let k=0; return w.split('').map(ch=>/[a-z]/i.test(ch)?(k++<n?ch:'_'):ch).join(' '); }
function show(){
  const q=S.q[S.i]; if(!q) return finish();
  S.cur=q; S.answered=false; S.hints=0; S.sel=-1; S.selSide='';
  const c=q.c, T=TYPES[q.type]; let lab='',top='',bot='';
  const optBtns=(arr,key)=>`<div class="pr-opts">${arr.map((x,i)=>`<button class="pr-opt" data-a="pick" data-id="${esc(x.id)}">${esc(key==='vi'?x.vi:label(x))}</button>`).join('')}</div>`;
  const picBtn=`<img class="pic" src="${c.image}" alt="">`;
  if(q.type==='en2vi'){ lab='Nghĩa tiếng Việt của từ này là gì?'; top=(hasImg(c)?picBtn:'')+`<div class="pw">${esc(label(c))} <button class="pb" style="border:3px solid #cbeaf8;background:#fff;border-radius:12px;height:40px" data-a="say">🔊</button></div>`; bot=optBtns(opts4(c,'vi'),'vi'); }
  else if(q.type==='vi2en'){ lab='Từ tiếng Anh của nghĩa này là gì?'; top=`<div class="pv">${esc(c.vi)}</div>`; bot=optBtns(opts4(c,'word'),'word'); }
  else if(q.type==='lw'){ lab='Nghe và chọn từ đúng'; top=`<button class="pr-btn" style="font-size:34px;padding:18px 30px" data-a="say">🔊</button>`; bot=optBtns(opts4(c,'word'),'word'); }
  else if(q.type==='lp'){ lab='Nghe và chọn hình đúng'; const ps=shuf([c].concat(shuf(pool().filter(x=>x.id!==c.id&&hasImg(x)&&x.word!==c.word)).slice(0,3)));
    top=`<button class="pr-btn" style="font-size:30px;padding:12px 26px" data-a="say">🔊</button><div class="pr-pics">${ps.map(x=>`<button class="pr-opt" data-a="pick" data-id="${esc(x.id)}"><img src="${x.image}" alt=""></button>`).join('')}</div>`; }
  else if(q.type==='type'){ lab='Nhìn hình và gõ từ tiếng Anh'; top=picBtn+`<div class="pv">${esc(c.vi)}</div><div class="pr-hint" id="hb"></div>`; bot=typed('Gõ từ tiếng Anh...',true); }
  else if(q.type==='listen'){ lab='Nghe và viết lại từ bạn nghe được'; top=`<button class="pr-btn" style="font-size:34px;padding:18px 30px" data-a="say">🔊</button><div class="pr-hint" id="hb"></div>`; bot=typed('Gõ từ bạn nghe được...',true); }
  else if(q.type==='missing'){ const idx=[]; c.word.split('').forEach((ch,i)=>{ if(/[a-z]/i.test(ch)) idx.push(i); }); const k=Math.max(1,Math.round(idx.length*.4)); q.blank=shuf(idx).slice(0,k).sort((a,b)=>a-b);
    q.ans=q.blank.map(i=>c.word[i].toLowerCase()).join(''); lab='Điền các chữ cái còn thiếu (gõ theo thứ tự)';
    top=(hasImg(c)?picBtn:'')+`<div class="pv">${esc(c.vi)}</div><div class="pr-slots">${c.word.split('').map((ch,i)=>q.blank.indexOf(i)>=0?'<u>&nbsp;_&nbsp;</u>':esc(ch)).join('')}</div>`; bot=typed('Gõ các chữ cái còn thiếu...',false); }
  else if(q.type==='scramble'){ lab='Sắp xếp các chữ cái thành từ đúng'; const letters=c.word.replace(/[^a-z]/gi,'').split(''); let sh=shuf(letters); if(sh.join('')===letters.join('')&&letters.length>2) sh=letters.slice().reverse();
    q.tiles=sh; q.placed=[]; top=(hasImg(c)?picBtn:'')+`<div class="pv">${esc(c.vi)}</div>`; bot=`<div class="pr-tiles" id="pl"></div><div class="pr-tiles pr-tray" id="tr"></div><div class="pr-act"><button class="pr-btn ghost" data-a="clr">↺ Xóa</button><span class="grow"></span><button class="pr-link" data-a="giveup">Mình không biết</button><button class="pr-btn" data-a="check">Kiểm tra</button></div>`; }
  else if(q.type==='match'){ const ws=shuf(pool()).slice(0,4); if(!ws.some(x=>x.id===c.id)) ws[0]=c; q.items=ws; q.R=shuf(ws); q.useImg=ws.every(hasImg); q.done=new Set(); q.wrong=0;
    lab='Nối từ tiếng Anh với '+(q.useImg?'hình':'nghĩa')+'. Chạm bên nào trước cũng được, đúng thì biến mất!'; top='<div id="mb" style="width:100%;flex:1;min-height:0;display:flex"></div>'; }
  const act=(['type','listen','missing'].indexOf(q.type)>=0)?`<div class="pr-act">${q.type!=='missing'?'<button class="pr-btn ghost" data-a="hint" id="hbtn">💡 Gợi ý (0/3)</button>':''}<span class="grow"></span><button class="pr-link" data-a="giveup">Mình không biết</button><button class="pr-btn" data-a="check">Kiểm tra</button></div>`:(q.type==='scramble'?'':`<div class="pr-act"><span class="grow"></span><button class="pr-link" data-a="giveup">Mình không biết</button></div>`);
  const pct=Math.round(S.done/S.total*100);
  root.innerHTML=`<div class="pr-bar"><button class="pb" data-a="quit">🏠</button><div class="pr-prog"><i style="width:${pct}%"></i></div><div class="pr-qn">Câu <b>${Math.min(S.done+1,S.total)}</b>/${S.total}</div><div class="pr-qn">${S.streak>=2?'🔥 '+S.streak:'⭐ '+S.score}</div><button class="pb" data-a="mute">${muted?'🔇':'🔊'}</button></div>
  <div class="pr-card"><div><span class="pr-type">${T.icon} ${T.label}</span>${q.att>1?' <span class="pr-type" style="background:#fff0f6;color:#d2557f">🔁 Làm lại</span>':''}</div><div class="pr-label">${lab}</div>
  <div class="pr-top">${top}</div><div class="pr-bot" id="bot">${bot}${act}<div id="fb"></div></div></div>`;
  if(q.type==='scramble') drawScr();
  if(q.type==='match') drawMatch();
  if(['lw','lp','listen'].indexOf(q.type)>=0) setTimeout(()=>say(c.word),350);
  if(q.type==='en2vi') setTimeout(()=>say(c.word),300);
  const inp=$('#pin'); if(inp&&!('ontouchstart' in window)) inp.focus();
}
function typed(ph,hintable){ return `<input class="pr-in" id="pin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ph}">`; }
function drawScr(){ const q=S.cur;
  $('#pl').innerHTML=q.placed.map((ti,k)=>`<button class="pr-tile" data-a="unplace" data-k="${k}">${esc(q.tiles[ti])}</button>`).join('')||'<span style="color:#9fb4c3;font-weight:900;align-self:center">Chạm chữ cái bên dưới</span>';
  $('#tr').innerHTML=q.tiles.map((ch,ti)=>`<button class="pr-tile ${q.placed.indexOf(ti)>=0?'used':''}" data-a="place" data-ti="${ti}">${esc(ch)}</button>`).join(''); }
function drawMatch(){ const q=S.cur;
  $('#mb').innerHTML=`<div class="pr-match"><div class="pr-col">${q.items.map((x,i)=>`<button class="pr-mb ${q.done.has(x.id)?'gone':''}" data-a="mt" data-side="L" data-i="${i}">${esc(label(x))}</button>`).join('')}</div><div class="pr-col">${q.R.map((x,j)=>`<button class="pr-mb ${q.done.has(x.id)?'gone':''}" data-a="mt" data-side="R" data-i="${j}">${q.useImg?`<img src="${x.image}" alt="">`:esc(x.vi)}</button>`).join('')}</div></div>`; }
function mEl(side,i){ return root.querySelector(`.pr-mb[data-side="${side}"][data-i="${i}"]`); }
function matchTap(side,i){ const q=S.cur; if(S.answered) return; const item=(side==='L'?q.items:q.R)[i]; if(!item||q.done.has(item.id)) return;
  if(q.sel<0||q.selSide===side){ const prev=q.sel>=0?mEl(q.selSide,q.sel):null; if(prev) prev.classList.remove('sel'); if(q.sel===i&&q.selSide===side){ q.sel=-1; q.selSide=''; return; } q.sel=i; q.selSide=side; {const e1=mEl(side,i); if(e1) e1.classList.add('sel');} if(side==='L') say(item.word); return; }
  const li=side==='L'?i:q.sel, ri=side==='R'?i:q.sel, a=mEl('L',li), b=mEl('R',ri), l=q.items[li], r=q.R[ri];
  q.sel=-1; q.selSide=''; if(!a||!b) return; a.classList.remove('sel'); b.classList.remove('sel');
  if(l===r){ q.done.add(l.id); sfxOk(); say(l.word); a.classList.add('gone'); b.classList.add('gone'); report({kind:'answer',qid:l.id,topic:'Từ vựng – '+document.title,ok:true,q:'[Nối cặp] '+l.word+' = '+l.vi});
    if(q.done.size===q.items.length) setTimeout(()=>{ if(S.cur===q&&!S.answered) finishQ(q.wrong<=1,'',q.c); },380); }
  else { q.wrong++; sfxBad(); a.classList.add('bad'); b.classList.add('bad'); report({kind:'answer',qid:l.id,topic:'Từ vựng – '+document.title,ok:false,q:'[Nối cặp] '+l.word+' ≠ '+r.vi}); setTimeout(()=>{ a.classList.remove('bad'); b.classList.remove('bad'); },380); } }
function hint(){ const q=S.cur,c=q.c; if(S.hints>=3) return; S.hints++; const n=norm(c.word).length; const out=[];
  if(S.hints>=1) out.push(`💡 Từ này có <b>${n}</b> chữ cái: <span class="mono">${esc(pat(c,0))}</span>`);
  if(S.hints>=2) out.push(`💡 Chữ cái đầu tiên: <span class="mono">${esc(pat(c,1))}</span>`);
  if(S.hints>=3) out.push(q.type==='listen'?`💡 Nghĩa tiếng Việt: <b>${esc(c.vi)}</b>`:`💡 Hai chữ cái đầu: <span class="mono">${esc(pat(c,2))}</span>`);
  $('#hb').innerHTML=out.join('<br>'); const b=$('#hbtn'); b.textContent=`💡 Gợi ý (${S.hints}/3)`; if(S.hints>=3) b.disabled=true; }
function finishQ(ok,given,c){ const q=S.cur; if(S.answered) return; S.answered=true; c=c||q.c;
  ok?sfxOk():sfxBad();
  if(q.type!=='match') report({kind:'answer',qid:c.id,topic:'Từ vựng – '+document.title,ok:ok,q:'['+TYPES[q.type].label+'] '+c.word+' = '+c.vi});
  if(ok){ if(q.att===1&&!S.hints) S.first.add(c.id); S.score+=(q.att===1?10:5); S.streak++; S.best=Math.max(S.best,S.streak); }
  else { S.streak=0; if(!S.missed.has(c.id)) S.missed.set(c.id,c); if(q.att<3){ const nt=rnd(enabled.filter(t=>t!==q.type&&!(TYPES[t].pic&&!hasImg(c))&&t!=='match')||['en2vi']); S.q.push({c,type:nt||'en2vi',att:q.att+1}); S.total=S.q.length; } }
  if(ok) S.done++; else S.done++;
  const fb=$('#fb'); const msgs=ok?['Chính xác!','Giỏi quá!','Tuyệt vời!','Đúng rồi!']:['Chưa đúng rồi','Cố lên nào!','Suýt nữa thì đúng!'];
  fb.innerHTML=`<div class="pr-fb ${ok?'good':'bad'}">${ok?'🎉':'💭'} ${rnd(msgs)}${ok&&S.hints?' (có dùng gợi ý)':''}${!ok&&q.att<3?' · Từ này sẽ quay lại sau 💪':''}<div><b>${esc(label(c))}</b> — ${esc(c.vi)} <button class="pb" style="border:2px solid #cbeaf8;background:#fff;border-radius:10px;height:30px" data-a="say2">🔊</button></div></div><div class="pr-act" style="margin-top:6px"><span class="grow"></span><button class="pr-btn pink" data-a="next" id="nx">${S.i+1>=S.q.length?'Xem kết quả':'Tiếp ▶'}</button></div>`;
  root.querySelectorAll('.pr-opt,.pr-in').forEach(el=>{ if(el.tagName==='INPUT'){ el.disabled=true; el.classList.add(ok?'ok':'no'); } });
  const nx=$('#nx'); if(nx) nx.focus({preventScroll:true});
  const act=root.querySelector('.pr-bot .pr-act'); if(act&&act.id!=='x') act.style.display='none';
}
function answerPick(id,btn){ const q=S.cur; if(S.answered) return; const ok=id===q.c.id;
  root.querySelectorAll('.pr-opt').forEach(b=>{ b.disabled=true; if(b.dataset.id===q.c.id) b.classList.add('right'); else if(b===btn) b.classList.add('wrong'); else b.classList.add('dim'); });
  if(ok) say(q.c.word); finishQ(ok,id); }
function check(){ const q=S.cur,c=q.c; if(S.answered) return;
  if(q.type==='scramble'){ const g=q.placed.map(ti=>q.tiles[ti]).join(''); return finishQ(norm(g)===norm(c.word),g); }
  const v=norm($('#pin').value); if(!v) return; const ok=q.type==='missing'?v===q.ans:v===norm(c.word); if(ok) say(c.word); finishQ(ok,v); }
function finish(){ const total=S.first.size, n=Math.max(1,new Set(S.q.map(x=>x.c.id)).size);
  const acc=Math.round(S.first.size/n*100); const stars=acc>=90?3:acc>=70?2:acc>=40?1:0; const miss=[...S.missed.values()];
  report({kind:'finish',score:S.first.size,max:n});
  root.innerHTML=`<div class="pr-bar"><button class="pb" data-a="cards">← Thẻ từ</button><div style="flex:1;text-align:center;font-weight:1000;color:#2b91c8">Kết quả</div></div>
  <div class="pr-res"><div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">⭐</span>`).join('')}</div><h2 style="text-align:center">${S.fix?'Sửa lỗi xong rồi!':'Hoàn thành!'}</h2><div class="big">+${S.score} điểm</div>
  <div class="pr-grid3"><div><b>${S.first.size}/${n}</b><span>Đúng ngay lần đầu</span></div><div><b>${acc}%</b><span>Chính xác</span></div><div><b>🔥 ${S.best}</b><span>Chuỗi đúng dài nhất</span></div></div>
  ${miss.length?`<h3 style="margin:8px 0;color:#23445d">📌 Từ làm sai</h3>${miss.map(c=>`<div class="pr-miss">${c.image?`<img src="${c.image}" alt="">`:''}<b>${esc(label(c))}</b><button class="pb" style="border:2px solid #cbeaf8;background:#fff;border-radius:10px;height:30px" data-a="sayw" data-w="${esc(c.word)}">🔊</button><span>${esc(c.vi)}</span></div>`).join('')}`:'<p style="text-align:center;font-weight:900">Không sai từ nào! 🎉</p>'}
  <div class="pr-btns">${miss.length?'<button class="pr-btn pink" data-a="fix">🔧 Fix it! Làm lại các từ vừa sai</button>':''}<button class="pr-btn" data-a="again">▶ Luyện tập lượt mới</button><button class="pr-btn ghost" data-a="cards">🃏 Về thẻ từ</button></div></div>`;
  S.lastMissed=miss; window.scrollTo(0,0);
}
root.addEventListener('click',e=>{ const b=e.target.closest('[data-a],[data-t],[data-ty]'); if(!b) return;
  if(b.dataset.t!==undefined){ sel=b.dataset.t; return setup(); }
  if(b.dataset.ty){ const k=b.dataset.ty,i=enabled.indexOf(k); if(i>=0) enabled.splice(i,1); else enabled.push(k); return setup(); }
  const a=b.dataset.a;
  if(a==='cards') return setMode('cards');
  if(a==='mute'){ muted=!muted; try{speechSynthesis.cancel();}catch(_){} b.textContent=muted?'🔇':'🔊'; return; }
  if(a==='start'||a==='again') return start(pool());
  if(a==='fix'){ const m=S.lastMissed; return start(m,true); }
  if(a==='quit'){ try{speechSynthesis.cancel();}catch(_){} return setup(); }
  if(!S) return;
  if(a==='say') return say(S.cur.c.word);
  if(a==='say2') return say(S.cur.c.word);
  if(a==='sayw') return say(b.dataset.w);
  if(a==='pick') return answerPick(b.dataset.id,b);
  if(a==='check') return check();
  if(a==='hint') return hint();
  if(a==='giveup') return finishQ(false,'');
  if(a==='next'){ S.i++; return show(); }
  if(a==='place'){ const q=S.cur; if(S.answered) return; const ti=+b.dataset.ti; if(q.placed.indexOf(ti)<0){ q.placed.push(ti); drawScr(); if(q.placed.length===q.tiles.length) setTimeout(check,150); } return; }
  if(a==='unplace'){ const q=S.cur; if(S.answered) return; q.placed.splice(+b.dataset.k,1); return drawScr(); }
  if(a==='clr'){ S.cur.placed=[]; return drawScr(); }
  if(a==='mt') return matchTap(b.dataset.side,+b.dataset.i);
});
root.addEventListener('keydown',e=>{ if(e.key==='Enter'&&S&&S.cur&&!S.answered&&e.target.id==='pin') check(); else if(e.key==='Enter'&&S&&S.answered){ const nx=$('#nx'); if(nx) nx.click(); } });
function setMode(m){ document.body.classList.toggle('mode-practice',m==='practice'); document.querySelectorAll('.modebar button').forEach(x=>x.classList.toggle('on',x.dataset.m===m));
  try{speechSynthesis.cancel();}catch(_){}
  if(m==='practice'){ setup(); } window.scrollTo(0,0); }
document.querySelectorAll('.modebar button').forEach(x=>x.addEventListener('click',()=>setMode(x.dataset.m)));
})();
</script>
</body>
</html>
