<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movers Grammar</title>
<link rel="icon" href="../../../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--t-peach:#FFE9DD;--t-sky:#E1EFFF;--t-mint:#DDF4E9;--t-rose:#FFE0EA;--t-lav:#ECE6FF;--t-butter:#FFF3C6;
  --cream:#FFF9F2;--ink:#2B3550;--soft:#67728D;--line:rgba(43,53,80,.10);
  --mint:#D3F1E5;--mint-d:#2E9C7C;--mint-dd:#1F7A60;--mint-s:#EAF8F2;
  --peach:#FFE0D2;--peach-d:#E27B52;--peach-dd:#C25A30;--peach-s:#FFF2EB;
  --sky:#DCEEFF;--sky-d:#3B88D0;--sky-dd:#2A6CB0;--sky-s:#EEF6FF;
  --rose:#FFDCE8;--rose-d:#DE5481;--rose-dd:#C23F6B;--rose-s:#FFEEF4;
  --lav:#E7DFFF;--lav-d:#7A64D4;--lav-dd:#5E48B8;--lav-s:#F3EEFF;
  --butter:#FFF1BE;--butter-d:#D3A01C;--good:#25A06D;--bad:#DC4B62;
  --shadow:0 1px 2px rgba(43,53,80,.05),0 10px 28px rgba(43,53,80,.08);
  --hfont:"Baloo 2","Nunito",system-ui,sans-serif;--bfont:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pc:var(--lav);--pd:var(--lav-d);--pdd:var(--lav-dd);--ps:var(--lav-s)}
body[data-c="mint"]{--pc:var(--mint);--pd:var(--mint-d);--pdd:var(--mint-dd);--ps:var(--mint-s)}
body[data-c="peach"]{--pc:var(--peach);--pd:var(--peach-d);--pdd:var(--peach-dd);--ps:var(--peach-s)}
body[data-c="sky"]{--pc:var(--sky);--pd:var(--sky-d);--pdd:var(--sky-dd);--ps:var(--sky-s)}
body[data-c="rose"]{--pc:var(--rose);--pd:var(--rose-d);--pdd:var(--rose-dd);--ps:var(--rose-s)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--bfont);font-weight:600;font-size:16px;line-height:1.5;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(900px 520px at 0% -5%,var(--pc) 0,transparent 62%),radial-gradient(800px 480px at 100% 0%,#DFF1FF 0,transparent 60%),radial-gradient(900px 600px at 50% 110%,#FFE6EF 0,transparent 60%),var(--cream);background-attachment:fixed;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
h1,h2,h3,h4{font-family:var(--hfont);margin:0;line-height:1.15;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
img{max-width:100%;display:block}
.hidden{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
/* thanh trên */
.sbar{position:sticky;top:0;z-index:30;margin:0 -16px 14px;padding:8px 16px;background:rgba(255,249,242,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.sbar-in{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto}
.slogo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.slogo img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--rose);box-shadow:0 0 0 3px #fff,0 4px 12px rgba(222,84,129,.2);flex:none}
.slogo b{display:block;font-family:var(--hfont);font-weight:800;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slogo small{display:block;color:var(--soft);font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;padding:4px 8px;border-radius:16px;font-weight:800;font-size:12px;color:var(--soft)}
.ni .nico{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:#fff;box-shadow:0 4px 10px rgba(140,110,200,.18);font-size:20px}
.ni:active .nico{transform:translateY(2px)}
/* nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 26px;border-radius:999px;font-family:var(--hfont);font-weight:700;font-size:20px;line-height:1;color:#fff;
  background:linear-gradient(180deg,var(--pd),var(--pdd));border:3px solid rgba(255,255,255,.55);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 6px 0 rgba(0,0,0,.2),0 14px 20px rgba(43,53,80,.14);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 2px 0 rgba(0,0,0,.2)}
.btn.ghost{background:#fff;color:var(--pdd);border:3px solid var(--pc);box-shadow:0 4px 0 rgba(43,53,80,.10)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pulse{animation:ready 1.8s ease-in-out infinite}
@keyframes ready{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:190px 1fr;gap:6px 22px;align-items:center;border-radius:34px;padding:18px 26px 18px 16px;margin-bottom:18px;overflow:hidden;border:3px solid #fff;
  background:radial-gradient(420px 220px at 88% 0%,#FFE6EF,transparent 70%),radial-gradient(420px 240px at 8% 100%,var(--mint),transparent 70%),radial-gradient(300px 200px at 60% 110%,var(--butter),transparent 70%),linear-gradient(135deg,#fff,#F6F1FF);box-shadow:0 22px 44px rgba(122,100,212,.18),var(--shadow)}
.hero .mascot{height:190px;display:grid;place-items:end center;position:relative}
.hero .mascot::before{content:'';position:absolute;left:8%;right:8%;top:6%;bottom:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff 0 40%,var(--rose) 41% 66%,transparent 68%);opacity:.9}
.hero .mascot img{position:relative;height:190px;width:auto;max-width:none;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(43,53,80,.18))}
.hello{display:inline-block;background:#fff;border:2px solid var(--rose);color:var(--rose-d);border-radius:999px;padding:5px 16px;font-family:var(--hfont);font-weight:800;font-size:18px;box-shadow:var(--shadow);margin-bottom:6px}
.hero h1{font-size:clamp(32px,6vw,52px);line-height:1}
.hero h1 span{background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent;background-image:linear-gradient(90deg,#2E9C7C,#3B88D0)}
.hero h1 span+span{background-image:linear-gradient(90deg,#DE5481,#E27B52)}
.hero p{margin:8px 0 10px;color:var(--soft);font-size:17px;max-width:520px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,#FFF6CF,var(--butter));border:2px solid #FFE59A;color:#8a6a00;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.sec{font-family:var(--hfont);font-size:24px;margin:18px 0 10px}
/* thẻ bài học */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{--tc:var(--mint);--td:var(--mint-d);position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border-radius:26px;padding:16px 16px 14px;box-shadow:var(--shadow);border:3px solid #fff;transition:transform .18s,box-shadow .18s;min-height:150px}
.tile.peach{--tc:var(--peach);--td:var(--peach-d)}.tile.sky{--tc:var(--sky);--td:var(--sky-d)}.tile.rose{--tc:var(--rose);--td:var(--rose-d)}.tile.lav{--tc:var(--lav);--td:var(--lav-d)}
.tile::before{content:'';position:absolute;inset:0 0 auto 0;height:8px;background:var(--tc)}
.tile .ico{width:54px;height:54px;border-radius:18px;background:var(--tc);display:grid;place-items:center;font-size:30px}
.tile b{font-family:var(--hfont);font-size:21px;line-height:1.1}
.tile small{color:var(--soft);font-size:14px;font-weight:700}
.tile .st{position:absolute;right:14px;top:16px;font-size:24px}
.tile.lock{opacity:.6;background:rgba(255,255,255,.75);border:3px dashed rgba(43,53,80,.16);box-shadow:none}
.tile.lock .ico{filter:grayscale(1)}
.tile.done .ico{background:linear-gradient(180deg,#FFF6CF,var(--butter))}
@media (hover:hover){.tile:not(.lock):hover{transform:translateY(-5px);box-shadow:0 18px 34px rgba(43,53,80,.16)}}
.tile:not(.lock):active{transform:scale(.98)}
/* thanh tiến trình */
.track{display:flex;align-items:center;margin:2px 6px 14px}
.node{flex:none;position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid rgba(43,53,80,.1);font-size:22px;box-shadow:var(--shadow)}
.node.cur{background:var(--pc);border-color:var(--pd);transform:scale(1.14)}
.node.done{background:linear-gradient(180deg,#FFF6CF,var(--butter));border-color:#FFD76A}
.node.lock{filter:grayscale(.9);opacity:.6}
.tline{flex:1;height:10px;margin:0 -3px;background:rgba(43,53,80,.08);border-radius:999px}
.tline.on{background:linear-gradient(90deg,var(--pc),var(--pd))}
.ptag{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;border-radius:999px;background:linear-gradient(90deg,var(--pc),#fff 92%);box-shadow:var(--shadow);margin:0 0 12px;font-family:var(--hfont);font-weight:800;font-size:19px;color:var(--pdd)}
.ptag .e{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px}
.ptag small{font-family:var(--bfont);font-weight:700;color:var(--soft);font-size:14px}
/* chibi nói */
.say{display:flex;align-items:flex-end;gap:12px;margin:0 0 14px}
.say .ch{width:96px;flex:none;position:relative}
.say .ch img{width:96px;height:auto;filter:drop-shadow(0 6px 6px rgba(43,53,80,.15));animation:bob 3.4s ease-in-out infinite}
.bubble{position:relative;flex:1;background:#fff;border:4px solid var(--pc);border-radius:26px;padding:12px 16px;font-size:18px;font-weight:800;box-shadow:var(--shadow)}
.bubble::before{content:'';position:absolute;left:-14px;bottom:20px;border:8px solid transparent;border-right-color:var(--pc);border-left:0}
.bubble .who{display:block;font-family:var(--hfont);font-size:14px;color:var(--pdd);margin-bottom:2px}
/* công thức */
.box{background:#fff;border-radius:26px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;border:3px solid #fff}
.box h3{font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--pdd)}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.fp{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.fp b{font-family:var(--hfont);font-size:20px;border-radius:14px;padding:6px 14px;border:2px solid transparent;line-height:1.2}
.fp small{font-size:12.5px;color:var(--soft);font-weight:700;white-space:pre-line;line-height:1.3}
.fp+.fp::before{content:none}
.t-sub{background:#D3F3E3;color:#1d7a58}.t-aux{background:#cfe6ff;color:#1c5da3}.t-pre{background:#FFE0BF;color:#9a5300}.t-obj{background:#E5D9FF;color:#5b3ab5}.t-v{background:#FFF0A8;color:#7a6200}
/* ví dụ */
.exs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ex{background:#fff;border-radius:24px;border:3px solid var(--pc);overflow:hidden;box-shadow:var(--shadow);animation:pop .4s both}
.ex .art{background:linear-gradient(180deg,var(--ps),#fff);display:grid;place-items:center;padding:8px;min-height:150px}
.ex .art svg{width:100%;max-width:340px;height:auto;border-radius:20px}
.ex .tx{padding:10px 14px 14px}
.ex .en{font-family:var(--hfont);font-size:22px;line-height:1.25}
.ex .en mark{background:linear-gradient(180deg,transparent 55%,var(--pc) 55%);color:var(--pdd);padding:0 3px;border-radius:4px}
.ex .vi{color:var(--soft);font-size:15px;font-weight:700;margin-top:2px}
.vart{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;position:relative;min-height:110px}
.vart img{height:94px;width:auto;filter:drop-shadow(0 4px 4px rgba(43,53,80,.15))}
.vart.no img{filter:grayscale(1);opacity:.25}
.vart.no::after{content:'✕';position:absolute;font-size:70px;color:var(--bad);font-family:var(--hfont);font-weight:800}
.vart.q::before{content:'?';position:absolute;right:6px;top:0;width:36px;height:36px;border-radius:50%;background:var(--butter-d);color:#fff;display:grid;place-items:center;font-family:var(--hfont);font-size:24px;font-weight:800;z-index:2}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--butter);border:3px dashed #F2D977;border-radius:22px;padding:12px 16px;font-weight:800;margin-bottom:14px}
.tip .bulb{font-size:28px;line-height:1}
.nav{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.nav .btn{flex:1 1 180px}
/* bài tập */
.qprog{height:12px;border-radius:99px;background:rgba(43,53,80,.08);overflow:hidden;margin:0 4px 14px}
.qprog i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pc),var(--pd));transition:width .4s}
.qcard{background:#fff;border-radius:30px;border:4px solid var(--pc);box-shadow:var(--shadow);padding:16px 16px 18px}
.qn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-weight:800;color:var(--soft);font-size:14px}
.qn .tag{background:var(--ps);color:var(--pdd);border-radius:999px;padding:2px 12px}
.qn .fix{background:var(--rose);color:var(--rose-dd);border-radius:999px;padding:2px 12px}
.qq{font-family:var(--hfont);font-size:clamp(24px,5vw,32px);line-height:1.25;margin:6px 0 12px}
.qq u{display:inline-block;min-width:92px;text-decoration:none;border-bottom:4px dashed var(--pd);text-align:center;color:var(--pdd)}
.qart{margin:0 auto 6px;max-width:300px}
.qart svg{width:100%;height:auto}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;border-radius:22px;background:#fff;border:3px solid var(--pc);font-family:var(--hfont);font-weight:700;font-size:23px;text-align:left;box-shadow:0 4px 0 rgba(43,53,80,.08);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt .l{width:38px;height:38px;border-radius:50%;background:var(--ps);color:var(--pdd);display:grid;place-items:center;font-size:20px;flex:none}
.opt.ok{background:#DDF6E8;border-color:var(--good);animation:pop .35s}
.opt.ok .l{background:var(--good);color:#fff}
.opt.no{background:#FFE6EA;border-color:var(--bad);animation:shake .35s}
.opt.no .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.45}
.fb{display:flex;gap:12px;align-items:center;border-radius:22px;padding:12px 14px;margin-top:14px;font-weight:800;animation:pop .3s}
.fb.good{background:#DDF6E8;color:#17734d}.fb.bad{background:#FFE6EA;color:#a82b43}
.fb img{width:64px;height:auto;flex:none}.fb .em{font-size:40px;line-height:1;flex:none}
.fb b{font-family:var(--hfont);font-size:20px;display:block}
/* kết quả */
.result{text-align:center;background:#fff;border-radius:34px;box-shadow:0 18px 40px rgba(43,53,80,.12);padding:20px 16px;border:3px solid #fff}
.result img.ch{width:150px;margin:0 auto}
.stars{font-size:54px;letter-spacing:6px;margin:4px 0}
.stars span{display:inline-block;animation:pop .5s both}
.stars .off{filter:grayscale(1);opacity:.3}
.result h2{font-size:32px;color:var(--pdd)}
.wrong{text-align:left;margin:14px auto 0;max-width:560px;display:grid;gap:8px}
.wrong div{background:var(--rose-s);border-radius:16px;padding:8px 12px;font-size:15px}
.wrong b{font-family:var(--hfont)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:80;background:#2B3550;color:#fff;border-radius:999px;padding:12px 22px;font-weight:800;box-shadow:0 10px 28px rgba(0,0,0,.25)}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;text-align:center;padding:14px 14px 18px}
  .hero .mascot,.hero .mascot img{height:140px}.hero p{margin-left:auto;margin-right:auto;font-size:16px}
  .tiles{grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:140px;padding:14px 12px 12px}.tile b{font-size:18px}
  .say .ch,.say .ch img{width:70px}.bubble{font-size:16px}
  .node{width:42px;height:42px;font-size:19px}
}
@media (max-width:420px){.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.t-pink{background:#FFD3E0;color:#a3234d}
.pat{border:3px solid var(--bc,#fff)}.pat.sky{--bc:var(--sky)}.pat.rose{--bc:var(--rose)}.pat.mint{--bc:var(--mint)}
.cks{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.ck{display:inline-block;padding:2px 12px;border-radius:12px;font-family:var(--hfont);font-size:22px;line-height:1.35;font-weight:700}
.ck:not([class*="t-"]){padding:2px 4px}
.pexs{display:grid;gap:10px;margin-top:12px}
.pex{display:flex;gap:12px;align-items:center;background:var(--ps);border-radius:20px;padding:8px 12px}
.pex .pa{width:150px;flex:none}.pex .pa .vart{min-height:64px;flex-wrap:nowrap;gap:2px}.pex .pa .vart img{height:auto;max-height:62px;flex:1 1 0;min-width:0;object-fit:contain}
.pvi{color:var(--soft);font-weight:700;font-size:15px;margin-top:2px}
.drow{display:flex;gap:10px;align-items:flex-end;margin:10px 0}
.drow.r{flex-direction:row-reverse}
.dch{width:74px;height:auto;flex:none;filter:drop-shadow(0 4px 4px rgba(43,53,80,.15))}
.dbub{position:relative;background:#fff;border:3px solid var(--pc);border-radius:22px;padding:8px 14px;flex:0 1 auto;max-width:calc(100% - 90px)}
.dbub.a{background:var(--ps);border-color:var(--pd)}
.dwho{font-family:var(--hfont);font-size:14px;color:var(--pdd);margin-bottom:2px}
.da{margin-top:4px}.da .vart{min-height:56px;flex-wrap:nowrap;justify-content:flex-start;gap:2px;width:170px}.da .vart img{height:auto;max-height:54px;flex:1 1 0;min-width:0;object-fit:contain}.da .vart.no::after{font-size:44px}
@media (max-width:520px){.pex .pa{width:110px}.ck{font-size:19px;padding:2px 9px}.dch{width:58px}.dbub{max-width:calc(100% - 70px)}}

/* ===== v3: bảng pastel, đừng nhầm 2 nửa, thẻ bài xinh, thanh nút luyện tập ===== */
.gt.tint th,.gt.tint td{border-radius:16px}
.gt.tint th.h0,.gt.tint td.c0{background:var(--t0)}.gt.tint th.h1,.gt.tint td.c1{background:var(--t1)}.gt.tint th.h2,.gt.tint td.c2{background:var(--t2)}
.gt.tint th{color:#2B3550;font-size:17px;padding:10px 6px}
.gt.tint td{text-align:left;font-family:var(--bfont);font-weight:700;font-size:16.5px;padding:10px 12px;border:2px solid rgba(255,255,255,.9);line-height:1.4;vertical-align:middle}
.gt.tint td.c0{font-family:var(--hfont);font-size:17px}.gt.big0 td.c0{text-align:center}.gt.big0 td.c0 b{font-size:26px;color:#C25A30;display:block;line-height:1.1}
.gt.tint td.c2 div:first-child{font-family:var(--hfont);font-size:19px}
.gt.tint td.c2 div+div{color:var(--soft);font-size:14.5px}
.gt.tint td b{color:#C25A30}
.tw .gt.tint{min-width:560px}
.misgrid{display:grid;gap:12px}
.mrow{border-radius:22px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.mpair{display:grid;grid-template-columns:1fr 1fr}
.mbad,.mgood{padding:10px 12px;font-family:var(--hfont);font-size:19px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.mbad{background:#FFE3EA;color:#a82b43}.mbad s{text-decoration-thickness:2px;opacity:.85}
.mgood{background:#DDF6E8;color:#17734d}.mgood b{font-weight:700}

":"mcq","q":"Look! Daisy _______ behind the green bush.","opts":["hides","is hide","hiding","is hiding"],"a":3,"why":"Chủ ngữ \"Daisy\" + is + V-ing \"hiding\".","fmt":"read","lv":"e","topic":"Present Continuous"},{"t":"mcq","q":"What is Jane wearing? — She _______ a blue swimsuit.","opts":["wearing","wears","is wearing","is wear"],"a":2,"why":"Chủ ngữ \"She\" + is + V-ing \"wearing\".","fmt":"read","lv":"e","topic":"Present Continuous"},{"t":"mcq","q":"Tom and Peter _______ roller skating in the playground.","opts":["is","are","do","be"],"a":1,"why":"Chủ ngữ số nhiều \"Tom and Peter\" + are + V-ing.","fmt":"read","lv":"e","topic":"Present Continuous"},{"t":"mcq","q":"_______ she carrying a yellow scarf?","opts":["Is","Are","Does","Do"],"a":0,"why":"Câu hỏi Yes/No HTTD với chủ ngữ \"she\": Is she...?.","fmt":"read","lv":"h","topic":"Present Continuous"},{"t":"mcq","q":"They _______ fishing by the river at the moment.","opts":["is","do","are","have"],"a":2,"why":"Chủ ngữ \"They\" + are + V-ing \"fishing\".","fmt":"read","lv":"m","topic":"Present Continuous"},{"t":"mcq","q":"Be careful! You _______ off the wall!","opts":["is falling","are falling","falling","fall"],"a":1,"why":"Cảnh báo hành động đang xảy ra: You are falling!.","fmt":"read","lv":"m","topic":"Present Continuous"},{"t":"mcq","q":"Look! The boys _______ a funny dance.","opts":["is doing","doing","are doing","does"],"a":2,"why":"Chủ ngữ \"The boys\" số nhiều + are + V-ing: are doing (do a dance).","fmt":"read","lv":"m","topic":"Present Continuous"},{"t":"mcq","q":"My father _______ a sweater today, he is wearing a jacket.","opts":["isn't wearing","aren't wearing","not wearing","don't wear"],"a":0,"why":"Thể phủ định HTTD chủ ngữ \"My father\" số ít: isn't wearing.","fmt":"read","lv":"h","topic":"Present Continuous"},{"t":"mcq","q":"What _______ the girls carrying in their hands?","opts":["is","are","do","does"],"a":1,"why":"Câu hỏi HTTD chủ ngữ \"the girls\" số nhiều: What are... carrying?.","fmt":"read", function lessonView(i) {

  const ok = actsDone(l);

/* ===== luyện tập / bài tập: trắc nghiệm + điền từ ===== */
let Q = null;

}
function practiceStart(i) {

    stars: s => s >= l.practice.length * .9 ? 3 : s >= l.practice.length * .7 ? 2 : s >= l.practice.length * .4 ? 1 : 0, lesson: i });
}
function quizStart() { const n = U.quiz.length; session({ key: 'quiz', title: 'Luyện tập tổng hợp · ' + U.title, qs: U.quiz, color: null, back: hubView, backLab: 'Unit', stars: s => s >= n * .9 ? 3 : s >= n * .7 ? 2 : s >= n * .4 ? 1 : 0 }); }

const FMT = { look: '🖼️ Look and choose', read: '📖 Read and choose', dlg: '💬 Complete the dialogue', cloze: '📄 Read and choose', list: '📋 Word list', fill: '✍️ Write one word' };
const lineEl = t => { const m = /^([A-Z][a-z]+): (.*)$/.exec(t); return h('div.cl', m ? [h('b.sp', m[1]), m[2]] : t); };
function quizView() {
  const o = Q.o, idx = Q.order[Q.pos], q = o.qs[idx], total = o.qs.length, fix = Q.round > 0, type = q.t || 'mcq';
  document.body.dataset.c = o.color || ['mint', 'peach', 'sky', 'rose'][idx % 4];
  const art = q.art ? artEl(q.art) : null, sp = /^([A-Z][a-z]+): /.exec(q.q), qt = sp ? q.q.slice(sp[0].length) : q.q, parts = qt.split('___');
  const blank = type === 'fill' ? h('input.fin', { type: 'text', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Điền từ', placeholder: '…' }) : h('u', ' ');
  const qline = [sp ? h('b.sp', sp[1]) : null, parts.length > 1 ? [parts[0], blank, parts[1]] : qt];
  const ctx = (q.pre || q.post) ? h('div.ctx', (q.pre || []).map(lineEl), h('div.cl.qq', qline), (q.post || []).map(lineEl)) : null;
  const card = h('div.qcard',
    h('div.qn', h('span', fix ? '' : 'Câu ' + (idx + 1) + ' / ' + total), fix ? h('span.fix', '🔁 Fix it! Làm lại câu sai') : null, q.unitNo ? h('span.tag.ut', 'Unit ' + q.unitNo + ' · ' + q.topic) : (o.key === 'quiz' && q.topic ? h('span.tag.ut', '🧩 ' + q.topic) : null),
      h('span.tag', q.fmt ? FMT[q.fmt] : type === 'fill' ? '✍️ Điền từ' : '📝 Chọn đáp án')),
    art ? h('div.qart', art) : null,

  const fbox = h('div'); Q.card = card; Q.fbox = fbox; Q.locked = false; Q.blank = null;
  if (type === 'mcq') card.append(h('div.opts', q.opts.map((t, k) => h('button.opt', { onclick: ev => pickMcq(k, ev.currentTarget) }, h('span.l', 'ABCD'[k]), h('span', t)))));
  else {

    const bank = h('div.fbank' + (q.bankShow ? '' : '.hidden'), (q.bank || []).map(w => h('button.wchip', { onclick: () => pick(w) }, w)));
    const hl = h('div.hline.hidden'), chk = h('button.btn', { onclick: () => checkFill(blank) }, 'Kiểm tra ✓');
    let lv = 0; const hb = h('button.btn.ghost.hintb', { onclick: () => {
      if (Q.locked) return; lv++;
      if (lv === 1) { hl.classList.remove('hidden'); hl.replaceChildren('💡 Chữ cái đầu: ', h('b', q.ans[0][0].toUpperCase() + ' …'), ' (' + q.ans[0].length + ' chữ cái)'); if (!q.bank) { hb.disabled = true; hb.textContent = '💡 Hết gợi ý'; } else hb.textContent = '💡 Gợi ý 2'; }
      else { bank.classList.remove('hidden'); hb.disabled = true; hb.textContent = '💡 Hết gợi ý'; }

  paint(topbar(o.title, o.back, o.backLab, o.mix ? 'Movers Grammar · Trộn' : null), o.mix ? null : (o.lesson != null ? trackEl(o.lesson) : trackEl('q')),
    h('div.qprog', h('i', { style: 'width:' + Math.min(100, Math.round(Object.keys(Q.first).length / total * 100)) + '%' })), card, bar);
}
function qb(ic, lab, fn, dis, cls, id) { return h('button.qb' + (cls ? '.' + cls : ''), { id: id || null, disabled: !!dis, onclick: fn, 'aria-label': lab }, gicon(ic), h('span', lab)); }
function confirmDlg(title, msg, yes, no, onYes) {
  const ov = h('div.cdlg'); const close = () => ov.remove();
  ov.append(h('div.cbox', h('h3', title), h('p', msg), h('div.crow2', h('button.btn.ghost', { onclick: close }, no), h('button.btn', { onclick: () => { close(); onYes(); } }, yes))));
  ov.addEventListener('click', e => { if (e.target === ov) close(); }); document.body.append(ov);
}
function leaveQ() {
  const back = Q.o.mix ? homeView : hubView;
  if (Object.keys(Q.first).length && !Q.done) confirmDlg(Q.o.mix ? 'Về trang các unit?' : 'Về trang ngữ pháp?', 'Kết quả bài này chưa được lưu. Em muốn thoát không?', 'Thoát', 'Ở lại', back);
  else back();
}
function undoQ() {
  if (!Q.locked && Q.blank && Q.blank.value) { Q.blank.value = ''; Q.blank.focus(); return; }
  if (Q.pos > 0) { Q.pos--; quizView(); }
}
function skipQ() {
  if (Q.pos >= Q.order.length - 1) return;
  Q.order.push(Q.order.splice(Q.pos, 1)[0]); quizView();
}
function finishQ(ok, shownAnswer) {
  const o = Q.o, idx = Q.order[Q.pos], q = o.qs[idx], first = !(idx in Q.first);
  if (first) { Q.first[idx] = ok; LSE_REPORT.answer(o.mix ? 'gram-mix-u' + q.unitNo + '-q' + (idx + 1) : 'gram-' + U.id + '-' + o.key + '-q' + (idx + 1), o.mix ? 'Movers Grammar · Trộn · ' + MIXD[(q.lv || 'm')][1] : 'Movers Grammar ' + U.no + ' · ' + (o.title.split('·')[1] || o.title).trim(), ok, q.q + ' → ' + shownAnswer); if (!ok) { Q.wrong.push(idx); Q.pending.push(idx); } }
  else if (ok) Q.pending = Q.pending.filter(x => x !== idx);
  Q.locked = true;
  Q.fbox.replaceChildren(ok
    ? h('div.fb.good', h('img', { src: CHIBI('co-vu'), alt: '' }), h('div', h('b', 'Giỏi quá! 🎉'), q.why))
    : h('div.fb.bad', h('span.em', '💪'), h('div', h('b', 'Gần đúng rồi, cố lên!'), 'Đáp án đúng: ' + shownAnswer + '. ' + q.why)));
  const nb = document.getElementById('qnext'); if (nb) { nb.disabled = false; nb.classList.add('pulse'); }
  const sk = document.querySelector('.qb:nth-child(2)'); if (sk) sk.disabled = true;
  Q.fbox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function pickMcq(k, btn) {
  if (Q.locked) return; const q = Q.o.qs[Q.order[Q.pos]], ok = k === q.a;
  Q.card.querySelectorAll('.opt').forEach((b, j) => { b.classList.add(j === q.a ? 'ok' : j === k ? 'no' : 'dim'); b.disabled = true; });
  const u = Q.card.querySelector('.qq u'); if (u) u.textContent = q.opts[q.a];
  finishQ(ok, q.opts[q.a]);
}
function checkFill(inp) {
  if (Q.locked) return; const q = Q.o.qs[Q.order[Q.pos]], v = fixNorm(inp.value); if (!v) { inp.focus(); return; }
  const ok = q.ans.some(a => fixNorm(a) === v) || (q.ans.some(a => fixNorm(a) === "can't") && v === 'cannot');
  inp.readOnly = true; inp.classList.add(ok ? 'ok' : 'no'); if (!ok) inp.value = q.ans[0];

}
function resultView() {
  const o = Q.o, total = o.qs.length, score = Object.values(Q.first).filter(Boolean).length, st = o.stars(score);
  document.body.dataset.c = o.color || 'lav';
  if (o.mix) LSE_REPORT.finish(score, total);
  else if (o.lesson != null) upd(p => { const old = p.pdone[U.lessons[o.lesson].id]; p.pdone[U.lessons[o.lesson].id] = { score: Math.max(score, old ? old.score : 0), stars: Math.max(st, old ? old.stars : 0) }; });
  else upd(p => { p.best = Math.max(p.best, score); p.stars = Math.max(p.stars, st); LSE_REPORT.finish(score, total); });
  if (!o.mix && o.lesson != null) LSE_REPORT.finish(score, total);
  const li = o.lesson, hasNext = li != null && li < U.lessons.length - 1;
  paint(topbar('Kết quả', o.back, o.backLab, o.mix ? 'Movers Grammar · Trộn' : null), o.mix ? null : (o.lesson != null ? trackEl(o.lesson) : trackEl('q')),
    h('div.result', h('img.ch', { src: CHIBI('an-mung'), alt: '' }),
      h('div.stars', [0, 1, 2].map(i => h('span' + (i < st ? '' : '.off'), { style: 'animation-delay:' + (i * 180) + 'ms' }, '⭐'))),
      h('h2', score + ' / ' + total + ' câu đúng ngay lần đầu'),
      h('p', { style: 'color:var(--soft);font-size:17px;margin:4px 0' }, st === 3 ? 'Tuyệt vời! Em nắm rất chắc rồi!' : st === 2 ? 'Rất tốt! Xem lại các câu sai là em sẽ giỏi hơn nữa.' : 'Em đã làm đến cùng, giỏi lắm! Xem lại bài rồi thử lại để được nhiều sao hơn nhé.'),
      (o.key === 'quiz' && Q.wrong.length) ? h('p.rv', '📖 Em nên xem lại: ', ...[...new Set(Q.wrong.map(i => o.qs[i].topic))].map(t => h('b', t + ' · '))) : null,
      Q.wrong.length ? h('div.wrong', Q.wrong.slice(0, 12).map(i => { const q = o.qs[i], a = q.t === 'fill' ? q.ans[0] : q.opts[q.a]; return h('div', h('b', q.q.indexOf('___') >= 0 ? q.q.replace('___', a) : q.q + ' → ' + a), ' — ', q.why); })) : null,
      o.mix ? h('div.nav', { style: 'justify-content:center' }, h('button.btn.ghost', { onclick: homeView }, '☰ Các unit'), h('button.btn', { onclick: o.again }, '🎲 Trộn bộ câu mới')) :
      h('div.nav', { style: 'justify-content:center' }, h('button.btn.ghost', { onclick: hubView }, '☰ Về Unit'),
        li != null ? h('button.btn.ghost', { onclick: () => lessonView(li) }, '📖 Xem lại bài') : h('button.btn.ghost', { onclick: () => lessonView(0) }, '📖 Xem lại bài'),
        h('button.btn.ghost', { onclick: () => li != null ? practiceStart(li) : quizStart() }, '↺ Làm lại'),
        li != null ? h('button.btn', { onclick: () => hasNext ? lessonView(li + 1) : (quizOpen() ? quizStart() : hubView()) }, hasNext ? 'Bài tiếp →' : 'Luyện tập tổng hợp →') : null)));
}
