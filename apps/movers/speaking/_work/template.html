<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking Test – Movers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7ff; --card:#fff; --ink:#3a3f5c; --muted:#868ba6; --line:#ece4f4;
  --pink:#ff9ebb; --pink-s:#ffe6ee; --blue:#8cc7ff; --blue-s:#e8f3ff; --mint:#7fd3b4; --mint-s:#e6f8f1; --mint-d:#2b8a70;
  --lav:#b9a8f0; --lav-s:#f0eaff; --sun:#ffd86b; --sun-s:#fff6d6; --peach:#ffb38a; --peach-s:#fff0e6;
  --bad:#ff7d97; --bad-s:#ffe9ee; --ok:#4fc79b; --r:20px;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fh:'Baloo 2','Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 0% 0%,#ffe3ee 0,transparent 42%),radial-gradient(circle at 100% 10%,#e0f1ff 0,transparent 40%),radial-gradient(circle at 50% 100%,#e9f9f1 0,transparent 45%);
  background-attachment:fixed;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.15}
.app{max-width:1180px;margin:0 auto;padding:12px 14px 90px}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* ---------- trang chủ ---------- */
.tico{display:inline-flex;vertical-align:middle;line-height:0}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#ffd6e5,#e3d9ff 55%,#cfeaff);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:0 5px 0 #d9cdf5}
.hero img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:18px;padding:4px;border:3px solid #fff;flex:none}
.hero .emo{width:84px;height:84px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:44px;flex:none}
.hero b{font-family:var(--fh);font-size:21px;display:block}
.hero span{font-weight:700;font-size:14.5px;opacity:.85}
details.guide{background:var(--card);border:2px solid var(--line);border-radius:var(--r);margin-bottom:12px}
details.guide summary{cursor:pointer;font-weight:800;padding:13px 16px;list-style:none;display:flex;align-items:center;gap:8px;min-height:48px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:'▾';margin-left:auto;color:var(--muted)}
details.guide[open] summary::after{content:'▴'}
details.guide .gb{padding:0 16px 14px;font-size:15px}
details.guide ol,details.guide ul{margin:6px 0 8px;padding-left:20px}
details.guide li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;min-height:42px}
.chip.on{background:var(--mint-s);border-color:var(--mint);color:var(--mint-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tcard{background:var(--card);border:3px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 4px 0 var(--line);transition:transform .12s}
.tcard:active{transform:translateY(2px)}
.tcard .th{height:118px;background:#f3eefb;display:block;width:100%;object-fit:cover}
.tcard .tb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.tcard .tn{font-family:var(--fh);font-weight:800;font-size:21px;color:#6a4fcb;display:flex;align-items:center;gap:8px}
.tcard .ts{font-size:13px;color:var(--muted);font-weight:700;line-height:1.3}
.tcard .tstar{margin-left:auto;font-size:15px;letter-spacing:1px}
.tcard.done{border-color:var(--mint)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--lav-s);color:#6a4fcb}
.tag.teach{background:var(--sun-s);color:#9a7400}

/* ---------- màn làm bài ---------- */
.steps{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:104px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center;min-height:62px}
.step b{font-family:var(--fh);font-size:17px;display:block;line-height:1.1}
.step small{font-size:12px;color:var(--muted);font-weight:700;display:block;line-height:1.2}
.step.on{border-color:var(--lav);background:linear-gradient(180deg,#fff,var(--lav-s));box-shadow:0 4px 0 #d9cdf5}
.step.on b{color:#6a4fcb}
.step.done{border-color:var(--mint)}
.step.done b::after{content:' ✓';color:var(--mint-d)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.how{background:var(--blue-s);border:2px solid #cfe6fb;border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.how b.en{display:block;font-size:17px;color:#2f6fb0;margin-bottom:2px}
.how .vi{color:#47658a;font-weight:600}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.pics.one{grid-template-columns:1fr}
.pic{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px;position:relative}
.pic.ex{border-color:#ffc7d8}.pic.ca{border-color:#bfdcfa}
.pic .cap{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:800;font-size:14.5px}
.pic.ex .cap{color:#e0527f}.pic.ca .cap{color:#3b86d6}
.pic .cap .zoom{margin-left:auto;font-size:13px;background:var(--lav-s);color:#6a4fcb;border-radius:10px;padding:5px 10px;min-height:34px;font-weight:800}
.pic img{width:100%;height:auto;display:block;border-radius:10px;background:#faf8ff}
.iw{position:relative;line-height:0}
.hintov{display:none;margin-top:8px;background:#fffdf0;border:3px dashed var(--sun);border-radius:12px;padding:8px 10px;line-height:1.4}
.hintov.show{display:block}
.hot{position:absolute;width:var(--hs,7%);min-width:30px;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:0;z-index:2;cursor:pointer;pointer-events:none}
.iw.hasdots{cursor:pointer}
.showdots .hot::after{content:'';position:absolute;inset:36%;border-radius:50%;background:rgba(255,196,40,.95);box-shadow:0 0 0 3px #fff;animation:pls 1.6s ease-in-out infinite}
@keyframes pls{0%,100%{transform:scale(.85)}50%{transform:scale(1.25)}}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.tip{position:absolute;z-index:4;background:#fff;border:3px solid #ff7a59;border-radius:12px;padding:3px 10px;font-weight:800;font-size:clamp(13px,1.7vw,19px);line-height:1.2;color:#3a3f5c;box-shadow:0 3px 10px rgba(0,0,0,.25);transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;font-family:var(--font)}
.tip small{display:block;font-size:.72em;color:#b0502e;font-weight:700}
.hot.on::after{background:#3fc59a!important;animation:none!important}
.pat{background:#eaf4ff;border:2px solid #bfdcfa;border-radius:14px;padding:8px 12px;margin:10px 0}
.pat .pt{font-family:var(--fh);font-weight:800;font-size:15.5px;color:#2f6fb0;margin-bottom:4px}
.pat .pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:5px 10px}
.pat .hline{margin:0;background:#fff;border:1.5px solid #cfe6fb;font-size:14px}
.qh{font-size:18px;font-weight:800;margin:2px 0 6px;line-height:1.7}
.qh span,.qf span{border-radius:8px;padding:1px 7px;margin:0 1px;display:inline-block}
.t-wh{background:#ffd3e0;color:#a3234d}.t-aux{background:#cfe6ff;color:#1c5da3}.t-sub{background:#d3f3e3;color:#1d7a58}.t-v{background:#ffe0bf;color:#9a5300}.t-obj{background:#e5d9ff;color:#5b3ab5}.t-ext{background:#fff0a8;color:#7a6200}
.qf{font-size:13.5px;font-weight:800;margin:2px 0 4px}
.qleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;margin:2px 0 6px}
.qleg span{border-radius:7px;padding:1px 7px;font-weight:800}
.qans{background:#f3fbf7;border-radius:8px;padding:3px 8px;margin-top:4px;font-weight:700;color:#1d7a58}
.dring{display:none;position:absolute;border:3px dashed #ff5d8f;border-radius:50%;pointer-events:none;z-index:2;background:rgba(255,93,143,.06)}
.showrings .dring{display:block}
.dn{display:none;position:absolute;transform:translate(-45%,-45%);width:clamp(26px,3.3vw,40px);aspect-ratio:1;border-radius:50%;background:#ff5d8f;color:#fff;font-family:var(--fh);font-weight:800;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:3;font-size:clamp(14px,1.9vw,21px);line-height:1;cursor:pointer;padding:0}
.dsum{background:#fff0f5;border:2px solid #ffc4d6;border-radius:14px;padding:8px 12px;margin-top:10px;font-weight:700;font-size:14.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dsum .dnc{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#ff5d8f;color:#fff;font-family:var(--fh);font-weight:800;font-size:15px}
.dsum .sm{flex-basis:100%;color:#2f6fb0;background:var(--blue-s);border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px}
.col{min-width:0}
.qstep{background:#fffaf0;border-radius:9px;padding:5px 9px;margin:2px 0 5px;font-weight:800;color:#8a5a00;font-size:14px}
.qstep b{font-size:16px}
.qmore{display:inline-block;background:var(--sun-s);border-radius:8px;padding:2px 8px;font-size:12.5px;color:#8a6d00;font-weight:800;margin-top:3px}
.qalt{background:#f6f2ff;border-radius:8px;padding:3px 8px;margin-top:4px;font-weight:700;color:#5b3ab5;font-size:13.5px}
.p2help{background:var(--pink-s);border:2px dashed #ffb3c8;border-radius:14px;padding:8px 12px;margin-top:10px;font-size:14px}
.p2help .tt{font-family:var(--fh);font-weight:800;font-size:16px;color:#b0405f;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.p2help table{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:13.5px;background:#fff}
.p2help th,.p2help td{border:1px solid #f3c6d3;padding:4px 7px;text-align:left;vertical-align:top}
.p2help th{background:#ffe0ea}
.qitem{margin:5px 0}
.qbtn{width:100%;text-align:left;background:var(--blue-s);border:2px solid #cfe6fb;border-radius:12px;padding:7px 11px;font-weight:800;color:#2f6fb0;font-size:14px;min-height:40px;display:flex;gap:8px;align-items:center}
.qhint{font-weight:700;font-size:13px;color:#6a8fb5;margin-left:2px}
.qbtn::after{content:'▾';margin-left:auto;color:#6a8fb5}
.qbtn.open::after{content:'▴'}
.qdet{background:#fff;border:2px solid #cfe6fb;border-top:0;border-radius:0 0 12px 12px;padding:7px 11px;font-size:13.5px;font-weight:600;margin-top:-4px}
.qdet .f{background:var(--sun-s);border-radius:8px;padding:3px 8px;margin:3px 0;font-weight:800;color:#8a6d00}
.p3open{background:linear-gradient(135deg,#fff,#eef7ff);border:3px solid #bfdcfa;border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:15.5px;font-weight:700}
.p3open .who{font-family:var(--fh);font-weight:800;color:#3b86d6;font-size:15px;display:flex;gap:6px;align-items:center;margin-bottom:3px}
.p3open .dn2{color:#a85a24;font-size:12.5px;margin-top:4px}
.storybox{background:var(--pink-s);border:2px dashed #ffb3c8;border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:700}
.storybox .tt{font-family:var(--fh);font-weight:800;font-size:17px;color:#b0405f;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.storybox ol{margin:4px 0;padding-left:22px}.storybox li{margin:3px 0}
.storybox .nt{font-size:12.5px;color:#a85a24;margin-top:4px}
/* ---- chấm điểm ---- */
.score{background:#f4f9ff;border:2px solid #cfe3f7;border-radius:16px;padding:10px 14px;margin-top:12px}
.score>b{font-family:var(--fh);font-size:17px;color:#2f6fb0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.score .sub{font-size:13px;color:var(--muted);font-weight:700;margin:2px 0 6px}
.crow{background:#fff;border:2px solid #e1eefb;border-radius:12px;padding:8px 10px;margin:8px 0}
.crow .ct{font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.crow .ct small{color:var(--muted);font-weight:700;font-size:12px}
.crow .ct .info{margin-left:auto;background:var(--lav-s);color:#6a4fcb;border-radius:9px;padding:3px 9px;font-size:12.5px;font-weight:800;min-height:30px}
.nums{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.nb{min-width:46px;height:46px;border-radius:12px;border:3px solid #cfe3f7;background:#fff;font-family:var(--fh);font-weight:800;font-size:19px;color:#2f6fb0;display:grid;place-items:center}
.nb.on{background:linear-gradient(180deg,#8fe0c3,#5fc9a4);border-color:#3fa882;color:#fff}
.dsc{display:none;font-size:13px;font-weight:600;margin-top:6px;background:#fafcff;border-radius:10px;padding:6px 10px;border:1px solid #e1eefb}
.dsc.show{display:block}
.dsc p{margin:4px 0}.dsc .en{color:#2f6fb0}.dsc .lv{font-weight:800;color:#6a4fcb}
.pavg{font-weight:800;color:var(--mint-d);margin-left:auto}
.shield{display:inline-block;vertical-align:middle;margin:0 1px}
.shields{display:flex;gap:6px;justify-content:center;margin:8px 0}
.sumn{font-size:13px;color:var(--muted);font-weight:700;max-width:560px;margin:8px auto 0}
.hintov .hsec{margin-bottom:8px}
.hintov .hh{font-family:var(--fh);font-weight:800;font-size:14.5px;color:#9a7400;margin-bottom:4px}
.hintov .hchips{display:flex;flex-wrap:wrap;gap:5px}
.hchip{background:var(--sun-s);border:1.5px solid #f1dc8a;border-radius:10px;padding:3px 8px;font-size:13px;line-height:1.25}
.hchip b{font-weight:800;color:#3a3f5c}
.hchip small{display:block;color:#8a6d00;font-weight:700;font-size:12px}
.hline{background:var(--blue-s);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:700;color:#2f6fb0;margin:3px 0}
.story .hintov .cols{columns:2 260px;column-gap:14px}
.story .hintov .hsec{break-inside:avoid}
.hbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.hbtn{background:var(--sun-s);border:3px solid #f1dc8a;border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;min-height:48px;color:#8a6d00;box-shadow:0 3px 0 #f1dc8a}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #f1dc8a}
.hbar span{font-size:13px;color:var(--muted);font-weight:700}
.p4btns{display:flex;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.p4b{display:flex;flex-direction:column;align-items:center;gap:3px}
.p4b small{font-size:12px;color:var(--muted);font-weight:700}
.tbtn{background:var(--pink-s);border-color:#ffc4d4;color:#b0405f;box-shadow:0 3px 0 #ffc4d4;display:inline-flex;align-items:center;gap:6px}
.p4teach{background:var(--pink-s);border:2px dashed #ffb3c8;border-radius:14px;padding:8px 12px;margin-top:10px;text-align:left;font-size:14.5px}
.p4teach .tt{font-family:var(--fh);font-weight:800;font-size:16px;color:#b0405f;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.p4teach .tr{margin:4px 0;font-weight:600}
.p4hint{background:var(--sun-s);border:2px dashed #f1d77a;border-radius:14px;padding:8px 12px;margin-top:10px;text-align:left;font-weight:700;font-size:14.5px;color:#8a6d00}
.p4hint .hchip{display:inline-block;margin:2px 3px 2px 0}
.pic .miss{padding:30px 8px;text-align:center;color:var(--muted);font-weight:700}
@media (max-width:640px) and (orientation:portrait){
  .pics{grid-template-columns:1fr}
  .rotate-hint{display:block!important}
}
.rotate-hint{display:none;background:var(--sun-s);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13.5px;margin-bottom:10px}
.story .pic{padding:10px}
.btn{background:linear-gradient(180deg,#b9a8f0,#9a86e6);color:#fff;font-family:var(--fh);font-weight:800;font-size:18px;border-radius:16px;padding:12px 22px;min-height:52px;box-shadow:0 4px 0 #7f6bd0;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7f6bd0}
.btn.ghost{background:#fff;color:#6a4fcb;border:2px solid #d9cdf5;box-shadow:0 3px 0 #e2d8f6}
.btn.mint{background:linear-gradient(180deg,#8fe0c3,#5fc9a4);box-shadow:0 4px 0 #3fa882}
.btn[disabled]{opacity:.5}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:6px}
.rate{background:var(--sun-s);border-radius:16px;padding:12px 14px;margin-top:12px}
.rate b{font-family:var(--fh);font-size:17px;display:block;margin-bottom:6px}
.rate .rr{display:flex;gap:8px;flex-wrap:wrap}
.rbtn{background:#fff;border:3px solid #f1e3a6;border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;min-height:52px;display:flex;align-items:center;gap:6px}
.rbtn.on{border-color:var(--mint);background:var(--mint-s);color:var(--mint-d)}
.teach{background:var(--sun-s);border:2px dashed #f1d77a;border-radius:16px;padding:10px 14px;margin-top:12px;font-size:14.5px}
.teach summary{cursor:pointer;font-weight:800;min-height:40px;display:flex;align-items:center;gap:6px;list-style:none}
.teach summary::-webkit-details-marker{display:none}
.teach table{width:100%;border-collapse:collapse;margin:6px 0;font-size:14px}
.teach th,.teach td{border:1px solid #efe0a0;padding:5px 8px;text-align:left;vertical-align:top}
.teach th{background:#fff3c4}
.teach .note{font-size:13px;color:#8a6d00;margin:6px 0}
.teach h4{margin:10px 0 4px;font-family:var(--fh);font-size:16px;color:#8a6d00}
.qcard{background:linear-gradient(135deg,#fff,#f6f1ff);border:3px solid var(--lav);border-radius:20px;padding:18px;text-align:center;box-shadow:0 5px 0 #d9cdf5}
.qcard .qn{font-weight:800;color:var(--muted);font-size:13.5px}
.qcard .qt{font-family:var(--fh);font-weight:800;font-size:28px;line-height:1.2;color:#4a3aa7;margin:6px 0 4px}
.qcard .qa{margin-top:10px;background:var(--mint-s);border-radius:14px;padding:10px 14px;font-weight:700;color:var(--mint-d);text-align:left}
.qcard .qb{margin-top:8px;background:var(--peach-s);border-radius:14px;padding:8px 14px;font-weight:700;color:#b25a22;text-align:left;font-size:14.5px}
.draftnote{background:var(--peach-s);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:700;color:#a85a24;margin-bottom:10px}
.dots{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.dots i{width:12px;height:12px;border-radius:50%;background:#e6dff5;display:block}
.dots i.on{background:var(--lav)}.dots i.cur{background:#7a5cd6;transform:scale(1.25)}

/* ---------- tổng kết ---------- */
.sum{text-align:center}
.sum img.ch{width:150px;height:150px;object-fit:contain}
.sum .big{font-family:var(--fh);font-size:34px;color:#6a4fcb}
.sum .rows{max-width:520px;margin:12px auto;text-align:left}
.sum .row{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:800}
.sum .row span:last-child{margin-left:auto;letter-spacing:2px}

/* ---------- phóng to ---------- */
#lb{position:fixed;inset:0;background:#241a40;z-index:50;display:flex;flex-direction:column}
#lb .lbt{display:flex;gap:8px;align-items:center;padding:10px 12px;color:#fff;font-weight:800}
#lb .lbt span{flex:1}
#lb .lbt button{background:#fff;color:#6a4fcb;border-radius:12px;min-height:44px;min-width:44px;padding:0 12px;font-weight:800}
#lb .lbc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 8px 16px;touch-action:pan-x pan-y pinch-zoom}
#lb img{display:block;margin:0 auto;background:#fff;border-radius:8px}
#lb .lb2{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px 10px;min-height:0}
#lb .lb2 figure{margin:0;display:flex;flex-direction:column;min-height:0;min-width:0}
#lb .lb2 figcaption{color:#fff;font-weight:800;font-size:14px;padding:0 2px 4px}
#lb .lb2 img{flex:1;min-height:0;width:100%;object-fit:contain;background:#fff;border-radius:10px}
@media (max-aspect-ratio:1/1){#lb .lb2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.bigbtn{background:var(--lav-s);border:3px solid #d9cdf5;border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;min-height:48px;color:#6a4fcb;box-shadow:0 3px 0 #e2d8f6}




/* ---------- thanh bar + nút home: cùng phong cách website Little Sprout ---------- */
body{overflow-x:clip;background-color:#FFF9F2;
  background-image:radial-gradient(900px 500px at 0% -5%,#FFE6EF 0,transparent 60%),radial-gradient(800px 480px at 100% 0%,#DFF1FF 0,transparent 60%),radial-gradient(900px 600px at 50% 110%,#E0F7EC 0,transparent 60%)}
:root{--ink:#2B3550;--muted:#67728D}
.sbar{position:relative;margin:0 0 12px;padding:6px 0}
.sbar::before{content:'';position:absolute;top:0;bottom:0;left:calc(50% - 50vw);right:calc(50% - 50vw);background:rgba(255,249,242,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(43,53,80,.10);z-index:-1}
.sbar-in{display:flex;align-items:center;gap:8px}
.slogo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.slogo img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:#FFDCE8;box-shadow:0 0 0 3px #fff,0 4px 12px rgba(222,84,129,.2);flex:none}
.slogo b,.sbar .ttl b{display:block;font-family:var(--fh);font-weight:800;font-size:20px;letter-spacing:.2px;line-height:1.1;color:var(--ink)}
.slogo small,.sbar .ttl small{display:block;color:var(--muted);font-size:12.5px;font-weight:700;line-height:1.25}
.sbar .ttl{flex:1;min-width:0}
.ni{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 8px;min-width:58px;line-height:1.1;border-radius:16px;background:transparent;border:0;color:var(--muted);font-weight:800;flex:none;transition:background .2s,color .2s}
.nico{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.85);box-shadow:0 4px 10px rgba(140,110,200,.18),inset 0 0 0 1.5px #fff;transition:transform .2s;font-size:19px;font-family:var(--fh);color:#6a4fcb}
.nico .tico svg{width:22px;height:22px}
.nlab{font-size:12px;font-weight:800}
.ni.on{background:rgba(255,255,255,.7);box-shadow:0 4px 14px rgba(140,110,200,.2);color:#2e9c7c}
.ni.on .nico{background:linear-gradient(135deg,#d3f1e5,#e3d6ff)}
.ni:active .nico{transform:translateY(2px)}
@media (hover:hover){.ni:hover{background:#fff;color:var(--ink)}.ni:hover .nico{transform:translateY(-2px) rotate(-6deg)}}
.timer{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--fh);font-weight:800;font-size:19px;background:#fff;border-radius:999px;padding:6px 14px;min-width:92px;min-height:44px;box-shadow:inset 0 0 0 2px rgba(43,53,80,.10);white-space:nowrap}


/* ---------- thẻ thông tin Part 2: pastel, bo tròn ---------- */
.p2tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.p2tg>div{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(106,79,203,.10);border:1px solid #eef0fb}
.p2tt{padding:9px 12px;font-family:var(--fh);font-weight:800;font-size:16px;background:#ffe6ef;color:#c93c72}
.p2tg>div+div .p2tt{background:#e0efff;color:#2a6fb8}
.p2t{width:100%;border-collapse:collapse;font-size:15px;background:#fff}
.p2t td{padding:8px 12px;border-top:1px solid #eef0fb;vertical-align:middle;font-weight:700}
.p2t td:first-child{width:46%;font-family:var(--fh);font-weight:800;font-size:14.5px;color:#5a6485;background:#fbfaff}
.p2t td:last-child{color:var(--ink)}
@media (max-width:560px){.p2tg{grid-template-columns:1fr}}


/* ---------- xem từng tranh Part 3 / tự đánh giá / gợi ý Part 4 ---------- */
#lb.hidden{display:none}
.sv-stage{display:flex;align-items:center;justify-content:center;padding:4px 10px;touch-action:pan-y;min-height:0}
.sv-crop{background-repeat:no-repeat;background-color:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.sv-dots{display:flex;justify-content:center;gap:10px;padding:8px 0}
.sv-dots i{width:14px;height:14px;border-radius:50%;background:#6f64a8;display:block;cursor:pointer}
.sv-dots i.cur{background:#ffd86b;transform:scale(1.25)}
.sv-stage{flex:0 0 auto;height:clamp(170px,36vh,460px);height:clamp(170px,36dvh,460px)}
.sv-hints{background:#fff;margin:0 10px;border-radius:18px;padding:10px 12px 12px;flex:1 1 0;min-height:96px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-padding-bottom:64px;display:flex;flex-direction:column;gap:10px}
.sv-hints:empty{display:none}
/* mỗi loại một màu, đúng màu 5 thẻ gợi ý ở trang chính */
.sv-row{--tint:#e6f1ff;--edge:#bad6f8;--acc:#2f78c4;padding:0;border:0;display:flex;flex-direction:column;gap:7px;background:var(--tint);border-radius:16px;padding:9px 10px 10px;box-shadow:inset 0 0 0 2px var(--edge)}
.sv-row+.sv-row{border-top:0}
.sv-row.s{--tint:#e6f1ff;--edge:#bad6f8;--acc:#2f78c4}
.sv-row.l{--tint:#e4f7ec;--edge:#b3e4c9;--acc:#2a8a5f}
.sv-row.v{--tint:#fff0e2;--edge:#ffd2ac;--acc:#c0641b}
.sv-row.f{--tint:#ffeaf1;--edge:#ffc9da;--acc:#d0467a}
.sv-row.in{animation:svin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes svin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.svl{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:var(--acc);color:#fff;border-radius:999px;padding:3px 13px 3px 4px;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.svl i{font-style:normal;width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px;line-height:1}
.svl b{font-family:var(--fh);font-weight:800;font-size:17px;letter-spacing:.6px;line-height:1.1}
.svl small{font-size:13px;font-weight:700;opacity:.92;line-height:1.1}
.sv-hints .hchips{display:flex;flex-wrap:wrap;gap:8px}
.sv-hints .hchip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;background:#fff;border:2.5px solid var(--acc);border-radius:14px;padding:4px 12px 5px;box-shadow:0 3px 0 var(--edge);max-width:100%}
.sv-hints .hchip b{font-family:var(--fh);font-weight:800;font-size:18px;line-height:1.2;color:#27304d}
.sv-hints .hchip small{display:block;font-size:13px;font-weight:800;color:var(--acc);line-height:1.2}
.sv-hbar{padding:8px 10px 0}.sv-hbar:empty{display:none}
.sv-hbar .hbtn{width:100%;min-height:50px;justify-content:center;font-size:16px}
/* nhãn và các ô chữ cùng một hàng (ô tự xuống dòng nếu hết chỗ) -> gọn, thấy đủ 4 dòng */
.sv-row{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px}
.sv-row .hchips{display:contents}
.svl{align-self:center}
@media (max-width:600px){
  .sv-hints{gap:7px;padding:8px 8px 10px}
  .svl i{width:24px;height:24px;font-size:14px}.svl b{font-size:15px}.svl small{font-size:12px}
  .sv-hints .hchip{padding:2px 10px 3px;border-width:2.5px;border-radius:12px}
  .sv-hints .hchip b{font-size:16.5px}.sv-hints .hchip small{font-size:12px}
  #lb.sv[data-rev="3"] .sv-stage,#lb.sv[data-rev="4"] .sv-stage{height:clamp(96px,20vh,260px);height:clamp(96px,20dvh,260px)}
  #lb.sv .lbt{padding:6px 12px}#lb.sv .sv-dots{padding:5px 0}
  .sv-hbar{padding-top:6px}.sv-hbar .hbtn{min-height:46px}.sv-nav{padding-top:8px}
}
@media (min-width:700px){.sv-stage{height:clamp(220px,44vh,640px);height:clamp(220px,44dvh,640px)}.sv-hints{margin:0 auto;width:min(760px,calc(100% - 20px))}}
@media (max-height:620px){.sv-stage{height:clamp(120px,30vh,260px);height:clamp(120px,30dvh,260px)}}
/* điện thoại xoay ngang: tranh bên trái, gợi ý bên phải -> thấy hết, không phải cuộn trang */
@media (orientation:landscape) and (max-height:560px){
  #lb.sv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;column-gap:10px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  #lb.sv .lbt{grid-column:1/-1;grid-row:1;padding:4px 12px}
  #lb.sv .sv-stage{grid-column:1;grid-row:2;height:auto;min-height:0}
  #lb.sv .sv-dots{grid-column:1;grid-row:3;padding:2px 0}
  #lb.sv .sv-nav{grid-column:1;grid-row:4;padding-top:4px}
  #lb.sv .sv-hints{grid-column:2;grid-row:2/4;margin:0 10px 0 0;width:auto}
  #lb.sv .sv-hbar{grid-column:2;grid-row:4;padding:4px 10px 10px 0}
}
.sv-nav{display:flex;gap:10px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.sv-nav .btn{flex:1;justify-content:center}
.selfbox{margin-top:14px}
.hbtn.pulse{animation:pulse 1s ease-in-out 4}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 3px 0 #f1dc8a}50%{transform:scale(1.07);box-shadow:0 0 0 6px rgba(255,216,107,.55)}}

/* ---------- Part 3: 5 cột pastel, chạm để hiện ---------- */
.p3ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.p3ctl span{flex:1 1 220px;font-size:13px;font-weight:700;color:var(--muted)}
.hbtn.sm{min-height:44px;padding:6px 14px;font-size:14.5px;border-width:2px;box-shadow:0 2px 0 #f1dc8a}
.p3cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
.pcol{--tint:#ffeaf1;--edge:#ffc9da;--acc:#d9507f;display:flex;flex-direction:column;min-width:0;background:var(--tint);border:2px solid var(--edge);border-radius:16px;padding:8px 8px 10px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:box-shadow .15s,transform .1s}
.pcol:active{transform:scale(.985)}
.pcol.pc1{--tint:#fff0e2;--edge:#ffd2ac;--acc:#c46a1f}
.pcol.pc2{--tint:#fff9d9;--edge:#f2de86;--acc:#a8820a}
.pcol.pc3{--tint:#e4f7ec;--edge:#b3e4c9;--acc:#2f8d63}
.pcol.pc4{--tint:#e6f1ff;--edge:#bad6f8;--acc:#2f78c4}
.pch{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:7px;border-bottom:1px solid rgba(0,0,0,.09);margin-bottom:2px}
.pcn{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-family:var(--fh);font-weight:800;font-size:15px;flex:none}
.pch b{font-family:var(--fh);font-size:16px;color:var(--acc)}
.plk{flex:1 1 100%;margin-left:0;background:#fff;border:1.5px solid var(--edge);color:var(--acc);border-radius:99px;padding:1px 9px;font-family:var(--fh);font-weight:800;font-size:14px;line-height:1.35;text-align:center}
.plk small{display:block;font-family:var(--font);font-size:12px;font-weight:700;color:#8b8fa8;line-height:1.1}
.prow{padding:7px 0}
.prow+.prow{border-top:1px solid rgba(0,0,0,.09)}
.prow.in{animation:rv .3s ease-out}
@keyframes rv{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pl2{display:block;font-size:12px;font-weight:800;color:var(--acc);margin-bottom:4px;letter-spacing:.2px}
.pl2 small{font-weight:700;color:#8b8fa8}
.pcol .hchips{gap:4px}
.pcol .hchip{background:#fff;border:2px solid var(--acc);border-radius:12px;font-size:14px;padding:3px 9px;box-shadow:0 2px 0 var(--edge)}
.pcol .prow.v .hchip{border-color:var(--acc);box-shadow:0 2px 0 var(--edge)}
.pcol .hchip small{color:var(--acc)}
.pcol .pl2{display:inline-flex;align-items:center;gap:4px;background:var(--acc);color:#fff;border-radius:999px;padding:2px 11px;margin-bottom:6px;font-size:12.5px;letter-spacing:.4px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.pcol .pl2 small{color:rgba(255,255,255,.92)}
.pnext{margin-top:auto;padding-top:8px;text-align:center;font-size:13px;font-weight:800;color:var(--acc);opacity:.85}
.pcol.done .pnext{opacity:.55}
@media (max-width:900px) and (min-width:561px){.pcol{padding:6px 6px 8px}.pcol .hchip{font-size:13px;padding:2px 6px}.pch b{font-size:14.5px}.plk{font-size:13px;padding:1px 7px}}
@media (max-width:560px){.p3cards{grid-template-columns:1fr}.pcol{padding:10px 12px}}

/* ---------- bảng so sánh hai tranh (Part 1): khung pastel + bảng trắng bo tròn ---------- */
.dtbl{margin-top:14px}
.dtbl>button{width:100%;display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 16px;background:#fff;border:2px solid #ffd3e1;border-radius:16px;font-family:var(--fh);font-weight:800;font-size:17px;color:#b0405f;box-shadow:0 3px 0 #ffd3e1;text-align:left}
.dtbl>button .cnt{white-space:nowrap;background:#ff9ebb;color:#fff;border-radius:99px;padding:0 10px;font-size:14px;line-height:24px}
.dtbl>button::after{content:'Mở ▾';margin-left:auto;font-size:14px;color:#c0678a;font-family:var(--font)}
.dtbl>button.open::after{content:'Đóng ▴'}
.cmp{margin-top:10px;padding:14px;border-radius:24px;background:linear-gradient(160deg,#fff3dd,#fdeaf6 55%,#e8f1ff);border:2px solid #f6e3c8}
.cmp-tt{display:flex;gap:12px;align-items:center;margin:0 4px 12px}
.cmp-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff9ec0,#a98cf0);font-size:20px;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.cmp-tt b{display:block;font-family:var(--fh);font-size:19px;color:#4a3aa7;line-height:1.2}
.cmp-tt small{display:block;font-size:13.5px;font-weight:700;color:#7a7f99;line-height:1.35;margin-top:2px}
.cmp-t{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(106,79,203,.10)}
.cmp-h,.cmp-r{display:grid;grid-template-columns:minmax(150px,.85fr) minmax(0,1.1fr) minmax(0,1.1fr)}
.cmp-h div{padding:12px 14px;font-family:var(--fh);font-weight:800;font-size:16px;background:#f3efff;color:#5b3ab5}
.cmp-h small{font-family:var(--font);font-weight:700;font-size:12.5px;opacity:.8}
.cmp-h .ex{background:#ffe6ef;color:#c93c72}.cmp-h .ca{background:#e0efff;color:#2a6fb8}
.cmp-r+.cmp-r{border-top:1px solid #eef0fb}
.cmp-r{align-items:stretch}
.cmp-n{display:flex;gap:10px;align-items:flex-start;padding:14px 12px 14px 14px}
.cmp-n span{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:50%;background:linear-gradient(135deg,#ff8fb3,#a98cf0);color:#fff;font-family:var(--fh);font-weight:800;font-size:17px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.cmp-loc b{display:block;font-family:var(--fh);font-weight:800;font-size:15px;color:#5a6485;line-height:1.25}
.cmp-loc small{display:block;font-size:13px;font-weight:600;color:#8b94b3;line-height:1.3;margin-top:2px}
.cmp-c{padding:16px 14px;font-size:17px;line-height:1.5;font-weight:700;color:var(--ink);align-self:stretch}
.cmp-c.ex{background:#fffafc}.cmp-c.ca{background:#f9fcff}
.cmp-c mark{background:none;color:#d6477f;font-family:var(--fh);font-weight:800;font-size:1.1em;border-bottom:3px solid #ffb3cb;padding:0 2px;border-radius:2px}
.cmp-c.ca mark{color:#2a6fb8;border-bottom-color:#a9d0f7}
@media (max-width:640px){
  .dtbl>button{font-size:15.5px;padding:10px 12px}
  .cmp{padding:10px;border-radius:20px}
  .cmp-tt b{font-size:17px}.cmp-tt small{font-size:12.5px}
  .cmp-h{display:none}
  .cmp-r{grid-template-columns:1fr;align-items:stretch}
  .cmp-n{padding:12px 14px 4px}
  .cmp-c{padding:2px 14px 8px 56px;font-size:16px}
  .cmp-c::before{content:attr(data-l);display:block;font-size:12px;font-weight:800;color:#9a8fb3;margin-bottom:1px}
  .cmp-c.ex::before{color:#c93c72}.cmp-c.ca::before{color:#2a6fb8}
  .cmp-c.ca{padding-bottom:14px}
}


/* ================= Giao diện kiểu Starters Speaking: màu theo Part, hero, thẻ bộ đề, thanh 4 chặng có khoá ================= */
:root{--sky:#DCEEFF;--sky-d:#3B88D0;--rose:#FFDCE8;--rose-d:#DE5481;--peach:#FFE0D2;--peach-d:#E27B52;--lav:#E7DFFF;--lav-d:#7A64D4;--butter:#FFF1BE;--butter-d:#D3A01C;--soft:#67728D;
  --pc:#D3F1E5;--pd:#2E9C7C;--pdd:#1F7A60;--ps:#EAF8F2}
body[data-part="2"]{--pc:var(--peach);--pd:var(--peach-d);--pdd:#C25A30;--ps:#FFF2EB}
body[data-part="3"]{--pc:var(--sky);--pd:var(--sky-d);--pdd:#2A6CB0;--ps:#EEF6FF}
body[data-part="4"]{--pc:var(--rose);--pd:var(--rose-d);--pdd:#C23F6B;--ps:#FFEEF4}
body[data-part="0"]{--pc:var(--lav);--pd:var(--lav-d);--pdd:#5E48B8;--ps:#F3EEFF}
.app{position:relative;z-index:1}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;opacity:.5;animation:float 16s ease-in-out infinite}
.bg i:nth-child(1){width:240px;height:240px;left:-80px;top:14%;background:radial-gradient(circle at 30% 30%,#fff,var(--pc))}
.bg i:nth-child(2){width:160px;height:160px;right:-40px;top:8%;background:radial-gradient(circle at 30% 30%,#fff,#FFDCE8);animation-delay:-5s}
.bg i:nth-child(3){width:200px;height:200px;right:6%;bottom:-70px;background:radial-gradient(circle at 30% 30%,#fff,#DCEEFF);animation-delay:-9s}
.bg i:nth-child(4){width:120px;height:120px;left:8%;bottom:6%;background:radial-gradient(circle at 30% 30%,#fff,#FFF1BE);animation-delay:-3s}
.bg b{position:absolute;font-size:26px;color:#fff;text-shadow:0 0 12px var(--pd);opacity:.8;animation:twinkle 3.6s ease-in-out infinite}
.bg b:nth-of-type(1){left:12%;top:22%}.bg b:nth-of-type(2){left:86%;top:30%;animation-delay:-1.2s;font-size:20px}
.bg b:nth-of-type(3){left:70%;top:68%;animation-delay:-2.2s}.bg b:nth-of-type(4){left:30%;top:80%;animation-delay:-.6s;font-size:18px}
@keyframes float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-22px) translateX(10px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ready{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ic{display:inline-grid;place-items:center;line-height:0;vertical-align:middle;flex:none}
.ic svg{width:1.3em;height:1.3em;display:block}
.nico .ic svg{width:24px;height:24px}
.btn{border-radius:999px;border-width:3px;min-height:56px;font-size:20px}

.pillrow{display:flex;gap:10px;flex-wrap:wrap}

.tile2{--tc:#D3F1E5;--td:#2E9C7C;position:relative;display:flex;flex-direction:column;text-align:left;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 28px rgba(43,53,80,.07);border:3px solid #fff;transition:transform .18s,box-shadow .18s}
.tile2.t-peach{--tc:var(--peach);--td:var(--peach-d)}.tile2.t-sky{--tc:var(--sky);--td:var(--sky-d)}.tile2.t-rose{--tc:var(--rose);--td:var(--rose-d)}
.tile2 .thumb{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,var(--tc),#fff);overflow:hidden;border-bottom:4px solid var(--tc)}
.tile2 .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.tile2 .num{position:absolute;left:12px;top:12px;min-width:46px;height:46px;padding:0 8px;border-radius:50%;background:#fff;color:var(--td);display:grid;place-items:center;font-family:var(--fh);font-weight:800;font-size:24px;box-shadow:0 4px 12px rgba(43,53,80,.2);border:3px solid var(--tc)}

.tile2 .flag.ok{background:var(--butter-d)}.tile2 .flag.mid{background:var(--sky-d)}
.tile2 .tbody{padding:12px 16px 16px;display:grid;gap:4px}
.tile2 .tbody b{font-family:var(--fh);font-size:24px;line-height:1.1}
.tile2 .tbody small{color:var(--soft);font-size:14px;font-weight:700}
.tile2 .go{margin-top:8px;justify-self:start;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:var(--td);color:#fff;font-family:var(--fh);font-weight:700;font-size:18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.16)}
@media (hover:hover){.tile2:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:0 18px 34px rgba(43,53,80,.16)}.tile2:hover .thumb img{transform:scale(1.06)}}
.tile2:active{transform:scale(.98)}
.track{display:flex;align-items:center;margin:2px 6px 14px}
.node{flex:none;position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid rgba(43,53,80,.1);font-size:23px;line-height:1;box-shadow:0 10px 28px rgba(43,53,80,.07);transition:all .3s;padding:0}
.node .ic svg{width:28px;height:28px}
.node.locked{filter:grayscale(.9);opacity:.6;background:#f1eff7}
.node.locked::after{content:'🔒';position:absolute;right:-6px;bottom:-6px;font-size:18px}
.node.done{background:linear-gradient(180deg,#FFF6CF,var(--butter));border-color:#FFD76A}
.node.cur{background:var(--pc);border-color:var(--pd);transform:scale(1.14);animation:pulse 2s ease-in-out infinite}
.node.shake{animation:shake .35s}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0),0 10px 28px rgba(43,53,80,.07)}50%{box-shadow:0 0 0 9px rgba(255,255,255,.7),0 10px 28px rgba(43,53,80,.07)}}
.tline{flex:1;height:10px;margin:0 -3px;background:rgba(43,53,80,.08);border-radius:999px;position:relative;overflow:hidden}

.ptag .ic svg{width:28px;height:28px}.ptag small{font-family:var(--font);font-weight:700;color:var(--soft);font-size:14px;margin-left:4px}
.card2{border-radius:34px;border:3px solid #fff;box-shadow:0 18px 40px rgba(43,53,80,.12);background:#fff;padding:22px 20px;text-align:center;max-width:760px;margin:6px auto}
.burst{position:relative;display:grid;place-items:center;width:min(52vw,200px);height:min(52vw,200px);margin:4px auto}
.burst::before{content:'';position:absolute;inset:-14%;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,214,102,.65) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 28%,transparent 70%);mask:radial-gradient(circle,#000 28%,transparent 70%);animation:spin 22s linear infinite}
.burst img{position:relative;width:auto;height:min(52vw,200px);max-width:none;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 10px 10px rgba(43,53,80,.2))}
.card2 h2{font-size:30px;margin:6px 0}
.prow2{display:flex;gap:12px;align-items:center;border-radius:18px;padding:12px 14px;text-align:left}
.prow2 b{font-family:var(--fh);font-size:18px}.prow2 small{display:block;color:var(--soft);font-size:14px;font-weight:700}
.prow2 .pico .ic svg{width:42px;height:42px}
.prow2 .st{margin-left:auto;font-size:24px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:80;background:#2B3550;color:#fff;border-radius:999px;padding:12px 22px;font-weight:800;font-size:16px;box-shadow:0 10px 28px rgba(0,0,0,.25);transition:opacity .4s}
.toast.out{opacity:0}
@media (max-width:640px){
  .hero2{grid-template-columns:1fr;text-align:center;padding:16px 16px 20px;gap:0}
  .hero2 .mascot{--mh:150px}.hero2 p{margin-left:auto;margin-right:auto;font-size:16px}.hero2 .pillrow{justify-content:center}.hero2::after{display:none}
  .grid2{grid-template-columns:1fr 1fr;gap:12px}.tile2 .tbody b{font-size:19px}.tile2 .go{min-height:40px;padding:0 14px;font-size:16px}
  .tile2 .num{min-width:38px;height:38px;font-size:19px}.node{width:46px;height:46px}.node .ic svg{width:24px;height:24px}
}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.tile2.lockd{opacity:.72;background:rgba(255,255,255,.75);border:3px dashed rgba(43,53,80,.16)}.tile2.lockd .thumb img{filter:grayscale(.9) brightness(1.05)}.tile2.lockd .go{background:#9aa3bd}.tile2 .flag.lk{background:#fff;color:#67728D;font-size:18px;padding:0 10px}
@media (max-width:480px){.ptag small{display:none}}
@media (max-width:640px){.sbar.intro .sbar-in{flex-wrap:nowrap}.sbar.intro .ttl{order:0;flex:1 1 0;min-width:0}.sbar.intro .ttl b{font-size:18px}.sbar.intro>.sbar-in>.ni:first-child{margin-right:0}}
@media (prefers-reduced-motion:reduce){.bg i,.bg b,.hero2 .mascot img,.burst::before,.node.cur{animation:none!important}}

/* ================= Giao diện chung: gọn · dễ chạm · đồng bộ mọi thiết bị ================= */
:focus-visible{outline:3px solid #7a5cd6;outline-offset:2px;border-radius:10px}
.app{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:calc(32px + env(safe-area-inset-bottom))}

      : h('div', h('div.big', 'Giỏi lắm! 🎉'), h('div.muted', 'Em đã luyện xong bộ đề này · ⏱ ' + fmt(st.tAcc) + '. Part nào còn khó thì luyện lại nhé.')),
    showT && un ? h('div.muted', 'Còn ' + un + ' phần chưa chấm đủ 3 tiêu chí (chưa tính vào kết quả).') : null,
    h('div.rows', PARTS.map(p => { const sc = st.sc[p.id], a = partAvg(sc); return h('div.row', h('span', 'Part ' + p.n), h('span.muted', p.vi), h('span', { style: 'font-size:14px;letter-spacing:0' }, showT ? (a == null ? '—' : sc.map(v => v == null ? '–' : v).join(' · ') + '  (TB ' + a.toFixed(1) + ')') : face(p.id))); })),
    showT ? h('div.rows', CR.map((c, i) => h('div.row', h('span', c.en), h('span.muted', c.vi), h('span', { style: 'letter-spacing:0' }, R.avg[i].toFixed(1) + ' / 5')))) : null,
    showT ? h('div.sumn', 'Cách tính của app: lấy điểm trung bình của từng tiêu chí qua các Part đã chấm, cộng ba tiêu chí lại, chia 3 rồi làm tròn ra số khiên (tối đa 5). Cambridge chấm cả bài Speaking bằng 3 tiêu chí 0–5 và đặt ngưỡng khiên theo từng kỳ thi, nên đây chỉ là ước tính để luyện tập, không phải kết quả chính thức.') : null,
    h('div.nav', { style: 'justify-content:center;margin-top:14px' },
      h('button.btn.ghost', { onclick: () => openSet(st.set.id) }, '↺ Làm lại'),
      h('button.btn.ghost', { onclick: goHome }, '☰ Chọn bộ khác'),
      next && setUnlocked(next) ? h('button.btn', { onclick: () => openSet(next.id) }, setName(next) + ' →') : null)));
  window.scrollTo(0, 0);
}
function goHome() { clearInterval(tick); st.view = 'home'; homeView(); window.scrollTo(0, 0); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('lb').classList.add('hidden'); });
homeView();
</script>
