<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clothes Run · EASYENG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2f3b4c; --ink-soft:#5f7080;
  --panel:#fffaf3; --panel-line:#f1dfc4;
  --sky:#5c94fc;
  --coral:#ff8a80; --coral-deep:#ee5d54;
  --gold:#ffd873; --gold-deep:#f0a63c;
  --mint:#5cc98a; --mint-deep:#3fa56f;
  --blue:#8fd0f2; --blue-deep:#4fa9dc;
  --good:#43a047; --bad:#e57373;
  --app-h:100vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Quicksand',system-ui,sans-serif;font-weight:600;color:var(--ink);background:var(--sky);
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;touch-action:manipulation}
#app,#stageWrap,#cv{touch-action:none}
.coin{width:1em;height:1em;vertical-align:-.14em;flex:none}

#app{position:fixed;left:0;top:0;width:100%;height:var(--app-h);display:flex;flex-direction:column;
  padding:calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));gap:6px;
  background:linear-gradient(180deg,#2f6fdc 0,var(--sky) 40%)}
.statbar{flex:none;display:flex;gap:8px;align-items:center}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;background:var(--panel);border:4px solid var(--panel-line);border-radius:999px;box-shadow:0 4px 0 #ecd3ac;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(17px,3.4vw,24px);white-space:nowrap}
.pill.bump{animation:bump .35s}
.pill.warn{background:#ffe1de;border-color:var(--coral);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
@keyframes bump{50%{transform:scale(1.15)}}
.rb{flex:none;width:42px;height:42px;border-radius:50%;border:4px solid var(--panel-line);background:var(--panel);font-size:19px;box-shadow:0 4px 0 #ecd3ac;cursor:pointer;padding:0}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 #ecd3ac}
.rb.off{opacity:.55}
.clue{flex:none;display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.18);padding:6px 8px 6px 14px;min-height:56px}
.clue .ic{font-size:28px;flex:none}
#clueText{flex:1;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:clamp(18px,4vw,28px);line-height:1.12}
.speak{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--blue);box-shadow:0 4px 0 var(--blue-deep);font-size:20px;cursor:pointer;padding:0}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-deep)}

#stageWrap{position:relative;flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;background:#c84c0c;border-radius:18px 18px 0 0;overflow:hidden}
#cv{display:block;image-rendering:pixelated;touch-action:none}
#toast{position:absolute;left:50%;top:72px;transform:translate(-50%,-20px) scale(.9);opacity:0;pointer-events:none;z-index:5;
  background:#fff;border:4px solid var(--panel-line);border-radius:999px;padding:4px 20px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(18px,3.6vw,26px);box-shadow:0 5px 0 #ecd3ac;white-space:nowrap;transition:all .2s}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.good{background:#d8f5df;border-color:var(--good)}
#toast.bad{background:#ffe1de;border-color:var(--bad)}
#toast.combo{background:#fff2c2;border-color:var(--gold-deep)}

#picCard{position:absolute;right:8px;top:8px;width:clamp(112px,25vmin,190px);padding:7px;background:#fff3c9;border:6px solid #8a4b1f;border-radius:16px;box-shadow:0 7px 0 rgba(0,0,0,.28);z-index:5;display:none;pointer-events:none}
#picCard.on{display:block;animation:picPop .45s cubic-bezier(.3,1.6,.5,1)}
#picCard img{display:block;width:100%;height:auto;max-height:clamp(96px,22vmin,170px);object-fit:contain}
@keyframes picPop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#banner{position:absolute;left:calc(50% - 70px);top:8px;transform:translate(-50%,-30px) scale(.9);opacity:0;pointer-events:none;z-index:6;text-align:center;background:var(--gold);border:5px solid #fff;border-radius:26px;box-shadow:0 8px 0 var(--gold-deep);padding:6px 22px;font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--ink);transition:all .3s;max-width:calc(100% - 200px)}
#banner.show{opacity:1;transform:translate(-50%,0) scale(1)}
#banner b{display:block;font-size:clamp(18px,3.6vw,28px);line-height:1.1}
#banner small{display:block;font-size:clamp(13px,2.4vw,18px);font-weight:700;color:#7a4b00}
#controls{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 calc(14px + env(safe-area-inset-left)) 0 calc(14px + env(safe-area-inset-right));pointer-events:none;z-index:4}
#controls .grp{display:flex;gap:14px;pointer-events:none}
.cb{pointer-events:auto;width:clamp(80px,19vmin,112px);height:clamp(80px,19vmin,112px);border-radius:50%;border:5px solid #fff;background:rgba(255,216,115,.92);box-shadow:0 7px 0 var(--gold-deep);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(30px,7vmin,44px);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;touch-action:none}
.cb.jump{background:rgba(255,138,128,.94);box-shadow:0 7px 0 var(--coral-deep);width:clamp(92px,23vmin,132px);height:clamp(92px,23vmin,132px);color:#fff;font-size:clamp(24px,5.6vmin,36px)}
.cb.on{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
@media (hover:hover) and (pointer:fine){#controls{display:none}}

.overlay{position:fixed;inset:0;z-index:50;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(30,50,90,.6);padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));touch-action:pan-y}
.overlay.hidden{display:none}
.overlay>.card{margin:auto}
.card{width:min(100%,460px);background:var(--panel);border:4px solid var(--panel-line);border-radius:28px;box-shadow:0 10px 0 #e6c99a;padding:20px 18px 22px;text-align:center}
.card h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(34px,9vw,46px);line-height:1;margin:8px 0 4px;color:var(--coral-deep);text-shadow:0 3px 0 #ffd873}
.card h2{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,6vw,32px);margin:4px 0 6px}
.card p{margin:6px 0 14px;color:var(--ink-soft);font-size:17px}
.btn{border:0;border-radius:999px;padding:8px 28px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;color:#fff;background:var(--coral);box-shadow:0 6px 0 var(--coral-deep);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral-deep)}
.btn.green{background:var(--mint);box-shadow:0 6px 0 var(--mint-deep)}
.btn.green:active{box-shadow:0 2px 0 var(--mint-deep)}
.btn.blue{background:var(--blue);box-shadow:0 6px 0 var(--blue-deep)}
.btn.blue:active{box-shadow:0 2px 0 var(--blue-deep)}
.btn.big{font-size:30px;padding:10px 42px}
.hint{display:flex;gap:14px;justify-content:center;margin:0 0 16px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;color:var(--ink-soft)}
.hint b{background:#fff;border:3px solid var(--panel-line);border-radius:10px;padding:0 10px}
.testRow{margin-top:16px;font-size:13px;color:var(--ink-soft)}
.testRow button{margin-left:4px;width:28px;height:28px;border-radius:50%;border:2px solid var(--panel-line);background:#fff;font-weight:700;cursor:pointer;padding:0}
#heroPrev{width:72px;height:64px;image-rendering:pixelated}
.stars{font-size:44px;letter-spacing:4px;margin:2px 0}
.stars .off{filter:grayscale(1) opacity(.3)}
.score{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:42px;color:var(--gold-deep);line-height:1}
.sect-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;margin:10px 0 4px}
.medals{display:flex;flex-direction:column;gap:4px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 14px}
.chip{background:#fff;border:2px solid var(--panel-line);border-radius:999px;padding:2px 10px;font-size:14px}
.chip b{font-family:'Baloo 2',sans-serif;color:var(--coral-deep)}
.endBtns{display:flex;flex-direction:column;gap:10px;align-items:center}
#worldRow{display:flex;gap:8px;justify-content:center;margin:2px 0 12px}
.wbtn{width:56px;border:3px solid var(--panel-line);border-radius:16px;background:#fff;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #ecd3ac}
.wbtn.on{border-color:var(--coral);background:#fff2ef;box-shadow:0 4px 0 var(--coral-deep)}
.wbtn.lock{opacity:.5}
.wbtn .wi{font-size:24px;line-height:1.1}.wbtn .wn{font-size:13px;color:var(--ink-soft);line-height:1}.wbtn .ws{font-size:12px;color:var(--gold-deep);letter-spacing:1px;line-height:1.3}
.chips.miss .chip{background:#fff0ee;border-color:#f7c9c4}.chips.miss .chip b{color:#c0392b}
@keyframes wshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.wbtn.shake{animation:wshake .3s}
</style>
</head>
<body>
<div id="app">
  <div class="statbar">
    <div class="pill" id="coinPill"><svg class="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#ffd54f" stroke="#d99a00" stroke-width="2"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#e8a900" stroke-width="2"/></svg><span id="coinVal">0</span></div>
    <div class="pill" id="heartsPill"><span id="heartsVal">❤️❤️❤️</span></div>
    <div class="pill" id="timerPill" style="display:none">⏱ <span id="timeVal">--</span></div>
    <div class="pill" id="progPill">🌍<span id="worldVal">1</span> 🚩<span id="progVal">0/7</span></div>
    <button class="rb" id="muteBtn" aria-label="Sound">🔊</button>
    <button class="rb" id="pauseBtn" aria-label="Pause">⏸</button>
  </div>
  <div class="clue"><span class="ic">🧢</span><span id="clueText">Run to the first blocks! →</span><button class="speak" id="speakBtn" aria-label="Listen again">🔊</button></div>

  <div id="stageWrap">
    <canvas id="cv"></canvas>
    <div id="picCard"></div>
    <div id="toast"></div>
    <div id="banner"><b id="bnTitle"></b><small id="bnSub"></small></div>
    <div id="controls">
      <div class="grp"><button class="cb" id="bL" aria-label="Left">◀</button><button class="cb" id="bR" aria-label="Right">▶</button></div>
      <div class="grp"><button class="cb jump" id="bJ" aria-label="Jump">JUMP</button></div>
    </div>
  </div>
</div>

<div class="overlay" id="startOverlay">
  <div class="card">
    <canvas id="heroPrev" width="18" height="16"></canvas>
    <h1>Clothes Run</h1>
    <p id="worldLine">World 1 · Grassland</p>
    <div id="worldRow"></div>
    <div class="hint"><b>← →</b><b>JUMP</b></div>
    <button class="btn big" id="startBtn">▶ Play</button>
    <div class="testRow" id="testRow" style="display:none">Test: <span id="testBtns"></span></div>
  </div>
</div>

<div class="overlay hidden" id="pauseOverlay">
  <div class="card">
    <h2>Paused ⏸</h2>
    <p>Take a breath!</p>
    <div class="endBtns">
      <button class="btn green big" id="resumeBtn">▶ Resume</button>
      <button class="btn blue" id="musicBtn">🎵 Music: ON</button>
      <button class="btn" id="restartBtn">↻ Restart world</button>
      <button class="btn blue" id="mapBtn">🗺 Worlds</button>
      <button class="btn" id="resetBtn" style="font-size:17px;background:#b9b3a8;box-shadow:0 6px 0 #968f83">🗑 Reset progress</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="card">
    <h2 id="endTitle">World clear! 🚩</h2>
    <div class="stars" id="endStars"></div>
    <div class="score" id="finalScoreBox"></div>
    <div class="medals" id="endMedals" style="margin-top:8px"></div>
    <div class="sect-title">You learned</div>
    <div class="chips" id="endChips"></div>
    <div id="endMissWrap"><div class="sect-title">Review these 🔁</div><div class="chips miss" id="endMiss"></div></div>
    <div class="endBtns">
      <button class="btn green big" id="nextBtn">Next world ▶</button>
      <button class="btn green" id="zaloBtn">📩 Send result via Zalo</button>
      <button class="btn blue" id="replayBtn">↻ Play this world again</button>
      <button class="btn blue" id="mapBtn2">🗺 Worlds</button>
    </div>
  </div>
</div>

}
function tone(f,dur,type="square",vol=.07,slide=null,delay=0){
  if(muted) return; const ctx=ensureCtx(); if(!ctx) return;
  const t=ctx.currentTime+delay, o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur*.9);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+dur+.03);
}

/** Chọn từ cho một thử thách: ưu tiên từ ÍT được hỏi trong lượt chơi này + từ bé HAY SAI (lưu qua các buổi) */
function chooseWord(def,usedW,extra){
  const spellOnly=def.kind==="missing"||def.kind==="scramble";
  let pool=ITEMS.filter(i=>!usedW.has(i.id)&&(!extra||extra(i)));
  if(spellOnly) pool=pool.filter(i=>i.spell!==false);
  if(def.maxLen) pool=pool.filter(i=>i.en.length<=def.maxLen);
  if(def.minLen) pool=pool.filter(i=>i.en.length>=def.minLen);
  if(!pool.length) pool=ITEMS.filter(i=>(!spellOnly||i.spell!==false)&&(!def.maxLen||i.en.length<=def.maxLen)&&(!extra||extra(i)));
  const weak=i=>Math.min(4,SAVE.weak[i.id]||0);
  const score=i=>(runSeen[i.id]||0)*(def.boss?3:10)-weak(i)*(def.boss?20:6)-(def.boss?i.en.length*4:0)+Math.random()*5;
  pool.sort((a,b)=>score(a)-score(b));
  const it=pool[0]; runSeen[it.id]=(runSeen[it.id]||0)+1; usedW.add(it.id); return it;
}

const FILL_LETTERS="aeiourstlnmcdhbkpgwy";
const pickCombo=it=>({t:it.id,c:it.color});
const sameCombo=(a,b)=>a.t===b.t&&a.c===b.c;
/** 2 đáp án gây nhiễu cho món `it`: 1 món CÙNG MÀU (để bé phải nhận ra bằng TỪ chứ không chỉ bằng màu) + 1 món khác.
    Tránh cặp dễ nhầm (quần dài/jean, giày/ủng, sơ mi/áo phông) */
function distractors(it){
  const pool=shuffle(ITEMS.filter(i=>i.id!==it.id&&(!it.grp||i.grp!==it.grp)));
  const first=pool.find(i=>i.color===it.color)||pool[0];
  const second=pool.find(i=>i!==first&&i.color!==first.color)||pool.find(i=>i!==first);
  return [pickCombo(first),pickCombo(second)];
}
function buildLevel(){

  const bossDef=STATION_DEFS.find(d=>d.boss);
  const bossIt=bossDef?chooseWord(bossDef,used):null;
  STATION_DEFS.forEach((def,idx)=>{
    const gx=def.kind==="grammar"?(def.want==="an"?(i=>!i.plural&&/^[aeiou]/i.test(i.color)):def.want==="plural"?(i=>i.plural):def.want==="sing"?(i=>!i.plural&&!/^[aeiou]/i.test(i.color)):null):null;
    const it=(def.boss&&bossIt)?bossIt:chooseWord(def,used,gx);
    const col=getColor(it.color);
    const st={idx,kind:def.kind,x:def.x,spawn:def.spawn,done:false,found:0,mistakes:0,targets:[],blocks:[],clue:"",speak:"",fade:1,sign:null,
      title:def.title,icon:def.icon,twist:def.twist,timer:def.timer||0,timerOn:false,tleft:0,it,col,word:it.en.toLowerCase(),blanks:[],next:0,double:!!def.double};

    const mkLab=(cb,ok,kind)=>{const i2=getItem(cb.t), c2=cb.c?getColor(cb.c):null; return {lab:kind==="pic"?{type:"text",text:bare(i2,c2)}:{type:"item"},it:i2,col:c2,ok};};
    if(def.kind==="find"||def.kind==="pic"||(def.kind==="listen"&&!def.double)){
      const [B,C]=distractors(it,col&&col.id);
      labs=shuffle([A,B,C]).map(cb=>mkLab(cb,cb===A,def.kind));
      if(def.kind==="pic") SP=44;
    } else if(def.kind==="listen"){ // gọi 2 món
      let A2,D1,D2,guard=0;
      const t2=chooseWord({kind:"find"},used,i=>i.id!==it.id&&(!it.grp||i.grp!==it.grp));
      do{
        A2=pickCombo(t2); D1=distractors(it,col&&col.id)[0]; D2=distractors(t2,A2.c)[0];
      }while([A,A2,D1,D2].some((x,i,arr)=>arr.findIndex(y=>sameCombo(x,y))!==i)&&guard++<40);
      labs=shuffle([A,A2,D1,D2]).map(cb=>mkLab(cb,cb===A||cb===A2,"item"));
    } else if(def.kind==="missing"){
      SP=24; const word=st.word, n=def.blanks||1;
      const pos=shuffle([...word].map((_,i)=>i)).slice(0,Math.min(n,word.length-1)).sort((a,b)=>a-b);
      st.blanks=pos.map(p=>({pos:p,ch:word[p],filled:false}));
      const need=st.blanks.map(b=>b.ch);
      const extra=shuffle([...FILL_LETTERS].filter(ch=>!need.includes(ch)));
      const letters=shuffle([...need,...extra.slice(0,2)]);
      labs=letters.map(ch=>({lab:{type:"letter",ch},ch,ok:true}));

    } else if(def.kind==="scramble"){
      SP=24; const word=st.word; let ls; let guard=0;
      do{ls=shuffle([...word]);}while(ls.join("")===word&&guard++<20);
      labs=ls.map(ch=>({lab:{type:"letter",ch},ch,ok:true}));
      st.sign={it,col};
    } else if(def.kind==="grammar"){
      // 2 cặp khối: [It is | They are] và (nếu là số ít) [a | an] — bé đập đúng 1 khối trong mỗi cặp
      SP=44; const sing=!it.plural, art=/^[aeiou]/i.test(col.id)?"an":"a";
      st.gram={sing, art, A:false, B:!sing};
      labs=shuffle([{t:"It is",ok:sing},{t:"They are",ok:!sing}]).map(p=>({lab:{type:"text",text:p.t},ok:p.ok,pair:"A"}));
      if(sing) labs.push(...shuffle([{t:"a",ok:art==="a"},{t:"an",ok:art==="an"}]).map((p,k)=>({lab:{type:"text",text:p.t},ok:p.ok,pair:"B",dx:20})));

    }
    st.water=!!def.water;
    st.width=st.water?200:16+(labs.length-1)*SP+(def.kind==="grammar"&&labs.length>2?20:0); st.barrierX=def.barrier!==undefined?def.barrier:(st.water?WATER.x1-8:def.x+st.width+20);
    labs.forEach((L,i)=>{
      const b={kind:"a",x:def.x+i*SP+(L.dx||0),pair:L.pair,y:136,w:16,h:16,lab:L.lab,it:L.it||it,col:L.col!==undefined?L.col:col,ch:L.ch||"",ok:L.ok,state:"idle",bounce:0,used:false,resetT:0,idx:i,st};

    const a=st.targets[0];
    if(def.kind==="find"){

      st.speak=st.blanks.length>1?"Which letters are missing?":"Which letter is missing?";

    }

    if(def.kind==="missing"||def.kind==="scramble"||def.kind==="grammar") refreshClue(st);
    (def.guards||[]).forEach(gx=>enemies.push({x:gx,y:G-16,w:16,h:16,dir:Math.random()<.5?-1:1,min:gx-34,max:gx+34,alive:true,sq:0,ph:Math.random()*5,guard:true}));
  });
  ENEMY_X.forEach(e=>{ const x=Array.isArray(e)?e[0]:e, mn=Array.isArray(e)?e[1]:x-90, mx=Array.isArray(e)?e[2]:x+90; enemies.push({x,y:G-16,w:16,h:16,dir:Math.random()<.5?-1:1,min:mn,max:mx,alive:true,sq:0,ph:Math.random()*5}); });

/* dòng gợi ý (thanh trắng phía trên) cho các vòng điền chữ / sắp xếp */
function refreshClue(st){
  let txt="";
  if(st.kind==="missing"){
    const arr=[...st.word].map((ch,i)=>{const b=st.blanks.find(x=>x.pos===i); return b&&!b.filled?"_":ch;});
    txt="✏️  "+arr.join(" ");
  } else if(st.kind==="scramble"){
    const sp=[...st.word].map((ch,i)=>i<st.next?ch:"_");
    txt="🔀  "+sp.join(" ");
  }
  if(st.kind==="grammar"){ const g=st.gram; txt="🧩  "+(g.A?(g.sing?"It is":"They are"):"___")+" "+(g.sing?(g.B?g.art:"___")+" ":"")+st.col.id+" "+st.it.en+"."; }
  st.clue=txt; if(activeIdx===st.idx&&!st.done) $("clueText").textContent=txt;
}

  (st.kind==="grammar"?[]:(st.targets.length?st.targets.map(b=>b.it):[st.it])).forEach(w=>{

function wrongBlock(b,permanent){

function bumpAnswer(b){

    const bl=st.blanks.find(x=>!x.filled&&x.ch===b.ch);

const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function moveHero(dt){
  hero.prevY=hero.y; hero.prevBottom=hero.y+hero.h;
  // X
  hero.x+=hero.vx*dt;
  hero.x=clamp(hero.x,0,LW-hero.w-4);
  for(const s of solids){
    if(Math.abs(s.x-hero.x)>80) continue;
    if(ov(hero,s)){
      if(hero.vy<0&&hero.prevY>=s.y+s.h-1) continue; // đang đập đầu từ dưới, để trục Y xử lý
      if(hero.vx>0||(hero.vx===0&&hero.x+hero.w/2<s.x+s.w/2)) hero.x=s.x-hero.w; else hero.x=s.x+s.w;
      hero.vx=0;
    }
  }
  // Y
  hero.y+=hero.vy*dt;
  let landed=false, hits=[];
  for(const s of solids){
    if(Math.abs(s.x-hero.x)>80) continue;
    if(!ov(hero,s)) continue;
    if(hero.vy>=0){ hero.y=s.y-hero.h; hero.vy=0; landed=true; }
    else {
      const o=Math.min(hero.x+hero.w,s.x+s.w)-Math.max(hero.x,s.x);
      if(o<5&&s.kind!=="wall"){ // hụt mép: đẩy nhẹ sang bên để vẫn nhảy tiếp
        if(hero.x+hero.w/2<s.x+s.w/2) hero.x=s.x-hero.w; else hero.x=s.x+s.w;
      } else { hits.push({s,o}); }
    }
  }
  if(hits.length){
    hits.sort((a,b)=>b.o-a.o); const s=hits[0].s;
    hero.y=s.y+s.h; hero.vy=60;
    if(s.kind!=="wall") bumpSolid(s);
  }
  // mặt đất
  const cx=hero.x+hero.w/2, bottom=hero.y+hero.h;
  if(hero.vy>=0&&hasGround(cx)&&hero.prevBottom<=G+1&&bottom>=G){hero.y=G-hero.h; hero.vy=0; landed=true;}
  hero.onGround=landed;
  return landed;
}

function update(dt){
  t+=dt;
  for(const f of fx){f.t+=dt; f.x+=f.vx*dt; f.y+=f.vy*dt; if(f.type==="spark") f.vy+=160*dt; if(f.type==="bubble") f.x+=Math.sin(f.t*3+f.r*5)*.15; if(f.type==="item"||f.type==="coin") f.vy+=(f.type==="coin"?260:20)*dt;}
  fx=fx.filter(f=>f.t<f.life);
  for(const s of solids) if(s.bounce>0) s.bounce=Math.max(0,s.bounce-dt);
  for(const st of stations) for(const b of st.blocks) if(b.resetT>0){b.resetT-=dt; if(b.resetT<=0){b.state="idle"; b.used=false;}}
  if(state!=="play") return;

  const cxh=hero.x+hero.w/2;
  hero.swim=!!WATER&&cxh>WATER.x0&&cxh<WATER.x1&&!hero.pit;
  if(hero.swim&&!swimHinted){swimHinted=true; toast("Tap JUMP to swim! 🌊","combo");}
  const dir=(keys.right?1:0)-(keys.left?1:0);
  const target=dir*(hero.swim?68:MAXV), acc=(dir?(Math.sign(hero.vx)===-dir?1500:620):900)*dt;
  hero.skid=!!(dir&&hero.onGround&&Math.sign(hero.vx)===-dir&&Math.abs(hero.vx)>30);
  hero.vx = hero.vx<target ? Math.min(target,hero.vx+acc) : Math.max(target,hero.vx-acc);
  if(dir) hero.face=dir;
  if(jumpBuf>0) jumpBuf-=dt; if(coyote>0) coyote-=dt; if(strokeCd>0) strokeCd-=dt;
  if(hero.swim){
    if((jumpBuf>0||keys.jump)&&strokeCd<=0){hero.vy=-128; jumpBuf=0; strokeCd=.3; hero.onGround=false; sSwim(); addFx({type:"bubble",x:hero.x+6+Math.random()*4,y:hero.y,vy:-26,life:1.6,r:1.4});}
  } else {
    if(jumpBuf>0&&coyote>0){hero.vy=-JUMPV; jumpBuf=0; coyote=0; hero.onGround=false; sJump();}
    // (bỏ kiểu "nhả nút là nhảy thấp": chạm nhanh trên iPad vẫn nhảy đủ cao để qua ống / hố)
  }
  if(hero.inv>0) hero.inv-=dt;
  hero.vy+=(hero.swim?300:GRAV)*dt;
  if(hero.swim) hero.vy=Math.min(hero.vy,85);
  ambT-=dt;
  if(ambT<=0){ambT=.3; if(WATER&&cam+viewW>WATER.x0&&cam<WATER.x1){ const lo=Math.max(WATER.x0+10,cam), hi=Math.min(WATER.x1-10,cam+viewW); addFx({type:"bubble",x:lo+Math.random()*Math.max(1,hi-lo),y:G-6,vy:-20-Math.random()*14,life:3.6+Math.random()*1.6,r:1+Math.random()*1.5}); }}

  const landed=moveHero(dt);
  if(hero.swim&&hero.y<4){hero.y=4; if(hero.vy<0) hero.vy=0;}
  const cx=hero.x+hero.w/2;
  if(landed){
    coyote=.09;
    if(hero.y+hero.h>=G-0.5&&hasGround(cx-24)&&hasGround(cx+24)&&hero.x<(stations.find(s=>!s.done)?.barrierX??LW)-30) lastSafe=hero.x;
  }
  // thành hố
  if(hero.y+hero.h>G+3){
    if(!hero.pit) hero.pit=GAPS.find(g=>cx>=g[0]-8&&cx<=g[1]+9)||null;
    if(hero.pit) hero.x=clamp(hero.x,hero.pit[0],hero.pit[1]+1-hero.w);
  } else hero.pit=null;
  if(hero.y>LH+24){fallDeath(); return;}

  // quái
  for(const e of enemies){
    if(!e.alive){ if(e.sq>0) e.sq-=dt; continue; }
    e.ph+=dt*5;
    const nx=e.x+e.dir*16*dt, probe={x:nx,y:e.y,w:e.w,h:e.h}, front=nx+(e.dir>0?e.w:0);
    let blocked=nx<e.min||nx>e.max||!hasGround(front);
    if(!blocked) for(const s of solids){ if(Math.abs(s.x-nx)<60&&ov(probe,s)){blocked=true;break;} }
    if(blocked) e.dir*=-1; else e.x=nx;
    // giẫm quái dễ hơn: vùng giẫm rộng (±3px hai bên, sâu 16px) — còn vùng bị đau thì thu nhỏ lại
    const hbot=hero.y+hero.h;
    const stompX=hero.x+hero.w>e.x-3&&hero.x<e.x+e.w+3;
    const hurtX=Math.min(hero.x+hero.w,e.x+e.w-3)-Math.max(hero.x,e.x+3), hurtY=Math.min(hbot,e.y+e.h)-Math.max(hero.y,e.y+5);
    if(hero.vy>0&&stompX&&hbot>=e.y-3&&hbot<=e.y+14&&hero.prevBottom<=e.y+13){
      e.alive=false; e.sq=.5; hero.vy=keys.jump?-300:-215; sStomp(); stompCount++; gain(5,e.x+8,e.y-6); sparkle(e.x+8,e.y+4,6,["#fff","#c8975a"]);
    } else if(hurtX>1&&hurtY>1) hurtHero();
  }
  // cá dưới nước
  for(const f of fishes){
    f.x+=f.dir*f.sp*dt; f.ph+=dt*6;
    if(f.x<f.min){f.x=f.min; f.dir=1;} if(f.x>f.max){f.x=f.max; f.dir=-1;}
    if(ov(hero,{x:f.x+2,y:f.y+2,w:12,h:8})) hurtHero();
  }
  // các từ nổi dưới nước: bơi chạm vào là chọn
  for(const st of stations){
    if(st.done||!st.water) continue;
    for(const b of st.blocks){
      if(b.used) continue;
      const bcx=b.x+8, bcy=b.y+8+Math.sin(t*2+b.idx)*2;
      if(Math.abs(hero.x+hero.w/2-bcx)<27&&Math.abs(hero.y+hero.h/2-bcy)<17) bumpAnswer(b);
    }
  }
  // xu bay
  for(const k of coinsAir){
    if(k.got) continue;
    if(Math.abs(hero.x+hero.w/2-k.x)<10&&Math.abs(hero.y+hero.h/2-k.y)<14){k.got=true; coins+=1; sCoin(); floatText("+1",k.x,k.y-8); updateHUD(); bump("coinPill");}
  }
  // nấm: +1 tim
  for(const m of items){
    if(m.got) continue; m.t+=dt;
    if(m.t>.2&&ov(hero,m)){
      m.got=true;
      if(hearts<3){hearts++; floatText("❤ +1",m.x+8,m.y-4,"#ff8a80"); toast("Extra heart! ❤️","good");} else gain(10,m.x+8,m.y-4);

    }
  }
  // đồng hồ đếm ngược của trạm
  const act=stations.find(s=>!s.done);
  if(act&&act.timerOn){
    act.tleft-=dt; $("timeVal").textContent=Math.ceil(Math.max(0,act.tleft)); $("timerPill").classList.toggle("warn",act.tleft<=8);
    if(act.tleft<=0) stationTimeout(act);
  }
  // hiện câu hỏi khi tới gần trạm
  const idx=stations.findIndex(s=>!s.done);
  if(idx>=0){const s=stations[idx]; if(t>2&&hero.x>s.x-210&&activeIdx!==idx){activeIdx=idx; setClue(s.clue,s.speak); sBell(); showBannerRound(s);}}
  const wantPic=(act&&act.sign&&activeIdx===act.idx)?act:null;
  if(wantPic!==picFor){picFor=wantPic; setPic(wantPic);}
  if(hero.x+hero.w>=FLAG_X-2 && stations.every(s=>s.done)) winLevel();
  const camT=clamp(hero.x+6-viewW*.44,CAM_MIN,Math.max(0,LW-viewW));
  cam+=(camT-cam)*Math.min(1,dt*7);
  hero.anim+=Math.abs(hero.vx)*dt*.09;
}

function rr(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function drawBubble(b){

  rr(cx-bw/2+1,top+1,bw-2,bh-2,4); c.fillStyle=st==="wrong"?"#fde0de":st==="right"?"#e4f8e8":"#fff"; c.fill();
  if(lab.type==="item"){

}

  } else {
    const g=c.createLinearGradient(x0,0,x1,0);
    g.addColorStop(0,"rgba(20,90,220,0)"); g.addColorStop(.07,"rgba(20,90,220,.40)"); g.addColorStop(.93,"rgba(20,90,220,.40)"); g.addColorStop(1,"rgba(20,90,220,0)");
    c.fillStyle=g; c.fillRect(x0,0,x1-x0,G+24);
    c.globalAlpha=.12; c.fillStyle="#fff";
    for(let i=0;i<5;i++){const rx=x0+24+i*58+Math.sin(t*.6+i)*8; c.beginPath(); c.moveTo(rx,0); c.lineTo(rx+16,0); c.lineTo(rx+6,G); c.lineTo(rx-12,G); c.closePath(); c.fill();}
    c.globalAlpha=1;
  }
  for(const sx of SEAWEED){ if(sx<cam-8||sx>cam+viewW+8) continue; for(let k=0;k<5;k++){const sw=Math.sin(t*2+sx*.1+k*.6)*(k*.45); R("#2e9a4a",Math.round(sx+sw),G-4-k*4,2,5);} }
}
function drawLava(){
  if(W.theme!=="castle") return;
  for(const [a,b] of GAPS){
    const x=a, w=b+1-a; if(x>cam+viewW+4||x+w<cam-4) continue;
    const gr=c.createLinearGradient(0,G,0,LH); gr.addColorStop(0,"#ffcc33"); gr.addColorStop(.35,"#ff7a1a"); gr.addColorStop(1,"#b3200f");
    c.fillStyle=gr; c.fillRect(x,G+6,w,LH-G-6);
    c.fillStyle="#ffdd55"; for(let i=0;i<w;i+=6){ const h=3+Math.sin(t*5+i*.7+a)*2; c.fillRect(x+i,G+6-h,5,h+1); }
  }
}
function drawFish(f){
  const x=Math.round(f.x), y=Math.round(f.y), fl=Math.floor(f.ph)%2;
  c.save(); if(f.dir<0){c.translate(x+16,y); c.scale(-1,1);} else c.translate(x,y);
  R("#ff7a45",4,2,9,8); R("#ff7a45",3,3,1,6); R("#ff7a45",13,3,1,6);
  R("#ff7a45",0,fl?2:3,3,3); R("#ff7a45",0,fl?7:6,3,3); R("#ff7a45",2,5,2,2);
  R("#ffd2a8",5,8,7,2); R("#e0502a",7,0,4,2);
  R("#fff",10,3,3,3); R("#2f3b4c",11,4,2,2);
  c.restore();
}
function drawWall(s){
  if(s.done) return;
  const x=s.barrierX, a=s.done?s.fade:1;
  c.save(); c.globalAlpha=.55*a; c.setLineDash([4,4]); c.lineWidth=2; c.strokeStyle="#fff"; c.beginPath(); c.moveTo(x+2.5,0); c.lineTo(x+2.5,G); c.stroke(); c.setLineDash([]);
  c.globalAlpha=a; c.fillStyle="#ee5d54"; c.fillRect(x-2,G-14,9,14); c.fillStyle="#fff"; c.fillRect(x-2,G-10,9,3);
  c.font="bold 9px 'Baloo 2',sans-serif"; c.textAlign="center"; c.fillStyle="#fff"; c.fillText("STOP",x+2.5,G-17); c.textAlign="left"; c.restore();
}
function drawFlag(){
  const x=FLAG_X, top=G-120;
  R("#2f3b4c",x,top,3,120); c.fillStyle="#ffd873"; c.beginPath(); c.arc(x+1.5,top-3,4,0,6.3); c.fill();
  const wave=Math.sin(t*4)*1.5;
  c.fillStyle="#2fb34a"; c.beginPath(); c.moveTo(x-1,top+4); c.lineTo(x-28+wave,top+14); c.lineTo(x-1,top+24); c.closePath(); c.fill();
  c.fillStyle="#fff"; c.font="bold 10px sans-serif"; c.fillText("★",x-18,top+19);
  c.drawImage(IM.obj,36,0,16,16,x-6,G-16,16,16);
}
function drawCoin(k){
  const w=Math.abs(Math.cos(t*5+k.x*.1));
  c.drawImage(IM.obj,88,0,14,16,Math.round(k.x-7*w-0.5+ (1-w)*0),Math.round(k.y-8),Math.max(1,Math.round(14*w)),16);
}
function render(){
  const S=scale*dpr;
  c.setTransform(S,0,0,S,0,0);
  c.imageSmoothingEnabled=false;
  c.fillStyle=SKYCOL; c.fillRect(0,0,viewW,LH);
  if(!ready()||!BGIMG) return;
  const camR=Math.round(cam*S)/S;
  const sx0=Math.max(0,camR), dx0=sx0-camR, sw=Math.min(viewW-dx0,LW-sx0);
  c.drawImage(BGIMG,sx0,0,sw,LH,dx0,0,sw,LH);
  c.save(); c.translate(-camR,0);
  if(camR<0) for(let wx=-96;wx<0;wx+=16) c.drawImage(GROUND,0,0,16,24,wx,200,16,24);
  drawLava();
  stations.forEach(drawWall);
  drawFlag();
  coinsAir.forEach(k=>{if(!k.got) drawCoin(k);});
  solids.forEach(drawSolid);
  drawWater();
  stations.forEach(st=>st.blocks.forEach(drawBubble));
  for(const m of items) if(!m.got){const rise=Math.min(1,m.t/.35); c.drawImage(IM.obj,104,0,16,16,m.x,Math.round(m.y+16-16*rise),16,16);}
  fishes.forEach(drawFish);
  for(const e of enemies){
    if(!e.alive){ if(e.sq>0) c.drawImage(IM.enemy,32,0,16,16,Math.round(e.x),Math.round(e.y),16,16); continue; }
    c.drawImage(IM.enemy,(Math.floor(e.ph)%2)*16,0,16,16,Math.round(e.x),Math.round(e.y),16,16);
  }
  if(hero){
    const blink=hero.inv>0&&Math.floor(hero.inv*14)%2===0;
    if(!blink) drawMario(c,hero.x+hero.w/2,hero.y,hero.face,hero.anim,!hero.onGround,hero.skid,Math.abs(hero.vx)>8);
  }
  for(const f of fx){
    const a=1-f.t/f.life;
    if(f.type==="spark"){c.globalAlpha=a; R(f.color,Math.round(f.x),Math.round(f.y),2,2); c.globalAlpha=1;}
    else if(f.type==="bubble"){c.globalAlpha=Math.min(.9,a*1.5); c.strokeStyle="#fff"; c.lineWidth=.8; c.beginPath(); c.arc(f.x,f.y,f.r,0,6.3); c.stroke(); c.globalAlpha=1;}
    else if(f.type==="text"){
      c.globalAlpha=Math.min(1,a*1.6); c.font="bold 11px 'Baloo 2',sans-serif"; c.textAlign="center";
      c.lineWidth=3; c.strokeStyle="#2f3b4c"; c.strokeText(f.text,f.x,f.y); c.fillStyle=f.color; c.fillText(f.text,f.x,f.y); c.textAlign="left"; c.globalAlpha=1;
    } else if(f.type==="item"){
      const im=itemImg(f.it,f.col); c.save(); c.globalAlpha=a; drawFit(im,f.x,f.y,22,18); c.restore();
    } else if(f.type==="coin"){
      c.globalAlpha=Math.min(1,a*2); c.drawImage(IM.obj,88,0,14,16,Math.round(f.x-7),Math.round(f.y-8),14,16); c.globalAlpha=1;
    }
  }
  c.restore();
}
let lastT=0;
function loop(ts){
  const dt=Math.min(.033,(ts-lastT)/1000||0); lastT=ts;
  for(const s of stations) if(s.done&&s.fade>0) s.fade=Math.max(0,s.fade-dt*2);
  if(cv.width>0){if(!paused) update(dt); render();}
  requestAnimationFrame(loop);
}

/* =====================================================================
   ĐIỀU KHIỂN
   ===================================================================== */
function bindBtn(id,key){
  const b=$(id);
  const down=e=>{e.preventDefault(); ensureCtx(); keys[key]=true; if(key==="jump") jumpBuf=.12; b.classList.add("on");};
  const up=e=>{e.preventDefault(); keys[key]=false; b.classList.remove("on");};
  b.addEventListener("pointerdown",down);
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,up));
  b.addEventListener("contextmenu",e=>e.preventDefault());
}
bindBtn("bL","left"); bindBtn("bR","right"); bindBtn("bJ","jump");
const KEYMAP={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",ArrowUp:"jump",KeyW:"jump",Space:"jump"};
window.addEventListener("keydown",e=>{if(e.code==="KeyP"||e.code==="Escape"){e.preventDefault(); setPaused(!paused); return;} if(paused) return; const k=KEYMAP[e.code]; if(!k) return; e.preventDefault(); if(k==="jump"&&!keys.jump) jumpBuf=.12; keys[k]=true;});
window.addEventListener("keyup",e=>{const k=KEYMAP[e.code]; if(!k) return; e.preventDefault(); keys[k]=false;});
window.addEventListener("blur",()=>{keys.left=keys.right=keys.jump=false;});

/* =====================================================================
   KẾT THÚC + KHỞI TẠO
   ===================================================================== */
function endGame(){
  state="menu";
  const wc=coins-worldStartCoins, stars=wc>=STAR_AT.three?3:wc>=STAR_AT.two?2:wc>=STAR_AT.one?1:0;
  SAVE.stars[worldIdx]=Math.max(SAVE.stars[worldIdx]||0,stars); SAVE.best[worldIdx]=Math.max(SAVE.best[worldIdx]||0,wc);
  SAVE.unlocked=Math.max(SAVE.unlocked||1,Math.min(WORLDS.length,worldIdx+2)); writeSave();
  const last=worldIdx>=WORLDS.length-1, totalStars=SAVE.stars.reduce((a,b)=>a+b,0);
  $("endTitle").textContent=last?"All worlds clear! 🏆":`World ${worldIdx+1} clear! 🚩`;
  $("finalScoreBox").innerHTML=`${COIN} <span>${wc}</span>`;
  $("endStars").innerHTML=[0,1,2].map(i=>`<span class="${i<stars?"":"off"}">⭐</span>`).join("");
  const medals=[];
  if(wrongCount===0) medals.push("💎 No wrong blocks");
  if(firstTryCount>=stations.length-1) medals.push("🎯 First-try hero");
  if(stompCount>=5) medals.push("🥾 Stomp master");
  if(hearts===3) medals.push("❤️ No hearts lost");
  if(last) medals.push(`🌍 All worlds: ${totalStars}/${WORLDS.length*3} ⭐`);
  $("endMedals").innerHTML=medals.map(m=>`<div>${m}</div>`).join("");
  $("endChips").innerHTML=[...reviewed].map(([en,vi])=>`<span class="chip"><b>${en}</b> · ${vi}</span>`).join("")||`<span class="chip">Try again!</span>`;
  // từ cần ôn: từ sai trong màn này + những từ bé hay sai nhất (lưu từ các buổi trước)
  const rev=new Map(worldMiss);
  Object.entries(SAVE.weak).filter(([id,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,6).forEach(([id])=>{ const w=getItem(id); if(w) rev.set(w.en,w.vi); });
  $("endMiss").innerHTML=[...rev].map(([en,vi])=>`<span class="chip"><b>${en}</b> · ${vi}</span>`).join("");
  $("endMissWrap").style.display=rev.size?"":"none";
  $("nextBtn").style.display=last?"none":"";
  lastResult=`Clothes Run — World ${worldIdx+1} (${W.name}): ${wc} xu, ${stars}⭐ (tổng ${totalStars}/${WORLDS.length*3}⭐). Đã học: ${[...reviewed.keys()].join(", ")||"-"}. Cần ôn lại: ${[...rev.keys()].join(", ")||"không có"}.`;
  showOverlay("endOverlay");
}
function drawPreview(){const p=$("heroPrev").getContext("2d"); p.imageSmoothingEnabled=false; p.clearRect(0,0,18,16); p.drawImage(IM.mario,0,71,18,16,0,0,18,16);}
fit();
requestAnimationFrame(ts=>{lastT=ts; requestAnimationFrame(loop);});
loadWorld(0); selW=Math.min(SAVE.unlocked-1,WORLDS.length-1); renderWorldRow(); setMusic(SAVE.music!==false);
if(location.hash==="#test"){ $("testRow").style.display=""; $("testBtns").innerHTML=STATION_DEFS.map((_,i)=>`<button data-from="${i}">${i+1}</button>`).join("")+" "+WORLDS.map((w,i)=>`<button data-w="${i}">W${i+1}</button>`).join(""); }
$("testBtns").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; fit(); if(b.dataset.w!==undefined) startWorld(+b.dataset.w,0,true); else startWorld(0,+b.dataset.from,true);});
$("worldRow").addEventListener("click",e=>{ const b=e.target.closest("[data-w]"); if(!b) return; const i=+b.dataset.w;
  if(i>=SAVE.unlocked){ b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); sWrong(); return; } selW=i; renderWorldRow(); sBump(); });

$("zaloBtn").addEventListener("click",()=>{try{navigator.clipboard&&navigator.clipboard.writeText(lastResult);}catch(e){} window.open(ZALO,"_blank");});

document.addEventListener("gesturestart",e=>e.preventDefault());
/* CHỐNG ZOOM (iOS Safari bỏ qua user-scalable=no): chặn pinch, chạm đúp, và tự reset nếu lỡ bị zoom */
(function(){
  let lastEnd=0, lastReset=0;
  const inGame=t=>t&&t.closest&&t.closest("#controls,#stageWrap,#cv,.statbar,.clue");
  ["gesturechange","gestureend","dblclick"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
  document.addEventListener("touchmove",e=>{if(e.touches.length>1) e.preventDefault();},{passive:false});
  document.addEventListener("touchend",e=>{const n=Date.now(); if(n-lastEnd<350&&inGame(e.target)&&!e.target.closest("button:not(.cb)")) e.preventDefault(); lastEnd=n;},{passive:false});
  function resetZoom(){
    const now=Date.now(); if(now-lastReset<800) return; lastReset=now;
    const m=document.querySelector('meta[name=viewport]'); if(!m) return;
    const full=m.getAttribute("content");
    m.setAttribute("content","width=device-width, initial-scale=1, viewport-fit=cover");
    setTimeout(()=>{m.setAttribute("content",full); fit();},80);
  }
  if(window.visualViewport) window.visualViewport.addEventListener("resize",()=>{ if(window.visualViewport.scale>1.02) resetZoom(); });
})();
if(location.hash==="#test") window.__t={startWorld,loadWorld,WORLDS,get W(){return W;},get worldIdx(){return worldIdx;},get SAVE(){return SAVE;},get runSeen(){return runSeen;},chooseWord,get hero(){return hero;},get stations(){return stations;},get solids(){return solids;},get enemies(){return enemies;},get coins(){return coins;},get hearts(){return hearts;},get state(){return state;},get cam(){return cam;},get fishes(){return fishes;},get paused(){return paused;},setPaused,keys,step(n){for(let i=0;i<n;i++) update(1/60);},jumpPress(){jumpBuf=.12;keys.jump=true;}};
