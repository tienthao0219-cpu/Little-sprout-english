function hangRound(){ G.lives = 6; G.guessed = new Set(); G.ended = false; G.showPic = false; drawHang(); }
function drawHang(){
  const g = G, w = g.words[g.i], tp = topicById(w.topics[0]), ended = g.ended;
  const slots = [...w.w].map(ch=>{
    if(ch===' ') return '<span class="gap"></span>';
    if(!isLetter(ch)) return `<span class="slot fixed">${esc(ch)}</span>`;
    const lc = ch.toLowerCase(), has = g.guessed.has(lc);
    if(has) return `<span class="slot ${ended==='win'?'ok':'filled'}">${esc(ch)}</span>`;
    if(ended==='lose') return `<span class="slot lost">${esc(ch)}</span>`;
    return '<span class="slot blank"></span>';
  }).join('');
  const keys = [...ABC].map(k=>{
    const used = g.guessed.has(k), good = used && norm(w.w).indexOf(k)>=0;
    return `<button class="key${used?(good?' good':' bad'):''}" data-act="hkey" data-k="${k}" ${used?'disabled':''}>${k}</button>`;
  }).join('');
  const last = g.i>=g.words.length-1;
  const fb = ended ? `<div class="fb ${ended==='win'?'good':'bad'}"><h3>${ended==='win'?'🌸 Cây đã được cứu!':'🥀 Cây bị héo mất rồi…'}</h3>
      <div class="fbrow">${w.img?`<img class="fbpic" src="${imgOf(w)}" alt="">`:''}<div><div class="fw">${wordHtml(w)} ${spk(w.say)}</div><div class="fv">${esc(w.vi)}</div></div></div>
      <button class="btn primary big" data-act="hnext" style="margin-top:10px">${last?'Xem kết quả':'Từ tiếp theo'} ↵</button></div>` : '';
  $('#hbody').innerHTML = `<div class="qcard">
    <span class="qtype">Từ ${g.i+1}/${g.words.length}</span><span class="qtopic">${esc(tp.icon+' '+unitLabel(tp))}</span>
    <div class="plant">${ended==='win'?'🌸':PLANT[g.lives]}</div>
    <div class="hearts">${'❤️'.repeat(g.lives)}${'🖤'.repeat(6-g.lives)}</div>
    <div class="qlabel" style="text-align:center">Nghĩa tiếng Việt</div>
    <div class="bigword vi" style="justify-content:center;margin:2px 0 6px">${esc(w.vi)} ${spk(w.say)}</div>
    ${(g.showPic || ended) && w.img ? qpic(w,'sm') : ''}
    <div class="slots center">${slots}</div>
    ${ended ? fb : `<div class="kb">${keys}</div>
      <div class="actions" style="justify-content:center;margin-top:14px"><button class="btn" data-act="hhint">💡 Mở 1 chữ (−1 ❤️)</button>${w.img&&!g.showPic?'<button class="btn" data-act="hdef">🖼️ Xem hình</button>':''}</div>`}
  </div>`;
  setScore('⭐ '+g.score);
}
function hangCheck(){
  const g = G, w = g.words[g.i];
  const win = [...new Set(norm(w.w))].every(c=>g.guessed.has(c));
  if(win){ g.ended = 'win'; g.score += 5 + g.lives*2; sfxOk(); }
  else if(g.lives<=0){ g.ended = 'lose'; g.missed.push(w); sfxBad(); }
  if(g.ended && store.sound) speak(w.say);
}
function hangGuess(k){
  const g = G; if(!g || g.key!=='hang' || g.ended || g.guessed.has(k)) return;
  g.guessed.add(k);
  if(norm(g.words[g.i].w).indexOf(k)<0){ g.lives--; sfxBad(); } else sfxOk();
  hangCheck(); drawHang();
}
function hangHint(){
  const g = G; if(!g || g.ended) return;
  if(g.lives<=1){ toast('Chỉ còn 1 ❤️ nên không thể dùng gợi ý nữa!'); return; }
  const rest = [...new Set(norm(g.words[g.i].w))].filter(c=>!g.guessed.has(c)); if(!rest.length) return;
  g.guessed.add(rnd(rest)); g.lives--; hangCheck(); drawHang();
}
function hangNext(){
  const g = G; if(!g || !g.ended) return;
  g.i++;
  if(g.i>=g.words.length){
    const saved = g.words.length - g.missed.length;
    gameResult({icon:saved>=g.words.length-1?'🌻':'🌱', title:'Xong rồi!', msg:`Bạn đã cứu ${saved}/${g.words.length} cây con.`, xp:g.score,
      stats:[[saved+'/'+g.words.length,'Cây được cứu'],[g.score,'Điểm'],[g.missed.length,'Từ cần ôn']], missed:g.missed, again:'playHangman', win:saved>=g.words.length-1});
  } else hangRound();
}
function hangKey(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(G.ended){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); hangNext(); } return; }
  if(e.key.length===1 && isLetter(e.key)) hangGuess(e.key.toLowerCase());
}

/* ---------- 4. Bắn bóng bay ---------- */
const BCOL = ['#ffa3b3','#ffbf94','#ffdf7a','#98e0bc','#9ccbff','#cdb4ff','#ffa8d3'];
function playBalloon(){
  endG();
  const pool = gamePool(4); if(!pool) return;
  const words = pickWeak(pool, Math.min(10, pool.length));
  G = mkG({key:'balloon', pool, words, i:0, lives:3, score:0, combo:0, right:0, missed:[], cur:null});
  startG('Bắn bóng bay','🎈','<div class="qcard" id="bprompt"></div><div class="sky" id="sky"></div><div class="banner" id="bbanner"></div>');
  balloonRound();
}
function balloonScore(){ setScore('❤️'.repeat(Math.max(0,G.lives))+' ⭐'+G.score); }
function balloonRound(){
  const g = G, w = g.words[g.i];
  const usePic = !!w.img && Math.random()<.65;
  const opts = mkOpts(w, 'en', g.pool);
  g.cur = {w, opts, resolved:false};
  $('#bprompt').innerHTML = `<span class="qtype">🎈 Bóng ${g.i+1}/${g.words.length}</span>
    <div class="qlabel">Chạm vào bóng bay có từ tiếng Anh đúng:</div>
    ${usePic ? qpic(w,'sm') : `<div class="bigword vi" style="margin-bottom:0">${esc(w.vi)}</div>`}`;
  const sky = $('#sky'); sky.style.setProperty('--h', sky.clientHeight+'px');
  const dur = Math.max(5, 8.5 - g.i*.3);
  const slots = shuffle([0,1,2,3]);
  sky.innerHTML = opts.map((o,i)=>`<button class="balloon" style="left:${slots[i]*25+1}%;--bc:${BCOL[(g.i+i)%BCOL.length]};animation-duration:${(dur+Math.random()*1.2).toFixed(2)}s;animation-delay:${(Math.random()*1.6).toFixed(2)}s" data-act="bpick" data-i="${i}">${esc(o)}</button>`).join('');
  [...sky.children].forEach((b,i)=>{ if(opts[i]===w.w) b.addEventListener('animationend', ()=>balloonResolve(false,-1)); });
  $('#bbanner').className = 'banner'; $('#bbanner').innerHTML = '';
  balloonScore();
}
function balloonPick(i){ if(G && G.key==='balloon' && G.cur && !G.cur.resolved) balloonResolve(G.cur.opts[i]===G.cur.w.w, i); }
function balloonResolve(ok, i){
  const g = G; if(!g || g.key!=='balloon' || !g.cur || g.cur.resolved) return;
  const c = g.cur; c.resolved = true;
  [...$('#sky').children].forEach((b,j)=>{ b.classList.add('freeze'); if(c.opts[j]===c.w.w) b.classList.add('right'); else if(j===i) b.classList.add('wrong'); else b.classList.add('dim'); });
  if(ok){ g.score += 10 + Math.min(g.combo,5)*2; g.combo++; g.right++; sfxOk(); }
  else { g.lives--; g.combo = 0; g.missed.push(c.w); sfxBad(); }
  if(store.sound) speak(c.w.say);
  const b = $('#bbanner'); b.className = 'banner show '+(ok?'good':'bad');
  b.innerHTML = ok ? `✅ <b>${esc(c.w.w)}</b> — ${esc(c.w.vi)}` : `❌ Đáp án: <b>${esc(c.w.w)}</b> — ${esc(c.w.vi)}`;
  balloonScore();
  g.timers.push(setTimeout(()=>{ g.i++; if(g.lives<=0 || g.i>=g.words.length) balloonEnd(); else balloonRound(); }, 1500));
}
function balloonEnd(){
  const g = G, alive = g.lives>0;
  gameResult({icon:alive?'🎈':'💔', title:alive?'Hoàn thành!':'Hết tim rồi!', msg:alive?'Bạn đã chạm đúng nhiều bóng bay!':'Đừng lo, thử lại nhé!', xp:g.score,
    stats:[[g.right+'/'+g.words.length,'Bóng đúng'],[g.score,'Điểm'],['❤️ '+Math.max(0,g.lives),'Tim còn lại']], missed:g.missed, again:'playBalloon', win:alive && g.right>=g.words.length-1});
}

/* ---------- 5. Đúng hay Sai? (60 giây) ---------- */
function playBlitz(){
  endG();
  const pool = gamePool(4); if(!pool) return;
  G = mkG({key:'blitz', pool, left:60, score:0, total:0, streak:0, best:0, wrong:[], cur:null, flash:'', onKey:blitzKey});
  startG('Đúng hay Sai?','⚡','<div class="timebar" id="tbar"><i></i></div><div class="qcard" id="bcard"></div><div class="bbtns"><button class="btn no-btn" data-act="bans" data-v="0">✗ Sai</button><button class="btn primary" data-act="bans" data-v="1">✓ Đúng</button></div><p class="note" id="blast" style="text-align:center;min-height:22px"></p><p class="note" style="text-align:center">Phím tắt: ← Sai · → Đúng</p>');
  blitzNext(); blitzTick();
  G.timers.push(setInterval(()=>{ if(paused) return; G.left--; blitzTick(); if(G.left<=0) blitzEnd(); }, 1000));
}
function blitzTick(){
  const g = G; setScore('⏱ '+g.left+' · ⭐ '+g.score);
  const tb = $('#tbar'); if(tb){ tb.firstElementChild.style.width = Math.max(0,(g.left/60*100))+'%'; tb.classList.toggle('low', g.left<=10); }
}
function blitzNext(){
  const g = G, pool = g.pool; let w;
  do { w = roulette(pool, x=>{ const p = getP(x.id); return BOXW[p.box]*(p.seen?1:1.5); }); } while(pool.length>1 && g.cur && g.cur.w===w);
  let truth = Math.random()<.5, shown = w.vi;
  if(!truth){
    const ok = x=>x!==w && x.vi!==w.vi;
    const near = pool.filter(x=>ok(x) && x.topics.some(t=>w.topics.indexOf(t)>=0));
    const src = near.length ? near : pool.filter(ok);
    if(src.length) shown = rnd(src).vi; else truth = true;
  }
  g.cur = {w, truth, shown};
  const c = $('#bcard');
  c.className = 'qcard'+(g.flash?' flash'+g.flash:'');
  c.innerHTML = `<div class="qlabel">Từ này có nghĩa là…</div>${qpic(w,'sm')}<div class="bigword">${wordHtml(w)} ${spk(w.say)}</div>
    <div class="clue" style="margin-bottom:0">= ${esc(shown)}</div>`;
}
function blitzAns(v){
  const g = G; if(!g || g.key!=='blitz' || g.left<=0) return;
  const c = g.cur, ok = (v===c.truth); g.total++;
  if(ok){ g.score++; g.streak++; g.best = Math.max(g.best, g.streak); g.flash = 'ok'; sfxOk(); $('#blast').textContent = ''; }
  else {
    g.streak = 0; g.flash = 'bad'; sfxBad();
    if(g.wrong.indexOf(c.w)<0) g.wrong.push(c.w);
    $('#blast').innerHTML = `✗ <b>${esc(c.w.w)}</b> = ${esc(c.w.vi)}`;
  }
  blitzTick(); blitzNext();
}
function blitzKey(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(k==='arrowright' || k==='d'){ e.preventDefault(); blitzAns(true); }
  else if(k==='arrowleft' || k==='a'){ e.preventDefault(); blitzAns(false); }
}
function blitzEnd(){
  const g = G; if(!g || g.key!=='blitz') return;
  const acc = g.total ? Math.round(g.score/g.total*100) : 0;
  gameResult({icon:'⚡', title:'Hết giờ!', msg:g.score>=15?'Nhanh như chớp!':'Cố gắng thêm lần nữa nhé!', xp:g.score*3,
    stats:[[g.score,'Câu đúng'],[acc+'%','Chính xác'],['🔥 '+g.best,'Chuỗi dài nhất']], missed:g.wrong, again:'playBlitz', win:g.score>=15});
}

/* ---------- Sự kiện ---------- */
const H = {
  toggleTopic(el){ const id = el.dataset.id, i = store.sel.indexOf(id); if(i>=0) store.sel.splice(i,1); else store.sel.push(id); save(); renderHome(); },
  selAll(){ store.sel = TOPICS.map(t=>t.id); save(); renderHome(); },
  selNone(){ store.sel = []; save(); renderHome(); },
  size(el){ store.size = +el.dataset.n; save(); renderHome(); },
  toggleType(el){
    const t = el.dataset.t, i = store.types.indexOf(t);
    if(i>=0){ if(store.types.length>1) store.types.splice(i,1); } else store.types.push(t);
    save(); renderHome();
  },
  toggleSound(){ store.sound = !store.sound; save(); renderHome(); },
  tab(el){ store.tab = el.dataset.t; save(); renderHome(); },
  back, skip, pause: pauseGame, resume: resumeGame,
  pausehome(){ resumeGame(); endG(); renderHome(); window.scrollTo(0,0); },
  reviewall(){ const ids = reviewIds().map(w=>w.id); if(ids.length) startSession({ids}); },
  flash(){ openFlash(); },
  flashTopic(el){ openFlash([el.dataset.id]); },
  flashstart(){ if(G && G.key==='flash'){ if(G.single) startSession({topic:G.units[0]}); else startSession(); } },
  fcmode(el){ if(G && G.key==='flash'){ G.mode = el.dataset.m; if(G.mode==='cards'){ G.i = 0; G.flip = false; } drawFlash(); } },
  fchide(){ if(G && G.key==='flash'){ G.hide = !G.hide; drawFlash(); } },
  fcunk(){ if(G && G.key==='flash'){ G.unkOnly = !G.unkOnly; drawFlash(); } },
  fcall(){
    if(!G || G.key!=='flash') return;
    const vis = [...document.querySelectorAll('.ft')].map(e=>e.dataset.id);
    const all = vis.length && vis.every(id=>G.flipped.has(id));
    vis.forEach(id=>{ if(all) G.flipped.delete(id); else G.flipped.add(id); });
    document.querySelectorAll('.ft').forEach(e=>e.classList.toggle('flipped', G.flipped.has(e.dataset.id)));
  },
  ftflip(el){
    if(!G || G.key!=='flash') return;
    const id = el.dataset.id; el.classList.toggle('flipped');
    if(el.classList.contains('flipped')){ G.flipped.add(id); if(BYID[id]) speak(BYID[id].say); } else G.flipped.delete(id);
  },
  flag(el){
    const id = el.dataset.id; if(!BYID[id]) return;
    const p = ensureP(id); p.unk = !p.unk; save();
    document.querySelectorAll('[data-act="flag"]').forEach(b=>{
      if(b.dataset.id!==id) return;
      b.classList.toggle('on', p.unk); b.setAttribute('aria-pressed', p.unk);
      b.textContent = p.unk ? '🚩 Chưa thuộc ✓' : '🚩 Chưa thuộc';
      const it = b.closest('.ft-item'); if(it) it.classList.toggle('unk', p.unk);
    });
    document.querySelectorAll('.fc-topic').forEach(tp=>{
      const sm = tp.querySelector('.fc-h small'); if(!sm) return;
      const u = tp.querySelectorAll('.ft-item.unk').length;
      sm.textContent = tp.querySelectorAll('.ft-item').length+' từ'+(u?' · 🚩 '+u:'');
    });
  },
  practiceTopic(el){ startSession({topic: el.dataset.id}); },
  enter(){ document.body.classList.remove('on-cover'); renderHome(); window.scrollTo(0,0); },
  cover: renderCover,
  covergames(){ store.tab = 'games'; save(); H.enter(); },
  coverflash(){ document.body.classList.remove('on-cover'); openFlash(); },
  fcflip(){ if(G && G.key==='flash'){ G.flip = !G.flip; drawFlash(); if(G.flip && store.sound) speak(G.deck[G.i].say); } },
  fcprev(){ flashMove(-1); },
  fcnext(){ flashMove(1); },
  fcshuffle(){ if(G && G.key==='flash'){ shuffle(G.deck); G.i = 0; G.flip = false; drawFlash(); } },
  gquit(){ endG(); renderHome(); window.scrollTo(0,0); },
  playMemory, playSearch, playHangman, playBalloon, playBlitz,
  openGame(el){ launchTemplate(el.dataset.k); },
  mflip(el){ memFlip(+el.dataset.i); },
  wcell(el){ swCell(+el.dataset.r, +el.dataset.c); },
  swhint: swHint,
  hkey(el){ hangGuess(el.dataset.k); },
  hhint: hangHint,
  hdef(){ if(G && G.key==='hang' && !G.ended){ G.showPic = true; drawHang(); } },
  hnext: hangNext,
  bpick(el){ balloonPick(+el.dataset.i); },
  bans(el){ blitzAns(el.dataset.v==='1'); },
  mL(el){ matchLeft(+el.dataset.i); },
  mR(el){ matchRight(+el.dataset.j); },
  reset(){ if(confirm('Xóa toàn bộ tiến độ và điểm của thiết bị này?')){ store.words = {}; store.sessions = 0; store.xp = 0; save(); renderHome(); } },
  start(){ startSession(); },
  again(){ startSession(S && S.topicOnly ? {topic:S.topicOnly} : {}); },
  review(){ if(S && S.missedIds && S.missedIds.length) startSession({ids:S.missedIds}); },
  home(){ renderHome(); window.scrollTo(0,0); },
  quit(){ if(confirm('Thoát khỏi lượt chơi? Phần đã làm vẫn được lưu lại.')) renderHome(); },
  speak(el){ speak(el.dataset.t, !!el.dataset.slow); },
  opt(el){ pick(+el.dataset.i); },
  submit(){ submit(false); },
  giveup(){ if(q && !q.answered){ if(q.mode==='mc' || q.mode==='pic' || q.mode==='match'){ q.picked = -1; finish(false,''); } else submit(true); } },
  next(){ next(); },
  hint(){
    if(!q || q.answered || q.hints>=3) return;
    q.hints++;
    const hb = $('#hintbox'); if(hb) hb.innerHTML = hintHtml();
    const bt = $('#hintbtn'); if(bt){ bt.textContent = `💡 Gợi ý (${q.hints}/3)`; if(q.hints>=3) bt.disabled = true; }
    const a = $('#ans'); if(a) a.focus({preventScroll:true});
  },
  clear(){ if(q && q.mode==='scramble' && !q.answered){ q.placed = []; updateScramble(); } },
  tile(el){ if(q && q.mode==='scramble' && !q.answered){ q.placed.push(+el.dataset.id); updateScramble(); } },
  unplace(el){ if(q && q.mode==='scramble' && !q.answered){ q.placed.splice(+el.dataset.i,1); updateScramble(); } }
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const f = H[el.dataset.act]; if(f) f(el, e);
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id==='hid' && q && q.mode==='missing'){
    const v = t.value.replace(/[^a-zA-Z]/g,'').toLowerCase().slice(0,q.blanks.length);
    t.value = v; q.typedL = v; updateSlots();
  } else if(t.id==='ans' && q){ q.value = t.value; }
  else if(t.id==='fcq' && G && G.key==='flash'){ G.query = t.value; const l = $('#fclist'); if(l) l.innerHTML = flashListHtml(); }
});
document.addEventListener('keydown', e=>{
  if(paused){ if(e.key==='Escape' || e.key==='Enter'){ e.preventDefault(); resumeGame(); } return; }
  if(G && G.key==='flash' && G.mode==='grid' && (e.key==='Enter' || e.key===' ') && e.target.classList && e.target.classList.contains('ft')){
    e.preventDefault(); H.ftflip(e.target); return;
  }
  if(G && G.onKey){ G.onKey(e); return; }
  if(e.ctrlKey || e.metaKey || e.altKey || !q) return;
  const k = e.key;
  if(q.answered){
    if((k==='Enter' || k===' ') && Date.now()-lastAnswerAt>350){ e.preventDefault(); next(); }
    return;
  }
  if(q.mode==='mc' || q.mode==='pic'){
    if(/^[1-4]$/.test(k)){ e.preventDefault(); pick(+k-1); }
    return;
  }
  if(q.mode==='match') return;
  if(k==='Enter'){ e.preventDefault(); submit(false); return; }
  if(q.mode==='scramble'){
    if(k==='Backspace'){ e.preventDefault(); q.placed.pop(); updateScramble(); }
    else if(k.length===1 && isLetter(k)){
      const t = q.order.find(t=>t.ch===k.toLowerCase() && q.placed.indexOf(t.id)<0);
      if(t){ e.preventDefault(); q.placed.push(t.id); updateScramble(); }
    }
  }
});

/* debug / kiểm tra nhanh trong console */
window.__vocab = {WORDS, TOPICS, store:()=>store, pickWords, norm, q:()=>q, S:()=>S, G:()=>G};

// quay về từ một game template: vào thẳng tab Trò chơi
let backHome = false;
try{ if(localStorage.getItem('starters.backHome')){ localStorage.removeItem('starters.backHome'); backHome = true; } }catch(e){}
if(backHome){ store.tab = 'games'; document.body.classList.remove('on-cover'); renderHome(); } else renderCover();

})();
