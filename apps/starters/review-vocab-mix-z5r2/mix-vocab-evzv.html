<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starters Vocab Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7ff; --card:#ffffff; --ink:#3a3f5c; --muted:#868ba6; --line:#ece4f4;
  --primary:#a6e6cf; --primary-d:#2b8a70; --primary-b:#7fd3b4; --primary-soft:#e6f8f1;
  --accent:#ffcfa6; --accent-soft:#fff2e4;
  --bad:#ff8fa5; --bad-soft:#ffe9ee; --blue:#9cc7ff; --blue-soft:#e9f2ff;
  --lav:#ece4ff; --pink:#ffe6ee; --sun:#fff3c4;
  --radius:20px;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-h:'Baloo 2','Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  background-image:radial-gradient(circle at 10% 0%,#ffe9bd 0,transparent 45%),radial-gradient(circle at 100% 20%,#d6f3e6 0,transparent 40%);
  background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
h1,h2,h3{font-family:var(--font-h);margin:0;line-height:1.15}
.app{max-width:820px;margin:0 auto;padding:14px 16px 110px}
.hidden{display:none!important}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-h);font-weight:800;font-size:22px;color:var(--primary-d)}
.logo i{font-style:normal;font-size:30px}
.pills{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.pill.btn-pill{padding:4px 10px}

.hero{background:linear-gradient(135deg,var(--primary),#43c9a1);color:#fff;border-radius:var(--radius);padding:18px 20px;margin:6px 0 18px;box-shadow:0 6px 0 var(--primary-d)}
.hero h1{font-size:28px;margin-bottom:4px}
.hero p{margin:0;opacity:.95}
.hero .stats{display:flex;gap:16px;margin-top:10px;font-weight:800;flex-wrap:wrap}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 0 10px}
.sec-h h2{font-size:21px}
.link{color:var(--blue);font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:4px}
.sep{color:var(--muted)}

/* topics */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.topic{position:relative;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:var(--radius);padding:12px 12px 12px 14px;display:block;width:100%;transition:transform .12s,border-color .12s,box-shadow .12s}
.topic:hover{transform:translateY(-2px)}
.topic.on{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.topic .row{display:flex;align-items:center;gap:10px}
.topic .ic{font-size:28px;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,#fff);flex:none}
.topic .nm{font-weight:800;line-height:1.2;padding-right:26px}
.topic .vi{color:var(--muted);font-size:14px}
.topic .chk{position:absolute;right:10px;top:10px;width:24px;height:24px;border-radius:8px;border:3px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff;font-weight:900}
.topic.on .chk{background:var(--c);border-color:var(--c)}
.topic .bar{height:8px;border-radius:999px;background:#f0e8d6;margin-top:10px;overflow:hidden;position:relative}
.topic .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.topic .bar .seen{background:color-mix(in srgb,var(--c) 35%,#fff)}
.topic .bar .mas{background:var(--c)}
.topic .meta{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:700}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.chip{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 16px;font-weight:800}
.seg button.on,.chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-d)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:8px 12px}
.chip.off-support{opacity:.45}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}

.startbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.startbar .inner{max-width:820px;margin:0 auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:12px 22px;font-weight:800;font-size:17px;border:3px solid var(--line);background:var(--card);transition:transform .1s}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.primary{background:var(--primary);border-color:var(--primary-d);color:#fff;box-shadow:0 4px 0 var(--primary-d)}
.btn.primary:active:not(:disabled){box-shadow:0 2px 0 var(--primary-d)}
.btn.primary:disabled{background:#b9c9c1;border-color:#9fb0a7;box-shadow:0 4px 0 #9fb0a7;color:#f4f4f4}
.btn.accent{background:var(--accent);border-color:#d98300;color:#fff;box-shadow:0 4px 0 #d98300}
.btn.big{width:100%;font-size:20px;padding:14px}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:13.5px}

/* game */
.gbar{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.gbar .x{width:38px;height:38px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:900;color:var(--muted)}
.progress{flex:1;height:16px;border-radius:999px;background:#eadfc9;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#7ddf9d);border-radius:999px;transition:width .35s}
.combo{font-weight:800;min-width:62px;text-align:right}
.qcard{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:20px 18px;box-shadow:0 5px 0 var(--line)}
.qcard.enter{animation:pop .28s ease-out}
.qcard.shake{animation:shake .4s}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.qtype{display:inline-flex;gap:6px;align-items:center;background:var(--blue-soft);color:#2d6fd6;border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px}
.qtopic{color:var(--muted);font-weight:700;font-size:14px;margin-left:8px}
.qlabel{margin:12px 0 6px;color:var(--muted);font-weight:700}
.clue{font-size:22px;font-weight:700;line-height:1.35;margin:6px 0 14px;font-family:var(--font-h)}
.bigword{font-family:var(--font-h);font-weight:800;font-size:40px;line-height:1.1;margin:8px 0 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;word-break:break-word}
.bigword.vi{font-size:32px;color:var(--primary-d)}
.icon-btn{width:46px;height:46px;border-radius:50%;background:var(--blue-soft);border:3px solid #b9d3ff;font-size:22px;flex:none;display:inline-grid;place-items:center}
.icon-btn.lg{width:84px;height:84px;font-size:38px;background:var(--blue);border-color:#2f78e0;box-shadow:0 5px 0 #2f78e0}
.icon-btn.lg:active{transform:translateY(3px);box-shadow:0 2px 0 #2f78e0}
.listen-row{display:flex;align-items:center;gap:14px;margin:12px 0 10px}
.pattern{font-family:ui-monospace,Consolas,monospace;font-size:24px;letter-spacing:2px;font-weight:700;margin:6px 0 12px;color:var(--primary-d);word-break:break-word}
.hintbox{background:var(--accent-soft);border:2px dashed #f2c46c;border-radius:14px;padding:8px 12px;margin:8px 0 12px;font-weight:700}
.hintbox:empty{display:none}
.hintbox div+div{margin-top:3px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}.bigword{font-size:34px}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:800;font-size:18px;min-height:56px;transition:transform .1s,border-color .1s}
.opt b{width:26px;height:26px;border-radius:8px;background:#f3ecdc;display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{background:var(--primary-soft);border-color:var(--primary)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.dim{opacity:.55}

.ans{width:100%;font:inherit;font-size:24px;font-weight:800;padding:12px 14px;border-radius:16px;border:3px solid var(--line);outline:none;margin-bottom:12px;background:#fff;color:var(--ink)}
.ans:focus{border-color:var(--blue)}
.ans.ok{border-color:var(--primary);background:var(--primary-soft)}
.ans.no{border-color:var(--bad);background:var(--bad-soft)}

.slotwrap{position:relative;margin:8px 0 14px}
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot{width:40px;height:50px;border-radius:12px;border:3px solid var(--line);background:#fff;display:inline-grid;place-items:center;font-family:var(--font-h);font-weight:800;font-size:26px;padding:0}
.slot.fixed{background:#f6efe0;border-color:#e6d9bb}
.slot.blank{border-color:#a9c9ff;background:var(--blue-soft)}
.slot.cur{border-color:var(--blue);box-shadow:0 0 0 3px #cfe0ff}
.slot.filled{background:#fff;border-color:var(--blue)}
.slot.ok{background:var(--primary-soft);border-color:var(--primary)}
.slot.no{background:var(--bad-soft);border-color:var(--bad)}
.gap{width:16px}
.hid{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;background:transparent;color:transparent;caret-color:transparent}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tile{width:46px;height:52px;border-radius:12px;background:var(--accent);border:3px solid #d98300;color:#fff;font-family:var(--font-h);font-weight:800;font-size:26px;box-shadow:0 4px 0 #d98300;display:grid;place-items:center}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #d98300}
.tile.used{opacity:.2;box-shadow:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.actions .grow{flex:1}

.fb{margin-top:16px;border-radius:20px;padding:14px 16px;border:3px solid}
.fb.good{background:var(--primary-soft);border-color:var(--primary)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{font-size:22px;margin-bottom:6px}
.fb .fw{font-family:var(--font-h);font-size:30px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb .fw .icon-btn{width:38px;height:38px;font-size:18px}
.fb .fv{font-weight:800;color:var(--primary-d)}
.fb .fd{color:#4a4d63;margin:2px 0 10px}
.fb .you{font-size:14px;margin-bottom:4px}

/* result */
.result{text-align:center}
.result .stars{font-size:54px;letter-spacing:6px;margin:6px 0}
.result .stars .off{filter:grayscale(1);opacity:.3}
.result h1{font-size:32px}
.result .big{font-family:var(--font-h);font-weight:800;font-size:44px;color:var(--primary-d)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.rgrid div{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px}
.rgrid b{display:block;font-family:var(--font-h);font-size:26px}
.rgrid span{color:var(--muted);font-size:13.5px;font-weight:700}
.wlist{text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:6px 14px;margin:14px 0}
.wlist .wr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1e9d8}
.wlist .wr:last-child{border:0}
.wr .e{font-weight:800}
.wr .v{color:var(--muted);text-align:right}
.rbtns{display:grid;gap:10px;margin-top:10px}
.confetti{position:fixed;top:-40px;z-index:50;font-size:26px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* tabs + mini games */
.tabs{display:flex;gap:8px;margin:24px 0 4px}
.tabs button{flex:1;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 8px;font-weight:800;font-size:17px}
.tabs button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-d);box-shadow:0 4px 0 var(--primary)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.gcard{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--line);transition:transform .12s;width:100%}
.gcard:hover{transform:translateY(-2px)}
.gcard .gi{font-size:34px;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--g);flex:none}
.gcard b{font-family:var(--font-h);font-size:19px}
.gcard .vi{color:var(--muted);font-size:14px}
.gtitle{flex:1;font-family:var(--font-h);font-weight:800;font-size:20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#2b2d42;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{min-height:96px;border-radius:16px;border:3px solid #9fd8bf;background:var(--primary-soft);display:grid;place-items:center;padding:6px;font-weight:800;font-size:15px;line-height:1.2;word-break:break-word;color:var(--ink);text-align:center;transition:transform .15s}
.mcard:active:not(:disabled){transform:scale(.96)}
.mcard .q{font-size:30px}
.mcard.up{background:#fff;border-color:var(--blue)}
.mcard.up.vi{background:var(--accent-soft);border-color:var(--accent)}
.mcard.done{background:var(--primary);border-color:var(--primary-d);color:#fff}
.mcard.done.vi{background:#43c9a1}
@media (max-width:420px){.mcard{min-height:84px;font-size:13px}}
.wgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:520px;margin:0 auto 14px;user-select:none}
.wgrid.shake{animation:shake .4s}
.wcell{aspect-ratio:1;border-radius:8px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:clamp(13px,4vw,22px);display:grid;place-items:center;padding:0;color:var(--ink)}
.wcell.start{background:var(--blue);border-color:#2f78e0;color:#fff}
.wcell.found{border-color:rgba(0,0,0,.15)}
.wcell.hint{animation:pulse .6s infinite alternate;border-color:var(--accent)}
@keyframes pulse{to{transform:scale(1.15);background:var(--accent-soft)}}
.wclues{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:520px){.wclues{grid-template-columns:1fr}}
.wclue{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:700}
.wclue.done{background:var(--primary-soft);border-color:var(--primary)}
.wclue .pat{font-family:ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:1px;font-size:13px;margin-left:6px}
.wclue .vi{color:var(--muted);font-weight:600}
.plant{font-size:76px;text-align:center;line-height:1;margin:4px 0}
.hearts{text-align:center;font-size:22px;letter-spacing:2px;margin-bottom:6px}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.key{width:40px;height:46px;border-radius:12px;background:#fff;border:3px solid var(--line);font-weight:800;font-size:19px;text-transform:uppercase;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.key.good{background:var(--primary-soft);border-color:var(--primary)}
.key.bad{background:var(--bad-soft);border-color:var(--bad);opacity:.6}
.slots.center{justify-content:center;margin:10px 0}
.slot.lost{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sky{position:relative;height:min(58vh,420px);min-height:320px;border-radius:24px;overflow:hidden;background:linear-gradient(#bfe4ff,#eaf7ff);border:3px solid #b9d3ff;margin-top:10px}
.balloon{position:absolute;bottom:-120px;width:23%;aspect-ratio:.82;border-radius:50% 50% 46% 46%;background:var(--bc);border:0;color:#fff;font-weight:800;font-size:clamp(11px,3.3vw,17px);display:grid;place-items:center;padding:8px;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:inset -8px -10px 0 rgba(0,0,0,.1);animation:rise linear both;word-break:break-word;line-height:1.1}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(var(--h) * -1 - 160px))}}
.balloon.freeze{animation-play-state:paused}
.balloon.dim{opacity:.3}
.balloon.right{box-shadow:0 0 0 5px var(--primary),inset -8px -10px 0 rgba(0,0,0,.1)}
.balloon.wrong{box-shadow:0 0 0 5px var(--bad),inset -8px -10px 0 rgba(0,0,0,.1);opacity:.6}
.banner{min-height:48px;margin-top:10px;border-radius:14px;padding:10px 12px;font-weight:700;text-align:center;opacity:0}
.banner.show{opacity:1}
.banner.good{background:var(--primary-soft)}
.banner.bad{background:var(--bad-soft)}
.timebar{height:14px;border-radius:999px;background:#eadfc9;overflow:hidden;margin-bottom:12px}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#ffd166);transition:width 1s linear}
.timebar.low i{background:var(--bad)}
.bbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.bbtns .btn{font-size:22px;padding:18px}
.btn.no-btn{background:var(--bad);border-color:#c2284f;color:#fff;box-shadow:0 4px 0 #c2284f}
.qcard.flashok{animation:okflash .35s}
.qcard.flashbad{animation:badflash .35s}
@keyframes okflash{from{background:var(--primary-soft)}to{background:#fff}}
@keyframes badflash{from{background:var(--bad-soft)}to{background:#fff}}
/* v2: số câu, thanh điều hướng, tạm dừng, từ sai, flashcard */
.small{font-size:13.5px}.muted{color:var(--muted)}
.red{color:var(--bad);font-weight:900;background:#fff1c7;padding:0 6px;border-radius:6px}
.nums{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.num{min-width:28px;height:28px;border-radius:9px;display:inline-grid;place-items:center;font-size:13px;font-weight:800;background:#f0e8d6;color:var(--muted);border:2px solid transparent;padding:0 4px}
.num.ok{background:var(--primary);color:#fff}
.num.bad{background:var(--bad);color:#fff}
.num.skip{background:#ffd166;color:#7a5a00}
.num.cur{border-color:var(--blue);box-shadow:0 0 0 3px #cfe0ff;background:#fff;color:var(--blue)}
.qcount{font-weight:800;margin:0 0 8px;color:var(--muted)}
.qcount b{color:var(--ink)}
.qcount .tag{background:var(--accent-soft);color:#b06a00;border-radius:999px;padding:2px 10px;margin-left:6px;font-size:13px}
.qnav{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 75%,transparent);z-index:5}
.qnav .inner{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qnav .btn{padding:10px 4px;font-size:15px;border-radius:14px;gap:4px;white-space:nowrap}
.qnav .btn:disabled{opacity:.45}
@media (max-width:380px){.qnav .btn{font-size:13px;padding:10px 2px}}
.overlay{position:fixed;inset:0;background:rgba(43,45,66,.72);z-index:80;display:grid;place-items:center;padding:20px}
.overlay .box{background:#fff;border-radius:26px;padding:26px 22px;max-width:380px;width:100%;text-align:center}
.overlay .pz{font-size:56px}
.overlay h2{font-size:28px;margin:6px 0}
.overlay p{color:var(--muted);margin:0 0 16px}
.is-paused .balloon{animation-play-state:paused!important}
.fb .why{background:rgba(255,255,255,.7);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15.5px}
.fb .why div+div{margin-top:3px}
.rtopic{margin-bottom:6px}
.rt-h{font-family:var(--font-h);font-weight:800;margin:10px 0 2px;color:var(--primary-d)}

.fc-en{font-family:var(--font-h);font-weight:800;font-size:20px;line-height:1.2}

.fcard.flip{background:var(--primary-soft);border-color:var(--primary);box-shadow:0 6px 0 var(--primary)}
.fcard-w{font-family:var(--font-h);font-weight:800;font-size:42px;line-height:1.1;word-break:break-word}
.fcard-w.vi{font-size:34px;color:var(--primary-d)}
.fcard .tip{color:var(--muted);font-size:14px;margin-top:10px}
/* ===== v3: giao diện pastel nhẹ nhàng ===== */
body{background-color:#fbf7ff;background-image:radial-gradient(60% 38% at 6% 0%,#ffe6ef 0,transparent 70%),radial-gradient(55% 40% at 100% 6%,#dcefff 0,transparent 70%),radial-gradient(70% 45% at 50% 100%,#e4f8ec 0,transparent 70%);background-attachment:fixed}
.btn{border-color:var(--line);box-shadow:0 3px 0 #efe7f7;color:var(--ink)}
.btn.primary{background:var(--primary);border-color:var(--primary-b);color:#1d4d3e;box-shadow:0 4px 0 var(--primary-b)}
.btn.primary:active:not(:disabled){box-shadow:0 2px 0 var(--primary-b)}

.btn.accent{background:#ffd7b5;border-color:#f5bf93;color:#6b3d12;box-shadow:0 4px 0 #f5bf93}
.btn.no-btn{background:#ffd0da;border-color:#f7aabb;color:#7a2438;box-shadow:0 4px 0 #f7aabb}
.hero{background:linear-gradient(135deg,#d8f5e7 0%,#dcebff 55%,#eadfff 100%);color:var(--ink);box-shadow:0 6px 0 #d3dcf0;border:3px solid #fff}
.hero h1{color:#2f6f5d}
.hero .stats{color:#4b5578}
.pill{border-color:#efe7f7;background:#fff}
.link{color:#5a86d8}
.logo{color:#2f7f68}
.logo-img{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 2px 0 #efe7f7;flex:none}
.logo{white-space:nowrap;min-width:0}

.topic.on .chk{background:color-mix(in srgb,var(--c) 70%,#fff);border-color:color-mix(in srgb,var(--c) 70%,#fff)}
.topic .bar{background:#f3ecf8}
.topic .bar .seen{background:color-mix(in srgb,var(--c) 30%,#fff)}
.topic .bar .mas{background:color-mix(in srgb,var(--c) 75%,#fff)}
.seg button.on,.chip.on{border-color:var(--primary-b);background:var(--primary-soft);color:var(--primary-d)}

.progress{background:#eee6f7}
.progress i{background:linear-gradient(90deg,#a6e6cf,#bfe3ff)}
.qcard{border-color:#efe7f7;box-shadow:0 6px 0 #f1eaf8}
.qtype{background:var(--blue-soft);color:#4a76c9}
.opt{border-color:#efe7f7}
.opt b{background:#f3ecf8}
.opt.right{background:var(--primary-soft);border-color:var(--primary-b)}
.opt.wrong{background:var(--bad-soft);border-color:#ff9fb3}
.fb.good{background:var(--primary-soft);border-color:var(--primary-b)}
.fb.bad{background:var(--bad-soft);border-color:#ff9fb3}
.fb .fv{color:var(--primary-d)}
.icon-btn{background:var(--blue-soft);border-color:#cfe0fb}
.icon-btn.lg{background:#cfe2ff;border-color:#a9c9fb;box-shadow:0 5px 0 #a9c9fb;color:#3a5fa0}
.icon-btn.lg:active{box-shadow:0 2px 0 #a9c9fb}
.tile{background:#ffd9b8;border-color:#f6bd90;color:#6b3d12;box-shadow:0 4px 0 #f6bd90}

.slot.no{background:var(--bad-soft);border-color:#ff9fb3}
.mcard{border-color:#cdeee0;background:#effaf5}
.mcard.up{background:#fff;border-color:#9cc7ff}
.mcard.up.vi{background:var(--accent-soft);border-color:#f5bf93}
.mcard.done{background:#c4f0de;border-color:var(--primary-b);color:#1d4d3e}

.wcell{border-color:#efe7f7}

.sky{background:linear-gradient(#d9ecff,#f4faff);border-color:#cfe0fb}
.num{background:#f1eaf8}

.num.bad{background:#ffc2cf;color:#8a2b43}

.key.bad{background:var(--bad-soft);border-color:#ff9fb3}

.overlay{background:rgba(88,84,128,.38);backdrop-filter:blur(3px)}

.wlist{border-color:#efe7f7}

.result .big{color:#2f7f68}

/* ô từ vựng trong phần ôn tập */
.fc-h{display:inline-flex;align-items:center;gap:8px;margin:20px 0 10px;padding:6px 16px;border-radius:999px;font-size:19px;background:color-mix(in srgb,var(--c) 18%,#fff);color:var(--ink);border:2px solid color-mix(in srgb,var(--c) 28%,#fff)}
.fc-h small{font-family:var(--font);font-weight:700;color:var(--muted);font-size:13.5px}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (max-width:440px){.fc-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.fc-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:138px;padding:22px 10px 16px;border-radius:24px;background:color-mix(in srgb,var(--c) 13%,#fff);border:3px solid color-mix(in srgb,var(--c) 26%,#fff);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 22%,#fff);transition:transform .12s;width:100%}
.fc-tile:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 22%,#fff)}
.fc-tile .snd{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.fc-tile .en{font-family:var(--font-h);font-weight:800;font-size:23px;line-height:1.1;word-break:break-word;margin-top:4px}
.fc-tile .meaning{font-weight:700;font-size:15.5px;line-height:1.25;color:#566083}
.fc-tile.speaking{animation:pop .3s}
.hidevi .fc-tile:not(.show) .meaning{filter:blur(8px);user-select:none}
/* trang bìa */
.on-cover .app{padding-bottom:18px}
.cover{position:relative;min-height:calc(100vh - 34px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 6px 22px;overflow:hidden}
.cover .deco{position:absolute;font-size:30px;opacity:.85;animation:floaty 6s ease-in-out infinite;pointer-events:none;user-select:none}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
.cover .brand{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid #efe7f7;border-radius:999px;padding:5px 16px;font-weight:800;color:#2f7f68;box-shadow:0 3px 0 #efe7f7;position:relative}
.cover .stage{position:relative;margin:22px 0 4px}
.cover .mascot{width:min(46vw,200px);aspect-ratio:1;border-radius:50%;background:#fff;border:7px solid #fff;box-shadow:0 8px 0 #e7ddf5,0 22px 44px rgba(150,130,200,.28);overflow:hidden;display:grid;place-items:center;font-size:90px}
.cover .mascot img{width:100%;height:100%;object-fit:cover;display:block}
.cover .rocket{position:absolute;right:-62px;top:-20px;width:96px;animation:floaty 5s ease-in-out infinite}
@media (max-width:420px){.cover .rocket{right:-44px;width:76px}}
.cover h1{font-size:clamp(46px,12vw,72px);line-height:.95;margin:18px 0 8px;letter-spacing:-.5px}
.cover h1 .a{color:#ef7aa3}
.cover h1 .b{color:#4fb596;display:block}
.cover .sub{color:#5b6285;font-weight:700;max-width:420px;margin:0 auto 14px;font-size:17px}
.cover .facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 22px;max-width:520px}
.cover .fact{background:#fff;border:2px solid #efe7f7;border-radius:999px;padding:5px 14px;font-weight:800;font-size:14.5px;color:#566083}
.cover .fact:nth-child(1){background:#fff0f4}
.cover .fact:nth-child(2){background:#eefaf4}
.cover .fact:nth-child(3){background:#eef5ff}
.cover .fact:nth-child(4){background:#fff7e6}
.cover .go{width:min(100%,340px);font-size:22px;padding:16px}
.cover .go2{display:flex;gap:10px;margin-top:12px;width:min(100%,340px)}
.cover .go2 .btn{flex:1;padding:11px 6px;font-size:16px}
.cover .prog{width:min(100%,340px);margin-top:18px;font-weight:800;color:#566083;font-size:14px}
.cover .prog .progress{height:12px;margin-top:6px}
@media (prefers-reduced-motion:reduce){*:not(.balloon){animation:none!important;transition:none!important}}
/* ---- bổ sung: nút Chưa thuộc, Practice chủ đề này, hộp thông tin ---- */
.fc-item{position:relative;display:flex;flex-direction:column;gap:7px}
.fc-flag{border:2px solid #f3c6d2;background:#fff;color:#a8566e;border-radius:999px;padding:6px 8px;font-weight:800;font-size:13.5px;line-height:1.1}
.fc-flag:active{transform:translateY(2px)}
.fc-flag.on{background:#ff8fa5;border-color:#e86a86;color:#fff}
.fc-flag.wide{padding:11px 22px;font-size:16px;margin-top:12px}
.fc-item.unk .fc-tile{border-color:#ff8fa5}
.fc-hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.fc-hrow .fc-h{margin:14px 0 8px}
.fc-hrow .btn{padding:8px 14px;font-size:14.5px;border-radius:14px}
.infobox{background:#e9f2ff;border:3px solid #cfe2ff;border-radius:16px;padding:10px 14px;font-weight:700}
/* ===================== STARTERS: bảng màu hồng–xanh trời, xinh hơn ===================== */
:root{--primary:#ffc7dc;--primary-d:#c4487c;--primary-b:#ff9fc4;--primary-soft:#fff0f6;--accent:#ffe29a;--accent-soft:#fff8e3;--blue:#8fd0ff;--blue-soft:#e8f5ff}
body{background-image:radial-gradient(60% 38% at 6% 0%,#ffe0ee 0,transparent 70%),radial-gradient(55% 40% at 100% 6%,#d6efff 0,transparent 70%),radial-gradient(70% 45% at 50% 100%,#fff3c9 0,transparent 70%)}
.logo{color:#c4487c}
.btn.primary{background:var(--primary);border-color:var(--primary-b);color:#7a1f48;box-shadow:0 4px 0 var(--primary-b)}
.btn.primary:active:not(:disabled){box-shadow:0 2px 0 var(--primary-b)}
.btn.primary:disabled{background:#f1e6ec;border-color:#e3d3dc;color:#b9a5b0;box-shadow:0 4px 0 #e3d3dc}
.hero{background:linear-gradient(135deg,#ffe3ee 0%,#e1f2ff 55%,#fff1c4 100%)}
.hero h1{color:#c4487c}
.progress i{background:linear-gradient(90deg,#ffb3d0,#a9dcff)}
.result .big,.rt-h{color:#c4487c}
.seg button.on,.chip.on{border-color:var(--primary-b);background:var(--primary-soft);color:var(--primary-d)}
.tabs button.on{border-color:var(--primary-b);background:var(--primary-soft);color:var(--primary-d);box-shadow:0 4px 0 var(--primary-b)}
.opt.right,.fb.good{background:var(--primary-soft);border-color:var(--primary-b)}
.slot.ok{background:var(--primary-soft);border-color:var(--primary-b)}
.cover h1 .a{color:#ff7fb0}.cover h1 .b{color:#4fb4e8}
.cover .brand{color:#c4487c}
.ptag{display:inline-block;font-family:var(--font);font-size:.42em;font-weight:800;color:#8a6a85;background:#f6ecf5;border-radius:999px;padding:2px 9px;vertical-align:middle;margin-left:6px;white-space:nowrap;letter-spacing:0}

/* ---------- thẻ unit trên trang chủ ---------- */
.topic{padding:0;display:flex;flex-direction:column}
.topic .tmain{display:block;width:100%;text-align:left;padding:12px 12px 6px 14px;border-radius:calc(var(--radius) - 3px)}
.topic .tmain .nm{padding-right:30px}
.topic .un{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.5px;color:color-mix(in srgb,var(--c) 85%,#000);background:color-mix(in srgb,var(--c) 16%,#fff);border-radius:999px;padding:1px 9px;margin-bottom:2px}
.topic .ic.thumb{padding:3px;background:#fff;border:2px solid color-mix(in srgb,var(--c) 30%,#fff)}
.topic .ic.thumb img{width:100%;height:100%;object-fit:contain}
.topic .tacts{display:flex;gap:6px;padding:0 10px 10px}
.topic .tacts button{flex:1;border:2px solid color-mix(in srgb,var(--c) 30%,#fff);background:color-mix(in srgb,var(--c) 9%,#fff);border-radius:12px;padding:6px 4px;font-weight:800;font-size:13.5px;color:color-mix(in srgb,var(--c) 70%,#222)}
.topic .tacts button:active{transform:translateY(2px)}
.topic .tmain .bar{margin-top:8px}

/* ---------- ảnh trong câu hỏi ---------- */
.qpic{display:grid;place-items:center;margin:4px 0 6px}
.qpic img{width:min(52vw,190px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 5px rgba(150,100,150,.14))}
.qpic.sm img{width:min(34vw,110px)}
.fbrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fbpic{width:84px;height:84px;object-fit:contain;flex:none}
.picopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px auto 0;max-width:430px}
.picopt{position:relative;display:grid;place-items:center;aspect-ratio:1;background:#fff;border:3px solid #efe7f7;border-radius:22px;padding:8px;transition:transform .1s,border-color .1s;box-shadow:0 4px 0 #f1eaf8}
.picopt:hover:not(:disabled){border-color:var(--blue)}
.picopt:active:not(:disabled){transform:translateY(2px)}
.picopt img{width:92%;height:92%;object-fit:contain}
.picopt b{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:8px;background:#f3ecf8;display:grid;place-items:center;font-size:13px;color:var(--muted)}
.picopt .cap{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-weight:800;font-size:16px;background:rgba(255,255,255,.85);border-radius:10px;margin:0 8px;padding:1px 4px}
.picopt.right{background:var(--primary-soft);border-color:var(--primary-b)}
.picopt.wrong{background:var(--bad-soft);border-color:#ff9fb3}
.picopt.dim{opacity:.55}

/* ---------- nối cặp ---------- */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:8px}
.mcol{display:grid;gap:10px;align-content:start}
.mbtn{min-height:76px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;background:#fff;border:3px solid #efe7f7;border-radius:18px;padding:6px 8px;font-weight:800;font-size:19px;line-height:1.2;transition:transform .1s;box-shadow:0 4px 0 #f1eaf8;word-break:break-word}
.mbtn img{width:64px;height:64px;object-fit:contain}
.mbtn:active:not(:disabled){transform:translateY(2px)}
.mbtn.sel{border-color:#8fb8f5;background:var(--blue-soft);box-shadow:0 0 0 3px #e0ecff}
.mbtn.done{background:var(--primary-soft);border-color:var(--primary-b);opacity:.8}
.mbtn.bad{animation:shake .4s;border-color:#ff9fb3;background:var(--bad-soft)}

/* ---------- flashcard: thẻ lật có ảnh (giống Flip Tiles) ---------- */
.ft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media (max-width:440px){.ft-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.ft-item{display:flex;flex-direction:column;gap:6px}
.ft{position:relative;height:212px;perspective:1000px;cursor:pointer;border-radius:22px;user-select:none;width:100%;display:block}
.ft-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.72,.2,1)}
.ft.flipped .ft-in{transform:rotateY(180deg)}
.ft-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;overflow:hidden;border:3px solid #fff;outline:3px solid color-mix(in srgb,var(--c) 42%,#fff);box-shadow:0 8px 18px rgba(120,100,160,.14)}
.ft-front{background:linear-gradient(160deg,#fff,color-mix(in srgb,var(--c) 10%,#fff) 70%,color-mix(in srgb,var(--c) 20%,#fff));display:grid;place-items:center;padding:10px 10px 22px}
.ft-front img{width:94%;height:100%;max-height:168px;object-fit:contain;filter:drop-shadow(0 6px 4px rgba(80,60,110,.1))}
.ft-front .wtxt{font-family:var(--font-h);font-weight:800;font-size:26px;text-align:center;line-height:1.1;word-break:break-word}
.ft-front .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;font-weight:900;letter-spacing:.5px;color:color-mix(in srgb,var(--c) 50%,#888)}
.ft-back{transform:rotateY(180deg);display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;padding:12px;background:radial-gradient(circle at 18px 18px,rgba(255,255,255,.55) 0 3px,transparent 4px) 0 0/36px 36px,linear-gradient(150deg,color-mix(in srgb,var(--c) 88%,#fff),color-mix(in srgb,var(--c) 62%,#ff9cc4))}
.ft-back .w{font-family:var(--font-h);font-weight:800;font-size:clamp(23px,5vw,30px);line-height:1.05;color:#fff;text-shadow:0 3px 0 rgba(70,50,100,.18);word-break:break-word}
.ft-back .w .ptag{color:#8a4a70;background:rgba(255,255,255,.88);text-shadow:none}
.ft-back .mean{font-weight:800;font-size:16px;line-height:1.25;color:#fff;text-shadow:0 2px 0 rgba(70,50,100,.18);background:rgba(255,255,255,.2);border-radius:12px;padding:3px 10px}
.hidevi .ft-back .mean{display:none}

function roulette(items, wf){
  const ws = items.map(wf); let r = Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<items.length;i++){ r -= ws[i]; if(r<=0) return items[i]; }

}

}
function tone(seq){
  if(!store.sound) return;
  try{
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    actx = actx || new C(); if(actx.state==='suspended') actx.resume();
    let t = actx.currentTime;
    seq.forEach(([f,d])=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.03); t += d*.85;
    });
  }catch(e){}
}

/* ---------- Chọn từ cho một lượt ---------- */
const BOXW = [10,7,4,2.5,1.5,1];
function pickWords(pool, n){
  const sNo = store.sessions;
  const arr = shuffle(pool.slice());
  const byOld = (a,b)=>getP(a.id).last - getP(b.id).last;
  // 0) Từ em bấm "Chưa thuộc": được ưu tiên trước (tối đa ~40% lượt)
  const chosen = arr.filter(w=>getP(w.id).unk).sort(byOld).slice(0, Math.ceil(n*0.4));
  // 1) Đến nửa lượt: những từ lâu chưa gặp / chưa từng gặp -> luyện hết mọi từ theo vòng
  arr.filter(w=>chosen.indexOf(w)<0).sort(byOld).slice(0, Math.max(0, Math.ceil(n/2) - chosen.length)).forEach(w=>chosen.push(w));
  let rest = arr.filter(w=>chosen.indexOf(w)<0);
  // 2) Phần còn lại: ưu tiên từ yếu
  while(chosen.length<n && rest.length){
    const w = roulette(rest, w=>{
      const p = getP(w.id), age = Math.min(sNo-p.last, 6);
      return BOXW[p.box]*(1+.5*age)*((p.seen && !p.lastOk)?1.5:1)*(p.seen?1:1.5)*(p.unk?2:1);
    });
    chosen.push(w); rest = rest.filter(x=>x!==w);
  }
  return shuffle(chosen);
}

/* Số từ mỗi lượt: tick 1 unit = 100% số từ · 2 unit = 80% · 3 unit = 70%. Từ 4 unit trở lên: theo số từ chọn (10 / 20 / 30). */
const RATIO_RULE = {1:1, 2:0.8, 3:0.7};
function sessionCount(sel, pool){
  const r = RATIO_RULE[sel.length];
  if(r) return Math.max(1, Math.min(pool.length, Math.round(pool.length*r)));
  return Math.min(store.size, pool.length);
}

const TW = {lw:[5,4,3,2,1,1], lp:[5,4,3,2,2,2], en2vi:[4,4,3,2,1,1], vi2en:[3,3,3,3,3,3], missing:[3,4,4,4,4,4], scramble:[2,3,4,4,4,4], type:[1,2,3,4,5,5], listen:[1,2,3,4,5,5], match:[3,3,3,2,2,2]};
function distinctTexts(pool){ return new Set(pool.map(w=>w.w.toLowerCase())).size; }
function typeOk(t, w){
  if(t==='scramble') return !/\s/.test(w.w) && norm(w.w).length>=3 && norm(w.w).length<=12;
  if(t==='lp') return !!w.img && WITH_IMG.length>=4;
  if(t==='match') return !!(S && S.matchOk);
  return true;
}
function pickType(w, enabled, prev, avoid){
  const p = getP(w.id);
  const ok = enabled.filter(t=>typeOk(t,w));
  const base = ok.length ? ok : ['en2vi'];
  let o = base.filter(t=>t!==p.lastType && t!==prev && t!==avoid);
  if(!o.length) o = base.filter(t=>t!==avoid);
  if(!o.length) o = base;
  return roulette(o, t=>TW[t][p.box]);
}
function mkOpts(w, kind, pool){
  const key = kind==='en' ? 'w' : 'vi';
  const used = new Set([w[key].toLowerCase()]); if(kind==='en') used.add(w.w.toLowerCase());
  const out = [];
  const near = WORDS.filter(x=>x!==w && x.topics.some(t=>w.topics.indexOf(t)>=0));
  [near, pool, WORDS].forEach(src=>{
    shuffle(src.slice()).forEach(x=>{
      if(out.length>=3) return;
      const v = x[key], k = v.toLowerCase();
      if(x.vi===w.vi) return;   // cùng nghĩa tiếng Việt: không dùng làm đáp án nhiễu
      if(!used.has(k)){ used.add(k); out.push(v); }
    });
  });
  out.push(w[key]);
  return shuffle(out);
}
// 4 hình để chọn (1 đúng + 3 nhiễu có ảnh)
function mkPicOpts(w, pool){
  const used = new Set([w.w.toLowerCase()]), out = [];
  const near = WITH_IMG.filter(x=>x!==w && x.topics.some(t=>w.topics.indexOf(t)>=0));
  [near, pool.filter(x=>x.img), WITH_IMG].forEach(src=>{
    shuffle(src.slice()).forEach(x=>{
      if(out.length>=3 || x===w) return;
      const k = x.w.toLowerCase();
      if(used.has(k) || x.vi===w.vi) return;
      used.add(k); out.push(x);
    });
  });
  out.push(w);
  return shuffle(out);
}

  const words = review ? shuffle(pool.slice()) : pickWords(pool, n);
  S = {
    n, review, pool, scope, topicOnly: opts.topic||null, types: store.types.filter(typeSupported),
    matchOk: distinctTexts(pool.length>=4 ? pool : WORDS)>=4,
    queue: words.map(w=>({w, attempt:1, avoid:''})),
    idx:0, done:0, score:0, streak:0, best:0, results:{}, prevType:'', startedPoolSize: pool.length,
    order: words.map(w=>w.id), status:{}, hist:[], hv:-1, live:null
  };
  save();
  prepareQ(); renderQ(true);
}

/* ---------- Tạm dừng ---------- */
function pauseGame(){
  if(paused || (!S && !G)) return;
  paused = true; pauseAt = Date.now();
  try{ if(TTS_OK) speechSynthesis.cancel(); }catch(e){}
  document.body.classList.add('is-paused');
  const o = document.createElement('div'); o.id = 'pause'; o.className = 'overlay';
  o.innerHTML = '<div class="box"><div class="pz">⏸</div><h2>Tạm dừng</h2><p>Nghỉ một chút nhé! Bấm tiếp tục khi em sẵn sàng.</p><button class="btn primary big" data-act="resume">▶ Tiếp tục</button><button class="btn big" data-act="pausehome" style="margin-top:10px">🏠 Về trang chủ</button></div>';
  document.body.appendChild(o);
}
function resumeGame(){
  if(!paused) return;
  const dt = Date.now()-pauseAt; paused = false;
  document.body.classList.remove('is-paused');
  const o = $('#pause'); if(o) o.remove();
  if(G && G.t0) G.t0 += dt;
}

function missingPlan(w, box){
  const pos = []; [...w.w].forEach((c,i)=>{ if(isLetter(c)) pos.push(i); });
  const len = pos.length;
  let k = Math.max(1, Math.round(len*.4)) + (box>=4?1:0);
  k = Math.min(k, len-1);
  const cand = pos.slice(1);
  return shuffle(cand.slice()).slice(0,Math.max(1,k)).sort((a,b)=>a-b);
}

// Dựng bài "Nối cặp": từ đang hỏi + 3 từ khác; một bên là từ tiếng Anh, bên kia là hình (hoặc nghĩa tiếng Việt)
function setupMatch(){
  const w = q.w, pool = S.pool.length>=4 ? S.pool : WORDS;
  const ok = x=>x!==w && x.w.toLowerCase()!==w.w.toLowerCase() && x.vi!==w.vi;
  const near = pool.filter(x=>ok(x) && x.topics.some(t=>w.topics.indexOf(t)>=0));
  let cands = [];
  [near, pool.filter(ok), WORDS.filter(ok)].forEach(src=>{ shuffle(src.slice()).forEach(x=>{ if(cands.indexOf(x)<0) cands.push(x); }); });
  if(w.img) cands = cands.filter(x=>x.img).concat(cands.filter(x=>!x.img));
  const seen = new Set([w.w.toLowerCase()]), pick = [];
  cands.forEach(x=>{ const k = x.w.toLowerCase(); if(pick.length<3 && !seen.has(k)){ seen.add(k); pick.push(x); } });
  if(pick.length<3) return false;
  q.items = [w].concat(pick);
  q.useImg = q.items.every(x=>x.img);
  q.left = shuffle(q.items.slice()); q.right = shuffle(q.items.slice());
  q.sel = -1; q.done = new Set(); q.wrong = 0; q.flash = null; q.mode = 'match';
  return true;
}

function prepareQ(){
  const item = S.queue[S.idx], w = item.w, p = getP(w.id);
  const type = pickType(w, S.types, S.prevType, item.avoid);
  S.prevType = type;
  const easy = item.attempt>1 || p.box<3;
  q = {item, w, type, answered:false, correct:null, hints:0, value:'', picked:-1, given:''};
  S.live = q;
  if(type==='en2vi'){
    q.mode = 'mc'; q.opts = mkOpts(w,'vi',S.pool); q.correctVal = w.vi;
  } else if(type==='lw'){
    q.mode = 'mc'; q.opts = mkOpts(w,'en',S.pool); q.correctVal = w.w;
  } else if(type==='lp'){
    q.mode = 'pic'; q.opts = mkPicOpts(w,S.pool);
  } else if(type==='vi2en'){
    q.mode = easy ? 'mc' : 'typed';
    if(easy){ q.opts = mkOpts(w,'en',S.pool); q.correctVal = w.w; }
  } else if(type==='type' || type==='listen'){
    q.mode = 'typed';
  } else if(type==='missing'){
    q.mode = 'missing'; q.blanks = missingPlan(w, p.box); q.typedL = '';
  } else if(type==='match'){
    if(!setupMatch()){ q.type = 'en2vi'; q.mode = 'mc'; q.opts = mkOpts(w,'vi',S.pool); q.correctVal = w.vi; }
  } else {
    q.mode = 'scramble';
    const letters = [...w.w].filter(isLetter).map(c=>c.toLowerCase());
    q.tiles = letters.map((ch,i)=>({id:i,ch}));
    q.order = shuffle(q.tiles.slice());
    for(let t=0;t<12 && q.order.map(x=>x.ch).join('')===letters.join('');t++) shuffle(q.order);
    q.placed = [];
  }
}

/* ---------- Dựng giao diện câu hỏi ---------- */
function pattern(word, reveal){
  let seen = 0;
  return [...word].map(ch=>{
    if(isLetter(ch)){ seen++; return seen<=reveal ? ch : '_'; }
    return ch===' ' ? '  ' : ch;
  }).join(' ');
}
const spk = (text, slow) => `<button class="icon-btn" data-act="speak" data-t="${esc(text)}" ${slow?'data-slow="1"':''} aria-label="${slow?'Nghe chậm':'Nghe'}">${slow?'🐢':'🔊'}</button>`;
const qpic = (w, cls) => w.img ? `<div class="qpic${cls?' '+cls:''}">${imgTag(w)}</div>` : '';

function optsHtml(){
  return `<div class="opts">${q.opts.map((o,i)=>{
    let cls = 'opt';
    if(q.answered){ if(o===q.correctVal) cls += ' right'; else if(i===q.picked) cls += ' wrong'; else cls += ' dim'; }
    return `<button class="${cls}" data-act="opt" data-i="${i}" ${q.answered?'disabled':''}><b>${i+1}</b><span>${esc(o)}</span></button>`;
  }).join('')}</div>`;
}
function picOptsHtml(){
  return `<div class="picopts">${q.opts.map((o,i)=>{
    let cls = 'picopt';
    if(q.answered){ if(o===q.w) cls += ' right'; else if(i===q.picked) cls += ' wrong'; else cls += ' dim'; }
    return `<button class="${cls}" data-act="opt" data-i="${i}" ${q.answered?'disabled':''} aria-label="Hình ${i+1}"><b>${i+1}</b>${imgTag(o)}${q.answered?`<span class="cap">${esc(o.w)}</span>`:''}</button>`;
  }).join('')}</div>`;
}
function typedHtml(ph){
  const cls = q.answered ? (q.correct?' ok':' no') : '';
  return `<input id="ans" class="ans${cls}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ph}" value="${esc(q.value)}" ${q.answered?'disabled':''}>`;
}
function slotsHtml(){
  const w = q.w.w; let j = 0; let curDone = false;
  return [...w].map((c,i)=>{
    if(c===' ') return '<span class="gap"></span>';
    if(q.blanks.indexOf(i)<0) return `<span class="slot fixed">${esc(c)}</span>`;
    const ch = q.typedL[j] || ''; let cls = 'slot blank';
    if(q.answered){ cls = 'slot ' + (ch.toLowerCase()===c.toLowerCase() ? 'ok' : 'no'); }
    else if(ch) cls = 'slot filled';
    else if(!curDone){ cls += ' cur'; curDone = true; }
    j++;
    return `<span class="${cls}">${esc(q.answered && !ch ? c : ch)}</span>`;
  }).join('');
}
function scrambleHtml(){
  const n = q.tiles.length;
  const slots = Array.from({length:n}, (_,i)=>{
    const id = q.placed[i]; const ch = id!==undefined ? q.tiles[id].ch : '';
    let cls = 'slot' + (ch?' filled':'');
    if(q.answered) cls += q.correct ? ' ok' : ' no';
    return `<button class="${cls}" data-act="unplace" data-i="${i}" ${q.answered||!ch?'disabled':''}>${esc(ch)}</button>`;
  }).join('');
  const bank = q.order.map(t=>{
    const used = q.placed.indexOf(t.id)>=0;
    return `<button class="tile${used?' used':''}" data-act="tile" data-id="${t.id}" ${(q.answered||used)?'disabled':''}>${esc(t.ch)}</button>`;
  }).join('');
  return `<div class="slots" style="margin-top:10px">${slots}</div><div class="bank">${bank}</div>`;
}
function matchHtml(){
  const L = q.left.map((x,i)=>{
    const done = q.done.has(x.id);
    const cls = 'mbtn'+(done?' done':'')+(q.sel===i?' sel':'')+((q.flash && q.flash.l===i)?' bad':'');
    return `<button class="${cls}" data-act="mL" data-i="${i}" ${(done||q.answered)?'disabled':''}>${wordHtml(x)}</button>`;
  }).join('');
  const R = q.right.map((x,j)=>{
    const done = q.done.has(x.id);
    const cls = 'mbtn'+(done?' done':'')+((q.flash && q.flash.r===j)?' bad':'');
    return `<button class="${cls}" data-act="mR" data-j="${j}" ${(done||q.answered)?'disabled':''}>${q.useImg ? imgTag(x) : esc(x.vi)}</button>`;
  }).join('');
  return `<div class="match"><div class="mcol">${L}</div><div class="mcol">${R}</div></div>`;
}
function hintHtml(){
  const w = q.w, n = norm(w.w).length, out = [];
  if(q.hints>=1) out.push(`💡 Từ này có <b>${n}</b> chữ cái: <span style="display:block;font-family:ui-monospace,Consolas,monospace;letter-spacing:2px;font-size:20px">${esc(pattern(w.w,0))}</span>`);
  if(q.hints>=2) out.push(`💡 Chữ cái đầu tiên: <span style="display:block;font-family:ui-monospace,Consolas,monospace;letter-spacing:2px;font-size:20px">${esc(pattern(w.w,1))}</span>`);
  if(q.hints>=3) out.push(`💡 Nghĩa tiếng Việt: <b>${esc(w.vi)}</b>${w.img?`<div class="qpic sm">${imgTag(w)}</div>`:''}`);
  return out.map(x=>`<div>${x}</div>`).join('');
}
const byText = t => WORDS.find(x=>x.w.toLowerCase()===String(t).toLowerCase());
/* Giải thích sau mỗi câu (cả đúng lẫn sai) */
function explainHtml(){
  const w = q.w, L = [], b = s => `<b>${esc(s)}</b>`;
  if(q.type==='en2vi') L.push(`${b(w.w)} nghĩa là ${b(w.vi)}.`);
  else if(q.type==='vi2en') L.push(`Nghĩa “${esc(w.vi)}” trong tiếng Anh là ${b(w.w)}.`);
  else if(q.type==='missing') L.push(`Từ hoàn chỉnh là ${b(w.w)} (${esc(w.vi)}).`);
  else if(q.type==='scramble') L.push(`Các chữ cái ghép lại thành ${b(w.w)} (${esc(w.vi)}).`);
  else if(q.type==='type') L.push(`${w.img?'Hình này là':'Nghĩa này là'} ${b(w.w)} (${esc(w.vi)}).`);
  else if(q.type==='match') L.push(`Các cặp đúng: ${q.items.map(x=>`${b(x.w)} = ${q.useImg?'hình':esc(x.vi)}`).join(' · ')}`);
  else L.push(`Từ em vừa nghe là ${b(w.w)} (${esc(w.vi)}).`);
  if(q.mode!=='mc' && q.mode!=='pic' && q.mode!=='match') L.push(`Đánh vần: ${b([...w.w].filter(c=>c!==' ').join(' · '))}`);
  if(!q.correct && q.picked>=0){
    if(q.mode==='pic'){ const x = q.opts[q.picked]; if(x) L.push(`Em đã chọn hình của ${b(x.w)} (${esc(x.vi)}), không phải ${b(w.w)}.`); }
    else if(q.mode==='mc'){
      const pk = q.opts[q.picked];
      if(q.type==='en2vi'){ const x = WORDS.find(x=>x.vi===pk); if(x) L.push(`“${esc(pk)}” là nghĩa của từ ${b(x.w)}, không phải ${b(w.w)}.`); }
      else { const x = byText(pk); if(x) L.push(`Em đã chọn ${b(x.w)} — nghĩa là “${esc(x.vi)}”.`); }
    }
  }
  if(!q.correct && q.mode!=='mc' && q.mode!=='pic' && q.mode!=='match' && q.given) L.push(`Em trả lời “${esc(q.given)}” — chưa khớp với ${b(w.w)}.`);
  return `<div class="why"><b>💡 Giải thích:</b>${L.map(x=>`<div>${x}</div>`).join('')}</div>`;
}
function feedbackHtml(){
  const w = q.w, ok = q.correct;
  const good = ['Chính xác!','Giỏi quá!','Tuyệt vời!','Xuất sắc!','Đúng rồi!'];
  const bad = ['Chưa đúng rồi','Cố lên nào!','Suýt nữa thì đúng!','Không sao, nhớ từ này nhé!'];
  const hintNote = (ok && q.hints) ? ' (có dùng gợi ý)' : '';
  const retry = (!ok && q.item.attempt===1) ? '<div class="fd">Từ này sẽ quay lại sau ít phút để em thử lần nữa 💪</div>' : '';
  return `<div class="fb ${ok?'good':'bad'}">
    <h3>${ok?'🎉':'💭'} ${rnd(ok?good:bad)}${hintNote}</h3>
    <div class="fbrow">${w.img?`<img class="fbpic" src="${imgOf(w)}" alt="">`:''}<div><div class="fw">${wordHtml(w)} ${spk(w.say)}</div><div class="fv">${esc(w.vi)}</div></div></div>
    ${explainHtml()}${retry}</div>`;
}
function numsHtml(){
  const cur = q.w.id;
  return `<div class="nums" aria-label="Danh sách câu hỏi">${S.order.map((id,i)=>`<span class="num ${S.status[id]||''}${id===cur?' cur':''}">${i+1}</span>`).join('')}</div>`;
}
function navHtml(){
  const viewing = S.hv!==-1;
  return `<div class="qnav"><div class="inner">
    <button class="btn" data-act="back" ${(!S.hist.length || S.hv===0)?'disabled':''}>◀ Lại</button>
    <button class="btn" data-act="pause">⏸ Dừng</button>
    <button class="btn" data-act="skip" ${(viewing||q.answered)?'disabled':''}>⏭ Bỏ qua</button>
    <button class="btn${q.answered?' primary':''}" id="nextbtn" data-act="next" ${q.answered?'':'disabled'}>Tiếp ▶</button></div></div>`;
}
const listenRow = w => `<div class="listen-row"><button class="icon-btn lg" data-act="speak" data-t="${esc(w.say)}" aria-label="Nghe">🔊</button>${spk(w.say,true)}</div>`;

function renderQ(first){
  const w = q.w, T = TYPES[q.type];
  const tp = topicById(w.topics[0]);
  let body = '';
  if(q.type==='en2vi'){
    body = `<div class="qlabel">Nghĩa tiếng Việt của từ này là gì?</div>${qpic(w)}<div class="bigword">${wordHtml(w)} ${spk(w.say)}</div>` + optsHtml();
  } else if(q.type==='vi2en'){
    body = `<div class="qlabel">Từ tiếng Anh của nghĩa này là gì?</div><div class="bigword vi">${esc(w.vi)}</div>`;
    body += q.mode==='mc' ? optsHtml() : `<div class="pattern">${esc(pattern(w.w,1))}</div>` + typedHtml('Gõ từ tiếng Anh...');
  } else if(q.type==='lw'){
    body = `<div class="qlabel">Nghe và chọn từ đúng</div>${listenRow(w)}` + optsHtml();
  } else if(q.type==='lp'){
    body = `<div class="qlabel">Nghe và chọn hình đúng</div>${listenRow(w)}` + picOptsHtml();
  } else if(q.type==='type'){
    body = `<div class="qlabel">${w.img?'Nhìn hình và gõ từ tiếng Anh':'Gõ từ tiếng Anh của nghĩa này'}</div>${qpic(w)}<div class="bigword vi">${esc(w.vi)}</div><div class="pattern">${esc(pattern(w.w,1))}</div>` + typedHtml('Gõ từ tiếng Anh...');
  } else if(q.type==='missing'){
    body = `<div class="qlabel">Điền các chữ cái còn thiếu</div>${qpic(w,'sm')}<div class="bigword vi">${esc(w.vi)}</div>
      <div class="slotwrap"><div class="slots" id="slots">${slotsHtml()}</div>${q.answered?'':`<input id="hid" class="hid" type="text" maxlength="${q.blanks.length}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Nhập các chữ cái còn thiếu" value="${esc(q.typedL)}">`}</div>`;
  } else if(q.type==='listen'){
    body = `<div class="qlabel">Nghe và viết lại từ bạn nghe được</div>${listenRow(w)}
      <div class="hintbox" id="hintbox">${hintHtml()}</div>` + typedHtml('Gõ từ bạn nghe được...');
  } else if(q.type==='match'){
    body = `<div class="qlabel">Nối mỗi từ tiếng Anh với ${q.useImg?'hình':'nghĩa'} đúng của nó (chạm từ bên trái, rồi chạm bên phải)</div><div id="matchbox">${matchHtml()}</div>`;
  } else {
    body = `<div class="qlabel">Sắp xếp các chữ cái thành từ đúng</div>${qpic(w,'sm')}<div class="bigword vi">${esc(w.vi)}</div><div id="scr">${scrambleHtml()}</div>`;
  }
  let actions = '';
  if(!q.answered){
    if(q.mode==='typed' || q.mode==='missing' || q.mode==='scramble'){
      actions = `<div class="actions">
        ${q.type==='listen'?`<button class="btn" data-act="hint" id="hintbtn">💡 Gợi ý (${q.hints}/3)</button>`:''}
        ${q.mode==='scramble'?`<button class="btn" data-act="clear">↺ Xóa</button>`:''}
        <span class="grow"></span>
        <button class="btn primary" data-act="submit">Kiểm tra</button></div>
        <div style="text-align:right;margin-top:8px"><button class="link" data-act="giveup">Mình không biết</button></div>`;
    } else {
      actions = `<div style="text-align:right;margin-top:10px"><button class="link" data-act="giveup">Mình không biết</button></div>`;
    }
  }
  const pct = Math.round(S.done/S.n*100);
  const qn = S.order.indexOf(w.id)+1;
  const tags = (S.hv!==-1 ? '<span class="tag">👀 Xem lại</span>' : '') + (q.item.attempt>1 ? '<span class="tag">🔁 Làm lại</span>' : '');
  app.innerHTML = `
    <div class="gbar"><button class="x" data-act="quit" aria-label="Về trang chủ">🏠</button>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="combo">${S.streak>=2?'🔥 '+S.streak:'⭐ '+S.score}</div></div>
    ${numsHtml()}
    <div class="qcount">Câu <b>${qn}</b>/${S.n}${tags}</div>
    <div class="qcard${first?' enter':''}" id="qcard">
      <span class="qtype">${T.icon} ${T.label}</span><span class="qtopic">${esc(tp.icon+' '+unitLabel(tp))}</span>
      ${body}${actions}${q.answered?feedbackHtml():''}
    </div>${navHtml()}`;
  window.scrollTo(0,0);
  if(!q.answered){
    if(q.mode==='typed') focusEl('#ans');
    else if(q.mode==='missing') focusEl('#hid');
    if(q.type==='listen' || q.type==='lw' || q.type==='lp') setTimeout(()=>speak(w.say), 350);
    else if(q.type==='en2vi' && store.sound) setTimeout(()=>speak(w.say), 300);
  } else if(S.hv===-1){

}
function focusEl(sel){ setTimeout(()=>{ const e = $(sel); if(e) e.focus({preventScroll:true}); }, 60); }
function shake(){ const c = $('#qcard'); if(!c) return; c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }

/* ---------- Xử lý trả lời ---------- */
function checkTyped(given){
  const g = norm(given);
  if(g===norm(q.w.w) || q.w.alt.indexOf(g)>=0) return true;
  // Việt → Anh: các từ cùng nghĩa tiếng Việt đều được chấp nhận
  return q.type==='vi2en' && WORDS.some(x=>x.vi===q.w.vi && norm(x.w)===g);
}
function submit(giveUp){
  if(!q || q.answered) return;
  let ok = false, given = '';
  if(q.mode==='mc' || q.mode==='pic' || q.mode==='match') return;
  if(q.mode==='typed'){
    const el = $('#ans'); given = (el ? el.value : q.value).trim(); q.value = given;
    if(!given && !giveUp){ shake(); return; }
    ok = !giveUp && checkTyped(given);
  } else if(q.mode==='missing'){
    if(q.typedL.length<q.blanks.length && !giveUp){ shake(); return; }
    let j = 0; given = [...q.w.w].map((c,i)=> q.blanks.indexOf(i)<0 ? c : (q.typedL[j++]||'_')).join('');
    ok = !giveUp && norm(given)===norm(q.w.w);
    if(giveUp) given = '';
  } else if(q.mode==='scramble'){
    if(q.placed.length<q.tiles.length && !giveUp){ shake(); return; }
    given = q.placed.map(id=>q.tiles[id].ch).join('');
    ok = !giveUp && given===norm(q.w.w);
    if(giveUp) given = '';
  }
  finish(ok, giveUp ? '' : given);
}
function finish(ok, given){
  q.answered = true; q.correct = ok; q.given = given;
  const item = q.item, w = q.w;
  let pts = 0;
  if(item.attempt===1){
    const p = ensureP(w.id);
    p.seen++; p.last = store.sessions; p.lastType = q.type; p.lastOk = ok;
    if(ok){
      p.ok++;
      if(!q.hints){ p.box = Math.min(5, p.box+1); p.rv = false; if(p.box>=4) p.unk = false; }
      pts = (q.hints ? Math.max(3, 10-3*q.hints) : 10) + Math.min(S.streak,5);
      S.streak++; S.best = Math.max(S.best, S.streak);
      S.done++;
    } else {
      p.bad++; p.box = Math.max(0, p.box-1); p.rv = true;
      S.streak = 0;
      S.queue.splice(Math.min(S.idx+4, S.queue.length), 0, {w, attempt:2, avoid:q.type});
    }
    S.results[w.id] = {w, ok, hinted:q.hints>0, type:q.type};
    S.status[w.id] = ok ? 'ok' : 'bad';
    lse('answer', {qid:w.id, topic:'Từ vựng Starters – '+unitLabel(topicById(w.topics[0]))+' '+topicById(w.topics[0]).name, ok:ok, q:'['+TYPES[q.type].label+'] '+w.w+' = '+w.vi});
  } else {
    if(ok) pts = 3;
    S.done++;
  }
  S.score += pts; store.xp += pts; save();
  ok ? sfxOk() : sfxBad();
  lastAnswerAt = Date.now();
  renderQ(false);
  setTimeout(()=>speak(w.say), 450);
}
function pick(i){
  if(!q || q.answered) return;
  if(q.mode==='mc'){ q.picked = i; q.given = q.opts[i]; finish(q.opts[i]===q.correctVal, q.opts[i]); }
  else if(q.mode==='pic'){ q.picked = i; q.given = q.opts[i].w; finish(q.opts[i]===q.w, q.opts[i].w); }
}
function updateMatch(){ const e = $('#matchbox'); if(e) e.innerHTML = matchHtml(); }
function matchLeft(i){
  if(!q || q.mode!=='match' || q.answered) return;
  q.sel = (q.sel===i) ? -1 : i;
  if(q.sel>=0) speak(q.left[i].say);
  updateMatch();
}
function matchRight(j){
  if(!q || q.mode!=='match' || q.answered) return;
  if(q.sel<0){ toast('Chạm một từ bên trái trước nhé!'); return; }
  const l = q.left[q.sel], r = q.right[j];
  if(l===r){
    q.done.add(l.id); q.sel = -1; q.flash = null; sfxOk();
    updateMatch();
    if(q.done.size===q.items.length) setTimeout(()=>{ if(q && !q.answered) finish(q.wrong<=1, ''); }, 350);
  } else {
    q.wrong++; q.flash = {l:q.sel, r:j}; q.sel = -1; sfxBad();
    updateMatch();
    const cur = q; setTimeout(()=>{ if(q===cur && cur.flash){ cur.flash = null; updateMatch(); } }, 450);
  }
}
function next(){
  if(!S || !q || !q.answered) return;
  if(S.hv!==-1){                       // đang xem lại câu cũ: đi tới
    S.hv++;
    if(S.hv>=S.hist.length){ S.hv = -1; q = S.live; } else q = S.hist[S.hv];
    renderQ(false); return;
  }
  S.hist.push(q);
  S.idx++;
  if(S.idx>=S.queue.length){ renderResult(); return; }
  prepareQ(); renderQ(true);
}
function back(){
  if(!S || !S.hist.length) return;
  if(S.hv===-1) S.hv = S.hist.length-1; else if(S.hv>0) S.hv--; else return;
  q = S.hist[S.hv]; renderQ(false);
}
function skip(){
  if(!S || S.hv!==-1 || !q || q.answered) return;
  const it = q.item;
  if((it.skips||0)>=1){ toast('Câu này đã bỏ qua 1 lần rồi, mình xem đáp án nhé!'); finish(false, ''); return; }
  if(!S.status[q.w.id]) S.status[q.w.id] = 'skip';
  S.queue.push({w:it.w, attempt:it.attempt, avoid:it.avoid, skips:1});
  S.idx++;
  prepareQ(); renderQ(true);
  toast('Đã bỏ qua. Câu này sẽ quay lại ở cuối bài.');
}

const fmtT = ms => { const s = Math.round(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function mkG(o){ return Object.assign({timers:[], cleanup(){ this.timers.forEach(t=>{ clearInterval(t); clearTimeout(t); }); }}, o); }

function gamePool(min, filter){
  const p = poolOf(store.sel).filter(filter || (()=>true));
  if(p.length<min){ toast(`Hãy tick thêm unit (cần ít nhất ${min} từ phù hợp).`); return null; }

// Chọn ngẫu nhiên có trọng số: từ chưa thuộc xuất hiện nhiều hơn
function pickWeak(pool, n){
  let rest = pool.slice(); const out = [];
  while(out.length<n && rest.length){
    const w = roulette(rest, w=>{ const p = getP(w.id); return BOXW[p.box]*(p.seen?1:1.5); });
    out.push(w); rest = rest.filter(x=>x!==w);
  }
  return out;
}

function playMemory(){
  endG();
  const pool = gamePool(5); if(!pool) return;
  const used = new Set(), picked = [];
  pickWeak(pool, pool.length).forEach(w=>{ const k = w.w.toLowerCase(); if(picked.length<8 && !used.has(k) && !used.has('vi:'+w.vi)){ used.add(k); used.add('vi:'+w.vi); picked.push(w); } });
  if(picked.length<4){ toast('Hãy tick thêm unit.'); return; }
  const cards = shuffle(picked.flatMap(w=>[{w, side:'en', text:w.w, up:false, done:false}, {w, side:'vi', text:w.vi, up:false, done:false}]));
  G = mkG({key:'memory', cards, n:picked.length, first:-1, lock:false, moves:0, matched:0, t0:Date.now()});
  startG('Lật thẻ ghép cặp','🃏','<p class="note" style="margin:0 0 10px">Lật hai thẻ để ghép từ tiếng Anh với hình (hoặc nghĩa tiếng Việt) của nó.</p><div class="mgrid" id="mgrid"></div>');
  drawMem(); memTick();
  G.timers.push(setInterval(memTick, 500));
}
function memTick(){ if(G && G.key==='memory') setScore('⏱ '+fmtT(Date.now()-G.t0)+' · 🔄 '+G.moves); }
function drawMem(){
  $('#mgrid').innerHTML = G.cards.map((c,i)=>{
    const show = c.up || c.done, pic = c.side==='vi' && c.w.img;
    return `<button class="mcard ${c.side}${pic?' hasimg':''}${c.up?' up':''}${c.done?' done':''}" data-act="mflip" data-i="${i}" ${show?'disabled':''} aria-label="Thẻ ${i+1}">${show?(pic?imgTag(c.w):`<span>${esc(c.text)}</span>`):'<span class="q">🌱</span>'}</button>`;
  }).join('');
}
function memFlip(i){
  if(!G || G.key!=='memory' || G.lock) return;
  const c = G.cards[i]; if(c.up || c.done) return;
  c.up = true; if(c.side==='en' && store.sound) speak(c.w.say);
  if(G.first<0){ G.first = i; drawMem(); return; }
  const a = G.cards[G.first]; G.first = -1; G.moves++;
  if(a.w===c.w){
    a.done = c.done = true; a.up = c.up = false; G.matched++; sfxOk(); drawMem(); memTick();
    if(G.matched===G.n) G.timers.push(setTimeout(memFinish, 600));
  } else {
    G.lock = true; sfxBad(); drawMem(); memTick();
    G.timers.push(setTimeout(()=>{ a.up = false; c.up = false; G.lock = false; drawMem(); }, 900));
  }
}
function memFinish(){
  const g = G, ms = Date.now()-g.t0;
  const stars = g.moves<=Math.ceil(g.n*1.6) ? 3 : g.moves<=Math.ceil(g.n*2.4) ? 2 : 1;

    xp:g.n*5+stars*10, stats:[[g.moves,'Lượt lật'],[fmtT(ms),'Thời gian'],['⭐'.repeat(stars),'Đánh giá']], again:'playMemory', win:stars>=2});
}

/* ---------- 2. Tìm từ trong ô chữ ---------- */
const WCOLS = ['#ffd6a5','#caffbf','#9bf6ff','#bdb2ff','#ffc6ff','#fdffb6','#a0c4ff'];
function playSearch(){
  endG();
  const pool = gamePool(5, w=>{ const n = norm(w.w).length; return n>=3 && n<=10; }); if(!pool) return;
  const SIZE = 10, DIRS = [[0,1],[1,0],[1,1]];
  let grid, placed = [];
  for(let attempt=0; attempt<20; attempt++){
    const seen = new Set(), cand = [];
    pickWeak(pool, pool.length).forEach(w=>{ const k = norm(w.w); if(cand.length<7 && !seen.has(k)){ seen.add(k); cand.push(w); } });
    cand.sort((a,b)=>norm(b.w).length - norm(a.w).length);
    grid = Array.from({length:SIZE}, ()=>Array(SIZE).fill(''));
    placed = [];
    cand.forEach(w=>{
      const s = norm(w.w);
      for(let t=0;t<200;t++){
        const d = rnd(DIRS), r = Math.floor(Math.random()*SIZE), c = Math.floor(Math.random()*SIZE);
        if(r+d[0]*(s.length-1)>=SIZE || c+d[1]*(s.length-1)>=SIZE) continue;
        let ok = true;
        for(let i=0;i<s.length;i++){ const ch = grid[r+d[0]*i][c+d[1]*i]; if(ch && ch!==s[i]){ ok = false; break; } }
        if(!ok) continue;
        const cells = [];
        for(let i=0;i<s.length;i++){ grid[r+d[0]*i][c+d[1]*i] = s[i]; cells.push([r+d[0]*i, c+d[1]*i]); }
        placed.push({w, s, cells, found:false}); return;
      }
    });
    if(placed.length>=Math.min(5,pool.length)) break;
  }
  const L = 'abcdefghijklmnopqrstuvwxyz';
  grid.forEach(row=>{ for(let j=0;j<row.length;j++) if(!row[j]) row[j] = L[Math.floor(Math.random()*26)]; });
  G = mkG({key:'search', grid, placed, start:null, hint:null, hints:0, t0:Date.now()});
  startG('Tìm từ trong ô chữ','🔎','<p class="note" style="margin:0 0 10px">Nhìn hình / nghĩa tiếng Việt, rồi tìm từ tiếng Anh trong ô chữ: chạm chữ cái đầu, sau đó chạm chữ cái cuối (từ nằm ngang, dọc hoặc chéo xuống).</p><div class="wgrid" id="wgrid"></div><div class="wclues" id="wclues"></div><div class="actions" style="margin-top:12px"><button class="btn" data-act="swhint">💡 Gợi ý</button></div>');
  drawSearch();
}
function drawSearch(){
  const g = G, fmap = {};
  g.placed.forEach((p,k)=>{ if(p.found) p.cells.forEach(c=>{ fmap[c[0]+','+c[1]] = k; }); });
  $('#wgrid').innerHTML = g.grid.map((row,r)=>row.map((ch,c)=>{
    const k = fmap[r+','+c]; let cls = 'wcell', st = '';
    if(k!==undefined){ cls += ' found'; st = `style="background:${WCOLS[k%WCOLS.length]}"`; }
    if(g.start && g.start[0]===r && g.start[1]===c) cls += ' start';
    if(g.hint && g.hint[0]===r && g.hint[1]===c) cls += ' hint';
    return `<button class="${cls}" ${st} data-act="wcell" data-r="${r}" data-c="${c}" aria-label="${ch}">${ch.toUpperCase()}</button>`;
  }).join('')).join('');
  $('#wclues').innerHTML = g.placed.map(p=>`<div class="wclue${p.found?' done':''}">${p.found?`✅ <b>${esc(p.w.w)}</b> <span class="vi">${esc(p.w.vi)}</span>`:`${p.w.img?imgTag(p.w,'gimg'):'❓'} ${esc(p.w.vi)} <span class="pat">${esc(pattern(p.w.w,0))}</span>`}</div>`).join('');
  setScore('🔎 '+g.placed.filter(p=>p.found).length+'/'+g.placed.length);
}
function swCell(r, c){
  if(!G || G.key!=='search') return;
  G.hint = null;
  if(!G.start){ G.start = [r,c]; drawSearch(); return; }
  const r1 = G.start[0], c1 = G.start[1];
  if(r1===r && c1===c){ G.start = null; drawSearch(); return; }
  const dr = r-r1, dc = c-c1;
  if(dr!==0 && dc!==0 && Math.abs(dr)!==Math.abs(dc)){ G.start = [r,c]; drawSearch(); return; }
  const n = Math.max(Math.abs(dr), Math.abs(dc)), sr = Math.sign(dr), sc = Math.sign(dc);
  let s = ''; for(let i=0;i<=n;i++) s += G.grid[r1+sr*i][c1+sc*i];
  const rs = s.split('').reverse().join('');
  const hit = G.placed.find(p=>!p.found && (p.s===s || p.s===rs));
  if(hit){
    hit.found = true; G.start = null; sfxOk(); if(store.sound) speak(hit.w.say); drawSearch();
    if(G.placed.every(p=>p.found)) G.timers.push(setTimeout(searchFinish, 700));
  } else {
    sfxBad(); G.start = [r,c]; drawSearch();
    const gr = $('#wgrid'); if(gr){ gr.classList.remove('shake'); void gr.offsetWidth; gr.classList.add('shake'); }
  }
}
function swHint(){
  if(!G || G.key!=='search') return;
  const left = G.placed.filter(p=>!p.found); if(!left.length) return;
  const p = rnd(left); G.hint = p.cells[0]; G.hints++; G.start = null; drawSearch();
}
function searchFinish(){
  const g = G, ms = Date.now()-g.t0, n = g.placed.length;
  gameResult({icon:'🔎', title:'Tìm đủ rồi!', msg:g.hints?`Bạn đã dùng ${g.hints} lần gợi ý.`:'Không cần gợi ý nào, tuyệt vời!',
    xp:Math.max(10, n*10-g.hints*3), stats:[[n+'/'+n,'Từ tìm được'],[fmtT(ms),'Thời gian'],[g.hints,'Lần gợi ý']], again:'playSearch', win:g.hints<=1});
}

const PLANT = ['🥀','🥀','🥀','🌱','🌷','🌻','🌻'];
const ABC = 'abcdefghijklmnopqrstuvwxyz';
function playHangman(){
