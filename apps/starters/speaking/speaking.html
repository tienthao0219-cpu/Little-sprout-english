<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starters Speaking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Token màu/font: lấy đúng từ css/style.css của website ===== */
:root{
  --cream:#FFF9F2;--paper:#FFFFFF;
  --mint:#D3F1E5;--mint-d:#2E9C7C;
  --peach:#FFE0D2;--peach-d:#E27B52;
  --lav:#E7DFFF;--lav-d:#7A64D4;
  --butter:#FFF1BE;--butter-d:#D3A01C;
  --sky:#DCEEFF;--sky-d:#3B88D0;
  --rose:#FFDCE8;--rose-d:#DE5481;
  --ink:#2B3550;--soft:#67728D;--line:rgba(43,53,80,.10);
  --good:#25A06D;--bad:#DC4B62;--warn:#E5A216;
  --r:20px;--r-sm:14px;
  --shadow:0 1px 2px rgba(43,53,80,.05),0 10px 28px rgba(43,53,80,.07);
  --hfont:"Baloo 2","Nunito",system-ui,sans-serif;
  --bfont:"Nunito","Be Vietnam Pro",system-ui,sans-serif;
  /* màu chủ đạo theo Part (mặc định = Part 1) */
  --pc:var(--mint);--pd:var(--mint-d);--pdd:#1F7A60;--ps:#EAF8F2;
}
body[data-part="2"]{--pc:var(--peach);--pd:var(--peach-d);--pdd:#C25A30;--ps:#FFF2EB}
body[data-part="3"]{--pc:var(--sky);--pd:var(--sky-d);--pdd:#2A6CB0;--ps:#EEF6FF}
body[data-part="4"]{--pc:var(--rose);--pd:var(--rose-d);--pdd:#C23F6B;--ps:#FFEEF4}
body[data-part="0"]{--pc:var(--lav);--pd:var(--lav-d);--pdd:#5E48B8;--ps:#F3EEFF}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--bfont);font-weight:600;color:var(--ink);line-height:1.5;min-height:100vh;
  background:
    radial-gradient(900px 500px at 0% -5%,#FFE6EF 0,transparent 60%),
    radial-gradient(800px 480px at 100% 0%,#DFF1FF 0,transparent 60%),
    radial-gradient(900px 600px at 50% 110%,#E0F7EC 0,transparent 60%),
    var(--cream);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
h1,h2,h3,h4{font-family:var(--hfont);margin:0;line-height:1.15;font-weight:700}
button{font-family:inherit;font-size:16px;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
img{max-width:100%;display:block}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 28px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* ===== thanh trên ===== */
.sbar{position:sticky;top:0;z-index:40;margin:0 -16px 12px;padding:8px 16px;background:rgba(255,249,242,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.sbar-in{display:flex;align-items:center;gap:6px;max-width:1080px;margin:0 auto}
.slogo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.slogo>span{min-width:0}
.slogo img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--lav);border:2px solid #fff;box-shadow:var(--shadow);flex:none}
.slogo b{display:block;font-family:var(--hfont);font-weight:800;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slogo small{display:block;color:var(--soft);font-size:12.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:56px;min-height:56px;padding:4px 8px;border-radius:16px;color:var(--soft);font-weight:800;flex:none;line-height:1.1;transition:background .2s,color .2s}
.ni .nico{font-size:22px;line-height:1}
.ni .nlab{font-size:12px}
.ni.on{background:rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(140,110,200,.2);color:var(--pdd)}
@media (hover:hover){.ni:hover{background:#fff;color:var(--ink)}}
.ni:focus-visible,.btn:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--lav-d);outline-offset:2px}

/* ===== nút lớn ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 26px;border-radius:999px;font-family:var(--hfont);font-weight:700;font-size:20px;line-height:1;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 rgba(43,53,80,.10);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,53,80,.10)}
.btn.pri{background:var(--pdd);color:#fff;border-color:transparent;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn.pri:active{box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.soft{background:var(--ps);color:var(--pdd);border-color:var(--pc)}
.btn.sm{min-height:48px;font-size:17px;padding:0 18px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ===== trang chủ ===== */
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#fff,var(--ps));border:2px solid #fff;border-radius:28px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px}
.hero img{width:120px;height:112px;object-fit:contain;object-position:50% 100%;flex:none}
.hero h1{font-size:clamp(28px,5vw,40px);color:var(--ink)}
.hero p{margin:6px 0 0;color:var(--soft);font-size:16px}
.pillrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:800;box-shadow:var(--shadow)}
.pill.star{background:var(--butter);border-color:#FFE59A;color:#8a6a00}
.sec{font-size:22px;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{position:relative;text-align:left;background:#fff;border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--shadow);border:2px solid transparent;min-height:132px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.tile::before{content:'';position:absolute;left:0;top:0;right:0;height:10px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,var(--mint),var(--peach),var(--sky),var(--rose))}
@media (hover:hover){.tile:not(.soon):hover{transform:translateY(-3px);border-color:var(--mint-d)}}
.tile b{font-family:var(--hfont);font-size:24px;line-height:1.1;margin-top:6px}
.tile small{color:var(--soft);font-size:14px;font-weight:700}
.tile .go{margin-top:auto;display:flex;align-items:center;gap:8px;font-family:var(--hfont);font-weight:700;color:var(--pdd)}
.tile .got{position:absolute;right:14px;top:22px;font-size:26px}
.tile.soon{background:rgba(255,255,255,.55);border:2px dashed rgba(43,53,80,.18);box-shadow:none;cursor:default}
.tile.soon::before{opacity:.35}
.tile.soon b{color:var(--soft)}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--lav);color:#5E48B8}
.badge.gen{background:var(--butter);color:#8a6a00}
details.guide{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:6px 18px;margin-top:18px}
details.guide summary{min-height:48px;display:flex;align-items:center;font-weight:800;cursor:pointer}
details.guide ol{margin:0 0 12px 18px;padding:0;color:var(--soft)}
details.guide li{margin:6px 0}

/* ===== màn làm bài ===== */
.progrow{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.prog{flex:1;height:12px;border-radius:999px;background:rgba(43,53,80,.07);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--pc),var(--pd));transition:width .4s ease}
.pstars{display:flex;gap:2px;align-items:center;font-size:24px;flex:none;line-height:1}
.pstars span{filter:grayscale(1);opacity:.35;transition:filter .3s,opacity .3s,transform .3s}
.pstars span.on{filter:none;opacity:1}
.pstars span.cur{opacity:.9;filter:none;transform:scale(1.15)}
.pstars span.cur:not(.on){filter:grayscale(.6)}
.ptag{display:inline-flex;align-items:center;gap:8px;background:var(--pc);color:var(--pdd);border-radius:999px;padding:6px 16px;font-family:var(--hfont);font-weight:800;font-size:16px;margin-bottom:10px}

.stage{background:var(--ps);border:2px solid var(--pc);border-radius:28px;padding:12px;box-shadow:var(--shadow)}
.scgrid{display:grid;gap:12px}
@media (min-width:880px){.scgrid.tray{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}.scgrid.tray .scene{width:100%}}

.scene{position:relative;width:min(100%,calc((100vh - 400px)*1.3333));min-width:min(100%,300px);margin:0 auto;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#fff;border:3px solid #fff;box-shadow:0 0 0 2px var(--pc);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.scene>img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.scene.nopic{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#fff,#fff 12px,var(--ps) 12px,var(--ps) 24px);cursor:default}
.ptr{position:absolute;border:5px solid var(--rose-d);border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 6px 16px rgba(222,84,129,.35);pointer-events:none;animation:ptr 1.3s ease-in-out infinite;z-index:3}
.ptr.sq{border-radius:18px}
@keyframes ptr{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}
.zone{position:absolute;border:4px dashed var(--pdd);border-radius:16px;background:rgba(255,255,255,.35);pointer-events:none;z-index:2;animation:ptr 1.3s ease-in-out infinite}
.tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;pointer-events:none;z-index:5;animation:tap .7s ease-out forwards}
.tap.ok{background:rgba(37,160,109,.35);border:4px solid var(--good)}
.tap.no{background:rgba(220,75,98,.25);border:4px solid var(--bad)}
@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.scene.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.placed{position:absolute;width:17%;z-index:4;transform:translate(-50%,-50%);border-radius:10px;border:3px solid #fff;box-shadow:0 6px 14px rgba(43,53,80,.28);background:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.placed img{border-radius:7px}
.placed.drag{cursor:grab;touch-action:none}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(-50%,-50%) scale(1)}}
.nopic .nop{text-align:center;padding:20px;max-width:520px}
.nopic .nop b{display:block;font-family:var(--hfont);font-size:22px}

.trayhd{font-family:var(--hfont);font-weight:700;color:var(--pdd);margin:2px 4px 8px}
.trayg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (min-width:880px){.tray .trayg{grid-template-columns:repeat(4,1fr);gap:8px}}
.slot{position:relative;aspect-ratio:5/4;border-radius:16px;background:rgba(255,255,255,.55);border:2px dashed rgba(43,53,80,.16)}
.chip{position:absolute;inset:0;border-radius:16px;background:#fff;border:3px solid #fff;box-shadow:0 5px 12px rgba(43,53,80,.18);overflow:hidden;touch-action:none;cursor:grab;transition:transform .15s,box-shadow .15s}
.chip img{width:100%;height:100%;object-fit:contain;pointer-events:none;background:#fff}
.chip .lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(43,53,80,.8);color:#fff;font-size:12px;text-align:center;padding:1px 2px}
.chip.held{transform:translateY(-6px) scale(1.06);box-shadow:0 0 0 4px var(--pd),0 12px 22px rgba(43,53,80,.3)}
.chip.want{animation:ptr 1.2s ease-in-out infinite;box-shadow:0 0 0 4px var(--pc),0 5px 12px rgba(43,53,80,.18)}
.chip.dim{opacity:.55;pointer-events:none}
.chip.wob{animation:shake .35s}
.ghost{position:fixed;z-index:200;width:96px;pointer-events:none;border-radius:12px;border:3px solid #fff;box-shadow:0 14px 28px rgba(43,53,80,.35);transform:translate(-50%,-60%) rotate(-4deg);background:#fff}

/* thẻ lật */
.fcwrap{display:grid;place-items:center;padding:8px 0 6px;min-height:min(56vw,320px)}
.fc{perspective:1100px;width:min(86%,400px);aspect-ratio:5/4;cursor:pointer;animation:deal .7s cubic-bezier(.2,.9,.3,1.1)}
.fc.out{animation:away .45s ease-in forwards}
@keyframes deal{from{transform:translate(-55vw,-24vh) rotate(-22deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes away{to{transform:translate(55vw,-20vh) rotate(18deg) scale(.5);opacity:0}}
.fc-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.2,.4,1)}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;border:6px solid #fff;box-shadow:0 14px 30px rgba(43,53,80,.22),0 0 0 3px var(--pc);overflow:hidden;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.face.front img{width:100%;height:100%;object-fit:contain}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#fff,var(--ps));padding:12px}
.face.back .w{font-family:var(--hfont);font-weight:800;font-size:clamp(34px,9vw,56px);color:var(--pdd);line-height:1}
.face.back .s{font-size:clamp(18px,4.6vw,26px);color:var(--ink);margin-top:10px;font-weight:700}
.face.back .hint{margin-top:12px;font-size:13px;color:var(--soft)}
.fliphint{position:absolute;right:10px;bottom:8px;z-index:3;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;color:var(--pdd);box-shadow:var(--shadow)}

/* khung giám khảo */
.dock{position:sticky;bottom:0;z-index:30;margin:auto -16px -28px;padding-top:14px!important;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,249,242,0),rgba(255,249,242,.92) 22%)}
.dock-in{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:96px 1fr;gap:6px 12px;align-items:end}
.ex{width:96px;height:96px;object-fit:contain;object-position:50% 100%;animation:bob 3.2s ease-in-out infinite;grid-row:1}
.ex.swap{animation:exin .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes exin{from{transform:scale(.7) translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.bub{position:relative;background:#fff;border:3px solid var(--pc);border-radius:24px;padding:12px 16px;box-shadow:var(--shadow);min-height:64px;display:flex;align-items:center;gap:10px}
.bub::before{content:'';position:absolute;left:-12px;bottom:22px;width:20px;height:20px;background:#fff;border-left:3px solid var(--pc);border-bottom:3px solid var(--pc);transform:rotate(45deg);border-radius:0 0 0 6px}
.bub .q{flex:1;font-family:var(--hfont);font-weight:700;font-size:clamp(22px,4.4vw,30px);line-height:1.2;color:var(--ink)}
.bub .q small{display:block;font-family:var(--bfont);font-size:14px;font-weight:700;color:var(--soft);margin-top:4px}
.bub .q.back{color:var(--pdd)}
.spk{flex:none;width:56px;height:56px;border-radius:50%;background:var(--ps);color:var(--pdd);font-size:24px;border:2px solid var(--pc)}
.acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.acts .btn{flex:1 1 150px;max-width:340px}
.dock.big .dock-in{grid-template-columns:1fr;justify-items:center;text-align:center}
.dock.big .ex{width:min(52vw,200px);height:min(52vw,200px)}
.dock.big .bub{width:100%}
.dock.big .bub::before{left:50%;top:-12px;bottom:auto;margin-left:-10px;transform:rotate(135deg)}
.dock.big .acts{justify-content:center}
@media (min-width:700px){.dock-in{grid-template-columns:150px 1fr}.ex{width:150px;height:150px}}

/* ghi chú của cô */
.tnote{background:var(--butter);border:2px dashed #E8C95C;border-radius:16px;padding:10px 14px;margin:0 0 10px;font-size:14.5px;color:#6b5400;font-weight:700}
.tnote b{color:#4d3c00}
.tnote .tg{display:inline-block;margin-right:6px;font-size:12px;background:#fff;border-radius:999px;padding:0 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tab{min-height:48px;padding:0 16px;border-radius:999px;background:#fff;border:2px solid var(--line);font-family:var(--hfont);font-weight:700;font-size:16px}
.tab.on{background:var(--pc);color:var(--pdd);border-color:var(--pd)}
.nameIn{width:100%;max-width:420px;min-height:60px;border-radius:18px;border:3px solid var(--pc);padding:0 18px;font:700 26px var(--hfont);text-align:center;background:#fff;color:var(--ink)}
.nameIn:focus{outline:3px solid var(--lav-d);outline-offset:2px}

/* màn xong Part / thưởng */
.card{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:22px 20px;text-align:center;border:2px solid #fff}
.partdone{display:grid;gap:12px;justify-items:center}
@media (max-height:820px){.partdone{gap:6px}.rew .stickrow span{font-size:30px!important}.rew h2{margin:0;font-size:24px}.partdone .bigstar{font-size:44px}}
.partdone img{width:min(60vw,240px,30vh);height:min(54vw,220px,28vh);min-height:120px;object-fit:contain;object-position:50% 100%}
.bigstar{font-size:84px;line-height:1;animation:starpop .9s cubic-bezier(.3,1.7,.5,1)}
@keyframes starpop{0%{transform:scale(0) rotate(-60deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.rew h2{font-size:clamp(28px,6vw,40px)}
.stickrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.sticker{position:relative;width:112px;text-align:center}
.sticker .sv{width:112px;height:112px;border-radius:26px;background:#fff;box-shadow:var(--shadow);border:3px solid #fff;display:grid;place-items:center;transition:transform .2s}
.sticker svg{width:92px;height:92px}
.sticker.lock .sv{background:rgba(255,255,255,.55);border:2px dashed rgba(43,53,80,.2);box-shadow:none}
.sticker.lock svg{filter:grayscale(1) brightness(1.35) contrast(.55);opacity:.55}
.sticker small{display:block;margin-top:4px;font-weight:800;font-size:13px;color:var(--soft)}
.sticker.new .sv{animation:starpop .9s cubic-bezier(.3,1.7,.5,1);box-shadow:0 0 0 4px var(--butter),var(--shadow)}
.albumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;justify-items:center}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:150}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:180;background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-weight:800;box-shadow:var(--shadow);animation:toast 1.8s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

@media (max-width:560px){
  .wrap{padding:0 12px 24px}.sbar{margin:0 -12px 10px;padding:6px 12px}.dock{margin:12px -12px -24px;padding-left:12px;padding-right:12px}
  .slogo small{display:none}.ni{min-width:52px}
  .hero{padding:14px}.hero img{width:92px;height:92px}
  .dock-in{grid-template-columns:76px 1fr}.ex{width:76px;height:76px}
  .bub{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .fc-in{transition:none}.conf{display:none}
  .fc.flip .face.front{visibility:hidden}.fc:not(.flip) .face.back{visibility:hidden}
}
</style>
</head>
<body data-part="0">
<div class="wrap" id="app"></div>

<script>
/* dữ liệu bộ đề (sinh bởi build.py từ _work/data.json) */

function fmt(t){return String(t||'').replace(/\(name\)/gi,nm())}

/* ======================= dựng các bước của một Part ======================= */
function buildSteps(s,p){
  const out=[];
  if(p===0){
    const P=s.p1;
    out.push({t:'name',say:P.hello.say,vi:P.hello.vi,gen:P.hello.gen,ex:'vay-tay'});
    out.push({t:'say',scene:true,say:P.intro.say,vi:P.intro.vi,ex:'chi-bang'});
    out.push({t:'point',scene:true,say:P.example.say,vi:P.example.vi,target:P.example.target,ex:'chi-bang'});
    P.find.forEach(q=>out.push({t:'find',scene:true,say:q.say,back:q.back,vi:q.vi,target:q.target,ex:'dung'}));
    out.push({t:'say',scene:true,tray:true,say:fmt(P.tableSay.say),vi:P.tableSay.vi,ex:'chi-bang'});
    P.cardSteps.forEach(c=>{
      out.push({t:'pick',scene:true,tray:true,say:c.pick.say,back:c.pick.back,vi:c.pick.vi,card:c.card,ex:'dung'});
      if(c.demo)out.push({t:'demo',scene:true,tray:true,say:c.demo.say,vi:c.demo.vi,card:c.card,zone:c.demo.zone,ex:'chi-bang'});
      out.push({t:'place',scene:true,tray:true,say:c.place.say,back:c.place.back,vi:c.place.vi,card:c.card,zone:c.place.zone,ex:'dung'});
    });
  }else if(p===1){
    s.p2.forEach((q,i)=>out.push({t:'ask',scene:true,say:q.say,back:q.back,vi:q.vi,ans:q.ans,point:q.point,ex:i?'dung':'chi-bang',first:i===0}));
  }else if(p===2){
    s.p3.forEach(c=>c.qs.forEach((q,j)=>out.push({t:'card',card:c.card,qi:j,last:j===c.qs.length-1,say:q.say,back:q.back,vi:q.vi,ans:q.ans,alt:q.alt,check:j===0?c.check:'',ex:'dung'})));
  }else{
    s.p4.forEach(q=>out.push({t:'ask',talk:true,say:fmt(q.say),back:q.back,vi:q.vi,ans:q.ans,ex:'dung'}));
    out.push({t:'bye',talk:true,say:fmt(s.bye.say),vi:s.bye.vi,ex:'vay-tay'});
  }
  return out;
}

function goHome(){stopSpeak();st.view='home';document.body.dataset.part='0';render()}
function openSet(id){st.set=setBy(id);st.partsDone=[false,false,false,false];st.firstTry={};st.view='intro';st.part=0;document.body.dataset.part='1';render()}
function startPart(p){
  st.part=p;st.steps=buildSteps(st.set,p);st.i=0;st.wrong=0;st.help=false;st.held=null;st.flip=false;st.dealt=null;
  if(p===0){st.placed={}}else if(p===1){st.placed={}}
  document.body.dataset.part=String(p+1);st.view='step';render();
}
function nextStep(){
  stopSpeak();sfx.pop();
  if(st.i<st.steps.length-1){st.i++;st.wrong=0;st.help=false;st.held=null;st.flip=false;render()}
  else finishPart();
}
function finishPart(){
  st.partsDone[st.part]=true;st.view=st.part===3?'reward':'partdone';
  if(st.part===3)saveReward();
  render();
}
function saveReward(){
  const prog=loadProg();const had=Object.keys(prog.stars).length;
  const first=!prog.stars[st.set.id];
  prog.stars[st.set.id]={n:((prog.stars[st.set.id]||{}).n||0)+1,t:Date.now()};
  const now=Object.keys(prog.stars).length;
  st.newStk=[];
  if(first){MILESTONES.forEach((m,i)=>{if(m>had&&m<=now&&!prog.stk.includes(i)){prog.stk.push(i);st.newStk.push(i)}})}
  saveProg(prog);st.earnedFirst=first;st.totalNow=now;
  window.LSE_REPORT.finish(4,4);
}

function teacherNote(s,step){
  const bits=[];
  if(step.ans)bits.push(h('div',h('b','Đáp án mẫu: '),step.ans.join('  /  ')));
  if(step.back)bits.push(h('div',h('b','Câu hỏi dự phòng (back-up): '),step.back));
  if(step.alt)bits.push(h('div',h('b','Hoặc hỏi: '),step.alt));
  if(step.vi)bits.push(h('div',h('b','Nghĩa: '),step.vi,' ',h('span.tg','do Claude soạn')));
  if(step.t==='find'||step.t==='point')bits.push(h('div',h('b','Vị trí đúng: '),'vùng khoanh nét hồng trên tranh'));
  if(step.t==='pick'||step.t==='place'||step.t==='demo')bits.push(h('div',h('b','Thẻ: '),s.cards[step.card].w,step.zone?'  →  '+s.zones[step.zone].label:''));
  if(step.gen)bits.push(h('div',h('span.tg','do Claude soạn'),'Câu chào được chỉnh từ “Hello, my name’s …” trong sách.'));
  if(step.check)bits.push(h('div',h('b','⚠ Cô xác nhận: '),step.check));
  if(!bits.length)bits.push(h('div','Chế độ cô đang bật.'));
  return h('div.tnote',bits);
}

function rectStyle(r,pad){pad=pad||0;return {left:(r[0]-pad)+'%',top:(r[1]-pad)+'%',width:(r[2]+pad*2)+'%',height:(r[3]+pad*2)+'%'}}

function sceneBlock(s,step){
  const showTray=!!step.tray;
  const wrap=h('div.scgrid'+(showTray?'.tray':''));
  const sc=h('div.scene',{role:'img','aria-label':s.scene.alt});
  if(s.scene.img)sc.append(h('img',{src:A(s.scene.img),alt:s.scene.alt,draggable:'false'}));
  else{sc.classList.add('nopic');sc.append(h('div.nop',h('span',{style:{fontSize:'54px'}},'🖼️'),h('b','Chưa có ảnh'),h('span','Dán ảnh vào img/…/scene.webp (xem file prompt ảnh).')))}
  /* thẻ đã đặt lên tranh */
  Object.keys(st.placed).forEach(id=>{
    const pl=st.placed[id],c=s.cards[id];
    const e=h('div.placed'+(step.t==='place'&&step.card===id?'.drag':''),{style:{left:pl.x+'%',top:pl.y+'%'},'data-id':id},h('img',{src:A(c.img),alt:c.w,draggable:'false'}));
    if(step.t==='place'&&step.card===id){e.addEventListener('pointerdown',ev=>dragStart(ev,id,e))}
    sc.append(e);
  });
  /* vòng chỉ của giám khảo */
  const tgt=step.target||step.point;
  if(tgt&&s.hot[tgt]&&(step.t==='point'||step.t==='ask'||(step.t==='find'&&st.help)||(step.t==='find'&&teach()))){
    sc.append(h('div.ptr'+(s.hot[tgt].rect[2]>30?'.sq':''),{style:rectStyle(s.hot[tgt].rect,.6)}));
  }
  if(step.t==='demo'){/* thẻ bay lên xe đạp được xử lý ở dockBlock */}
  if(step.t==='place'&&s.zones[step.zone]&&(st.help||teach())){sc.append(h('div.zone',{style:rectStyle(s.zones[step.zone].rect)}))}
  if(step.t==='pick'&&st.help&&false){}
  /* chạm vào tranh */
  sc.addEventListener('click',ev=>{
    if(ev.target.closest('.placed'))return;
    const r=sc.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*100,y=(ev.clientY-r.top)/r.height*100;
    sceneTap(sc,step,x,y);
  });
  if(!(step.t==='find'||step.t==='place'))sc.style.cursor='default';
  wrap.append(sc);
  if(showTray){
    const tray=h('div.tray',h('div.trayhd','🃏 Bàn thẻ (chạm hoặc kéo thẻ)'));
    const g=h('div.trayg');
    s.p1.order.forEach(id=>{
      const slot=h('div.slot');
      if(!st.placed[id]){
        const c=s.cards[id];
        const chip=h('button.chip'+(st.held===id?'.held':'')+((step.t==='pick'||step.t==='place')&&step.card===id&&st.help?'.want':'')+((step.t==='say'||step.t==='demo')?'.dim':''),{'data-id':id,'aria-label':'thẻ '+c.w},h('img',{src:A(c.img),alt:c.w,draggable:'false'}),teach()?h('span.lbl',c.w):null);
        chip.addEventListener('pointerdown',ev=>dragStart(ev,id,chip));
        slot.append(chip);
      }
      g.append(slot);
    });
    tray.append(g);wrap.append(tray);
  }
  return wrap;
}
function inRect(x,y,r,tol){tol=tol||0;return x>=r[0]-tol&&x<=r[0]+r[2]+tol&&y>=r[1]-tol&&y<=r[1]+r[3]+tol}
function marker(sc,x,y,ok){const m=h('div.tap.'+(ok?'ok':'no'),{style:{left:x+'%',top:y+'%'}});sc.append(m);setTimeout(()=>m.remove(),800)}
function sceneTap(sc,step,x,y){
  const s=st.set;
  if(step.t==='find'){
    const r=s.hot[step.target].rect,ok=inRect(x,y,r,1.2);
    marker(sc,x,y,ok);
    if(ok){
      sfx.ok();
      window.LSE_REPORT.answer('ss-'+s.id+'-p1-'+step.target,'Speaking Starters · Part 1 Where is…?',st.wrong===0&&!st.help,step.say+' (Test '+s.no+')');
      stepDone(step,'Great! ✓');
    }else{sfx.no();st.wrong++;sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake');
      if(st.wrong===2){st.help=true;render()}
      else if(st.wrong>=4){stepDone(step,'Look, it is here!',true)}}
  }else if(st.held&&step.t==='place'){tryPlace(step,st.held,x,y)}
}
let doneLock=false;
function stepDone(step,msg,reveal){
  /* hiện lời khen + nút Tiếp */
  st.praise=msg;st.reveal=!!reveal;st.stepDone=true;
  renderDock();
  const sc=$('.scene');if(sc&&step.target&&st.set.hot[step.target]&&!$('.scene .ptr')){sc.append(h('div.ptr'+(st.set.hot[step.target].rect[2]>30?'.sq':''),{style:rectStyle(st.set.hot[step.target].rect,.6)}))}
}

/* ----- kéo/chạm thẻ ----- */
function dragStart(ev,id,el){
  const step=st.steps[st.i];
  if(!(step.t==='pick'||step.t==='place'))return;
  if(st.stepDone)return;
  const sx=ev.clientX,sy=ev.clientY;let moved=false,ghost=null;
  const c=st.set.cards[id];
  const move=e=>{
    if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<9)return;
    if(step.t==='pick')return;
    moved=true;
    if(!ghost){ghost=h('img.ghost',{src:A(c.img),alt:''});document.body.append(ghost);el.style.opacity='.35'}
    ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';e.preventDefault();
  };
  const up=e=>{
    document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    if(ghost){ghost.remove();el.style.opacity=''}
    if(moved){
      const sc=$('.scene');if(!sc)return;const r=sc.getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){tryPlace(step,id,(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100);return}
      if(step.t==='place')sfx.no();return;
    }
    /* chỉ chạm */
    if(step.t==='pick')pickCard(step,id,el);
    else if(step.t==='place'){
      if(id!==step.card){wobble(el);sfx.no();return}
      st.held=st.held===id?null:id;sfx.pop();
      document.querySelectorAll('.chip').forEach(c2=>c2.classList.toggle('held',c2.dataset.id===st.held));
      const pe=document.querySelector('.placed[data-id="'+id+'"]');if(pe)pe.style.outline=st.held===id?'4px solid var(--pdd)':'';
      if(st.held===id)toast('Bây giờ chạm vào tranh để đặt thẻ');
    }
  };
  document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
}
function wobble(el){el.classList.remove('wob');void el.offsetWidth;el.classList.add('wob')}
function pickCard(step,id,el){
  if(id===step.card){
    sfx.ok();
    window.LSE_REPORT.answer('ss-'+st.set.id+'-p1-pick-'+id,'Speaking Starters · Part 1 Which is…?',st.wrong===0&&!st.help,step.say+' (Test '+st.set.no+')');
    st.held=null;stepDone(step,'Yes! ✓');
    document.querySelectorAll('.chip').forEach(c2=>{c2.classList.toggle('held',c2.dataset.id===id)});
  }else{sfx.no();wobble(el);st.wrong++;
    if(st.wrong===2){st.help=true;render()}
    else if(st.wrong>=4){stepDone(step,'This is the one!',true)}}
}
function tryPlace(step,id,x,y){
  if(step.t!=='place'||id!==step.card)return;
  const z=st.set.zones[step.zone];const ok=inRect(x,y,z.rect,1);
  const sc=$('.scene');if(!sc)return;
  if(ok){
    sfx.ok();st.placed[id]={x:z.rect[0]+z.rect[2]/2,y:z.rect[1]+z.rect[3]/2};st.held=null;
    window.LSE_REPORT.answer('ss-'+st.set.id+'-p1-place-'+id,'Speaking Starters · Part 1 Put the card…',st.wrong===0&&!st.help,step.say+' (Test '+st.set.no+')');
    stepDone(step,'Perfect! ✓');
    const f=document.querySelector('.scgrid');if(f){const keepDone=true;rebuildStage()}
  }else{
    marker(sc,x,y,false);sfx.no();st.wrong++;sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake');
    if(st.wrong===2){st.help=true;st.held=null;render()}
    else if(st.wrong>=4){const z2=st.set.zones[step.zone];st.placed[id]={x:z2.rect[0]+z2.rect[2]/2,y:z2.rect[1]+z2.rect[3]/2};st.held=null;stepDone(step,'Look, here!',true);rebuildStage()}
  }
}
function rebuildStage(){
  const step=st.steps[st.i],stage=$('.stage');if(!stage)return;
  stage.innerHTML='';stage.append(sceneBlock(st.set,step));
}

/* ----- demo: giám khảo đặt thẻ ----- */

  const z=st.set.zones[step.zone];
  st.placed[step.card]={x:z.rect[0]+z.rect[2]/2,y:z.rect[1]+z.rect[3]/2};
  sfx.deal();rebuildStage();
}

/* ----- thẻ lật (Part 3) ----- */
function flashBlock(s,step){
  const c=s.cards[step.card];
  const fc=h('div.fc'+(st.flip?'.flip':''),{role:'button',tabindex:'0','aria-label':'Thẻ '+c.w+'. Chạm để lật.'},
    h('div.fc-in',
      h('div.face.front',h('img',{src:A(c.img),alt:'',draggable:'false'})),
      h('div.face.back',h('div.w',c.w),h('div.s',c.s),h('div.hint','Chạm để lật lại'))),
    h('span.fliphint','👆 chạm để lật'));
  if(st.dealt===step.card)fc.style.animation='none';else st.dealt=step.card;
  const flip=()=>{fc.classList.toggle('flip');st.flip=fc.classList.contains('flip');sfx.flip()};
  fc.addEventListener('click',flip);fc.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
  const wrap=h('div.fcwrap',fc);
  const info=h('div',{style:{textAlign:'center',color:'var(--soft)',fontSize:'14px',fontWeight:'700'}},'Thẻ '+(s.p3.findIndex(x=>x.card===step.card)+1)+' / '+s.p3.length+(teach()&&c.gen?'  ·  câu mẫu: do Claude soạn':''));
  return h('div',wrap,info);
}
function talkStage(step){
  if(step.t==='name'){
    const inp=h('input.nameIn',{type:'text',value:stu.name,readonly:AU.name?true:null,placeholder:'Tên của em',maxlength:'20','aria-label':'Tên của em',autocomplete:'off',oninput:e=>{stu.name=e.target.value.slice(0,20);store.set('lss_guest_name',stu.name)}});
    return h('div',{style:{display:'grid',placeItems:'center',gap:'10px',padding:'22px 8px',textAlign:'center'}},h('div',{style:{fontFamily:'var(--hfont)',fontWeight:'700',fontSize:'20px',color:'var(--pdd)'}},'✏️ Em tên là gì? (gõ tên rồi nói thành tiếng)'),inp);
  }
  return h('div',{style:{padding:'14px',textAlign:'center',color:'var(--pdd)',fontFamily:'var(--hfont)',fontWeight:'700',fontSize:'20px'}},step.t==='bye'?'🌈 Cảm ơn em đã làm bài!':'💬 Cô hỏi, em trả lời bằng miệng nhé');
}

/* ----- khung giám khảo ----- */
function dockBlock(step){
  const d=h('div.dock'+((step.talk||step.t==='name')?'.big':''));d.id='dock';
  st.stepDone=false;st.praise='';st.reveal=false;
  fillDock(d,step);
  if(step.t==='demo')setTimeout(()=>runDemo(step),350);
  return d;
}
function renderDock(){const d=$('#dock'),step=st.steps[st.i];if(d)fillDock(d,step)}
function fillDock(d,step){
  d.innerHTML='';
  const done=st.stepDone;
  const ex=done?(st.reveal?'dung':'nhay-mat'):(st.help?'co-vu':step.ex);
  const exImg=h('img.ex.swap',{src:EXA(ex),alt:'Miss Thảo'});
  const text=done?st.praise:(st.help&&step.back?step.back:fmt(step.say));
  const q=h('div.q'+(st.help&&!done?'.back':''),text,
    (!done&&step.vi&&teach())?h('small',step.vi):null,
    (!done&&step.alt&&teach())?h('small','or: '+step.alt):null);
  const spk=h('button.spk',{onclick:()=>speak(done?st.praise:(st.help&&step.back?step.back:fmt(step.say))),'aria-label':'Nghe lại câu hỏi'},'🔊');
  const bub=h('div.bub',q,S.sound?spk:null);
  const acts=h('div.acts');
  const next=(label)=>h('button.btn.pri',{onclick:()=>advance(step)},label||'Tiếp ▶');
  switch(step.t){
    case 'name':case 'say':case 'point':case 'demo':
      acts.append(next(step.t==='name'?'Em đã trả lời ✓':'Tiếp ▶'));break;
    case 'find':case 'pick':case 'place':
      if(done)acts.append(next());
      else{
        acts.append(h('button.btn.soft'+(step.back?'':'.hidden'),{onclick:()=>{st.help=true;st.wrong=Math.max(st.wrong,2);render()}},'🙋 Em chưa hiểu'));
        if(teach())acts.append(h('button.btn.sm',{onclick:()=>stepDone(step,'(cô bỏ qua bước này)',true)},'Cô: bỏ qua ▶'));
      }
      break;
    case 'ask':
      acts.append(step.back?h('button.btn.soft',{onclick:()=>{st.help=!st.help;render()}},st.help?'↩ Hỏi lại câu đầu':'🙋 Em chưa hiểu'):null,
                  h('button.btn.pri',{onclick:()=>advance(step)},'Em đã trả lời ✓'));break;
    case 'card':
      acts.append(step.back?h('button.btn.soft',{onclick:()=>{st.help=!st.help;render()}},st.help?'↩ Hỏi lại câu đầu':'🙋 Em chưa hiểu'):null,
                  h('button.btn.pri',{onclick:()=>advance(step)},step.last?'Xong thẻ này ✓':'Em đã trả lời ✓'));break;
    case 'bye':
      acts.append(h('button.btn.pri',{onclick:()=>advance(step)},'Bye bye! 👋'));break;
  }
  if(!acts.children.length)acts.classList.add('hidden');
  d.append(h('div.dock-in',exImg,bub,acts));
  if(done&&!st.reveal)sfx.pop();
}
function advance(step){
  if(step.t==='card'&&step.last){
    const fc=$('.fc');
    if(fc&&!matchMedia('(prefers-reduced-motion: reduce)').matches){fc.classList.add('out');st.flip=false;sfx.deal();setTimeout(nextStep,420);return}
    st.flip=false;
  }
  nextStep();
}

/* ----- xong một Part ----- */
const PRAISE=['Great job!','Well done!','Super!','Fantastic!'];
function partDoneView(){
  const app=$('#app'),P=PART_INFO[st.part],nxt=PART_INFO[st.part+1];
  app.append(topbar(st.set.title+' · Part '+P.n,'Xong rồi!'));app.append(progRow(100));
  sfx.star();confetti(26);
  app.append(h('div.card.partdone',
    h('div.bigstar','⭐'),
    h('img',{src:EXA('nhay-mat'),alt:''}),
    h('h2',PRAISE[st.part%PRAISE.length]+' Part '+P.n+' xong!'),
    h('p',{style:{color:'var(--soft)',margin:0}},'Sắp tới: Part '+nxt.n+' · '+nxt.vi),
    h('div',{style:{background:'var(--ps)',borderRadius:'16px',padding:'10px 14px',color:'var(--pdd)',fontSize:'15px',maxWidth:'460px'}},nxt.how),
    h('button.btn.pri',{onclick:()=>startPart(st.part+1)},'Part '+nxt.n+' ▶')));
  document.body.dataset.part=String(st.part+2);
  if(st.part+2>4)document.body.dataset.part='4';
}

/* ----- phần thưởng cuối bộ ----- */
function rewardView(){
  const app=$('#app'),prog=loadProg(),un=new Set(prog.stk);
  app.append(topbar(st.set.title+' · Hoàn thành!','Thank you!'));app.append(progRow(100));
  sfx.star();confetti(60);
  const nw=st.newStk||[];
  const c=h('div.card.rew.partdone',
    h('img',{src:EXA('an-mung'),alt:''}),
    h('h2','Congratulations, '+nm()+'! 🎉'),
    h('div.stickrow',[0,1,2,3].map(()=>h('span',{style:{fontSize:'44px'}},'⭐'))),
    h('p',{style:{margin:0,fontWeight:'800'}},st.earnedFirst?'Em nhận thêm 1 ⭐ sao sưu tầm! Tổng: '+st.totalNow+' ⭐':'Em đã làm lại bộ này rất tốt! Tổng: '+st.totalNow+' ⭐'));
  if(nw.length){
    c.append(h('h3',{style:{color:'var(--pdd)'}},'🎁 Sticker mới!'));
    c.append(h('div.stickrow',nw.map(i=>stickerEl(i,un,true))));
  }else{
    const nx=MILESTONES.find(m=>m>st.totalNow);
    c.append(h('p',{style:{color:'var(--soft)',margin:0}},nx?'Còn '+(nx-st.totalNow)+' bộ nữa để mở sticker tiếp theo ✨':'Em đã sưu tầm đủ sticker rồi! 🏆'));
  }
  c.append(h('div',{style:{display:'flex',gap:'10px',justifyContent:'center',flexWrap:'wrap',marginTop:'8px'}},
    h('button.btn.pri',{onclick:()=>{st.view='album';render()}},'🎁 Xem sticker'),
    h('button.btn',{onclick:()=>openSet(st.set.id)},'↺ Làm lại'),
    h('button.btn',{onclick:goHome},'🏠 Về trang chủ')));
  app.append(c);
  if(teach())app.append(h('div.tnote',{style:{marginTop:'12px'}},h('b','Cô: '),'Bài nói không chấm điểm tự động (máy không nhận giọng). Sao được tính khi em hoàn thành đủ 4 Part. Tiến trình lưu trên máy này theo tên học viên.'));
}
function albumView(){
  const app=$('#app'),prog=loadProg(),un=new Set(prog.stk);
  app.append(topbar('Sticker của em','⭐ '+Object.keys(prog.stars).length+' sao',{back:()=>{st.view=st.set&&st.partsDone[3]?'reward':'home';render()},backLab:'Về'}));
  const sec=h('div.card',h('h2','🎁 Bộ sưu tập'),h('p',{style:{color:'var(--soft)'}},'Hoàn thành bộ test để nhận sao. Đủ mốc sẽ mở sticker mới!'),
    h('div.albumgrid',STK.map((_,i)=>stickerEl(i,un,false))));
  app.append(sec);
  if(teach()){
    app.append(h('div.tnote',{style:{marginTop:'12px'}},h('b','Cô: '),'Mốc mở sticker (số bộ đã hoàn thành): '+MILESTONES.join(', ')+'.',h('div',{style:{marginTop:'8px'}},
      h('button.btn.sm',{onclick:()=>{const all=new Set(STK.map((_,i)=>i));const g=document.querySelector('.albumgrid');g.innerHTML='';STK.forEach((_,i)=>g.append(stickerEl(i,all,false)));toast('Xem thử (không lưu)')}},'👀 Xem thử tất cả (không lưu)'),' ',
      h('button.btn.sm',{onclick:()=>{if(st.resetArm){st.resetArm=false;saveProg({stars:{},stk:[]});render()}else{st.resetArm=true;toast('Chạm lần nữa để xoá');setTimeout(()=>{st.resetArm=false},2600)}}},'🗑 Đặt lại tiến trình'))));
  }
}

/* ======================= khởi động ======================= */
(function boot(){
  const q=new URLSearchParams(location.search);
  if(q.get('teach')==='1'){S.teach=true}
  if(q.get('mute')==='1'){S.sound=false}
  render();
  window.__ss={st,startPart,openSet,nextStep,render,goHome,S,stu,loadProg,saveProg};
  if(q.get('set')){openSet(q.get('set'));if(q.get('part'))startPart(+q.get('part')-1);}
  if(q.get('step')&&st.view==='step'){st.i=+q.get('step');render()}
})();
</script>
